:84 (keeps only .events)","Compare :72-80 (listConflicts throws on degradation)","Read list-natural-events.ts:31 (missing seed → dataAvailable:false)"],"poc":"During a natural-events seed outage the promise fulfils, the layer reads 'ok', X-No-Cache is never set, and the empty response is CDN-cached.","impact":"Partner embed shows empty natural-events data cached for up to an hour during an outage.","remediation":["Propagate dataAvailable and throw on a degraded natural-events layer, matching listConflicts"],"status":"code-verified"},{"id":"V13","severity":"medium","title":"Shipping-v2 route-intelligence fabricates an all-clear on seed loss","component":"server/worldmonitor/shipping/v2/route-intelligence.ts:68/91-92/118","summary":"A chokepoint seed read failure is coerced to disruptionScore 0 / WAR_RISK_TIER_NORMAL with no unavailability marker.","cvss":"N/A — availability/integrity bug","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"getCachedJson(CHOKEPOINT_STATUS_KEY).catch(()=>null); then disruptionScore = ... ?? 0 and warRiskTier = ... ?? 'WAR_RISK_TIER_NORMAL' (:91-92); :118 only blanks fetchedAt. The response type has no upstreamUnavailable member. Siblings get-chokepoint-status.ts:609 and get-shipping-stress.ts:17 surface the outage. Same all-clear when the ISO2 pair is missing from country-port-clusters.json.","reproduce":["Read route-intelligence.ts:68 (.catch(()=>null)), :91-92 (?? 0 / NORMAL)","Compare get-chokepoint-status.ts:609 and get-shipping-stress.ts:17"],"poc":"On a chokepoint seed loss the endpoint returns disruptionScore 0 and warRiskTier NORMAL — a fabricated calm.","impact":"Docs publish disruptionScore (0-100) and warRiskTier as authoritative; users see 'normal' shipping risk during a real data outage.","remediation":["Add an upstreamUnavailable member and surface degradation, matching the siblings"],"status":"code-verified"},{"id":"V15","severity":"high","title":"Dockerfile.digest-notifications builds with npm lifecycle scripts enabled","component":"Dockerfile.digest-notifications:47","summary":"npm ci runs without --ignore-scripts while its hardened sibling calls that flag 'the critical part'.","cvss":"N/A — supply-chain","cwe":"CWE-829 (Inclusion of Functionality from Untrusted Control Sphere)","scope":"supply-chain","description":"Line 47: RUN npm ci --prefix scripts --omit=dev (no --ignore-scripts, no --omit=optional), as root on node:24-alpine. Dockerfile.relay:28-35 installs the identical scripts/package.json with --ignore-scripts and its comment states that is 'the critical part'. scripts/package-lock.json has 5 packages with install scripts (bufferutil, utf-8-validate, esbuild, es5-ext, fsevents); esbuild is a direct production dep (via convex/tsx) whose postinstall performs a network fetch.","reproduce":["Read Dockerfile.digest-notifications:47","Compare Dockerfile.relay:28-35 (--ignore-scripts --omit=optional)","Enumerate scripts/package-lock.json packages with hasInstallScript:true"],"poc":"Dependency install/postinstall scripts execute during the image build as root; esbuild fetches a platform binary over the network.","impact":"A compromised transitive dependency's install script runs with root at build time — classic supply-chain foothold.","remediation":["Add --ignore-scripts --omit=optional to the npm ci, matching Dockerfile.relay"],"status":"code-verified"},{"id":"V16","severity":"medium","title":"docker runtime stage has no USER; nginx runs as root in a published image","component":"docker/Dockerfile:58-74","summary":"The published GHCR nginx image runs its master process as root; sibling Dockerfiles all set a non-root USER.","cvss":"N/A — hardening","cwe":"CWE-250 (Execution with Unnecessary Privileges)","scope":"infra","description":"FROM nginx:alpine AS runtime (:58) has no USER through :74. docker-entrypoint.sh writes /etc/nginx/nginx.conf then exec nginx as uid 0. The image is pushed to ghcr.io/koala73/worldmonitor. Correct siblings: Dockerfile:114 USER appuser, Dockerfile.publish-bootstrap-tiers:18 USER node, Dockerfile.umami:159 USER nextjs. No HEALTHCHECK either.","reproduce":["Read docker/Dockerfile:58-74 (no USER)","Read docker-entrypoint.sh:4-5 (exec nginx as root)","Confirm docker-publish.yml pushes the image"],"poc":"The runtime stage never drops privileges; nginx master runs as root.","impact":"Any nginx/container compromise starts with root, widening blast radius in a published image.","remediation":["Add a non-root USER (and a HEALTHCHECK) to the runtime stage"],"status":"code-verified"},{"id":"V17","severity":"low","title":"deploy-gate.yml grants statuses:write at workflow scope to all jobs","component":".github/workflows/deploy-gate.yml:30-35","summary":"All five jobs get statuses:write though only one posts a commit status.","cvss":"N/A — least-privilege","cwe":"CWE-250 (Execution with Unnecessary Privileges)","scope":"infra","description":"statuses: write is declared at the workflow permissions block (:30-35). Only the invalidate job (:58, script deploy-gate.sh:95) posts a commit status. This diverges from the repo's default-deny policy in contributor-trust.yml:50-53 and railway-deploy-trigger-watchdog.yml:23 (permissions: {}).","reproduce":["Read deploy-gate.yml:30-35 (workflow-scope statuses:write)","Confirm only the invalidate job uses it"],"poc":"Four jobs carry a write token they never use.","impact":"Excess CI token permission surface across jobs that do not need it.","remediation":["Move statuses:write to job scope on the one job that posts a status"],"status":"code-verified"},{"id":"V18","severity":"low","title":"workflow_dispatch inputs interpolated straight into run: blocks","component":".github/workflows/publish-go.yml:59; perf-style-layout-budget.yml:63,76","summary":"GitHub expands ${{ inputs.* }} before the shell parses, so a value containing a quote breaks out of the command.","cvss":"N/A — CI injection (write-access gated)","cwe":"CWE-94 (Improper Control of Generation of Code)","scope":"infra","description":"VERSION=\"${{ inputs.version }}\" (publish-go.yml:59) and the perf-budget URL/max_pct inputs are interpolated inside shell double-quotes. ${{ }} expands before the shell parses, so a value with a quote breaks out. Safe siblings (deploy-gate.yml:55, proto-check.yml) use env:. workflow_dispatch requires write access, so it is a narrow privilege gain, not unauthenticated RCE.","reproduce":["Read publish-go.yml:59 and perf-style-layout-budget.yml:63,76","Compare the env: pattern in deploy-gate.yml:55"],"poc":"A dispatch input containing a double-quote escapes the shell command.","impact":"Command injection in CI, limited to actors who already have write access.","remediation":["Pass dispatch inputs via env: and reference $VAR, never inline ${{ }} in run:"],"status":"code-verified"},{"id":"V19","severity":"high","title":"health.js dereferences workerControl.subsystems its own producer may omit","component":"api/health.js:3449-3451 (vs producer :2610-2615)","summary":"A permitted seed-meta shape without .subsystems throws a TypeError that 500s /api/health and wedges the refresh lease.","cvss":"N/A — availability/robustness","cwe":"CWE-476 (NULL Pointer Dereference)","scope":"api","description":"classifyKey at :3449-3451 reads workerControl.subsystems.scan.status / .admission.status with no optional chaining, while :3446 uses workerControl?.subsystems?.scan?.claimFailure. The producer at :2574/:2610-2615 returns subsystems only conditionally, so it is legitimately absent. The guard at :3448 needs only status==='error' && outcome==='claim_error', independent of subsystems, so the deref throws.","reproduce":["Read health.js:3446-3451 (mixed optional chaining) and :2574/:2610-2615 (subsystems conditional)","Construct meta {status:'SEED_ERROR', workerControl:{status:'error', outcome:'claim_error'}} with no subsystems"],"poc":"That shape throws TypeError; it escapes handleHealth (no try/catch in the registry loop), so /api/health returns a platform 500 and releaseHealthVerdictRefreshLock is never reached — the lease stays held and every caller gets REFRESH_PENDING permanently.","impact":"A single permitted seed-meta shape can take the whole health endpoint down permanently (snapshot cache never written, re-throws forever).","remediation":["Optional-chain the subsystems dereferences at :3449-3451"],"status":"code-verified"},{"id":"V20","severity":"high","title":"bootstrap.js answers Redis failure with 200 {data:{}} for credentialed callers","component":"api/bootstrap.js:436-441/543-568","summary":"Public kinds get a 503 on Redis failure, but session/Pro/OEM callers fall through to a 200 empty body identical to 'never seeded'.","cvss":"N/A — error-handling/availability","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"isPublicBootstrapKind (:436-441) covers only public-weather/anonymous-weather/public-tier/public-on-demand. The catch (:543-568) answers 503+Retry-After for public kinds ('Infrastructure failure is not an empty registry'), then falls through to jsonResponse({data:{}, missing:names}, 200, no-store) for everything else. authKind:'session' (the primary browser boot) and every Pro/OEM/embed caller take the 200 arm; the two catch arms contradict each other.","reproduce":["Read bootstrap.js:436-441 (public-kind set) and :543-568 (both catch arms)"],"poc":"With Redis down, a session-authenticated browser boot receives 200 {data:{}, missing:<all keys>} — byte-identical to 'nothing was ever seeded'.","impact":"Credentialed clients cannot distinguish an infrastructure outage from an empty dataset, leading to wrong UI behavior.","remediation":["Return 503 + Retry-After for infrastructure failure on all authKinds, not just public"],"status":"code-verified"},{"id":"V21","severity":"high","title":"checkRateLimit drops the ratelimit 'reason', so a timeout is a silent unconditional allow","component":"server/_shared/rate-limit.ts:573-586","summary":"@upstash/ratelimit resolves timeouts as {success:true, reason:'timeout'}; checkRateLimit discards reason, so slow Redis silently disables the limiter.","cvss":"N/A — control bypass under degradation","cwe":"CWE-703 / CWE-770 (Allocation Without Limits)","scope":"api","description":"checkRateLimit destructures {success, limit, reset} and drops reason (:573-586), so opts.failClosed and the catch are never reached. @upstash/ratelimit v2 RESOLVES {success:true, reason:'timeout'} on its 5s timer instead of rejecting, so !success is false and it returns null (allow) with no log/Sentry. The sibling checkScopedRateLimit:1260-1268 documents and handles this exact case.","reproduce":["Read rate-limit.ts:573-586 (reason dropped)","Compare checkScopedRateLimit:1260-1268 (handles reason==='timeout' as degraded)"],"poc":"Under slow Redis the limiter returns allow for every request; three failClosed:true call sites (chat-analyst.ts:204 frontier LLM, customer-portal.ts:84 billing, symbol-search.ts:231 shared Finnhub key) become unlimited.","impact":"The rate limit silently disappears under exactly the slow-Redis conditions it exists to absorb — abuse of paid LLM, billing, and a shared vendor key.","remediation":["Treat reason==='timeout' as unavailable (degraded / failClosed), matching checkScopedRateLimit"],"status":"code-verified"},{"id":"V22","severity":"medium","title":"_relay fetchWithTimeout disarms the abort before the body is read","component":"api/_relay.js:27-35","summary":"The timeout is cleared once headers arrive, so a stalled response body can hang indefinitely past the documented ceiling.","cvss":"N/A — resource exhaustion","cwe":"CWE-400 (Uncontrolled Resource Consumption)","scope":"api","description":"fetchWithTimeout returns on headers and clearTimeout in finally (:27-35). Sinks then await response.text() with no live AbortSignal (:114, x-feed.js:235, telegram-feed.js:418). telegram-feed.js:79-88 documents the 25s begin-response ceiling; a stalled body is unbounded.","reproduce":["Read _relay.js:27-35 (clearTimeout in finally) and :114 (await text() with no signal)"],"poc":"A connection that returns headers then stalls the body leaves the await pending past the timeout; the platform kills the invocation.","impact":"Caller sees a platform error instead of the 504 envelope; unbounded hang consumes the invocation.","remediation":["Keep the AbortSignal live through the body read (do not clearTimeout until text() resolves)"],"status":"code-verified"},{"id":"V23","severity":"low","title":"cache-purge reports a partially-failed DEL pipeline as HTTP 200","component":"api/cache-purge.js:168-176","summary":"Per-command Redis errors are never inspected, so a failed DEL contributes 0 and the handler still returns success.","cvss":"N/A — error-handling","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"deleted = results.reduce((sum, r) => sum + (r.result || 0), 0); r.error is never inspected, so a failed command contributes 0 and the handler returns 200 {matched, deleted}. bootstrap.js:311-317 and _user-api-key.js:274-275 correctly branch on entry.error.","reproduce":["Read cache-purge.js:168-176 (no r.error check)"],"poc":"A DEL that errors is counted as 0 deletions but the response is still 200.","impact":"An operator believes a cache purge succeeded when it partially failed.","remediation":["Inspect r.error per command and report failures in the response"],"status":"code-verified"},{"id":"V24","severity":"medium","title":"seed-health staleness from an unvalidated fetchedAt (NaN)","component":"api/seed-health.js:671,785","summary":"A non-numeric fetchedAt yields NaN age, and NaN>maxStale is false, so it publishes status:ok / stale:false forever.","cvss":"N/A — monitoring blind spot","cwe":"CWE-20 (Improper Input Validation)","scope":"api","description":"ageMs = evaluationNow - (meta.fetchedAt || 0) with no numeric guard (:671). A non-numeric truthy value yields NaN, and freshnessStale = ageMs > maxStalenessMs is NaN>x = false (:785), so it publishes status:'ok', stale:false with only ageMinutes:null as a trace. health.js:2815-2819 guards the same field with Number.isFinite.","reproduce":["Read seed-health.js:671 and :785","Compare health.js:2815-2819 (Number.isFinite guard)"],"poc":"A malformed fetchedAt makes the endpoint report the seed as fresh indefinitely.","impact":"Staleness is never detected for a producer that writes a malformed timestamp.","remediation":["Guard fetchedAt with Number.isFinite before computing age"],"status":"code-verified"},{"id":"V25","severity":"medium","title":"npm_config_allow_scripts= is not an npm setting (3 build scripts)","component":"package.json:94,97,110","summary":"Three build scripts set a non-existent npm env var believing it disables lifecycle scripts; npm runs them by default.","cvss":"N/A — supply-chain","cwe":"CWE-829 (Inclusion of Functionality from Untrusted Control Sphere)","scope":"supply-chain","description":"ci:blog-site / build:blog:raw / build:pro use `cross-env npm_config_allow_scripts= npm ... ci`. npm has no allow-scripts key (verified: `npm config get allow-scripts` -> undefined; ignore-scripts defaults false, so scripts run). The real mechanism is used by worktree:bootstrap:test-only (--ignore-scripts).","reproduce":["Read package.json:94,97,110","Run npm config get allow-scripts -> undefined; npm config get ignore-scripts -> false"],"poc":"Dependency install/postinstall in the blog-site and pro-test trees execute during npm run build and in CI where a supply-chain control was believed active.","impact":"The intended supply-chain control is silently inert in two subtrees.","remediation":["Use --ignore-scripts on those npm ci invocations"],"status":"code-verified"},{"id":"V26","severity":"low","title":"undici@7.29.0 matches CVE-2026-85024 and is exact-pinned","component":"package.json:256 (package-lock.json:22446)","summary":"undici 7.29.0 is in the affected range and the exact pin blocks npm audit fix; not currently reachable.","cvss":"Low (advisory)","cwe":"CVE-2026-85024 / GHSA-3wwx-pv8p-q78v","scope":"supply-chain","description":"package-lock.json resolves undici 7.29.0; GHSA-3wwx-pv8p-q78v affects >=7.28.0 <7.29.1 (fix 7.29.1). package.json pins the exact string '7.29.0' (no caret), so npm update/audit fix will not move it. The vuln is in undici's bundled WebSocket permessage-deflate cleanup; the only import (scripts/seed-natural-events.mjs) uses Agent as an HTTP dispatcher, no WebSocket, so it is not currently reachable.","reproduce":["Read package.json:256 (exact pin) and package-lock.json:22446 (7.29.0)"],"poc":"Version match confirmed; no reachable WebSocket sink in app code.","impact":"Latent advisory exposure; blocked from auto-fix by the exact pin.","remediation":["Bump undici to >=7.29.1 (allow a caret or update the pin)"],"status":"code-verified"},{"id":"V27","severity":"low","title":"ip-address@10.4.0 matches two SSRF-class advisories","component":"package-lock.json:15948","summary":"The tree's only IP-classification library has NAT64 and link-local classifier bugs; not currently reachable.","cvss":"Low (advisory)","cwe":"CVE-2026-101910 / CVE-2026-101913","scope":"supply-chain","description":"ip-address 10.4.0 is reached via telegram -> socks. GHSA-2vr4-cq9g-pvrc (>=10.2.0 <10.5.1): NAT64 64:ff9b:1::/48 not recognised. GHSA-rpw4-54j3-4h4q (<=10.5.0): isLinkLocal matches fe80::/64 instead of fe80::/10. Not currently reachable — socks only does byte<->text conversion, never calls the classifiers. Relevant because webhook-egress work is exactly the use case that would adopt it.","reproduce":["Read package-lock.json:15948 (10.4.0 via telegram -> socks)"],"poc":"Version match confirmed; classifiers not invoked by socks.","impact":"Latent SSRF-classification bypass if this library is adopted for egress guarding.","remediation":["Bump ip-address to >=10.5.1 and avoid relying on its classifiers for SSRF defence"],"status":"code-verified"},{"id":"V55","severity":"medium","title":"getIndicatorData circuit-breaker cache key omits countries and years","component":"src/services/economic/index.ts:597-614","summary":"World Bank indicator breaker keyed on '__default__' — one country's figures served for another request for 30 min.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-345","scope":"client","description":"execute() is called with no cacheKey, so the circuit breaker falls back to DEFAULT_CACHE_KEY ('__default__'). A response fetched for countries=['US'], years=5 is served verbatim to a request for countries=['CN','JP'], years=20, and because persistCache is true it also survives reloads. Every other breaker in the repo keys on the full request (aviation, consumer-prices); getWbBreaker is the only one invoked with a varying request and no key.","reproduce":["Open the tech-indicators panel and request an indicator for one country/year range","Within 30 minutes request the same indicator for a different country/year range","Observe the first response served for the second request (no stale marker)"],"poc":"Source-level: execute() invoked without a cacheKey argument; breaker default key is a module constant '__default__' shared across all callers.","impact":"The tech-indicators panel shows a different country's economic figures than the one requested, presented as authoritative, with no stale/degraded indicator.","remediation":["Pass a request-derived cacheKey (e.g. `${countries.join(',')}:${years}`) to execute()","Mirror the sibling breakers that key on the full request"],"status":"code-verified"},{"id":"V56","severity":"low","title":"x-intel cache serves a larger limit's payload to a smaller request","component":"src/services/x-intel.ts:70","summary":"cachedLimit >= limit comparison lets a limit=50 response satisfy a limit=5 request.","cvss":"N/A — correctness","cwe":"CWE-345","scope":"client","description":"The cache-hit guard is `if (cachedResponse && cachedLimit >= limit && ...)` — the direction of the comparison means a response cached for limit=50 satisfies a subsequent limit=5 request. The inFlight de-dup map two lines below keys by limit exactly, so the module holds two contradictory notions of query identity in adjacent lines.","reproduce":["Request the x-intel feed with limit=50 (caches it)","Request the same feed with limit=5","Observe the 50-item payload returned for the limit=5 call"],"poc":"Source-level: comparison operator `cachedLimit >= limit` at line 70 vs exact-limit keying of the inFlight map at line 71.","impact":"A caller receives more items than requested. Low in practice — the only production caller passes a constant limit of 50.","remediation":["Key the cache on the exact limit, or clamp the served slice to the requested limit"],"status":"code-verified"},{"id":"V57","severity":"low","title":"insights-loader shared abort can be armed past the shared-promise window","component":"src/services/insights-loader.ts:148-159","summary":"armInFlightTimeout re-aborts a dead controller in a narrow window, discarding a joining caller's budget.","cvss":"N/A — robustness","cwe":"CWE-362","scope":"client","description":"armInFlightTimeout uses Math.max on inFlightDeadlineMs and its early-return guard requires inFlightAbortTimer !== null. abortInFlightRequest nulls that timer while inFlight is only cleared in the promise's finally. In that window a joining caller's guard fails, Math.max keeps the already-expired deadline, remaining <= 0 fires, and it re-aborts a dead controller — discarding the new caller's budget.","reproduce":["Trigger an insights load that aborts","Have a second caller join in the window before the finally clears inFlight","Observe the second caller's request aborted immediately"],"poc":"Source-level timing analysis of armInFlightTimeout / abortInFlightRequest vs the promise finally.","impact":"One wasted retry for a joining caller. Narrow and self-healing — not a stuck loading state.","remediation":["Clear inFlight and the deadline atomically with the abort, not in a later finally"],"status":"code-verified"},{"id":"V58","severity":"low","title":"Server-rejected wm_ tester key is never cleared from localStorage / cookie","component":"src/services/browser-key-session.ts:50-67","summary":"A refused key mint leaves the raw wm_ key in JS-readable storage and retries forever.","cvss":"N/A — storage hygiene","cwe":"CWE-312","scope":"storage","description":"migrateLegacyKeysToHttpOnlySession does `if (!ok) return false`, and clearLegacyKeyStorage is only reached on success. establishWmKeySession returns false (does not throw) on a refused mint. Every call site is either `void ...catch()` or `if (!ok) return false`, and .catch() only handles throws — so a permanent 401 is indistinguishable from a network blip, is retried forever, and the raw key persists in JS-readable storage, contradicting the module's HttpOnly-migration purpose.","reproduce":["Present a legacy wm_ key the server rejects (401)","Observe the key remains in localStorage / document.cookie and the migration is retried on each load"],"poc":"Source-level: clearLegacyKeyStorage unreachable on the !ok path.","impact":"A rejected credential lingers in JS-readable storage indefinitely, defeating the module's storage-hygiene invariant.","remediation":["Clear legacy key storage on a definitive refusal (401), not only on success","Distinguish refusal from transient network failure before retrying"],"status":"code-verified"},{"id":"V60","severity":"high","title":"MCP get_tariff_trends serves two Pro datasets to authenticated free accounts","component":"api/mcp/registry/cache-tools.ts:2497-2502 / :2422","summary":"Tool omits _subscriptionOnly, so a free account reads the Pro national-debt + tariff datasets via MCP.","cvss":"6.5 (Medium-High) — authenticated entitlement bypass","cwe":"CWE-285","scope":"access-control","description":"get_tariff_trends declares _cacheKeys including 'trade:tariffs:v2:840' and the premium 'economic:national-debt:v1', but the tool definition omits _subscriptionOnly, so toolAccess() classifies it 'free-account'. dispatch.ts denies only toolAccess === 'subscription', so a free account passes and is metered a slot. The sibling get_sanctions_data sets _subscriptionOnly:true for the same class of Pro key read.","reproduce":["Authenticate an MCP session as a free (non-Pro) account","Call tools/call for get_tariff_trends","Observe the Pro national-debt + tariff datasets returned instead of a subscription denial"],"poc":"Source-level: _cacheKeys intersect a tier-gated seed key while _subscriptionOnly is absent; dispatch gate keys only on 'subscription'.","impact":"A monetised Pro dataset (per-country national debt) is delivered to free accounts through the MCP tool surface.","remediation":["Add _subscriptionOnly: true to the get_tariff_trends definition","Add a test asserting every cache tool whose _cacheKeys intersect a tier-gated seed key is flagged subscription-only"],"status":"code-verified"},{"id":"V61","severity":"high","title":"Generated GET decoder emits 0 for absent numeric params — every ?? default is dead code","component":"src/generated/server/**/service_server.ts (28 files)","summary":"Systemic: absent optional numeric query params decode to 0, so `?? default` never fires — handlers silently misbehave.","cvss":"N/A — systemic correctness (availability of features)","cwe":"CWE-670","scope":"api","description":"The generated GET decoder produces `Number(params.get(\"x\") ?? \"0\")` = 0 for an absent param; `??` does not fall through on 0, so every downstream `req.x ?? default` is unreachable. In list-webcams the bbox collapses to 0,0,0,0 → empty result cached as a 200. The repo already diagnosed this in get-carrier-ops.ts:51-55 and fixed that one handler only. The decoder pattern appears in 28 generated files.","reproduce":["Call list-webcams (or list-aviation-news, get-bypass-options, get-multi-sector-cost-shock) with the optional numeric param omitted","Observe the handler behaves as if the value were 0, not the documented default (empty list / wrong window / dropped corridors)"],"poc":"Confirmed: webcam/v1/service_server.ts:110 `Number(params.get(\"zoom\") ?? \"0\")`; get-bypass-options.ts:39 closurePct resolves 0 not 100 (drops full-closure corridors); list-aviation-news.ts:102 windowHours 0 → cutoff now, maxItems 0 → [].","impact":"Primary content routes return empty or wrong-scoped data with HTTP 200 (some CDN-cached), while the documented default is silently unreachable. Single highest-count defect class in the assessment.","remediation":["Fix the codegen to emit `undefined` (not 0) for absent optional numeric query params — closes the class in one change","Add a codegen test asserting no numeric optional query field is defaulted with `??` over a 0-emitting decoder"],"status":"code-verified"},{"id":"V62","severity":"high","title":"Both earthquake exporters multiply an already-millisecond epoch by 1000","component":"src/utils/export.ts:119 / src/utils/export-report.ts:164","summary":"occurredAt is epoch-ms per proto, but exporters do occurredAt*1000 → every quake dated ~57,000 years in the future.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"client","description":"The seismology proto documents occurredAt as Unix epoch milliseconds, and the map popup consumes it directly. Both the CSV exporter (export.ts:119) and the PDF data report (export-report.ts:164) multiply it by 1000 before formatting. new Date(1759000000000*1000).toISOString() yields +057710-06-29..., the ISO-8601 expanded-year form most parsers reject.","reproduce":["Export earthquakes to CSV or generate the PDF data report","Open the output and inspect any earthquake timestamp","Observe dates ~57,000 years in the future in expanded-year ISO form"],"poc":"new Date(1759000000000 * 1000).toISOString() === '+057710-06-29T07:06:40.000Z' (vs correct 2025-09-27T19:06:40.000Z).","impact":"Every earthquake in the user-facing CSV export and PDF report is corrupted with an unparseable far-future date — the artefact the user takes away from the product.","remediation":["Drop the * 1000 in both export.ts:119 and export-report.ts:164"],"status":"code-verified"},{"id":"V63","severity":"medium","title":"Aviation-news window filter bypassed for undated items, which are then stamped now","component":"server/worldmonitor/aviation/v1/list-aviation-news.ts:129-133","summary":"new Date(str).getTime() returns NaN (never throws), so undated items skip the window filter and render as freshest.","cvss":"N/A — correctness","cwe":"CWE-704","scope":"api","description":"The code wraps `new Date(item.pubDate).getTime()` in try/catch expecting a throw, but it returns NaN instead. `NaN < cutoff` is falsy so the window filter never fires, and `publishedAt || now` then stamps the item with the current time, sorting it newest-first. pubDate is '' for feeds using only dc:date or none.","reproduce":["Query list-aviation-news with window_hours=1 while an undated feed item exists","Observe the undated item bypasses the window and renders as the freshest story"],"poc":"new Date('').getTime() → NaN; NaN < cutoff → false; publishedAt || now → now.","impact":"Undated (or bad-date) items always appear as the newest aviation news regardless of the requested time window, misrepresenting recency.","remediation":["Guard with Number.isFinite(publishedAt) and drop or de-prioritise undated items","Do not stamp undated items with `now`"],"status":"code-verified"},{"id":"V64","severity":"medium","title":"Relay ETF parser pairs price and volume from different bars","component":"scripts/ais-relay.cjs:3777-3787","summary":"close[] and volume[] filtered independently → today's volume paired with yesterday's close; flat ETFs flip flow sign.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"The relay filters the close and volume arrays independently, so with close=[c0,c1,null], volume=[v0,v1,v2] it pairs price from bar 2 with volume from bar 3 — the exact bug the shared etf-flow-provider.mjs fixed by filtering together. It also derives flow sign from priceChange > 0 ? 1 : -1, so a flat ETF (priceChange===0, direction 'neutral') contributes a negative flow and can flip the panel's NET INFLOW / NET OUTFLOW headline. Both writers share market:etf-flows:v1, so results depend on which ran last.","reproduce":["Provide a Yahoo response with a null in one of the close/volume arrays but not the other","Observe mismatched price/volume pairing and a flat ETF emitting a negative flow"],"poc":"Source-level: independent .filter(v=>v!=null) on close and volume; sign from priceChange>0?1:-1 with neutral direction.","impact":"Fabricated ETF fund-flow figures that can invert the panel's inflow/outflow headline, depending on which writer last wrote the shared Redis key.","remediation":["Filter close and volume together per bar (as etf-flow-provider.mjs does)","Treat priceChange===0 as neutral flow (0), not negative"],"status":"code-verified"},{"id":"V65","severity":"medium","title":"clusterByProximity grid cells collapse to ~1% of the search radius above 89.43° latitude","component":"src/services/correlation-engine/engine.ts:243-246","summary":"cosLat guard discards the divisor instead of clamping, so longitude cells become ~160× too narrow near the poles.","cvss":"N/A — correctness","cwe":"CWE-682","scope":"client","description":"cellSizeLon = cosLat > 0.01 ? cellSizeLat / cosLat : cellSizeLat. The guard avoids dividing by ~0 but discards the divisor, falling back to a latitude-width cell used as a longitude-width cell. At 89.5° a longitude degree is ~0.696 km, so the cell spans ~0.006 × radiusKm — ~160× too narrow — and the 3×3 neighbour prefilter never passes far-apart points to haversineKm. There is also a hard discontinuity at 89.42° vs 89.43°.","reproduce":["Feed the correlation engine two events within radiusKm but above 89.43° latitude","Observe they are never clustered because the prefilter grid columns are too narrow"],"poc":"Numeric: at 89.5°, cellSizeLon fallback ≈ latitude width while true longitude width ≈ 0.006 × radius.","impact":"Correlated signals near the poles fail to cluster; provably wrong branch (not a judgement call). Practical impact small — few clustered signals sit above 89.4°.","remediation":["Use cellSizeLat / Math.max(0.01, cosLat) so the divisor is clamped, not discarded"],"status":"code-verified"},{"id":"V66","severity":"low","title":"setMonth() overflow makes the 'last N months' window one period short","component":"src/config/ai-regulations.ts:481 / scripts/seed-bis-data.mjs:130","summary":"setMonth(getMonth()-months) preserves day-of-month, so month-end dates roll forward and shorten the window.","cvss":"N/A — correctness","cwe":"CWE-682","scope":"api","description":"cutoffDate.setMonth(cutoffDate.getMonth() - months) preserves the day-of-month, so e.g. July 31 minus 6 months yields February 31 → March 3, moving the cutoff a month later than intended on 7-11 days per year. The correct pattern (anchor day 01) already exists in operational-balance.ts:45 and us-cpi-monthly.ts:45.","reproduce":["Invoke the 'last N months' window from a month-end date (e.g. the 31st)","Observe the cutoff lands one period short of the intended window"],"poc":"Date-arithmetic: new Date('2026-07-31').setMonth(m-6) overflows Feb → March.","impact":"The regulatory / BIS 'last N months' window is occasionally one period short, dropping the oldest expected month.","remediation":["Call setDate(1) before setMonth, or use new Date(Date.UTC(y, m - months, 1))"],"status":"code-verified"},{"id":"V67","severity":"high","title":"Three copies of the seed-meta health rule; the weakest owns the source-failure detector","component":"server/worldmonitor/resilience/v1/_source-failure.ts:153-160","summary":"Source-failure detector treats absent status/fetchedAt as healthy, so an errored/empty seed reads as 'no crisis'.","cvss":"N/A — monitoring integrity","cwe":"CWE-754","scope":"infra","description":"The strict rule (_dimension-freshness.ts:129) checks status, state (OK/OK_ZERO) and recordCount. The source-failure detector (_source-failure.ts:153) only computes nonOk from a present status and stale from a present fetchedAt — an absent status yields false, an absent fetchedAt yields false, so the record is treated as healthy. A third weak copy (_dimension-scorers.ts:1106) gates two fail-closed activation paths. A meta of {state:'ERROR', fetchedAt:fresh} is flagged stale by one path and healthy by both source-failure paths.","reproduce":["Publish a seed-meta with state:'ERROR' and no status/fetchedAt (or an empty successful run)","Observe the resilience dimension keeps imputationClass 'stable-absence' (score 85) — 'no crisis' rendered from an outage"],"poc":"Source-level divergence: strict predicate vs the two weak predicates over the same seed-meta shape.","impact":"A dead or empty seeder yields a dimension the widget renders as healthy; 180+ countries can be imputed as low-risk from an upstream outage with no operator signal.","remediation":["Introduce one classifySeedMetaHealth(meta,key,now): 'ok'|'stale'|'failed' in _dimension-freshness.ts and call it from all three sites"],"status":"code-verified"},{"id":"V68","severity":"high","title":"buildPillarList counts retired and not-applicable dimensions that computeOverallCoverage excludes","component":"server/worldmonitor/resilience/v1/_pillar-membership.ts:37","summary":"Pillar coverage and overall coverage use different dimension filters → two published fields disagree per country.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"buildPillarList filters only !isFlagDarkDimension, while the headline uses isExcludedFromConfidenceMean, which additionally excludes RESILIENCE_RETIRED_DIMENSIONS and RESILIENCE_NOT_APPLICABLE_WHEN_ZERO_COVERAGE. For a fully-observed sovereign-wealth country, pillar coverage = 0.75 while overallCoverage = 1.0; for ~190 countries with no SWF data, 0.625 vs 1.0. pillarScore weights domains by weight × coverage, so social-governance takes 59.9% of the structural-readiness pillar instead of the declared 47.2%.","reproduce":["Compute resilience pillars and overall score for a country with a retired/not-applicable dimension","Compare pillar coverage vs overallScore.overallCoverage — they disagree"],"poc":"Re-ran both filters over RESILIENCE_DIMENSION_DOMAINS: pillar 0.75 vs overall 1.0.","impact":"Two published coverage/score fields disagree for the same country, and pillar weighting is skewed from its declared distribution.","remediation":["Change _pillar-membership.ts:37 to filter with !isExcludedFromConfidenceMean(dimension)"],"status":"code-verified"},{"id":"V69","severity":"medium","title":"A missing sub-indicator is dropped and survivors renormalised, so a source outage raises the score","component":"server/worldmonitor/resilience/v1/_dimension-scorers.ts:994-1019","summary":"weightedScore divides by available+fallback weight, not total — a null leg redistributes onto survivors, inflating the score.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"weightedScore divides by scoringWeight = availableWeight + fallbackWeight, not totalWeight. A metric with score===null and no fallbackScore leaves the denominator and its weight redistributes to survivors. Running MACRO_FISCAL_INDICATOR_WEIGHTS with legs 60/20/40/80/50: all-observed → 51; worst leg missing → 58; best leg missing → 45. The IMPUTE taxonomy that would deflate absent signals is not applied because the outage branch emits score:null (a drop), not an IMPUTE entry.","reproduce":["Simulate one sub-indicator seeder failing (score:null, no fallback)","Observe the country's published overall score and rank move up, with only coverage dropping"],"poc":"Computed: worst-leg-missing raises the dimension score from 51 to 58.","impact":"When a seeder dies, the affected country's resilience score increases with nothing on the response indicating a source is down.","remediation":["Divide by totalWeight, or emit an IMPUTE (deflating) entry for the missing leg rather than dropping it"],"status":"code-verified"},{"id":"V70","severity":"medium","title":"Unguarded toISOString() on a seed-meta timestamp poisons the score cache for all 196 countries","component":"server/worldmonitor/resilience/v1/_shared.ts:890-893","summary":"A non-parsing fetchedAt throws RangeError → NEG_SENTINEL cached → resilience ranking never published for any country.","cvss":"N/A — availability (latent)","cwe":"CWE-20","scope":"infra","description":"The code guards only truthiness: staticMeta?.fetchedAt ? new Date(staticMeta.fetchedAt).toISOString().slice(0,10) : todayIsoDate(). A non-parsing value throws RangeError. The throw propagates through cachedFetchJson → writes NEG_SENTINEL and rethrows → a success-shaped zero payload → warmMissingResilienceScores records a compute failure for all 196 countries → coverageRatio 0 < 0.9 → the ranking is never published. Three sibling helpers in the same file guard the field correctly.","reproduce":["Have the static seed-meta carry a non-numeric/non-parseable fetchedAt","Observe the resilience ranking fails to publish for the entire country set"],"poc":"Source-level: new Date(<non-parseable>).toISOString() throws RangeError with no Number.isFinite guard.","impact":"Blast radius is the entire published resilience score surface, not one country. Latent — the current seeder writes Date.now().","remediation":["Guard with Number.isFinite(new Date(fetchedAt).getTime()) before toISOString(), mirroring toResilienceDataVersion in the same file"],"status":"code-verified"},{"id":"V71","severity":"medium","title":"change30d is not 30 days: the 31-member ZSET cap is shared across formula and education tags","component":"server/worldmonitor/resilience/v1/_shared.ts:855-863","summary":"One ZSET holds date:formula:educationState members trimmed to 31 total, so change30d reaches only ~15 days of depth.","cvss":"N/A — correctness","cwe":"CWE-682","scope":"api","description":"One ZSET per country holds <date>:<formula>:<educationState> members, trimmed with ZREMRANGEBYRANK key 0 -31 — a 31-member cap across ALL tags. The reader filters to the current tag and takes history[0] as the 30-day anchor. The two documented rollback flags (PILLAR_COMBINE, EDUCATION) do not rotate the history key prefix, unlike every other construct change. On flip day filtered history is empty (change30d = 0); it reaches only ~15 days of depth.","reproduce":["Flip RESILIENCE_PILLAR_COMBINE_ENABLED or RESILIENCE_EDUCATION_ENABLED","Observe change30d = 0 on flip day and a 1-day delta the next day under a field named change30d"],"poc":"Source-level: single ZSET, 31-member cap, tag-filtered reader.","impact":"The published change30d trend is shallow and resets on flag flips; detectTrend reads 'stable' for the first two days.","remediation":["Rotate the history key prefix on flag flips, or hold a per-tag ZSET with its own cap"],"status":"code-verified"},{"id":"V72","severity":"medium","title":"Energy scorers keep the 0.5 exposure default that scoreLogisticsSupply removed for this exact defect","component":"server/worldmonitor/resilience/v1/_dimension-scorers.ts:3133-3135 / :3024","summary":"Missing fossilElectricityShare defaults to 0.5, pinning energyPriceStress at a hard floor of 50/100.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"scoreEnergyV2 (:3133) and scoreEnergyLegacy (:3024) keep `const exposure = fossilElectricityShare != null ? ... : 0.5;` — the same 0.5 default that scoreLogisticsSupply (:2939-2956) removed with a plan reference because it inflated tiny states' components to ~75. With no exposure observation, energyPriceStress is pinned at 50 + 0.5 × energyStressScore (a floor of 50/100), and weightedBlend assigns it weight 1.0.","reproduce":["Score energy resilience for a country with no fossilElectricityShare observation","Observe energyPriceStress floored at ~50 regardless of the live shock signal"],"poc":"Source-level: 0.5 fallback present in scoreEnergyV2/Legacy, absent in the corrected scoreLogisticsSupply.","impact":"Countries with no exposure data get a fabricated 50/100 energy-stress floor on a live-shock signal, weighted at full confidence.","remediation":["Remove the 0.5 default (mirror scoreLogisticsSupply) and set certaintyCoverage so the missing leg is deflated"],"status":"code-verified"},{"id":"V73","severity":"high","title":"list-stablecoin-markets degraded 200s get s-maxage=1200 from the shared CDN","component":"server/worldmonitor/market/v1/list-stablecoin-markets.ts:358,387","summary":"Degraded responses use dataStatus (not a cache-contract marker) so a Redis blip is CDN-cached as 'no data' for ~20 min.","cvss":"N/A — availability","cwe":"CWE-345","scope":"api","description":"Every degraded exit returns { stablecoins: [], dataStatus: 'UNAVAILABLE'|'PARTIAL' }. cache-contract.ts only recognises upstreamUnavailable/unavailable/dataAvailable:false/degraded/available:false/error — not dataStatus — and the handler never calls markNoStoreFallbackResponse. So getRpcNoStoreReasonFromJson returns null and the gateway applies CDN-Cache-Control: public, s-maxage=1200, stale-if-error=1800 for anonymous callers. It is the sole unmarked seed-read handler in the directory.","reproduce":["Cause an Upstash blip while an anonymous client requests list-stablecoin-markets","Observe an empty degraded 200 served, then CDN-cached for ~20 min (≈50 min under stale-if-error)"],"poc":"Source-level: no markNoStore call; dataStatus not in the cache-contract marker set.","impact":"One Redis blip makes every anonymous visitor see 'no stablecoin data' for ~20-50 minutes, dated fresh via a current timestamp.","remediation":["Wrap both degraded returns in markNoStoreFallbackResponse(ctx.request, ...) or add dataAvailable:false"],"status":"code-verified"},{"id":"V74","severity":"medium","title":"get-insider-transactions sends the Finnhub key in the URL; its sibling uses the header","component":"server/worldmonitor/market/v1/get-insider-transactions.ts:69","summary":"Finnhub API key placed in the query string (&token=), where the sibling _quote-provider uses X-Finnhub-Token.","cvss":"4.0 (Low-Medium) — credential exposure in logs","cwe":"CWE-598","scope":"comms","description":"The handler builds `https://finnhub.io/api/v1/stock/insider-transactions?symbol=...&token=${apiKey}`, while _quote-provider.ts:120 authenticates the same FINNHUB_API_KEY with the X-Finnhub-Token header (a first-class Finnhub alternative). A URL-embedded key lands in every egress proxy / CDN / APM access log and would be copied into Referer on any redirect.","reproduce":["Trigger an insider-transactions fetch","Inspect egress/proxy logs and observe the Finnhub token in the request URL"],"poc":"Source-level: token in query string vs header on the sibling provider.","impact":"The shared Finnhub credential is written to logs and can leak via Referer, risking key compromise.","remediation":["Drop &token= and send the X-Finnhub-Token header, matching _quote-provider.ts"],"status":"code-verified"},{"id":"V75","severity":"medium","title":"AnalyzeStock cache key is a lossy form of caller-supplied name","component":"server/worldmonitor/market/v1/analyze-stock.ts:1982-1988","summary":"Cache key folds name.replace(/[^a-zA-Z0-9]/g,'').slice(0,30) — collisions serve another caller's analysis; unbounded LLM spend.","cvss":"N/A — data-integrity + cost","cwe":"CWE-345","scope":"api","description":"The cache key folds name.replace(/[^a-zA-Z0-9]/g,'').slice(0,30).toLowerCase(). Two names sharing their first 30 alphanumerics collide, and the cached payload carries the first caller's name plus the LLM summary/action/whyNow. The news sub-cache uses a different canonicalisation (stableHash(query).slice(0,12) over the full query), so the layers were never reconciled. A caller can also manufacture unbounded distinct keys for one symbol, forcing fresh paid LLM calls up to the daily quota.","reproduce":["Request analyze-stock with two different names sharing their first 30 alphanumeric characters","Observe the second request served the first caller's cached analysis"],"poc":"Source-level: lossy 30-char alphanumeric fold used as cache identity.","impact":"One caller's stock analysis (with their name) is served to another; and unbounded cache-key variants drive paid LLM spend.","remediation":["Hash the full, validated name (as the news sub-cache does) and validate/bound the name before keying"],"status":"code-verified"},{"id":"V76","severity":"low","title":"list-comtrade-flows widens a malformed reporter_code to all six reporters","component":"server/worldmonitor/trade/v1/list-comtrade-flows.ts:34","summary":"A present-but-invalid reporter_code silently answers with the entire 84-key default dataset.","cvss":"N/A — input validation","cwe":"CWE-20","scope":"input","description":"`req.reporterCode && isValidCode(req.reporterCode) ? [req.reporterCode] : REPORTERS` — a present-but-invalid code silently answers with the entire default dataset. Both siblings (get-trade-flows.ts:82, get-tariff-trends.ts:113) explicitly fixed this class; this handler kept the old shape.","reproduce":["Call list-comtrade-flows with reporter_code=XX (present but invalid)","Observe the full multi-reporter dataset returned instead of an error"],"poc":"Source-level: invalid code falls through to REPORTERS.","impact":"A malformed reporter filter silently returns everything, misleading callers about scope.","remediation":["Reject a present-but-invalid reporter_code with a 400, matching the sibling handlers"],"status":"code-verified"},{"id":"V77","severity":"low","title":"analyze-stock reports the 20-day average in the ma60 field","component":"server/worldmonitor/market/v1/analyze-stock.ts:1116","summary":"When <60 candles, ma20 is substituted and emitted as ma60 (and fed to the LLM prompt) with no marker.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"`const ma60Series = candles.length >= 60 ? smaSeries(closes, 60) : ma20Series.slice();` substitutes MA20 and emits it as the ma60 response field, also injected into the LLM prompt. The upstream gate requires only candles.length >= 30, so any stock with 30-59 bars (recent IPO, long halt) reports a 20-day MA labelled ma60, with no separate null marker.","reproduce":["Analyze a stock with 30-59 candles","Observe the ma60 field actually contains the 20-day moving average"],"poc":"Source-level: ma20Series.slice() assigned to ma60Series in the <60-candle branch.","impact":"A mislabeled moving average is shown to users and fed to the analysis LLM, producing subtly wrong indicators.","remediation":["Emit null (or omit) ma60 when fewer than 60 candles exist, rather than substituting ma20"],"status":"code-verified"},{"id":"V78","severity":"low","title":"rateDateMs rolls invalid dates over; its Number.isFinite guard can never fire","component":"server/worldmonitor/economic/v1/us-interest-rates.ts:43-48","summary":"Date.UTC normalises invalid dates (2026-13-45 → 2027-02-14) so isFinite is always true — the guard is dead.","cvss":"N/A — input validation","cwe":"CWE-20","scope":"input","description":"rateDateMs uses Date.UTC(y, m-1, d), which normalises rather than rejecting: rateDateMs('2026-13-45') → 2027-02-14, so Number.isFinite(ms) is always true. The two siblings use Date.parse(`${isoDate}T00:00:00Z`), which returns NaN for the identical input and is correctly rejected.","reproduce":["Call rateDateMs with an out-of-range date like 2026-13-45","Observe a valid (rolled-over) timestamp returned instead of rejection"],"poc":"Date.UTC(2026, 12, 45) normalises to 2027-02-14.","impact":"Malformed dates are silently accepted and mapped to the wrong day, corrupting rate-series lookups.","remediation":["Use Date.parse(`${isoDate}T00:00:00Z`) and reject NaN, matching the sibling handlers"],"status":"code-verified"},{"id":"V79","severity":"low","title":"get-forecast-scorecard hand-rolls its Redis read and drops the Upstash error-envelope check","component":"server/worldmonitor/forecast/v1/get-forecast-scorecard.ts:104-105","summary":"Checks only resp.ok then payload.result; Upstash returns HTTP 200 with {error} for command failures.","cvss":"N/A — robustness","cwe":"CWE-754","scope":"infra","description":"The handler checks only resp.ok then `payload.result || null`. Upstash returns HTTP 200 with {\"error\":\"…\"} for command failures, and the shared redis.ts:163 (used by the sibling get-forecasts.ts) throws on data.error. Contained in practice (the empty card is marked no-store), so the effect is a misleading 'Redis credentials not configured' log for a command failure plus a second Redis client to maintain.","reproduce":["Induce an Upstash command error (HTTP 200 with an error body)","Observe it treated as an empty result rather than an error"],"poc":"Source-level: no data.error check on the hand-rolled read path.","impact":"Command failures are misclassified and mis-logged; a redundant Redis client diverges from the shared helper.","remediation":["Use the shared redis.ts helper (which throws on data.error) instead of a bespoke read"],"status":"code-verified"},{"id":"V80","severity":"high","title":"computeExposure nearest-country lookup is raw-degree Euclidean","component":"shared/analysis-population-exposure.ts:91","summary":"Distance = sqrt(dlat^2+dlon^2) with no cos(lat) and no antimeridian wrap → wrong country, wrong hemisphere.","cvss":"N/A — data-integrity/correctness","cwe":"CWE-682","scope":"api","description":"const dist = Math.sqrt((lat - cLat) ** 2 + (lon - cLon) ** 2) — raw degrees, no cos(lat) scaling and no antimeridian wrap. A degree of longitude is not a degree of latitude, so the metric over-weights longitude by 1/cos(lat) (unbounded near the poles), and 179°E scores as 358° from 179°W rather than 1°, mapping points west of the antimeridian to the wrong hemisphere. The chosen country's density is the sole multiplier for the returned exposedPopulation.","reproduce":["Call get-population-exposure (exposure mode) for a point near the antimeridian or a high latitude","Observe the nearestCountry resolves to a wrong, distant country"],"poc":"MLI centroid lon -4.0 sits a raw-degree gap of 171.2 from Tonga's -175.2; the metric ignores that these straddle the antimeridian.","impact":"Population-exposure estimates attribute events to the wrong country (and the browser panel's top-10 sorts on the resulting exposedPopulation).","remediation":["Use dx = ((lon - cLon + 540) % 360) - 180; dist = hypot(lat - cLat, dx * cos(lat*PI/180))"],"status":"code-verified"},{"id":"V81","severity":"high","title":"get-temporal-baseline reads a Redis keyspace no producer writes","component":"server/worldmonitor/infrastructure/v1/get-temporal-baseline.ts:13,44","summary":"Reader uses baseline:v1 keys; the only producer writes baseline:v2 — so the RPC can never return a baseline.","cvss":"N/A — availability/correctness","cwe":"CWE-670","scope":"api","description":"get-temporal-baseline uses makeBaselineKey → baseline:v1:<type>:global:<weekday>:<month>. The only server-side producer (list-temporal-anomalies.ts:376) writes baseline:v2 via makeBaselineKeyV2, and the only v1 writer (record-baseline-snapshot.ts:20) now throws an unconditional 403. So getCachedJson always returns null and the handler returns { learning:true, sampleCount:0 } with error:'' — cached under the slow tier because no no-store marker fires.","reproduce":["Call get-temporal-baseline for any of its five types","Observe a permanent { learning:true, sampleCount:0 } response, cached on the slow tier"],"poc":"Source-level: reader on makeBaselineKey (v1); producer on makeBaselineKeyV2 (v2); v1 writer 403s.","impact":"The RPC can never return a baseline, anomaly, or z-score for any type; clients get a permanent 'still warming up' signal.","remediation":["Point the reader at makeBaselineKeyV2 (the live keyspace), or restore a v1 producer","Emit a no-store marker for the empty/learning payload so it is not slow-tier cached"],"status":"code-verified"},{"id":"V82","severity":"high","title":"STAC imagery failure cached as a positive empty result","component":"server/worldmonitor/imagery/v1/search-imagery.ts:168-171,191","summary":"Non-2xx STAC response returns {scenes:[],totalResults:0} instead of null, so an upstream outage is cached as a valid empty answer (1h Redis, 4h CDN).","cvss":"N/A — availability/robustness","cwe":"CWE-755","scope":"api","description":"On a non-2xx upstream response the fetcher returns an empty success payload ({scenes:[],totalResults:0}) rather than null or a throw. cachedFetchJsonWithMeta treats any non-null return as a positive result and writes it for CACHE_TTL=3600s; the payload carries none of the availability markers cache-contract.ts recognizes, so the static tier applies s-maxage=3600 and the CDN s-maxage=14400. The timeout path correctly throws, but the non-2xx branch bypasses it.","reproduce":["Force the STAC upstream to return a non-2xx (e.g. 5xx) during a search-imagery call","Observe the handler returns 200 {scenes:[],totalResults:0}","Note the response lacks upstreamUnavailable/dataAvailable markers, so it is cached 1h (Redis) / 4h (CDN)","Each distinct datetime window is poisoned independently until its Redis entry expires"],"poc":"Source-verified: search-imagery.ts:170 returns {scenes:[],totalResults:0} on !resp.ok; helper caches non-null results per its own contract (redis.ts:985-987).","impact":"An imagery upstream blip is presented and cached as 'no scenes available' for up to an hour (Redis) and four hours (CDN), masking the outage and denying real results to every caller of that window.","remediation":["Return null on non-2xx so the failure is not cached (cacheFailures:false)","Add upstreamUnavailable:true to the catch payload so the gateway forces no-store"],"status":"code-verified"},{"id":"V83","severity":"high","title":"list-service-statuses total outage caches 31 UNSPECIFIED rows and destroys its fallback","component":"server/worldmonitor/infrastructure/v1/list-service-statuses.ts:134-136,279-281,322","summary":"checkServiceStatus swallows every error into an UNSPECIFIED row and never returns null, so a total outage yields 31 unknown rows that also overwrite the last-good fallback cache.","cvss":"N/A — availability/robustness","cwe":"CWE-755","scope":"api","description":"checkServiceStatus maps every error/non-2xx to a SERVICE_OPERATIONAL_STATUS_UNSPECIFIED row and never returns null, so Promise.all always yields 31 rows and the total-outage suppression branch is unreachable. Line 322 then assigns fallbackStatusesCache = {data: results}, overwriting the last-good snapshot with the all-unknown array; the '|| fallbackStatusesCache?.data' fallback is dead, and even the catch returns the poisoned rows. The path is in RELAY_WARM_PING_PATHS so the relay actively pulls the poisoned body into the shared cache.","reproduce":["Trigger an egress block or 403 wave so all 31 service checks fail","Observe 31 rows returned, all status UNSPECIFIED, HTTP 200","Note fallbackStatusesCache is overwritten with the all-unknown array (line 322)","Outage now outlasts the Redis entry because the good fallback is clobbered"],"poc":"Source-verified: no null-return path; :322 unconditionally overwrites fallback; health stamping records recordCount:31 as if real.","impact":"One egress block makes all 31 providers read 'unknown' for ~30 min, and because the fallback is destroyed the outage persists beyond the cache window — a self-inflicted availability degradation of the status board.","remediation":["Return null from the fetcher when every row is UNSPECIFIED","Only assign fallbackStatusesCache when at least one row has a known status"],"status":"code-verified"},{"id":"V84","severity":"medium","title":"Vessel-snapshot bbox quantization floors all four corners","component":"server/worldmonitor/maritime/v1/get-vessel-snapshot.ts:48-50,101-105,186-190","summary":"quantize() is Math.floor applied to both SW and NE corners, shrinking the box south/west; sub-degree boxes collapse to zero area and match no vessel.","cvss":"N/A — correctness","cwe":"CWE-682","scope":"api","description":"quantize is Math.floor and is applied to both the SW and NE corners, so the box shrinks instead of snapping outward. Sub-degree boxes collapse to zero area (a 0.5x0.5 box east of the antimeridian becomes 0x0), and floor(-179.5)=-180 zero-widths any half-degree box near the antimeridian. The relay accepts a zero-area box, so the request succeeds and matches nothing. Sibling list-military-bases/list-webcams correctly floor SW and ceil NE.","reproduce":["Request a vessel snapshot with a ~0.5 degree bbox (e.g. lat 24.57->28.57)","Observe both corners floored (24->28), the northern 0.57 strip dropped","For a box just east of the antimeridian, observe a zero-width query returning no vessels"],"poc":"Runtime-reproduced in audit: a valid 0.5x0.5 box east of the antimeridian quantizes to 0.00x0.00.","impact":"Vessels in the top/right strip of any requested viewport are systematically omitted, and small viewports return empty — silently wrong maritime coverage on the live-tankers layer.","remediation":["Floor the SW corner and ceil the NE corner (quantize(..., true) for NE), mirroring list-military-bases.ts","Reject or expand a zero-area box before querying"],"status":"code-verified"},{"id":"V85","severity":"medium","title":"list-military-bases maps an unparseable coordinate to (0,0) while keeping the real country","component":"server/worldmonitor/military/v1/list-military-bases.ts:203-204","summary":"Number(meta.lat)||0 collapses missing/non-numeric/real-zero coordinates to (0,0) while still publishing the real name/branch/countryIso2.","cvss":"N/A — correctness","cwe":"CWE-20","scope":"api","description":"Number(meta.lat)||0 collapses 'no coordinate', non-numeric, and a genuine 0 into the same (0,0), while the record still publishes the real name/kind/branch/countryIso2. A named base is drawn in the Gulf of Guinea labelled with a country it is not in, surviving an hour of daily-tier CDN cache and returned by a country filter. The sibling list-military-flights rejects (returns null) instead of relocating; the seeder guard only checks lat==null, which is false for 'abc'/200/''.","reproduce":["Seed or receive a base record with lat='abc' or a missing lat","Observe the base rendered at (0,0) with its real country label intact","Filter by that country and see the mislocated base returned"],"poc":"Source-verified: :203-204 Number(meta.lat)||0; seeder guard (seed-military-bases.mjs:757) only filters lat==null.","impact":"Named military bases are plotted in the ocean off West Africa with a wrong country attribution and cached for an hour — misleading operational data on a defense layer.","remediation":["Reject records with non-finite coordinates (return null), matching list-military-flights.ts:235","Tighten the seeder guard to Number.isFinite(lat) && Number.isFinite(lon)"],"status":"code-verified"},{"id":"V86","severity":"medium","title":"list-earthquakes passes an unclamped page_size into Array.slice","component":"server/worldmonitor/seismology/v1/list-earthquakes.ts:23,29","summary":"pageSize = req.pageSize||500 is a truthiness check, not a range check; a negative value reaches slice(0, negative) and returns an offset-from-end slice.","cvss":"N/A — input validation","cwe":"CWE-1284","scope":"input","description":"const pageSize = req.pageSize || 500 is a truthiness guard, not a range check, and the proto field carries no buf.validate rule. A negative value reaches slice(0, negative), where JS treats a negative end as an offset from the end (page_size=-5 -> length 15 on a 20-element array). Every sibling (list-cyber-threats, list-climate-disasters) clamps with clampInt; list-military-flights requires Number.isInteger && >0.","reproduce":["Call list-earthquakes with page_size=-5 against a 20-item set","Observe 15 items returned (slice(0,-5))","Try page_size=-100000 and observe 0 items"],"poc":"Runtime-reproduced in audit: negative page_size yields offset-from-end slices instead of a clamp.","impact":"A caller can silently truncate or distort the result count with a negative page size; inconsistent with every sibling list route and unvalidated at the proto layer.","remediation":["Add (buf.validate.field).int32.gte=0 to page_size and regenerate","Clamp in the handler with clampInt like the sibling list routes"],"status":"code-verified"},{"id":"V87","severity":"medium","title":"list-positive-geo-events reports stale:false on total source failure","component":"server/worldmonitor/positive-events/v1/list-positive-geo-events.ts:50","summary":"On Redis error with no fallback the handler returns {events:[],fetchedAt:0,stale:false} — asserting current data — with no gateway marker, poisoning a fixed cache key.","cvss":"N/A — availability/robustness","cwe":"CWE-755","scope":"api","description":"When Redis errors and no in-process fallback applies, the handler returns {events:[], fetchedAt:0, stale:false}. stale:false asserts the data is current, and no gateway availability marker is present, so cache-contract cannot force no-store. Every sibling in the family (list-natural-events, list-fire-detections, list-navigational-warnings, list-climate-news) returns dataAvailable:false. The cache key is fixed (positive-events:geo:v1), so one failure poisons the endpoint for every anonymous caller across the slow/CDN window.","reproduce":["Induce a Redis read error for positive-events:geo:v1","Observe 200 {events:[], stale:false}","Confirm the empty result is cached for all anonymous callers (fixed key, no no-store marker)"],"poc":"Source-verified: :50 returns stale:false on failure vs siblings returning dataAvailable:false.","impact":"A transient Redis failure is published as 'no positive events, and current' and cached platform-wide, hiding the outage from operators and consumers alike.","remediation":["Return dataAvailable:false (or upstreamUnavailable:true) on failure so the gateway sets no-store","Never emit stale:false for a failed read"],"status":"code-verified"},{"id":"V88","severity":"medium","title":"get-population-exposure never enforces required coordinates; radius is unbounded","component":"server/worldmonitor/displacement/v1/get-population-exposure.ts:26","summary":"lat/lon are documented required but only range-validated, so mode=exposure with no coords defaults to (0,0); radius has gte=0 and no upper bound, producing lossy int64 estimates.","cvss":"N/A — input validation","cwe":"CWE-20","scope":"input","description":"The proto documents lat/lon as required for exposure mode but attaches only range rules; the handler never checks presence. ?mode=exposure with no coordinates decodes to 0, satisfies gte=-90/lte=90, and returns a fully-formed estimate for (0,0). radius has gte=0 and no lte; the module's own doc warns an unbounded radius 'produces a confidently-wrong number... worse than refusing', and documents computeBoundedExposure which this RPC does not use. Large radius overflows Number.MAX_SAFE_INTEGER, so the int64 field is emitted as a lossy double.","reproduce":["Call get-population-exposure?mode=exposure with no lat/lon","Observe a populated estimate for coordinates (0,0) (e.g. nearestCountry NGA)","Call with radius=10000000 and observe an exposedPopulation exceeding MAX_SAFE_INTEGER (lossy)"],"poc":"Runtime-reproduced in audit: missing coords -> (0,0) estimate; radius=1e7 -> ~2.8e17 exposedPopulation.","impact":"The endpoint returns confident, wrong exposure figures for missing/oversized inputs instead of refusing, and emits lossy int64 values — misleading humanitarian estimates.","remediation":["Require lat/lon presence for exposure mode and 400 otherwise","Add an upper bound to radius and route through computeBoundedExposure"],"status":"code-verified"},{"id":"V89","severity":"low","title":"get-humanitarian-summary-batch returns 200 empty where its single-country sibling raises 503","component":"server/worldmonitor/conflict/v1/get-humanitarian-summary-batch.ts:39-51","summary":"The batch route treats every cache miss as a legitimate zero and returns 200 {results:{}} cached ~20 min, while the single-country sibling throws 503 via readRequiredSeed.","cvss":"N/A — availability/robustness","cwe":"CWE-755","scope":"api","description":"getCachedJsonBatch misses are treated as legitimate zeros, so the route returns {results:{}, fetched:0, requested:N} with 200. The single-country sibling uses readRequiredSeed which throws SeedUnavailableError (503, no-store). The route is absent from RPC_CACHE_TIER, so it falls back to medium (s-maxage=600 / CDN 1200), publicly caching '0 of 25 countries have summaries' for ~20 min. The catch also reports requested:0, discarding the caller's input.","reproduce":["Call get-humanitarian-summary-batch when the seed cache is empty","Observe 200 {results:{}, fetched:0} cached for ~20 minutes","Compare with get-humanitarian-summary (single) returning 503"],"poc":"Source-verified: batch uses getCachedJsonBatch (miss=zero); sibling uses readRequiredSeed (throws 503).","impact":"A seed gap is published and cached as 'no humanitarian data for these countries' rather than signalled as unavailable, and the catch loses the request context.","remediation":["Treat an all-miss batch as unavailable (503/no-store) like the single-country route","Preserve requested count in the catch path"],"status":"code-verified"},{"id":"V90","severity":"low","title":"mapEcsFlight substitutes (0,0) for a position-less flight","component":"server/worldmonitor/military/v1/get-wingbits-live-flight.ts:81-82","summary":"lat: raw.lat ?? raw.la ?? 0 stamps (0,0) for a flight with no position; cached 30s on an ungated public RPC, indistinguishable from a real Gulf of Guinea fix.","cvss":"N/A — correctness","cwe":"CWE-20","scope":"api","description":"lat: raw.lat ?? raw.la ?? 0 substitutes 0 for an absent position; the only absence check is on data.flight. The record is cached 30s and served on an ungated public RPC, and the generated type declares plain double so (0,0) is indistinguishable from a real fix. Rated Low because no first-party browser code reads live.lat/lon — impact is confined to third-party API/MCP consumers.","reproduce":["Receive a flight record with no lat/lon but a present flight id","Observe the record served with lat=0, lon=0","Note it is cached 30s on the public RPC"],"poc":"Source-verified: :81-82 nullish-defaults coordinates to 0.","impact":"Third-party consumers of the live-flight RPC receive phantom (0,0) positions for position-less flights, with no way to distinguish them from real fixes.","remediation":["Return null / omit the record when lat or lon is absent (mirror list-military-flights.ts:235)"],"status":"code-verified"},{"id":"V91","severity":"high","title":"SSE connect timeout is attached to the long-lived stream, making the 12s RPC budget unreachable","component":"api/mcp-proxy.ts:204-212,646-657","summary":"The 10s connect AbortSignal is passed to the fetch that opens the SSE stream, so it aborts the response body at 10s — the documented 12s RPC budget can never be reached.","cvss":"N/A — availability/robustness","cwe":"CWE-703","scope":"api","description":"SSE_CONNECT_TIMEOUT_MS=10000 and SSE_RPC_TIMEOUT_MS=12000, but connect() passes signal: AbortSignal.timeout(SSE_CONNECT_TIMEOUT_MS) to the GET that opens the HTTP+SSE stream. A signal passed to fetch aborts the response body, not just connection setup, so the stream carrying every initialize/tools/list/tools/call response is structurally dead at 10s while the code waits 12s. A secondary defect: rejectSession rejects deferreds whose handler is only attached later, producing an unhandled promise rejection in the Edge isolate, triggerable on demand (30 req/min/IP).","reproduce":["Point /api/mcp-proxy at a remote MCP server whose path ends in /sse and whose tool takes >10s","Observe the stream aborts at 10s (TimeoutError on the body) -> 504 'MCP server timed out'","Trigger a stream abort inside the send() window to observe an unhandled rejection"],"poc":"Runtime-reproduced in audit against a live server: a 400ms signal let headers + first chunk arrive, then threw TimeoutError on the body at the deadline.","impact":"Every remote MCP server whose tool takes >10s is permanently unusable through the proxy, and the unhandled-rejection half is remotely triggerable on the rate-limited public endpoint.","remediation":["Race only the header phase against the connect deadline; keep the body under a controller that close() aborts","Make every deferred self-handling at creation (promise.catch(()=>{}))"],"status":"code-verified"},{"id":"V92","severity":"medium","title":"prompts/get coerces a JSON argument with unguarded String() -> unhandled TypeError","component":"api/mcp/prompts/index.ts:324","summary":"const value = String(raw) with no typeof guard throws on an object like {toString:'x'}; prompts/get is public/quota-exempt and the handler re-throws, escaping as a raw platform 500.","cvss":"N/A — robustness","cwe":"CWE-248","scope":"api","description":"const value = String(raw) has no typeof guard, so String(JSON.parse('{\"toString\":\"x\"}')) throws TypeError: Cannot convert object to primitive value. prompts/get is in PUBLIC_MCP_METHODS (anonymous, quota-exempt) and mcpHandler re-throws after telemetry, so the error escapes every structured JSON-RPC path as a raw platform 500 with no Cache-Control/CORS and no id echo, breaking the 'every refusal is a JSONRPCError' invariant. Siblings guard this (argStr returns '' for non-strings).","reproduce":["POST /mcp {jsonrpc:2.0,id:1,method:'prompts/get',params:{name:'...',arguments:{iso2:{toString:1}}}}","Observe a raw platform 500 with no JSON-RPC error envelope and no id"],"poc":"Verified: String({toString:1}) throws; prompts/get re-throws to platform.","impact":"An anonymous caller can force uncontracted 500s on a public MCP method, breaking the JSON-RPC error contract clients rely on.","remediation":["Guard with typeof raw==='string' (or coerce safely), mirroring argStr in api/mcp/filters.ts"],"status":"code-verified"},{"id":"V93","severity":"medium","title":"argStrList throws, and the dispatcher's post-filter catch then serves the UNFILTERED payload","component":"api/mcp/filters.ts:15-18; api/mcp/dispatch.ts:173-188","summary":"argStrList maps String() over untrusted input and can throw; the post-filter catch re-throws only known error types, so a TypeError falls through to result=data — the full unnarrowed blob.","cvss":"N/A — robustness","cwe":"CWE-248","scope":"api","description":"argStrList does raw.map(x=>String(x).toLowerCase().trim()) on untrusted input despite its contract to degrade to a no-op. The dispatcher's post-filter catch re-throws only McpStoredContractError and RpcValidationError; a TypeError is neither, so it reaches result=data — the full, un-narrowed cache blob. Not a data leak (the caller is entitled to the full slice) but it defeats the limit/country narrowing the tool schema advertises and lets a caller trigger Sentry post-filter events at will.","reproduce":["Call an MCP tool passing a non-array/object where a string list is expected","Observe argStrList throws, the catch swallows it, and the unfiltered payload is returned"],"poc":"Source-verified: filters.ts:15-18 unguarded map; dispatch.ts:173-188 catch re-throws only two types.","impact":"Advertised limit/country narrowing can be bypassed (defeating pagination/scoping) and Sentry noise can be generated on demand.","remediation":["Type-guard argStrList like the other coercion helpers (argStr/argNum/argBool)"],"status":"code-verified"},{"id":"V94","severity":"low","title":"describe_tool reflects the caller tool_name untruncated; every sibling caps at 100","component":"api/mcp/registry/rpc-tools.ts:3421","summary":"Returns {error:'unknown_tool',requested:name} with no slice; the quota-exempt tool lets a free account convert ~256KB/request into ~15MB/min of reflected egress.","cvss":"N/A — abuse/amplification","cwe":"CWE-405","scope":"api","description":"describe_tool returns requested: name with no length cap, while the sibling dispatch.ts:284-286 caps the echoed name at 100 with a comment naming the reflection-amplification class. arguments is cast rather than schema-validated, so the only bound is the 256KB body cap. The tool is quota-exempt by design and reachable by an authenticated free account, so one principal can convert ~256KB/request into ~15MB/min of egress that never touches the daily cap.","reproduce":["Call describe_tool with a ~256KB tool_name from a free account","Observe the full name reflected in the response, uncapped"],"poc":"Source-verified: :3421 echoes name unsliced; sibling caps at 100.","impact":"Reflection amplification: a free account can generate large egress from the quota-exempt tool without hitting the daily cap.","remediation":["Cap the echoed name at 100 chars, matching dispatch.ts/handler.ts/a2a.ts"],"status":"code-verified"},{"id":"V95","severity":"low","title":"MCP Apps sources[] links allow http: while sibling evidence[] links are https-only","component":"api/mcp/ui/shell.ts:196-202; world-brief-app.ts:92-99; country-brief-app.ts:142-150","summary":"httpUrl() accepts both http: and https: for sources[] headline links, while the same file's evHttps() enforces https for evidence[] — two link policies for one payload.","cvss":"N/A — transport/hardening","cwe":"CWE-319","scope":"client","description":"shell.ts httpUrl() accepts both http: and https:, and is used for sources[] headline links (a.href=url; target=_blank). The same file defines evHttps() and applies it to evidence[] links 73 lines later — two different link policies for two URL fields from the same payload. The shell CSP has no navigate-to and frame-ancestors is advisory in a meta tag, so any party influencing a sources[].url can place an attacker-chosen, possibly plaintext/MITM-able link inside an official WorldMonitor card.","reproduce":["Supply an http:// URL in a sources[] entry of an MCP Apps card","Observe httpUrl() accepts it and renders a clickable link, unlike evidence[]"],"poc":"Source-verified: httpUrl() accepts http:; evHttps() (same file) enforces https for evidence[].","impact":"A feed/relay that influences sources[].url can embed a plaintext or attacker-controlled link under WorldMonitor's source attribution in an official card.","remediation":["Use https-only validation for sources[] links, matching evHttps()"],"status":"code-verified"},{"id":"V96","severity":"low","title":"MCP per-minute limiters drop reason; the sibling free-tier limiter refuses on timeout","component":"api/mcp/auth.ts:874,912","summary":"Both per-minute limiters destructure only {success}, so a reason:'timeout' resolution (success:true) counts as verified headroom, silently unenforcing the paid burst ceiling under slow Redis.","cvss":"N/A — rate-limit robustness","cwe":"CWE-703","scope":"api","description":"auth.ts:874 and :912 destructure only {success}, so a reason:'timeout' resolution (which @upstash/ratelimit returns as success:true) counts as verified headroom and the catch never fires (no telemetry). The sibling 200 lines below (auth.ts:1034-1046) documents and handles this exact case. This is the fourth independent instance of the reason==='timeout' defect class in the repo (see V21). Under Redis degradation the paid tools/call per-user burst ceiling (60-300/min) is silently unenforced; the daily counter still bounds spend.","reproduce":["Degrade Upstash so limit() resolves {success:true, reason:'timeout'}","Observe the per-minute MCP burst ceiling stops enforcing with no log/Sentry"],"poc":"Source-verified: :874/:912 drop reason; sibling :1034-1046 handles timeout as unavailable.","impact":"During a Redis slowdown the paid MCP per-minute burst limit disappears silently — s an opaque Redis UUID in one flat oauth:token:<uuid> namespace. The stored scope ('mcp'/'mcp_pro') is written at mint time and never read by the resolver, and no RFC 8707 resource parameter is accepted, stored, or checked. No privilege escalation (both scopes grant identical MCP access; redirect_uri/client_id/PKCE are re-verified on exchange with refresh-family reuse contained). The consequence is blast radius: a token is not bound to the client or resource server that received it, so a leak in any consumer is usable at both /mcp and api.worldmonitor.app, and revoking one consumer does not revoke the bearer elsewhere.","reproduce":["Mint an MCP bearer and inspect its stored record","Confirm scope is never consulted by resolveBearerToContext and no resource/audience is bound"],"poc":"Source-verified: grep scope in _oauth-token.js returns only comments; no resource param handling.","impact":"A leaked bearer is usable across every consumer of the token namespace and both host surfaces; revocation is not consumer-scoped.","remediation":["Bind tokens to an audience/resource (RFC 8707) and enforce the stored scope at resolution"],"status":"code-verified"},{"id":"V99","severity":"high","title":"/api/docs-mcp forwards the caller's Authorization to a third-party SaaS host","component":"api/docs-mcp.ts:23,42-51","summary":"FORWARDED_REQUEST_HEADERS includes 'authorization', copied verbatim to a fixed third-party host (worldmonitor.mintlify.dev); the route is an unauthenticated public facade with ACAO:* inviting credentials.","cvss":"6.5 (Medium-High)","cwe":"CWE-200","scope":"api","description":"UPSTREAM_URL is a third-party host (worldmonitor.mintlify.dev/docs/mcp). FORWARDED_REQUEST_HEADERS includes 'authorization' (line 45), and upstreamRequestHeaders() copies the caller's header verbatim into the outbound fetch. The route is an unauthenticated public facade: ACAO:'*' and Access-Control-Allow-Headers includes Authorization, so the CORS preflight actively invites a browser
