<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Monitor — Security Findings</title>
<meta name="description" content="Authorized security assessment of the World Monitor application (NTRO · SIH PS 26163) — 152 findings with CVSS, PoC and remediation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#f8fafc; --elevated:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --muted:#54606e; --faint:#8a95a3;
  --accent:#0e7490; --accent-ink:#ffffff; --accent-soft:#e0f2fe;
  --crit:#dc2626; --high:#ea580c; --med:#ca8a04; --low:#0d9488; --info:#64748b;
  --crit-bg:#fef2f2; --high-bg:#fff7ed; --med-bg:#fefce8; --low-bg:#f0fdfa; --info-bg:#f1f5f9;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e13; --surface:#111820; --surface2:#0e141b; --elevated:#18212b; --border:#232f3b; --border-strong:#33414f;
  --text:#e7eef5; --muted:#9aa8b6; --faint:#647080;
  --accent:#38bdf8; --accent-ink:#04141d; --accent-soft:#0c2b3a;
  --crit:#f0616d; --high:#ff9f45; --med:#ffcf5c; --low:#4ec9b0; --info:#94a3b8;
  --crit-bg:#2a1416; --high-bg:#2a1d10; --med-bg:#282213; --low-bg:#0f2521; --info-bg:#18212b;
}}
:root[data-theme="dark"]{
  --bg:#0a0e13; --surface:#111820; --surface2:#0e141b; --elevated:#18212b; --border:#232f3b; --border-strong:#33414f;
  --text:#e7eef5; --muted:#9aa8b6; --faint:#647080;
  --accent:#38bdf8; --accent-ink:#04141d; --accent-soft:#0c2b3a;
  --crit:#f0616d; --high:#ff9f45; --med:#ffcf5c; --low:#4ec9b0; --info:#94a3b8;
  --crit-bg:#2a1416; --high-bg:#2a1d10; --med-bg:#282213; --low-bg:#0f2521; --info-bg:#18212b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .t{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.stat{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 9px;background:var(--surface2)}
.stat b{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat.crit b{color:var(--crit)} .stat.high b{color:var(--high)} .stat.med b{color:var(--med)} .stat.low b{color:var(--low)} .stat.info b{color:var(--info)}
.top .spacer{flex:1}
.top a.src{font-size:12.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.top a.src:hover{color:var(--accent)}
.tgl{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;width:38px;height:34px;font-size:15px;display:grid;place-items:center;flex:none}
.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- app shell ---------- */
.app{flex:1;display:grid;grid-template-columns:clamp(320px,30vw,420px) 1fr;min-height:0}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface2)}
.filters{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.search input{flex:1;border:0;background:transparent;color:var(--text);font-family:var(--sans);font-size:13.5px;outline:none}
.search svg{flex:none;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;user-select:none}
.chip[aria-pressed="true"]{color:var(--text)}
.chip[aria-pressed="true"].c-crit{background:var(--crit-bg);border-color:var(--crit)}
.chip[aria-pressed="true"].c-high{background:var(--high-bg);border-color:var(--high)}
.chip[aria-pressed="true"].c-med{background:var(--med-bg);border-color:var(--med)}
.chip[aria-pressed="true"].c-low{background:var(--low-bg);border-color:var(--low)}
.chip[aria-pressed="true"].c-info{background:var(--info-bg);border-color:var(--info)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.list{flex:1;overflow-y:auto;overflow-x:hidden}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;border-bottom:1px solid var(--border);cursor:pointer}
.row .stripe{align-self:stretch;min-height:52px}
.row .main{min-width:0;padding:9px 4px 9px 0}
.row .rid{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.row .rtitle{font-weight:600;font-size:13px;letter-spacing:-.01em;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .badge{padding-right:12px}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sevdot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:1px;margin-right:5px}
.sevmini{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.sev-critical .stripe{background:var(--crit)} .sevmini.sev-critical{background:var(--crit-bg);color:var(--crit)} .sevdot.critical{background:var(--crit)}
.sev-high .stripe{background:var(--high)} .sevmini.sev-high{background:var(--high-bg);color:var(--high)} .sevdot.high{background:var(--high)}
.sev-medium .stripe{background:var(--med)} .sevmini.sev-medium{background:var(--med-bg);color:var(--med)} .sevdot.medium{background:var(--med)}
.sev-low .stripe{background:var(--low)} .sevmini.sev-low{background:var(--low-bg);color:var(--low)} .sevdot.low{background:var(--low)}
.sev-info .stripe{background:var(--info)} .sevmini.sev-info{background:var(--info-bg);color:var(--info)} .sevdot.info{background:var(--info)}
.list .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- detail pane ---------- */
.detail{overflow-y:auto;min-height:0;background:var(--bg)}
.detail-inner{max-width:920px;margin:0 auto;padding:30px 40px 80px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.dhead .did{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sevpill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.sevpill.sev-critical{background:var(--crit-bg);color:var(--crit)} .sevpill.sev-high{background:var(--high-bg);color:var(--high)}
.sevpill.sev-medium{background:var(--med-bg);color:var(--med)} .sevpill.sev-low{background:var(--low-bg);color:var(--low)} .sevpill.sev-info{background:var(--info-bg);color:var(--info)}
.livetag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--crit);border:1px solid var(--crit);border-radius:5px;padding:2px 7px}
.dtitle{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 20px;text-wrap:balance}
.metagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:26px}
.metagrid .m{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px}
.metagrid .m .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
.metagrid .m .v{font-size:13px;font-family:var(--mono);word-break:break-word;line-height:1.45}

.sec{margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec > h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec > h3::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.sec p{margin:0;font-size:15px;line-height:1.7;color:var(--text)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding:11px 14px 11px 46px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.fixes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fixes li{position:relative;padding:10px 14px 10px 34px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--low);border-radius:9px;font-size:14px;line-height:1.6}
.fixes li::before{content:"✓";position:absolute;left:12px;top:10px;color:var(--low);font-weight:700}
.poc{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:13px 15px;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.disclose{font-size:12.5px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:8px;padding:10px 13px;margin-top:10px}
.impactbox{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.impactbox p{font-size:14.5px}

.placeholder{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.placeholder .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px}

/* PS bar */
.psbar{margin-top:8px}
.psbar details{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.psbar summary{cursor:pointer;padding:12px 15px;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:10px;align-items:center}
.psbar summary::-webkit-details-marker{display:none}
.psbar summary .cv{margin-left:auto;color:var(--faint);font-size:11.5px;font-weight:500}
.psbar .pc{padding:0 15px 14px;font-size:13px;color:var(--muted)}
.psbar .pc h4{color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.psbar .pc ul{margin:0;padding-left:18px}

/* mobile: detail becomes an overlay */
.back{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{border-right:0}
  .detail{position:fixed;inset:0;top:0;z-index:50;transform:translateX(100%);transition:transform .22s ease}
  body.detail-open .detail{transform:translateX(0)}
  .detail-inner{padding:20px 18px 70px}
  .back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;margin-bottom:16px}
  .stats{display:none}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.detail::-webkit-scrollbar,.list::-webkit-scrollbar{width:10px}
.detail::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
</style>
</head>
<body>

  <div class="brand">

  </div>
  <div class="stats" id="stats"></div>
  <span class="spacer"></span>
  <a class="src" href="https://www.worldmonitor.app" target="_blank" rel="noopener">worldmonitor.app ↗</a>
  <button class="tgl" id="tgl" title="Toggle theme" aria-label="Toggle light/dark theme">◐</button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="filters">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search title, ID, component, scope…" autocomplete="off" aria-label="Search findings">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filter by severity"></div>
      <span class="count" id="count"></span>

  <section class="detail" id="detail" tabindex="-1" aria-live="polite">

      <div><div class="big">Select a finding</div><div>152 findings · click any item to see the full report</div></div>
    </div>
  </section>
</div>

<script>
const FINDINGS = [{"id":"V28","severity":"low","title":"vitest@4.1.1 matches CVE-2026-84373 (path traversal / arbitrary file read); dev-only","component":"package-lock.json (vitest 4.1.1) · package.json (^4.1.0)","summary":"The committed lockfile pins vitest 4.1.1 (affected by GHSA-82fw-gwwq-j7x9, fixed 4.1.11); the caret in package.json permits the fix but the lockfile does not take it. Reachable only by a test-file author.","cvss":"N/A — dev dependency","cwe":"CWE-22 (Path Traversal)","scope":"supply-chain","description":"package-lock.json + the vitest entry; GHSA-82fw-gwwq-j7x9 affects >=2.1.0 003c4.1.11; fix is 4.1.11. package.json declares vitest ^4.1.0, so the caret permits the fix but the committed lockfile does not take it. Reachable only by whoever can already write a test/mock spec.","reproduce":["grep vitest in package-lock.json (4.1.1) vs the advisory fix 4.1.11","Confirm exposure is limited to test execution"],"poc":"Static: lockfile pins vitest 4.1.1 (003c 4.1.11 fix); dev/test-time only.","impact":"Arbitrary file read during test execution by an actor who can author a test file — development/CI exposure only, no production reachability.","remediation":["npm update vitest to 4.1.11 and commit the lockfile","Enforce a minimum in package.json"],"status":"code-verified"},{"id":"V29","severity":"info","title":"Lockfile pins lodash@4.18.1 - a version never published upstream","component":"package-lock.json (node_modules/lodash)","summary":"lodash resolves to 4.18.1, which does not exist on the public registry (last real release is 4.17.21).","cvss":"N/A - integrity note","cwe":"CWE-1104","scope":"supply-chain","description":"The lockfile resolves lodash to 4.18.1 from registry.npmjs.org, but no lodash 4.18.1 has ever been published upstream. Every entry carries a valid integrity hash and matching range, so the consistent explanation is a mirrored or synthetic registry rather than a poisoned lockfile - flagged for the owner, not reported as tampering.","reproduce":["grep lodash-4 in package-lock.json -> lodash-4.18.1.tgz","Confirm npmjs.com lists 4.17.21 as latest 4.x"],"poc":"Lockfile references lodash-4.18.1.tgz; no such version exists on the public npm registry.","impact":"Supply-chain provenance ambiguity: builds pull a version that cannot be reproduced from the public registry.","remediation":["Confirm which registry generated the lockfile","Re-pin to a published version (4.17.21) and regenerate the lockfile against public npm"],"status":"code-verified"},{"id":"V30","severity":"medium","title":"4 of 5 rate-limiter constructions ignore the deployment-key-scoping contract","component":"server/_shared/rate-limit.ts:68/1093/1221 · api/_rate-limit.js:57 (vs api/_api-key-rate-limit.js:66-70)","summary":"Three Ratelimit constructions plus api/_rate-limit.js build unprefixed rl/rl:ep/rl:scope keys and never call getKeyPrefix(), so a preview deploy sharing one Upstash DB can exhaust or reset production's per-IP and per-principal limits.","cvss":"N/A — infra isolation / hardening","cwe":"CWE-770","scope":"infra","description":"The contract getKeyPrefix() (redis.ts:41-47, M-6 fix) returns preview:003csha8>: for non-production to avoid collisions when deployments share one Upstash instance. Measured: rate-limit.ts has three `new Ratelimit(` at :68 (prefix:'rl'), :1093 ('rl:ep'), :1221 ('rl:scope') and zero getKeyPrefix() call sites; api/_rate-limit.js:57 builds prefix:'rl'/`rl:${policy.scope}` with zero. The correct one proves the omission is a policy violation: api/_api-key-rate-limit.js:66-70 uses `${getKeyPrefix()}rl:apikey:min` and api/mcp/free-account-allowance.ts:46-51 warns an unprefixed key lets a preview deploy spend or reset a real user's production allowance. The rl:*:fw:* non-Lua fallback keys (:577,:1174,:1257) are unprefixed on both surfaces.","reproduce":["grep getKeyPrefix server/_shared/rate-limit.ts → 0; read the three prefix:'rl*' constructions","Read the correct sibling api/_api-key-rate-limit.js:66-70","Run a preview deploy against the same Upstash DB and drive traffic → it consumes production's rl:* budgets"],"poc":"Static: three limiter keys and api/_rate-limit.js are unprefixed; the one correct limiter proves the env-scoping contract exists and is violated here.","impact":"A single preview/test run can exhaust production's per-IP 600/min limit, the fail-closed per-endpoint budgets, and the user:/apikey-user: principal buckets for any real user on the same Upstash egress — degrading or denying production rate-limiting.","remediation":["Prefix every limiter key with getKeyPrefix() (mirror api/_api-key-rate-limit.js:66-70), including the fw fallback keys","Add a lint/test asserting no unprefixed 'rl' key is constructed"],"status":"code-verified"},{"id":"V31","severity":"medium","title":"Daily-quota INCR+EXPIRE never verifies the EXPIRE, leaving permanent keys","component":"server/_shared/direct-llm-quota.ts:152-189 · api/_api-key-rate-limit.js:153-172 (vs backtest-stock-quota.ts:117-131)","summary":"The pipeline result type has no per-command error field, so a failed EXPIRE after a successful INCR is never detected — leaving orphaned permanent quota keys; a truncated pipeline also consumes a unit via a no-op rollback.","cvss":"N/A — integrity / unbounded key growth","cwe":"CWE-772 (Missing Release of Resource)","scope":"infra","description":"direct-llm-quota.ts:152-189 validates only pipeResult[0]?.result; entry [1] (EXPIRE) is never inspected, and its result type Array003c{result?:unknown}> (:124) can't even represent a per-command error. Same at api/_api-key-rate-limit.js:153-172. The hardened sibling backtest-stock-quota.ts:117-131 checks `expireEntry?.error==null && (result===1||result==='1')` and retries the TTL while refunding the unproved claim, with a type {result?:unknown;error?:unknown} pinned by tests. Second hole: a truncated pipeline response (runRedisPipeline → []) yields 'redis-unavailable' AFTER the INCR executed, and the noop rollback leaves the unit consumed. Not a spend bypass (key name rotates by UTC date) — integrity + unbounded permanent-key growth.","reproduce":["Read direct-llm-quota.ts:152-189 (only INCR checked) vs backtest-stock-quota.ts:117-131 (checks EXPIRE + refund)","Simulate an EXPIRE failure after a successful INCR","Observe a permanent (no-TTL) quota key and, on a truncated pipeline, a consumed-but-unrefunded unit"],"poc":"Static: the EXPIRE result is neither typed nor inspected, so a newly-created key with a failed EXPIRE persists forever.","impact":"Failed EXPIREs leave orphaned zero-value quota keys that accumulate without bound in Redis, and a truncated pipeline burns a quota unit without a refund — data-integrity and unbounded-storage issues on the metering path.","remediation":["Adopt the backtest-stock-quota.ts pattern: type the result with error, verify the EXPIRE, retry the TTL, and refund on an unproved claim","Add a test pinning both the failed-EXPIRE and truncated-pipeline shapes"],"status":"code-verified"},{"id":"V32","severity":"low","title":"dispatchServerSubRequest 503s unconditionally in the Tauri sidecar","component":"server/_shared/redis.ts:705 · sub-request-admission.ts:33-36 · server-sub-request-dispatch.ts:57-63","summary":"runRedisPipeline returns [] unconditionally under LOCAL_API_MODE=tauri-sidecar, so admission is always null and every /api/batch/v1/execute sub-request is permanently refused with a mislabeled 503.","cvss":"N/A — desktop correctness","cwe":"CWE-670","scope":"api","description":"redis.ts:705 runRedisPipeline returns [] unconditionally when LOCAL_API_MODE==='tauri-sidecar'. sub-request-admission.ts:33-36 requires stored?.result==='OK' → always null. server-sub-request-dispatch.ts:57-63 converts that to {kind:'refused',status:503,body:{error:'Rate-limit service temporarily unavailable'}} — permanently, not only during an outage, and the message names the wrong subsystem. The same file family already special-cases this runtime three times (rate-limit.ts:1113-1142). No first-party client calls /api/batch/v1/execute (proto + generated stubs only), so the blast radius is third-party API consumers on a sidecar deployment.","reproduce":["Read redis.ts:705 (tauri-sidecar → []) and server-sub-request-dispatch.ts:57-63 (→ 503)","Call /api/batch/v1/execute on a sidecar deployment","Observe a permanent 503 'Rate-limit service temporarily unavailable'"],"poc":"Static: the sidecar always returns [] for the admission pipeline, so batch sub-requests are always refused with a mislabeled 503.","impact":"Third-party API consumers on a Tauri-sidecar deployment cannot use the batch endpoint at all (permanent 503 with a misleading message) — a desktop correctness gap.","remediation":["Special-case tauri-sidecar in the admission path (as rate-limit.ts:1113-1142 does) or fix the message","Add a test asserting batch works on a sidecar deployment"],"status":"code-verified"},{"id":"V33","severity":"high","title":"runSeed's preservation path puts a 600s TTL on a key deliberately declared persistent","component":"scripts/_seed-utils.mjs:2571 · :1340 · scripts/seed-forecast-resolutions.mjs:2240-2258","summary":"On any graceful-failure path runSeed applies EXPIRE 600 to the forecast resolutions ledger — a key intentionally written with no TTL — so a permanent working ledger is deleted 10 minutes later.","cvss":"N/A — data loss / integrity","cwe":"CWE-672 (Operation on a Resource after Expiration/Release)","scope":"storage","description":"scripts/_seed-utils.mjs:2571 sets `defaultPreservationTtl = ttlSeconds || 600`, applied to defaultPreservationKeys (canonicalKey, seed-meta, extraKeys, preserveKeys), and :1340 builds `EXPIRE k ttlSeconds` for each. The one caller that omits ttlSeconds on purpose is seed-forecast-resolutions.mjs:2240-2258, which runs `runSeed('forecast','resolutions', RESOLUTIONS_KEY, …, { /* Persistent working ledger: no ttlSeconds by design (#5007 R11) */ })`, so atomicPublish writes forecast:resolutions:v1 with no EX. On EVERY graceful-failure path (fetch failure, SIGTERM-during-fetch, contract RETRY, validation skip) the preservation call emits `EXPIRE forecast:resolutions:v1 600`, converting a permanent ledger into a key Redis deletes in 10 minutes. The documented override preserveKeyTtls (:2451,:2536-2562) that would prevent this is not used by this caller. The other 161 runSeed callers all pass ttlSeconds; this is a live daily Railway cron and the data is unrecoverable (buildLedgerForRun ingests from forecast:predictions:history:v1 and RESOLUTIONS_KEY itself).","reproduce":["Read scripts/_seed-utils.mjs:2571 (ttlSeconds||600) and :1340 (EXPIRE k ttlSeconds)","Read seed-forecast-resolutions.mjs:2240-2258 — runSeed called with no ttlSeconds by design","Trigger any graceful-failure path in the resolutions seeder","Observe EXPIRE forecast:resolutions:v1 600 issued against the persistent ledger"],"poc":"Static: the preservation default (600s) is applied to a key the caller deliberately created without a TTL; 10 minutes later Redis deletes the permanent ledger.","impact":"The forecast-resolutions working ledger (source-of-truth for forecast scoring) is silently destroyed 10 minutes after any transient seeder failure, on a daily production cron. The data cannot be reconstructed from upstream, so forecast scorecards degrade with no error surfaced.","remediation":["In the preservation path, do not apply a default TTL to keys the caller declared persistent — honor an explicit 'no TTL' via preserveKeyTtls or a sentinel","Have seed-forecast-resolutions pass preserveKeyTtls marking RESOLUTIONS_KEY as no-expire","Add a test asserting a graceful failure never issues EXPIRE against a persistent-declared key"],"status":"code-verified"},{"id":"V34","severity":"high","title":"notification-relay upstashRest has no fetch timeout on the only poll loop","component":"scripts/notification-relay.cjs:81-92 (vs :94-100)","summary":"The Redis REST helper that drives the single-threaded notification poll loop calls fetch() with no AbortSignal, so one stalled connection hangs delivery indefinitely while Railway still reports the process healthy.","cvss":"N/A — availability (silent notification outage)","cwe":"CWE-400 (Uncontrolled Resource Consumption)","scope":"infra","description":"scripts/notification-relay.cjs:81-92 (upstashRest) calls fetch(...) with NO signal, while the immediately following helper upstashDedupSetNx (:94-100) DOES pass signal:AbortSignal.timeout(10000) — this one is the outlier among 10 AbortSignal.timeout uses in the file. Node's global fetch/undici has no default request timeout, so a connection that is accepted but never answered leaves the await pending forever. upstashRest is awaited directly by the single-threaded `while(true)` poll loop via popNextEvent() (:1755) → subscribe() (:1781), which has no watchdog. isUserPro and checkDedup also route through it, so the hang can stall mid-delivery. A second timeout-less writer is shadowLogScore (:1444). The byte-identical helper in the sibling cron seed-digest-notifications.mjs:360 carries the signal.","reproduce":["Read notification-relay.cjs:81-92 (no signal) vs :94-100 (signal present)","Trace popNextEvent (:1755) → subscribe (:1781) → the while(true) loop awaiting upstashRest","Simulate an accepted-but-unanswered Upstash connection → the await never resolves, no watchdog fires"],"poc":"Static: upstashRest omits AbortSignal.timeout while every sibling Redis call in the file includes it; the poll loop has no independent watchdog.","impact":"A single stalled Upstash connection halts all notification delivery indefinitely — wm:events:queue accumulates with no delivery and no error log — while Railway health still reports the process alive, so no restart/SIGTERM occurs until a manual deploy. A complete, silent notifications outage.","remediation":["Add signal:AbortSignal.timeout(10000) to upstashRest (and shadowLogScore), matching upstashDedupSetNx and the digest-notifications sibling","Add a poll-loop eady mapped)","Add a test asserting a publish-phase throw yields a non-zero exit / non-OK bundle summary"],"status":"code-verified"},{"id":"V36","severity":"medium","title":"Sanctions entity lookup: an empty normalize() needle matches the entire index","component":"server/worldmonitor/sanctions/v1/lookup-entity.ts:50-52/131-138","summary":"normalize() maps every non-[a-z0-9] char to space and trims, so a Cyrillic/CJK or punctuation query becomes '' and matches every entity at score 100/80 — and diacritics are split, not folded, so accented names never match.","cvss":"N/A — correctness / matching integrity","cwe":"CWE-20 (Improper Input Validation)","scope":"input","description":"lookup-entity.ts:50-52 normalize() maps every non-[a-z0-9] char to a space then trims; :131-138 scores haystack===needle → 100 and haystack.startsWith(needle) → 80. Reproduced at runtime: '..' → '', '李王' → '', normalize('газпром')===''  → true. So a Cyrillic entity is returned as an exact match (score 100), and every Latin entity hits startsWith('') at score 80 for a 2-char query. Secondary: replacing a diacritic with a space rather than folding means 'Müller' → 'm ller' ≠ 'muller' (verified false), so accented names never match their transliteration. The route /api/sanctions/v1/lookup-sanction-entity is public, no-store, 30/min/IP, length gate 2-200, so '..' and '李王' both pass.","reproduce":["Read lookup-entity.ts:50-52 (normalize) and :131-138 (scoring)","Query the public lookup with '..' or a CJK/Cyrillic-only string (passes the 2-200 length gate)","Observe the entire index returned (score 100 for a same-normalizing entity, 80 for all Latin entities)"],"poc":"Runtime: normalize('..')='' , normalize('李王')='' , normalize('газпром')='' → empty needle matches everything; 'Müller'→'m ller' never matches 'muller'.","impact":"The public sanctions entity-lookup returns the entire (or arbitrary) index for punctuation/non-Latin queries and silently fails to match accented names to their transliterations — corrupting a sanctions-screening result that users may rely on.","remediation":["Return {results:[],total:0} for an empty needle before the scan","Normalize with NFKD + diacritic strip: s.normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()","Add tests for empty-needle and accented-name cases"],"status":"code-verified"},{"id":"V37","severity":"medium","title":"5 of 5 readers of CHOKEPOINT_STATUS_KEY fail open to a fabricated 'calm'","component":"server/worldmonitor/supply-chain/v1/get-bypass-options.ts:50/90 · get-multi-sector-cost-shock.ts:96/102-103 · get-country-cost-shock.ts:49/68-84 · get-route-explorer-lane.ts:242 · shipping/v2/route-intelligence.ts:68","summary":"All five readers swallow the chokepoint-status key with .catch(()=>null) and default scores to 0 / war-risk to NORMAL with no availability marker, understating war-risk insurance by 20-60× — while 13 siblings carry the signal.","cvss":"N/A — correctness / false all-clear","cwe":"CWE-703","scope":"api","description":"Measured cluster (not a sample): all five swallow the same key with .catch(()=>null) and none sets an availability marker. get-bypass-options.ts:50 → every waypoint score ?? 0, then :90 re-ranks by freight cost alone as the live ranking. get-multi-sector-cost-shock.ts:96,102-103 → warRiskTier ?? 'NORMAL'; _insurance-tier.ts:28-35 prices NORMAL at 5 bps vs WAR_ZONE 300 / CRITICAL 100 — a 20-60× understatement flowing into annualImpactRate. get-country-cost-shock.ts:49,68-84 → coverageDays:0, supplyDeficitPct:0, unavailableReason:'' WITH hasEnergyModel:true (a wrong number published as measurement). get-route-explorer-lane.ts:242 → disruptionScore:0, NORMAL. route-intelligence.ts:68 → same (V13). The correct pattern is used 13× in the same directory (get-chokepoint-status.ts:609, get-shipping-stress.ts:17, …).","reproduce":["Read the five readers' .catch(()=>null) + ?? defaults","Read _insurance-tier.ts:28-35 (NORMAL 5 bps vs WAR_ZONE 300)","Induce a m is the hole. Sole consumer get-risk-scores.ts computes a risk score over an empty unrest baseline, indistinguishable from a quiet 30-day window.","reproduce":["Read acled.ts:86-91 (early return [] before cache) and acled-auth.ts:211-217 (returns null on cold isolate)","Force a token-exchange failure (bad password / ACLED outage / cold isolate)","Observe [] returned, cached-good discarded, get-risk-scores computes over an empty unrest baseline"],"poc":"Static: the token-miss arm returns [] before consulting the cache and sets no availability/negative marker, so an auth blip reads as 'zero conflicts'.","impact":"An ACLED credential/outage blip makes conflict data read as zero events, discarding good cached data, so risk scores drop to a false 'quiet' for a security-relevant unrest dataset with no signal to operators or consumers.","remediation":["On a token miss, serve stale cached data if present and mark upstreamUnavailable / negative-cache; do not return [] before the cache","Align the token-miss arm with the resp.ok throw path (acled.ts:111)","Add a test asserting a token failure does not yield an empty-but-fresh risk baseline"],"status":"code-verified"},{"id":"V39","severity":"low","title":"Seeder and handler implement the same chokepoint-exposure policy with different boundary conditions","component":"scripts/seed-hs2-chokepoint-exposure.mjs:326 · get-country-chokepoint-index.ts:90","summary":"The seeder accepts the flow-weighted result only when some exposureScore>0 while the handler falls back only when exposures.length===0, so all-zero scores publish different vulnerabilityIndex; a raw/prefixed key mismatch compounds it in preview.","cvss":"N/A — correctness / divergence","cwe":"CWE-697","scope":"api","description":"seed-hs2-chokepoint-exposure.mjs:326 accepts the flow-weighted result only when exposures.some(e=>e.exposureScore>0), else publishes the country-route fallback. get-country-chokepoint-index.ts:90 falls back only when exposures.length===0. All-ze he entire /pro param namespace, so DebugBear loads with those values live","component":"shared/sensitive-url-params.ts:14 · pro-test/src/services/checkout-intent-url.ts:25-28 · pro-test/src/main.tsx:23","summary":"The 'never send to telemetry' param regex enumerates the dashboard spellings but not the wm_checkout_* /pro spellings, and DebugBear RUM initializes at module scope before the params are stripped, so those values reach the telemetry vendor.","cvss":"N/A — privacy / data leakage to vendor","cwe":"CWE-201 (Insertion of Sensitive Information Into Sent Data)","scope":"client","description":"sensitive-url-params.ts:14 is documented as 'The one list of URL params that must never reach a telemetry vendor' and enumerates dashboard spellings (checkoutProduct|checkoutReferral|checkoutDiscount|checkout_product|…, ref, wm_referral). The /pro spellings are constants at checkout-intent-url.ts:25-28 — wm_checkout_product, wm_checkout_ref, wm_checkout_discount, wm_checkout_attribution — plus wm_checkout_mission/_panel/_handoff; NONE appear in the regex (verified: wm_checkout_* not matched; checkoutProduct/ref matched). initDebugBearRum() runs at module scope (main.tsx:23), i.e. BEFORE App's useEffect strips the params, and DebugBear has no redaction hook, so this hold-gate is the only control.","reproduce":["Read sensitive-url-params.ts:14 (dashboard spellings only) and checkout-intent-url.ts:25-28 (/pro spellings)","Run the regex against wm_checkout_product / wm_checkout_ref → not matched","Load /pro?wm_checkout_ref=… with DebugBear enabled; the RUM collector reads location before the strip"],"poc":"Runtime: the sensitive-param regex does not match wm_checkout_product/_ref/_discount/_mission, so DebugBear RUM (module-scope init) sends them.","impact":"Checkout referral/discount/attribution values from the /pro flow are transmitted to the DebugBear telemetry vendor, leaking commercially and privacy-sensitive URL parameters the repo explicitly intends to keep from telemetry.","remediation":["Add the wm_checkout_* /pro param names to SENSITIVE_URL_PARAM_RE (derive both lists from one source)","Strip sensitive params before any telemetry init, or configure a DebugBear redaction hook","Add a test asserting every /pro checkout param is matched by the regex"],"status":"code-verified"},{"id":"V43","severity":"low","title":"pro-test openBillingPortal navigates to an unvalidated portal_url while its sibling checkout_url is allowlisted","component":"pro-test/src/services/checkout.ts:843-851 (vs :622-637)","summary":"openBillingPortal navigates to result.portal_url with no scheme/host check (even when !resp.ok), while the sibling checkout field is validated against a Dodo host allowlist 200 lines earlier.","cvss":"N/A — client redirect (needs compromised first-party response)","cwe":"CWE-601","scope":"client","description":"checkout.ts:843-851 `typeof result?.portal_url==='string' ? … : FALLBACK`, then navigate(url) into window.location.assign / window.open / location.href, with no scheme or host check — and it navigates even when !resp.ok. The sibling field, same file, 200 lines earlier (:622-637), safeHostedCheckoutUrl enforces https + a Dodo host allowlist (HOSTED_CHECKOUT_HOSTS.has(url.hostname)). The dashboard's copy routes the identical field through openExternalUrl → isOpenableExternalUrl. Not independently exploitable — requires a compromised/misconfigured first-party response.","reproduce":["Read checkout.ts:843-851 (no validation) vs :622-637 (allowlisted)","Return a portal_url with an unexpected scheme/host from the first-party endpoint","Observe navigation to it without validation"],"poc":"Static: portal_url is navigated to unvalidated (even on !resp.ok), unlike the allowlisted checkout_url sibling.","impact":"If the first-party billing-portal response is compromised or misconfigured, the client navigates to an attacker-chosen URL — a redirect risk gated on a compromised first-party response.","remediation":["Validate portal_url against the Dodo host allowlist (mirror safeHostedCheckoutUrl at :622-637) and only navigate on resp.ok","Add a test asserting an off-allowlist portal_url is refused"],"status":"code-verified"},{"id":"V44","severity":"low","title":"CLI --api_key silently downgrades the credential from a header into a URL query string","component":"cli/src/core.mjs (VALUE_FLAGS, :167-169, :238)","summary":"VALUE_FLAGS maps api-key/apikey/key but not api_key, so --api_key falls to the unknown-flag branch that turns it into a request param written into url.searchParams — putting the key in logs and Referer.","cvss":"N/A — credential hygiene (CLI)","cwe":"CWE-598","scope":"comms","description":"cli/src/core.mjs VALUE_FLAGS maps api-key|apikey|key but NOT api_key; the unknown-flag branch (:167-169) deliberately turns an unrecognised --flag value into a request param, and restPlan (:238) writes every such param into url.searchParams. Executed: `get /api/x --api_key wm_…` → https://api.worldmonitor.app/api/x?api_key=wm_… (no header); `--api-key wm_…` → header set. --api_key is the natural guess given the documented WORLDMONITOR_API_KEY env var and the product's own api_key form field (api/oauth/authorize.js:201).","reproduce":["Read cli/src/core.mjs VALUE_FLAGS (no api_key), :167-169 (unknown → param), :238 (param → searchParams)","Run `get /api/x --api_key wm_…`","Observe the key in the request URL (?api_key=…), not a header"],"poc":"Executed: --api_key places the key in the query string; --api-key sets the header.","impact":"A user typing the natural --api_key form leaks their API key into CDN/proxy access logs and any Referer, rather than sending it as a header — a credential-hygiene footgun.","remediation":["Map api_key (and reject unknown --flags that look like credentials as params)","Add a test asserting --api_key sets a header, never a query param"],"status":"code-verified"},{"id":"V45","severity":"high","title":"get-regional-snapshot collapses 'Redis is down' into {} and the CDN pin ce even after Redis recovers.","remediation":["Adopt the get-regional-brief.ts pattern: use getRawJson (throws), catch → return {upstreamUnavailable:true}, and return {} only for a genuinely missing key","Ensure getRpcNoStoreReasonFromJson recognizes the marker so the gateway sets no-store on the failure","Add a test asserting a Redis error yields a no-store response, not a slow-tier-cached {}"],"status":"code-verified"},{"id":"V46","severity":"high","title":"GDELT free-text search bypasses the operator URL-revocation set the country path enforces","component":"server/worldmonitor/intelligence/v1/search-gdelt-documents.ts:126-152 (country, fail-closed) vs :170-197 (free-text, no revocation)","summary":"The country branch fails closed on an unreadable suppression set and filters revoked URLs; the free-text branch never calls readRevokedUrlSet(), so retracted/takedown/phishing URLs still surface in keyword search with error:''.","cvss":"N/A — content-governance / access-control","cwe":"CWE-284 (Improper Access Control)","scope":"access-control","description":"The revoking branch (:126-152) does `Promise.all([readCountryIndex(), readRevokedUrlSet()])`, returns {articles:[],error:'revocations-unavailable'} when !revoked.readable (fail-closed, comment: 'rows served here reach prerendered pages'), and passes revokedUrls into selectCountryArticles. The free-text branch (:170-197) reads only the seeded topic snapshot and returns `{articles:match.articles.slice(0,maxRecords),query:req.query,error:''}` — readRevokedUrlSet() is NEVER called on this path, and the returned GdeltArticle shape is identical. So `SADD news:digest:revoked-urls:v1 003curl>` (a retracted story, legal takedown, phishing URL) still reaches every keyword search, and because error is '' nothing signals the suppression was skipped. The repo runbook (_lastgood.ts:80-88) states the suppression set is a property of digest CONTENT and every reader must go through the helper.","reproduce":["Read search-gdelt-documents.ts:126-152 (country path calls readRevokedUrlSet, fails closed) vs :170-197 (free-text path omits it)","SADD a URL into news:digest:revoked-urls:v1","Query the GDELT free-text/keyword search that would surface it → still returned, error:''"],"poc":"Static: readRevokedUrlSet() appears only in the country branch; the free-text branch slices seeded articles and returns them unfiltered.","impact":"Operator revocations — retracted stories, legal takedowns, flagged phishing URLs — are silently defeated for keyword search, and the suppressed content reaches prerendered/public pages with no signal that the control was bypassed. Governance and potential legal-compliance failure.","remediation":["Hoist readRevokedUrlSet() above the branch, fail closed on !revoked.readable, and filter the free-text results before slice()","Route every article-returning path through the shared suppression helper (per the _lastgood runbook)","Add a test asserting a revoked URL never appears in free-text results and that an unreadable set yields a closed error"],"status":"code-verified"},{"id":"V47","severity":"medium","title":"ListCountryHeadlines lets one anonymous request rescan the pool 250x, rebuilding RegExps per comparison","component":"server/worldmonitor/news/v1/list-country-headlines.ts:43/76 · shared/country-mention.js:210/214/234","summary":"250 country codes × a large pooled headline set, with mentionsCountry constructing fresh RegExps per name/demonym on every call, yields ~2s of edge CPU from a single unauthenticated GET, and permuting codes defeats the cache.","cvss":"N/A — algorithmic-complexity DoS-shape","cwe":"CWE-1333 / CWE-407","scope":"dos","description":"list-country-headlines.ts:43 caps countryCodes at 250 (proto repeated.max_items=250), and :76 runs items.filter(item=>mentionsCountry(item.title,terms)) per code over headlines pooled from ~168 English-reachable feeds. country-mention.js:210,214,234 mentionsCountry constructs a fresh new RegExp for every name, demonym and exclusion phrase on every call; no memoization. Measured against the repo's module: 250 synthetic codes × 4200 pooled 95-char headlines = 2047ms (3459ms at 150-char titles) of edge CPU from one unauthenticated GET. Route is unauthenticated on the fast tier (gateway.ts:408); permuting the code order yields a fresh CDN cache key so the shared cache does not absorb repeats. Precedent for the fix exists: shared/country-headline-match.ts:53 otherCountryTermsCache.","reproduce":["Read list-country-headlines.ts:43/76 and country-mention.js:210/214/234 (fresh RegExp per call)","GET the route with 250 country codes","Measure ~2s edge CPU; permute the code order per request to defeat the CDN cache"],"poc":"Measured: 250 codes × 4200 headlines = ~2047ms edge CPU per unauthenticated request; RegExps rebuilt per comparison.","impact":"An unauthenticated caller imposes ~2s of edge CPU per request and can bypass caching by permuting codes, enabling low-effort CPU-amplification against the news surface.","remediation":["Memoize the compiled RegExps (mirror otherCountryTermsCache in shared/country-headline-match.ts:53)","Precompute or cap the per-code work; consider a lower code cap or canonicalized cache key","Add a performance test bounding CPU for 250 codes"],"status":"code-verified"},{"id":"V48","severity":"medium","title":"parseRssXml's digest branch has no title-length cap; the country-pool branch caps at 1000","component":"server/worldmonitor/news/v1/list-feed-digest.ts:1086-1087 (vs :1163)","summary":"On the digest path the only title bound is 'exists', while the sibling branch caps title≤1000/link≤2048; publisher-controlled titles flow verbatim into a 7-day story HSET and the response, with matchAll materializing every item first.","cvss":"N/A — resource / storage hygiene","cwe":"CWE-400","scope":"input","description":"list-feed-digest.ts:1086-1087 `const title=extractTag(block,'title'); if(!title) continue;` is the only bound on the digest path, vs :1163 on the !forDigest branch `if(title.length003c=1000 && link.length003c=2048 && originPublisher.length003c=200)`. NewsItem.title carries only min_len 1 (no max_len); CategoryBucket.items has no max_items. The title flows verbatim into the story:track:v1 HSET (:2489) and the response (:1967), retained for the 7-day STORY_TTL. Amplifiers: [...xml.matchAll(itemRegex)] (:1072) materialises every 003citem> before .slice(0,parseLimit), and await resp.text() (:815) has no byte cap. 154 of the 309 feed URLs in _feeds.ts are Google News queries, where the title is publisher-controlled.","reproduce":["Read list-feed-digest.ts:1086-1087 (no cap) vs :1163 (capped)","Publish a feed item (e.g. via a Google News query feed) with a very long 003ctitle>","Observe it stored verbatim in story:track:v1 (7-day TTL) and returned uncapped"],"poc":"Static: the digest branch lacks the title.length003c=1000 cap present 77 lines later on the sibling branch; matchAll materializes all items before slicing.","impact":"Unbounded publisher-controlled title strings inflate Redis storage (7-day retention) and response size, and the full-item materialization adds memory pressure — a resource/storage-hygiene risk on a high-volume feed path.","remediation":["Clamp title to ~1000 chars before items.push and the slice (mirror :1163)","Add a byte cap on resp.text() and slice before materializing all items","Add a test asserting an oversized title is truncated on the digest path"],"status":"code-verified"},{"id":"V49","severity":"low","title":"normalizeLocation's fuzzy fallback maps any empty result onto the first city in the table","component":"server/worldmonitor/research/v1/list-tech-events.ts:108-112/131-135 · server/_shared/city-coords.ts:15","summary":"Stripping 'hybrid:' and a trailing country can leave normalized==='' , and key.includes('') is always true, so the loop returns the first city (San Francisco) — plotting a venue-less virtual event at a real location.","cvss":"N/A — correctness (geo)","cwe":"CWE-20","scope":"input","description":"list-tech-events.ts:108-112 strips hybrid: and a trailing country, which can leave normalized===''; :131-135 then evaluates key.includes(normalized) — and 'anything'.includes('')===true — so the loop returns on its first entry. First key in city-coords.ts:15 is 'san francisco'. Verified in node: LOCATION:'Hybrid:' → San Francisco (37.7749,-122.4194) with virtual:false.","reproduce":["Read list-tech-events.ts:108-112/131-135 and city-coords.ts:15","Provide a location like 'Hybrid:' that normalizes to ''","Observe it plotted at San Francisco with virtual:false"],"poc":"Runtime: 'Hybrid:' → '' → key.includes('') true → returns the first city (San Francisco).","impact":"A virtual/venue-less tech event is plotted as a real in-person San Francisco conference, a geospatial correctness defect on the research map.","remediation":["Return no coordinate (virtual:true) when normalized is empty, before the includes loop","Add a test for a venue-less/virtual location"],"status":"code-verified"},{"id":"V50","severity":"medium","title":"validateUrl validates the resolved URL then returns the unresolved string","component":"src/utils/sanitize.ts:93-102","summary":"The relative branch resolves the URL, checks the resolved protocol, then returns the raw `trimmed` string — so control characters (tab/LF/CR/backslash) that resolve to https://evil.com/ pass validation and the raw string is re-parsed by the sink.","cvss":"N/A — client-side open-redirect / link injection","cwe":"CWE-601 (URL Redirection to Untrusted Site)","scope":"client","description":"sanitize.ts:93-102: the relative branch computes `const resolved = new URL(trimmed, base)`, checks resolved.protocol against the allowlist, then returns `trimmed` — discarding the resolution. The absolute branch correctly returns parsed.toString(); the two branches disagree. Ran it: '/\\t/evil.com', '/\\n/evil.com' and '/\\\\evil.com' all pass the ^(/|…) prefix test (first char is /), resolve to https://evil.com/ under WHATWG rules (tab/LF/CR stripped, backslash folds to / for special schemes), pass the https: check, and the function hands the raw string back. The caller then re-parses it: new URL('/\\t/evil.com', document.baseURI) → https://evil.com/. Distinct from CR-8/F8 (literal //host): this is a check present but running against a different value than the one consumed. Sinks include MonitorPanel.ts:149 href and TelegramIntelPanel.ts:536/544/549/557 (el.href / window.open).","reproduce":["Read sanitize.ts:93-102 — relative branch validates `resolved` but returns `trimmed`","Pass '/\\t/evil.com' (or '/\\\\evil.com') to validateUrl → passes","Observe the sink re-parses the raw string to https://evil.com/"],"poc":"Runtime: validateUrl('/\\t/evil.com') returns the raw string; new URL(that, base) → https://evil.com/ — validated value ≠ used value.","impact":"A crafted control-character relative URL passes the sanitizer and redirects a user off-site from href/window.open sinks (MonitorPanel, TelegramIntelPanel) — client-side open redirect / phishing.","remediation":["Return resolved.toString() (not trimmed) in the relative branch so the validated value is the used value","Add tests for tab/LF/CR/backslash relative inputs"],"status":"code-verified"},{"id":"V51","severity":"medium","title":"toIso2() returns Object.prototype members from a function typed string | null","component":"src/utils/country-codes.ts:133","summary":"An unvalidated bracket lookup on a plain object with ?? null returns inherited prototype members (constructor, toString, __proto__), so addCountry accepts a non-country and returns {ok:true}, and re-entrant callers throw inside a render filter.","cvss":"N/A — correctness / prototype exposure","cwe":"CWE-1321 (Prototype Pollution-adjacent) / CWE-471","scope":"client","description":"country-codes.ts:133 `return NAME_ALIASES_TO_ISO2[trimmed.toLowerCase()] ?? null;` — an unvalidated bracket lookup on a plain object literal. ?? fires only on null/undefined, and inherited prototype members are neither. Ran it: toIso2('CONSTRUCTOR') → function Object(){…}; toIso2('toString') → an object; toIso2('__proto__') → [object Object]. The sibling lookups at :69/:72 are safe only by accident (.toUpperCase() turns 'constructor' into 'CONSTRUCTOR'); toIso2 reaches a lowercased table, the only vulnerable shape. Consequence: addCountry's `if(!code) return {ok:false}` never fires; on the anonymous path JSON.stringify serializes the function to null, nothing persists, and {ok:true} is returned — App.ts:2291 reports 'Country CONSTRUCTOR followed'. Re-entrant use (DisplacementPanel.ts:141-143, DiseaseOutbreaksPanel.ts:167-170 do toIso2(x) then isFollowed(code)) throws TypeError: input.trim is not a function inside a render filter.","reproduce":["Read country-codes.ts:133 (bracket lookup ?? null)","Call toIso2('constructor') / toIso2('toString') → returns a prototype member, not null","Follow a country named 'constructor' → addCountry returns {ok:true} though nothing persists; or trigger a re-entrant panel filter → TypeError"],"poc":"Runtime: toIso2('CONSTRUCTOR') → native Object function; toIso2('toString') → object; the !code guard never fires.","impact":"A non-country input yields a success-shaped result (misleading state) or throws a TypeError inside a render filter (panel crash), and prototype members leak into a value typed string|null — a correctness and robustness defect.","remediation":["Use Object.hasOwn(NAME_ALIASES_TO_ISO2, key) ? … : null and add a typeof-string guard on the result","Add tests for 'constructor'/'toString'/'__proto__' inputs"],"status":"code-verified"},{"id":"V52","severity":"medium","title":"makeVectorId uses the 52-bit FNV hash as an IndexedDB primary key","component":"src/utils/hash.ts:4-13 · src/workers/vector-db.ts:81/71/107","summary":"The vector store keys records by a 52-bit invertible FNV hash of attacker-influenced RSS fields, and store.put overwrites on collision, so a cheap second-preimage silently replaces a real article's local vector.","cvss":"N/A — client-side integrity","cwe":"CWE-328 (Use of Weak Hash)","scope":"client","description":"hash.ts:4-13 warns 'Do NOT use for cache keys derived from attacker-controlled input … a meet-in-the-middle second-preimage search costs seconds of CPU rather than the 2^52 a digest of this width suggests.' The sibling cache-key builder already migrated to sha256Hex for exactly this (GHSA-9gp4, summary-cache-key.ts). vector-db.ts:81 was not migrated: makeVectorId = hashString(JSON.stringify([source,url,pubDate,text])). The store is created with keyPath:'id' (:71) and written with store.put (:107), so a collision is an unconditional overwrite, not add-then-dedupe. Input is third-party RSS source/url/pubDate/text. A second preimage on one article's tuple silently replaces a real article in the user's local store, and searchVectors (:153-199) then returns the attacker's text.","reproduce":["Read hash.ts:4-13 (warning) and vector-db.ts:81 (uses hashString as the id) + :71/:107 (keyPath:'id' + put)","Construct two RSS tuples colliding under the 52-bit FNV hash","Observe the second put overwrites the first record in IndexedDB"],"poc":"Static: 52-bit invertible hash as an IndexedDB primary key + store.put = overwrite-on-collision, against attacker-influenced feed fields.","impact":"An attacker who influences a feed can compute a colliding vector id and silently replace a real article's local vector, so the user's headline-memory recall returns attacker text with no error — client-side integrity corruption of the local knowledge store.","remediation":["Migrate makeVectorId to sha256Hex (mirror summary-cache-key.ts)","Or add-then-dedupe instead of overwrite; validate the stored record matches the source before serving","Add a test asserting distinct articles never share a vector id"],"status":"code-verified"},{"id":"V53","severity":"medium","title":"SignalModal.formatTime has no age tier: a 4-day-old signal renders as a bare clock time","component":"src/components/SignalModal.ts:514-516","summary":"formatTime returns only toLocaleTimeString with no date branch, so 2026-09-25 14:32 and 2026-09-29 14:32 both render as '14:32' in a product whose premise is event recency.","cvss":"N/A — correctness / UX (recency)","cwe":"CWE-684 (Incorrect Provision of Specified Functionality)","scope":"client","description":"SignalModal.ts:514-516 returns date.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) with no date branch, and the rendered row (:318,:382) carries no other date field — so 2026-09-25T14:32 and 2026-09-29T14:32 both render '14:32'. The repo has five 'time ago' implementations; src/utils/index.ts:1-22 is the day-tiered Intl.RelativeTimeFormat one used by NewsPanel/MonitorPanel/PositiveNewsFeedPanel, and SecurityAdvisoriesPanel.ts:98-107 / StrategicRiskPanel.ts:467-476 correctly fall through to toLocaleDateString(). In scope by design: the correlation engine windows are 24-96h (disaster 96h, escalation 48h, military 24h).","reproduce":["Read SignalModal.ts:514-516 (no date tier) and the row render at :318/:382 (no date field)","Open a signal 3-4 days old and one 3 minutes old","Observe both show only a clock time, indistinguishable"],"poc":"Static: formatTime has no date branch; a multi-day-old signal is shown as a bare HH:MM.","impact":"In a product whose value is judging how current an event is, a three-day-old conflict/disaster signal is presented indistinguishably from a three-minute-old one, misleading the operator about recency.","remediation":["Add a day-tier: fall through to toLocaleDateString() (or the shared time-ago util in src/utils/index.ts) when the signal isn't from today","Add a test asserting a multi-day-old signal renders a date"],"status":"code-verified"},{"id":"V54","severity":"high","title":"Daily Market Brief persistent cache is not account-scoped — cross-account watchlist leak","component":"src/services/daily-market-brief.ts:204-206 · :139 · :250 · :468-475","summary":"getCacheKey varies only by timezone, but the brief is built from the signed-in user's watchlist and persisted to IndexedDB/localStorage before any auth check — so on a shared browser, user A's holdings render to a different Pro account for up to 24h.","cvss":"N/A — cross-tenant information disclosure (shared-device)","cwe":"CWE-524 (Use of Cache Containing Sensitive Information)","scope":"storage","description":"getCacheKey() returns `${CACHE_PREFIX}:${sanitizeCacheKeyPart(resolveTimeZone(timezone))}` (:204-206) with CACHE_PREFIX='premium:daily-market-brief:v1' (:139) — the ONLY varying component is the timezone. But the brief content is built from the signed-in user's watchlist: getMarketWatchlistEntries() inside resolveTargets (:250), and the resulting items carry symbol/name/display. It is written to IndexedDB/localStorage (:472-475) and read back (:468) BEFORE any entitlement check and before any network call, so it renders on first paint. No purge exists (every deletePersistentCache call site is in circuit-breaker.ts for breaker keys; sign-out touches only cloud-sync version, last-sync, entitlement). The sibling src/services/referral.ts:26-42 proves this is an omission — it partitions by userId and subscribes to auth-state changes to invalidate. The primitive already exists: deriveActivationAccountKey(userId) (pro-activation-state.ts:75).","reproduce":["Read daily-market-brief.ts:204-206 (key = prefix + timezone only) and :250 (content from the user's watchlist)","On one browser, sign in as Pro user A (same timezone), open the Daily Market Brief so it persists","Sign out; sign in as Pro user B (same timezone); open the brief","Observe user A's cached watchlist-derived brief render to user B on first paint (within 24h)"],"poc":"Static: cache key omits any user/account component while the payload is user-watchlist-specific and persisted before the entitlement check.","impact":"On a shared or family device, one Pro user's private watchlist holdings (symbols/names) are rendered to a different Pro account for up to 24 hours, on first paint before any auth gate — a cross-tenant confidentiality breach of the paid product's personalized data.","remediation":["Include an opaque per-account component in the key: getCacheKey(timezone, deriveActivationAccountKey(userId))","Purge the persistent brief cache on sign-out and on auth-state change (mirror referral.ts)","Add a test asserting two accounts on the same browser/timezone never share a cached brief"],"status":"code-verified"},{"id":"V109","severity":"medium","title":"Sustained-burst detection inspects 5 arbitrary minutes, not the 5 most recent","component":"convex/apiPlanLimitNotices.ts:111-115 · apiPlanLimitUsage.ts:369-373/194-221/378-383","summary":"slice(-5) assumes the minute buckets are chronological, but the Axiom summarize query has no order and normalizeAxiomRows drops row.minute, so the window is 5 of up to 10 buckets at random — producing missed warnings and false sustained-burst emails.","cvss":"N/A — business-logic correctness","cwe":"CWE-682","scope":"api","description":"apiPlanLimitNotices.ts:111-115 `const buckets = (input.minuteBuckets ?? []).slice(-5)` — only correct if the array is chronological, and nothing establishes that. apiPlanLimitUsage.ts:369-373 the Axiom query is `| summarize usage=count() by customer_id, minute=bin(_time,1m)` with NO order/sort — Axiom's summarize returns one row per group with no defined ordering. normalizeAxiomRows (:194-221) DROPS row.minute entirely, and :378-383 pushes row.usage in result order — so no sort is even possible at that point. The window is ago(10m), so slice(-5) inspects 5 of up to 10 buckets at random. The intended contract is visible in the test fixtures, which all pass ascending arrays. Feeds getEnforcementReadiness (:500-556).","reproduce":["Read apiPlanLimitNotices.ts:111-115 (slice(-5), assumes chronological) and apiPlanLimitUsage.ts:369-373 (no order), :194-221 (drops minute)","Provide out-of-order
