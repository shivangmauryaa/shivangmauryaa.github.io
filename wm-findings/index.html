<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Monitor — Security Findings</title>
<meta name="description" content="Authorized security assessment of the World Monitor application (NTRO · SIH PS 26163) — 152 findings with CVSS, PoC and remediation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#f8fafc; --elevated:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --muted:#54606e; --faint:#8a95a3;
  --accent:#0e7490; --accent-ink:#ffffff; --accent-soft:#e0f2fe;
  --crit:#dc2626; --high:#ea580c; --med:#ca8a04; --low:#0d9488; --info:#64748b;
  --crit-bg:#fef2f2; --high-bg:#fff7ed; --med-bg:#fefce8; --low-bg:#f0fdfa; --info-bg:#f1f5f9;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e13; --surface:#111820; --surface2:#0e141b; --elevated:#18212b; --border:#232f3b; --border-strong:#33414f;
  --text:#e7eef5; --muted:#9aa8b6; --faint:#647080;
  --accent:#38bdf8; --accent-ink:#04141d; --accent-soft:#0c2b3a;
  --crit:#f0616d; --high:#ff9f45; --med:#ffcf5c; --low:#4ec9b0; --info:#94a3b8;
  --crit-bg:#2a1416; --high-bg:#2a1d10; --med-bg:#282213; --low-bg:#0f2521; --info-bg:#18212b;
}}
:root[data-theme="dark"]{
  --bg:#0a0e13; --surface:#111820; --surface2:#0e141b; --elevated:#18212b; --border:#232f3b; --border-strong:#33414f;
  --text:#e7eef5; --muted:#9aa8b6; --faint:#647080;
  --accent:#38bdf8; --accent-ink:#04141d; --accent-soft:#0c2b3a;
  --crit:#f0616d; --high:#ff9f45; --med:#ffcf5c; --low:#4ec9b0; --info:#94a3b8;
  --crit-bg:#2a1416; --high-bg:#2a1d10; --med-bg:#282213; --low-bg:#0f2521; --info-bg:#18212b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .t{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.stat{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 9px;background:var(--surface2)}
.stat b{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat.crit b{color:var(--crit)} .stat.high b{color:var(--high)} .stat.med b{color:var(--med)} .stat.low b{color:var(--low)} .stat.info b{color:var(--info)}
.top .spacer{flex:1}
.top a.src{font-size:12.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.top a.src:hover{color:var(--accent)}
.tgl{cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;width:38px;height:34px;font-size:15px;display:grid;place-items:center;flex:none}
.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- app shell ---------- */
.app{flex:1;display:grid;grid-template-columns:clamp(320px,30vw,420px) 1fr;min-height:0}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface2)}
.filters{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.search input{flex:1;border:0;background:transparent;color:var(--text);font-family:var(--sans);font-size:13.5px;outline:none}
.search svg{flex:none;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;user-select:none}
.chip[aria-pressed="true"]{color:var(--text)}
.chip[aria-pressed="true"].c-crit{background:var(--crit-bg);border-color:var(--crit)}
.chip[aria-pressed="true"].c-high{background:var(--high-bg);border-color:var(--high)}
.chip[aria-pressed="true"].c-med{background:var(--med-bg);border-color:var(--med)}
.chip[aria-pressed="true"].c-low{background:var(--low-bg);border-color:var(--low)}
.chip[aria-pressed="true"].c-info{background:var(--info-bg);border-color:var(--info)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.list{flex:1;overflow-y:auto;overflow-x:hidden}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;border-bottom:1px solid var(--border);cursor:pointer}
.row .stripe{align-self:stretch;min-height:52px}
.row .main{min-width:0;padding:9px 4px 9px 0}
.row .rid{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.row .rtitle{font-weight:600;font-size:13px;letter-spacing:-.01em;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .badge{padding-right:12px}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sevdot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:1px;margin-right:5px}
.sevmini{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.sev-critical .stripe{background:var(--crit)} .sevmini.sev-critical{background:var(--crit-bg);color:var(--crit)} .sevdot.critical{background:var(--crit)}
.sev-high .stripe{background:var(--high)} .sevmini.sev-high{background:var(--high-bg);color:var(--high)} .sevdot.high{background:var(--high)}
.sev-medium .stripe{background:var(--med)} .sevmini.sev-medium{background:var(--med-bg);color:var(--med)} .sevdot.medium{background:var(--med)}
.sev-low .stripe{background:var(--low)} .sevmini.sev-low{background:var(--low-bg);color:var(--low)} .sevdot.low{background:var(--low)}
.sev-info .stripe{background:var(--info)} .sevmini.sev-info{background:var(--info-bg);color:var(--info)} .sevdot.info{background:var(--info)}
.list .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- detail pane ---------- */
.detail{overflow-y:auto;min-height:0;background:var(--bg)}
.detail-inner{max-width:920px;margin:0 auto;padding:30px 40px 80px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.dhead .did{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sevpill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.sevpill.sev-critical{background:var(--crit-bg);color:var(--crit)} .sevpill.sev-high{background:var(--high-bg);color:var(--high)}
.sevpill.sev-medium{background:var(--med-bg);color:var(--med)} .sevpill.sev-low{background:var(--low-bg);color:var(--low)} .sevpill.sev-info{background:var(--info-bg);color:var(--info)}
.livetag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--crit);border:1px solid var(--crit);border-radius:5px;padding:2px 7px}
.dtitle{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 20px;text-wrap:balance}
.metagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:26px}
.metagrid .m{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px}
.metagrid .m .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
.metagrid .m .v{font-size:13px;font-family:var(--mono);word-break:break-word;line-height:1.45}

.sec{margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec > h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec > h3::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.sec p{margin:0;font-size:15px;line-height:1.7;color:var(--text)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding:11px 14px 11px 46px;background:var(--surface);border:1px solid var(--border);border-radius:9px;font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.fixes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fixes li{position:relative;padding:10px 14px 10px 34px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--low);border-radius:9px;font-size:14px;line-height:1.6}
.fixes li::before{content:"✓";position:absolute;left:12px;top:10px;color:var(--low);font-weight:700}
.poc{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:13px 15px;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.disclose{font-size:12.5px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:8px;padding:10px 13px;margin-top:10px}
.impactbox{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.impactbox p{font-size:14.5px}

.placeholder{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.placeholder .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px}

/* PS bar */
.psbar{margin-top:8px}
.psbar details{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.psbar summary{cursor:pointer;padding:12px 15px;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:10px;align-items:center}
.psbar summary::-webkit-details-marker{display:none}
.psbar summary .cv{margin-left:auto;color:var(--faint);font-size:11.5px;font-weight:500}
.psbar .pc{padding:0 15px 14px;font-size:13px;color:var(--muted)}
.psbar .pc h4{color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.psbar .pc ul{margin:0;padding-left:18px}

/* mobile: detail becomes an overlay */
.back{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{border-right:0}
  .detail{position:fixed;inset:0;top:0;z-index:50;transform:translateX(100%);transition:transform .22s ease}
  body.detail-open .detail{transform:translateX(0)}
  .detail-inner{padding:20px 18px 70px}
  .back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;margin-bottom:16px}
  .stats{display:none}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.detail::-webkit-scrollbar,.list::-webkit-scrollbar{width:10px}
.detail::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
</style>
</head>

</header>

<div class="app">
  <aside class="sidebar">
    <div class="filters">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search title, ID, component, scope…" autocomplete="off" aria-label="Search findings">
      </label>

    </div>
  </section>
</div>

<script>
const FINDINGS = [{"id":"V28","severity":"low","title":"vitest path-traversal advisory in the committed lockfile (dev-only)","component":"package-lock.json (vitest 4.1.1)","summary":"vitest@4.1.1 matches CVE-2026-84373 (arbitrary file read); caret allows the fix but the lockfile pins the vulnerable build.","cvss":"N/A - dev dependency","cwe":"CWE-22","scope":"supply-chain","description":"The committed lockfile resolves vitest to 4.1.1, which is in the affected range of GHSA-82fw-gwwq-j7x9 (path traversal / arbitrary file read, fixed in 4.1.11). package.json declares ^4.1.0 so the caret permits the fix, but the checked-in lockfile does not take it. Reachable only by someone who can already author a test/mock spec.","reproduce":["Inspect package-lock.json -> vitest resolved version 4.1.1","Compare against GHSA-82fw-gwwq-j7x9 fixed version 4.1.11"],"poc":"Lockfile pins 4.1.1 (< 4.1.11 fix). Dev/test-time only; no production reachability.","impact":"Arbitrary file read during test execution by an actor who can write a test file. Development/CI exposure only.","remediation":["Bump the lockfile to vitest 4.1.11 (npm update vitest)","Enforce a minimum in package.json"],"status":"code-verified"},{"id":"V29","severity":"info","title":"Lockfile pins lodash@4.18.1 - a version never published upstream","component":"package-lock.json (node_modules/lodash)","summary":"lodash resolves to 4.18.1, which does not exist on the public registry (last real release is 4.17.21).","cvss":"N/A - integrity note","cwe":"CWE-1104","scope":"supply-chain","description":"The lockfile resolves lodash to 4.18.1 from registry.npmjs.org, but no lodash 4.18.1 has ever been published upstream. Every entry carries a valid integrity hash and matching range, so the consistent explanation is a mirrored or synthetic registry rather than a poisoned lockfile - flagged for the owner, not reported as tampering.","reproduce":["grep lodash-4 in package-lock.json -> lodash-4.18.1.tgz","Confirm npmjs.com lists 4.17.21 as latest 4.x"],"poc":"Lockfile references lodash-4.18.1.tgz; no such version exists on the public npm registry.","impact":"Supply-chain provenance ambiguity: builds pull a version that cannot be reproduced from the public registry.","remediation":["Confirm which registry generated the lockfile","Re-pin to a published version (4.17.21) and regenerate the lockfile against public npm"],"status":"code-verified"},{"id":"V30","severity":"medium","title":"Four of five rate-limiter constructions ignore deployment-key scoping","component":"server/_shared/rate-limit.ts:68/1093/1221; api/_rate-limit.js:57","summary":"Rate-limit keys are built without getKeyPrefix(), so a preview deploy sharing one Upstash DB can exhaust production limits.","cvss":"N/A - hardening","cwe":"CWE-770","scope":"infra","description":"The repo contract getKeyPrefix() (M-6 fix) requires env-scoped Redis prefixes so multiple deployments sharing one Upstash instance do not collide. Three Ratelimit constructions in rate-limit.ts and the one in api/_rate-limit.js build unprefixed 'rl'/'rl:ep'/'rl:scope' keys; the correct pattern exists (api/_api-key-rate-limit.js) proving this is a policy violation, not a trade-off.","reproduce":["grep getKeyPrefix in server/_shared/rate-limit.ts -> 0 matches","Observe prefix:'rl' constructed at :68/:1093/:1221 with no env scope"],"poc":"grep getKeyPrefix server/_shared/rate-limit.ts returns zero call sites; keys are literal 'rl*' prefixes.","impact":"A single preview/test run can consume or reset production per-IP and per-principal rate-limit budgets on a shared Upstash egress.","remediation":["Prefix every limiter key with getKeyPrefix() as api/_api-key-rate-limit.js does","Add a lint/test asserting no unprefixed 'rl' key is constructed"],"status":"code-verified"},{"id":"V31","severity":"medium","title":"Daily-quota INCR+EXPIRE never verifies the EXPIRE, leaving permanent keys","component":"server/_shared/direct-llm-quota.ts:152-189; api/_api-key-rate-limit.js:153-172","summary":"The pipeline result type has no error field, so a failed EXPIRE after a successful INCR silently leaves an orphaned permanent key.","cvss":"N/A - integrity/hardening","cwe":"CWE-772","scope":"infra","description":"The daily-quota code validates only pipeResult[0] (the INCR); entry [1] (the EXPIRE) is never inspected and its result type (Array<{result?:unknown}>) cannot even represent a per-command error. A hardened sibling (backtest-stock-quota.ts) checks the EXPIRE result and retries the TTL while refunding an unproved claim. A truncated pipeline also leaves the unit consumed via a no-op rollback.","reproduce":["Read direct-llm-quota.ts:124 result type - no error field","Trace :152-189 - only [0] checked, [1] EXPIRE ignored"],"poc":"Static: EXPIRE result never read; failure mode not representable in the result type.","impact":"Not a spend bypass (keys rotate by UTC date) but causes unbounded permanent-key growth in Redis and integrity drift under partial-pipeline failure.","remediation":["Verify the EXPIRE entry (expireEntry?.error==null && result in {1,'1'}) and retry the TTL","Adopt the backtest-stock-quota.ts pattern and add tests for both failure shapes"],"status":"code-verified"},{"id":"V32","severity":"low","title":"Sub-request dispatch returns 503 unconditionally on the Tauri sidecar","component":"server/_shared/redis.ts:705; server/_shared/server-sub-request-dispatch.ts:57-63","summary":"On LOCAL_API_MODE=tauri-sidecar, runRedisPipeline returns [] so every batch sub-request is refused 503 with a misleading message.","cvss":"N/A - desktop-only","cwe":"CWE-703","scope":"infra","description":"runRedisPipeline returns [] unconditionally in tauri-sidecar mode; sub-request-admission then never sees an 'OK', so server-sub-request-dispatch always yields {refused,503,'Rate-limit service temporarily unavailable'} - permanently, not just during an outage, and naming the wrong subsystem. The file already special-cases this runtime three times elsewhere.","reproduce":["Set LOCAL_API_MODE=tauri-sidecar","Call /api/batch/v1/execute -> 503 'Rate-limit service temporarily unavailable'"],"poc":"Static: redis.ts:705 short-circuits to [] on sidecar; admission can never succeed.","impact":"Batch execution is permanently broken for third-party API consumers on a sidecar deployment; error message misattributes the cause.","remediation":["Special-case tauri-sidecar in the admission path like rate-limit.ts:1113-1142","Return a correct message or bypass admission on the loopback sidecar"],"status":"code-verified"},{"id":"V33","severity":"high","title":"runSeed preservation path puts a 600s TTL on a key declared persistent","component":"scripts/_seed-utils.mjs:2571,1340; scripts/seed-forecast-resolutions.mjs:2240","summary":"On any graceful failure the preservation code EXPIREs a deliberately-persistent forecast ledger to 600s, deleting it 10 minutes later.","cvss":"N/A - data-loss (ops)","cwe":"CWE-672","scope":"storage","description":"defaultPreservationTtl = ttlSeconds || 600 is applied to the preservation key set via EXPIRE. seed-forecast-resolutions calls runSeed with no ttlSeconds by design (persistent ledger), so every graceful-failure path (fetch failure, SIGTERM, RETRY, validation skip) emits EXPIRE forecast:resolutions:v1 600 - converting a permanent ledger into a key Redis deletes in 10 minutes. The documented preserveKeyTtls override is not used by this caller.","reproduce":["Trigger any graceful-failure path in the daily forecast-resolutions Railway cron","Observe EXPIRE forecast:resolutions:v1 600 on the persistent key"],"poc":"Static: preservation TTL defaults to 600 and is applied to the ttl-less persistent ledger key.","impact":"Irrecoverable loss of the forecast resolutions ledger (rebuilt from 200-item history) on a routine transient failure of a live daily cron.","remediation":["Honor a persistent (no-EXPIRE) declaration in the preservation path","Pass preserveKeyTtls or skip EXPIRE when the caller omitted ttlS ue}, so any throw from the publish phase (Redis 5xx after retries, CONTRACT VIOLATION, payload breach) is reported as success in the structured summary alerting keys on. Distinct from the single-file N6 pattern; here it is a 5-file cross-cutting issue with a specific bundle-summary consequence.","reproduce":["Force a publish-phase throw in any of the five seeders","Observe _bundle-runner.mjs report status=OK failed:0"],"poc":"Static: process.exit(0) in five FATAL catch handlers; bundle-runner treats 0 as success.","impact":"Silent seeding failures - stale or missing data ships while dashboards/alerts report healthy.","remediation":["process.exit(1) on fatal, or exit(75) which _bundle-runner maps to GRACEFUL_FAIL"],"status":"code-verified"},{"id":"V36","severity":"medium","title":"Sanctions entity lookup: an empty normalize() needle matches the entire index","component":"server/worldmonitor/sanctions/v1/lookup-entity.ts:50-52,131-138","summary":"normalize() maps all non-[a-z0-9] to spaces, so a Cyrillic/CJK or punctuation query becomes '' and matches every entity at score 80-100.","cvss":"N/A - correctness","cwe":"CWE-20","scope":"input","description":"normalize() lowercases and replaces every non-[a-z0-9] char with a space then trims, so '..', a Cyrillic or CJK name all reduce to ''. The scorer then treats haystack===needle as score 100 and haystack.startsWith(needle) as 80 - both true for an empty needle - so a 2-char query returns the whole index as exact/near-exact matches. Diacritics are replaced by spaces rather than folded, so 'Muller' never matches 'muller'.","reproduce":["GET /api/sanctions/v1/lookup-sanction-entity?q=.. (or a Cyrillic string)","Observe every entity returned at score 100/80"],"poc":"Runtime-reproducible: normalize('gazprom' in Cyrillic)==='' -> matches whole index; query passes the 2-200 length gate.","impact":"The public sanctions lookup returns meaningless whole-index results for many inputs and never matches transliterated accented names nt":"server/_shared/acled.ts:86-91; acled-auth.ts:211-217","summary":"A token-fetch miss returns [] before the cache read, so a transient auth blip yields an empty unrest baseline and throws away previously-cached good data.","cvss":"N/A - data integrity","cwe":"CWE-755","scope":"api","description":"getAcledAccessToken returning null makes acled.ts return [] before cachedFetchJson runs, so a token blip (bad password, ACLED outage, cold isolate) both returns empty and skips serving stale-but-good data. No throw, no upstreamUnavailable, no negative sentinel. The non-2xx path is wired correctly; the token-miss arm is the hole. The sole consumer computes a risk score over an empty baseline, indistinguishable from a quiet window.","reproduce":["Force getAcledAccessToken() to return null (token unavailable)","Observe [] returned and get-risk-scores computing over an empty unrest baseline"],"poc":"Static: acled.ts:87 returns [] before the cache read on token miss.","impact":"Conflict/unrest risk scores silently read as calm during any ACLED auth interruption, with cached good data discarded.","remediation":["Serve cached data or surface upstreamUnavailable on token miss","Move the cache read ahead of the token check"],"status":"code-verified"},{"id":"V39","severity":"low","title":"Seeder and handler compute chokepoint exposure with different boundary conditions","component":"scripts/seed-hs2-chokepoint-exposure.mjs:326; server/worldmonitor/supply-chain/v1/get-country-chokepoint-index.ts:90","summary":"Seeder falls back when no exposure score is >0; handler falls back only when the list is empty - so all-zero scores yield different vulnerabilityIndex.","cvss":"N/A - correctness","cwe":"CWE-697","scope":"api","description":"The seeder accepts the flow-weighted result only when some exposureScore>0, else uses the country-route fallback; the handler falls back only when exposures.length===0. All-zero scores are reachable (origins with no Comtrade registry entry are skipped), so the two publish different vulnerabilityIndex for the same (iso2,hs2). Compounding: the seeder writes the key raw while the handler reads it prefixed, so in preview the handler never sees the seed.","reproduce":["Pick an (iso2,hs2) where all exposure scores compute to 0","Compare seeder output vs handler output -> different vulnerabilityIndex"],"poc":"Static: boundary conditions differ (.some(e>0) vs length===0); raw vs prefixed key mismatch in preview.","impact":"Inconsistent chokepoint vulnerability index between the seeded value and the live handler; wrong values in preview/dev.","remediation":["Align both to the same boundary condition","Use the same key prefixing on both write and read"],"status":"code-verified"},{"id":"V40","severity":"medium","title":"A payload with an unparseable fetchedAt re-enters the Comtrade fetch path forever","component":"server/worldmonitor/supply-chain/v1/get-country-products.ts:53-57; _bilateral-hs4-lazy.ts:277-281","summary":"isStale() returns true when Date.parse(fetchedAt) is NaN, and the warm-recovery path never refreshes fetchedAt, so the payload is stale permanently.","cvss":"N/A - efficiency/hygiene","cwe":"CWE-835","scope":"api","description":"isStale() treats a non-finite Date.parse(fetchedAt) as stale, and the warm-recovery path writes only the 24h sentinel without refreshing the canonical key's fetchedAt, so isStale can never converge. The result is permanent re-entry into the lazy Comtrade fetch on every read. Bounded by a module-level in-flight guard and Pro-gating, so it is cost/hygiene rather than DoS.","reproduce":["Store a canonical payload with a non-parseable fetchedAt","Observe every read re-enter the lazy fetch path indefinitely"],"poc":"Static: NaN age -> permanently stale; warm path never rewrites fetchedAt.","impact":"Unnecessary repeated calls to a rate-limited external API and wasted compute on every read of an affected key.","remediation":["Treat an unparseable fetchedAt as a hard refresh once, then stamp r misconfigured first-party response - but the divergence is provable against two in-repo siblings.","reproduce":["Make the billing-portal endpoint return an attacker portal_url (compromised/misconfigured)","Observe navigation without validation"],"poc":"Static: portal_url navigated unchecked; checkout_url goes through safeHostedCheckoutUrl.","impact":"Open-redirect / phishing if the first-party billing response is tampered; low because it needs a compromised backend.","remediation":["Validate portal_url with the same host allowlist as checkout_url","Do not navigate on !resp.ok"],"status":"code-verified"},{"id":"V44","severity":"low","title":"CLI --api_key silently downgrades the credential from a header into a URL query","component":"cli/src/core.mjs (VALUE_FLAGS, :167-169,:238)","summary":"VALUE_FLAGS maps api-key/apikey/key but not api_key, so --api_key value is treated as a request param and written into the URL query string.","cvss":"N/A - credential hygiene","cwe":"CWE-598","scope":"client","description":"VALUE_FLAGS maps api-key|apikey|key but not the underscore spelling api_key; the unknown-flag branch turns --flag value into a request param, and restPlan writes every such param into url.searchParams. So `get /api/x --api_key wm_...` sends the key in the query string (no header) while `--api-key` correctly sets the header. api_key is the natural guess given the WORLDMONITOR_API_KEY env var and the product's own api_key form field.","reproduce":["cli: get /api/x --api_key wm_... -> URL becomes ...?api_key=wm_... with no header","cli: get /api/x --api-key wm_... -> header set, no query param"],"poc":"Executed: --api_key lands the key in the query string; --api-key sets the header.","impact":"The API key is placed in URLs and thus in CDN/proxy access logs and any Referer - CWE-598 sensitive info in query string.","remediation":["Add api_key to VALUE_FLAGS mapping to the header","Reject unknown --*key* flags rather than passing them as query params"],"status":"code-verified"},{"id":"V45","severity":"high","title":"get-regional-snapshot collapses 'Redis is down' into {} and the CDN pins it for an hour","component":"server/worldmonitor/intelligence/v1/get-regional-snapshot.ts:500-510","summary":"Lossy cache reads map an outage to {} with no availability field, so the empty answer is stored on the slow tier (s-maxage=3600).","cvss":"N/A - availability","cwe":"CWE-755","scope":"api","description":"getCachedRawString and getCachedJson (the lossy helpers that map a read error to null/absent) both cause a return of {} on failure, and the response type has no upstream_unavailable field, so getRpcNoStoreReasonFromJson returns null and the body is cached on the slow tier. The fix already exists verbatim in the sibling get-regional-brief.ts:56-70 (getRawJson that throws, catch -> {upstreamUnavailable:true}, return {} only for a genuinely missing key) and was never propagated here.","reproduce":["Induce a Redis read failure for the snapshot key","Observe {} returned, cached with s-maxage=3600"],"poc":"Static: both getCached* helpers return {} on error; no marker; slow-tier caching applies.","impact":"A brief Redis blip makes regional snapshots appear empty for up to an hour for all callers, cached at the edge.","remediation":["Use getRawJson + catch -> {upstreamUnavailable:true} as get-regional-brief.ts does","Return {} only for a genuinely missing key"],"status":"code-verified"},{"id":"V46","severity":"high","title":"GDELT free-text search bypasses the operator URL-revocation set","component":"server/worldmonitor/intelligence/v1/search-gdelt-documents.ts:170-197","summary":"The country path fails closed on an unreadable revocation set, but the free-text branch never calls readRevokedUrlSet(), so revoked URLs still surface in keyword search.","cvss":"N/A - content governance","cwe":"CWE-284","scope":"access-control","description":"The revoking branch reads the revoked-URL set in parallel and fails closed when it is unreadable, filtering results. The free-text branch reads only the seeded topic snapshot and returns articles.slice(...) with error:'' - readRevokedUrlSet() is never called on this path, and the returned shape is identical. So SADD to the digest revoked-urls set (a retracted story, legal takedown, phishing URL) still reaches every keyword search, with nothing signaling the suppression was skipped. The repo runbook states every reader of that key must go through the suppression helper.","reproduce":["Add a URL to news:digest:revoked-urls:v1","Query the GDELT free-text search that would return it -> still returned"],"poc":"Static: readRevokedUrlSet called only in the country branch (:134), not the free-text branch.","impact":"Retracted/legally-suppressed/phishing URLs reach prerendered pages via keyword search, defeating the operator revocation control.","remediation":["Hoist readRevokedUrlSet() above the branch and fail closed on !readable","Filter the free-text results before slicing"],"status":"code-verified"},{"id":"V47","severity":"medium","title":"ListCountryHeadlines lets one anonymous request rescan the pool 250x, rebuilding RegExps","component":"server/worldmonitor/news/v1/list-country-headlines.ts:43,76; shared/country-mention.js:210","summary":"250 country codes x thousands of pooled headlines, with mentionsCountry rebuilding a fresh RegExp per name/demonym on every call = ~2s of edge CPU per unauthenticated GET.","cvss":"N/A - DoS-shape","cwe":"CWE-1333","scope":"dos","description":"The route caps countryCodes at 250 and filters the whole English-feed headline pool per code; mentionsCountry builds a new RegExp for every name, demonym and exclusion phrase on every call with no memoization. Measured ~2047ms (3459ms at longer titles) of edge CPU from one unauthenticated GET; the route is on the fast tier and permuting code order yields a fresh CDN key so the cache does not absorb repeats. A memoization cache for exactly this exists elsewhere in the repo.","reproduce":["GET the diation":["Re-derive totalCount post-cap as the RPC path does","Pass a maxBytes and emit a real nextCursor"],"status":"code-verified"},{"id":"V125","severity":"low","title":"Internal-MCP bodyHash is taken over a lossily decoded string, not the raw bytes","component":"server/_shared/mcp-internal-hmac.ts:534-538","summary":"TextDecoder maps every invalid-UTF-8 byte sequence to U+FFFD, so byte-distinct bodies can hash equal; the module's 'SHA-256(bodyBytes)' docstring is false.","cvss":"N/A - integrity (bounded)","cwe":"CWE-347","scope":"api","description":"bodyHash = sha256Hex(new TextDecoder().decode(bodyBytes)); non-fatal TextDecoder maps distinct invalid byte sequences onto U+FFFD, so two byte-distinct bodies can decode-equal and hash-equal. Exploitation is bounded (needs a valid signature, the replay nonce is GETDEL-claimed, both bodies JSON.parse the same), but the module's stated body-exactness guarantee is false. The byte-accepting sha256Hex already exists in idempotency.ts; the signature half was fixed twice but the body half never was.","reproduce":["Craft two byte-distinct bodies that both decode to the same U+FFFD string","Observe equal bodyHash despite different raw bytes"],"poc":"Executed: sha256(decode(A))==sha256(decode(B)) while sha256(rawA)!=sha256(rawB).","impact":"The internal-MCP HMAC's body-exactness guarantee is false; any future consumer trusting a matching bodyHash as byte identity would be wrong.","remediation":["Hash the raw bytes via the byte-accepting sha256Hex","Drop the TextDecoder coercion on both sides"],"status":"code-verified"},{"id":"V126","severity":"medium","title":"Embed entitlement client collapses 'could not verify' into a terminal denial","component":"src/embed/embed-fetch.ts:96; src/embed-main.ts:76-83","summary":"fetchEmbedEntitlement returns ok = resp.ok && allowed for every non-2xx, so a 503 verification outage blanks a paying partner's display and blames their key.","cvss":"N/A - availability (partner)","cwe":"CWE-755","scope":"api","description":"fetchEmbedEntitlement returns a single ok for every non-2xx, so it cannot distinguish a retryable verification outage from a real denial - contrary to the file's own contract 70 lines above (denied is terminal, unavailable keeps last render). Both siblings guard 429/5xx; this one does not. The three reachable 503s (key_validation_unavailable, Convex unreachable, account_verification_unavailable) all become a terminal 'could not verify the embedding API key', blanking a paid wall display and misattributing the outage to the partner.","reproduce":["Return 503 (Convex/BAPI blip) from the entitlement endpoint","Observe the embed permanently blank with a 'could not verify key' error"],"poc":"Static: ok = resp.ok && allowed for all statuses; no 429/5xx retryable branch.","impact":"Any transient verification outage permanently blanks a paying partner's embedded display until reload.","remediation":["Return a retryable flag on 429/5xx and schedule a backoff re-probe","Mirror EmbedMapFrameUnavailableError handling"],"status":"code-verified"},{"id":"V127","severity":"low","title":"embed-entitlement discards the billing classification its sibling preserves","component":"server/_shared/embed-entitlement.ts:151-155; embed-session.ts:113-124","summary":"On denial it checks only verificationUnavailable and returns terminal 403, missing renewal_verification_pending which the sibling maps to 503 + retryAfter.","cvss":"N/A - availability (partner)","cwe":"CWE-755","scope":"api","description":"On denial the code checks only entitlements?.verificationUnavailable and otherwise returns 403 embed_not_entitled, while the sibling embed-session runs classifyBillingVerification and returns 503 with retryAfterSeconds when the denial is retryable. A cached row with billingStatus renewal_verification_pending/failed and a lapsed validUntil misses the flag and lands on the terminal 403 - but renewal_verification_pending is transient by definition. The cache layer's own comment requires retaining the marker for denial details.","reproduce":["Present a cached entitlement with billingStatus renewal_verification_pending and lapsed validUntil","Observe terminal 403 instead of 503 + retry"],"poc":"Static: only verificationUnavailable checked; billing classification dropped.","impact":"A transient renewal-verification state terminally denies a paying embed instead of a retryable 503.","remediation":["Reuse embed-session's four-clause billing block (503 + retryAfter on retryable)","Extract it into one shared function"],"status":"code-verified"},{"id":"V128","severity":"low","title":"Turnstile fail-open is decided by VERCEL_ENV, and no caller ever requests 'deny'","component":"server/_shared/turnstile.ts:25-35; submit-contact.ts:114; register-interest.ts:333","summary":"missingSecretPolicy defaults to allow-in-development keyed on VERCEL_ENV; on hosts where VERCEL_ENV is unset the captcha silently disappears.","cvss":"N/A - anti-abuse (non-Vercel)","cwe":"CWE-703","scope":"auth","description":"With no TURNSTILE_SECRET_KEY the module returns true when (VERCEL_ENV ?? 'development')==='development' - a variable unrelated to the captcha. Both public no-auth callers take the default rather than the exposed 'deny' policy. On Vercel, production/preview fall through to return false, so it is not live there; the exposure is any deployment where VERCEL_ENV is unset (Tauri sidecar, Railway, Docker, bare Node), where the captcha silently vanishes behind a console.error.","reproduce":["Deploy with TURNSTILE_SECRET_KEY unset and VERCEL_ENV unset","Submit the contact/interest form -> captcha bypassed"],"poc":"Static: fail-open gated on VERCEL_ENV, not on captcha configuration; callers omit deny.","impact":"On non-Vercel hosts the anti-abuse captcha on public Convex-write + email endpoints silently disappears.","remediation":["Default missingSecretPolicy to 'deny' and pass it explicitly at both call sites","Key the decision on the captcha's own config, not VERCEL_ENV"],"status":"code-verified"},{"id":"V129","severity":"info","title":"hasMxRecords fails open, disabling disposable/typo-domain gates on a DoH outage","component":"server/_shared/email-validation.ts:35-40; register-interest.ts:348","summary":"Both exits (non-OK HTTP, thrown fetch, 3s timeout) return true, so the disposable list, typo-TLD list and MX check all evaporate when Cloudflare DNS is unreachable.","cvss":"N/A - anti-abuse","cwe":"CWE-755","scope":"input","description":"hasMxRecords returns true on !res.ok and in the catch, so non-OK HTTP, a thrown fetch, and the 3s timeout all yield 'this domain accepts mail'. The disposable-domain list, typo-TLD list and MX check therefore all collapse together the moment Cloudflare DNS is unreachable, with no log line. Sole consumer is register-interest (public no-auth). Remaining controls after collapse: the 5h per-IP scoped limit and a Convex per-email throttle.","reproduce":["Make the DoH endpoint unreachable/slow","Submit interest with a disposable/typo domain -> accepted"],"poc":"Static: both exits of hasMxRecords return true (permissive).","impact":"On a DNS provider outage the email-quality gates silently disable, allowing disposable/typo signups.","remediation":["Return a tri-state so the caller can answer 503 rather than accept","Log the DoH failure"],"status":"code-verified"},{"id":"V130","severity":"high","title":"clampInt collapses an absent page_size to min(=1) on four routes","component":"server/_shared/constants.ts:3-6; research/v1 list-arxiv-papers.ts:29, list-hackernews-items.ts:26, list-trending-repos.ts:25; prediction/v1/list-prediction-markets.ts:98","summary":"The generated decoder emits 0 for an absent page_size; clampInt(0,50,1,100) returns 1 (min), not the fallback, so four content routes silently return 1 item.","cvss":"N/A - correctness","cwe":"CWE-1284","scope":"api","description":"clampInt returns fallback only for non-finite input; clampInt(0,...) returns Math.max(min,min(max,0))=1. The generated GET decoder emits 0 for an absent optional numeric param, and four routes pass req.pageSize raw, so an absent page_size clamps to 1 rather than the documented default. Two siblings guard it (req.pageSize<=0?DEFAULT:..., or req.pageSize||DEFAULT). OpenAPI publishes page_size as optional (1-100).","reproduce":["Call list-arxiv-papers with no page_size (documented as optional)","Observe 1 item returned instead of the 50 default"],"poc":"Isolated: clampInt(0,50,1,100)===1; clampInt(undefined,50,1,100)===50.","impact":"External API/MCP consumers of the primary arXiv/HN/GitHub-trending/prediction routes silently receive 1 item; static-tier routes CDN-cache the truncated payload up to 4h.","remediation":["Resolve the 0 sentinel before clamping on the four sites (pageSize||DEFAULT)","Or make clampInt apply fallback to non-positive input (no caller passes min 0)"],"status":"code-verified"},{"id":"V131","severity":"medium","title":"list-webcams treats an all-absent bbox as a real viewport, issuing GEOSEARCH BYBOX 0 0","component":"server/worldmonitor/webcam/v1/list-webcams.ts:78-135","summary":"All five bbox params ?? a decoder-0, so Number.isFinite(0) passes the guard and a degenerate GEOSEARCH FROMLONLAT 0 0 BYBOX 0 0 is issued under one shared key.","cvss":"N/A - correctness","cwe":"CWE-1284","scope":"api","description":"The five params default via ?? against a decoder that emits 0, so Number.isFinite(0) is true for all and the ValidationError guard never fires. The result is qW=qS=qE=qN=0, zoom=0, one shared cache key, and a real GEOSEARCH ... BYBOX 0 0 km. Depending on the backend this either returns nothing (empty 200 pinned 3600s in Redis) or throws SeedUnavailableError (503). Siblings get it right (vessel-snapshot returns null for all-zero; military-bases short-circuits and uses ||3 for zoom).","reproduce":["GET list-webcams with no bbox params","Observe GEOSEARCH BYBOX 0 0 and an empty 200 (or 503) under a shared key"],"poc":"Static: all-absent bbox passes Number.isFinite guard; degenerate GEOSEARCH issued.","impact":"An all-absent request either poisons a shared cache key with empty results for an hour or 503s.","remediation":["Short-circuit an all-zero/absent bbox before the query (vessel-snapshot pattern)","Use || for zoom or validate presence of bbox params"],"status":"code-verified"},{"id":"V132","severity":"medium","title":"cursor is silently ignored on two research routes without the repo's 'unimplemented' marker","component":"proto/worldmonitor/research/v1/list_hackernews_items.proto:13; list_trending_repos.proto:13","summary":"Both declare a cursor query param with no (sebuf.http.unimplemented)=true, yet neither handler reads it and both return pagination: undefined - the OpenAPI advertises live pagination.","cvss":"N/A - contract correctness","cwe":"CWE-684","scope":"api","description":"Both protos declare string cursor = 2 with no unimplemented marker, and both handlers never read it, always returning pagination: undefined. The sibling list_arxiv_papers.proto carries (sebuf.http.unimplemented)=true, and the generated OpenAPI reflects the difference (arxiv's cursor is documented 'accepted but currently ignored'). So the published contract advertises live pagination on two routes where a paging loop re-fetches page 1 forever, with no way for a correct client to detect it.","reproduce":["Read list_hackernews_items.proto:13 - cursor with no unimplemented marker","Call the route with a cursor -> pagination undefined, page 1 re-returned"],"poc":"Static: two of three research cursor fields lack the unimplemented marker present on arxiv.","impact":"The API contract falsely advertises pagination; a client paging loop never terminates / re-fetches page 1.","remediation":["Add (sebuf.http.unimplemented)=true to both cursor fields (mirror arxiv)","Or implement cursor pagination"],"status":"code-verified"},{"id":"V1","severity":"high","title":"Gateway drains handler side-channel from the wrong Request object","component":"server/gateway.ts:2451/2458/2467; server/_shared/response-headers.ts:9-10","summary":"Handler cache/status side-channel is keyed by Request identity but drained from a different object for authenticated callers.","cvss":"N/A — correctness/security-control bug","cwe":"CWE-670 (Always-Incorrect Control Flow Implementation)","scope":"api","description":"The handler side-channel (X-No-Cache, retryable, success-status-override) is stored in a WeakMap/WeakSet keyed by Request object identity (response-headers.ts:9-10). When rateLimitPrincipalUserId is set, the gateway builds a NEW request object (requestForHandler = withTrustedRateLimitPrincipal(request,...)) and passes it to the handler, but the drain calls at gateway.ts:2451/2458/2467 read from the ORIGINAL request. The two objects differ for every authenticated/principal-bearing caller, so the handler's writes are silently lost.","reproduce":["Read server/_shared/response-headers.ts:9-10 (WeakMap<Request>, WeakSet<Request>)","Read server/gateway.ts:788-790 (cloneRequestWithHeaders returns new Request)","Read gateway.ts:2420-2426 (requestForHandler is a new object when rateLimitPrincipalUserId set) and :2436 (handlerCall(requestForHandler))","Read gateway.ts:2451/2458/2467 — drain* read the original request, not requestForHandler"],"poc":"67 handler files use the side-channel. For Clerk-session / wm_ user-key / tier-gated / summarize-article callers the X-No-Cache→no-store conversion at gateway.ts:2491 never fires, and run-scenario's setSuccessStatusOverride(202)+Location is dropped (returns 200 without Location).","impact":"Inverted correctness: correct for anonymous/enterprise callers, broken for exactly the paid/authenticated callers — a private per-user response can be cached, and async-enqueue 202 responses lose their Location header.","remediation":["Drain the side-channel from requestForHandler at gateway.ts:2451/2458/2467","Or unify on a single request object for the handler call and the drain"],"status":"c
