andle it)","Induce Upstash latency so limit() resolves {success:true,reason:'timeout'}","Observe the per-minute MCP burst limit silently unenforced"],"poc":"Static: {success} only → a timeout resolution is treated as headroom, no telemetry.","impact":"During Redis degradation the paid MCP per-user per-minute burst ceiling is silently unenforced (the daily cap still bounds spend) — a rate-limit bypass under the exact condition the limit exists for.","remediation":["Capture reason and treat 'timeout' as unavailable (mirror auth.ts:1034-1046); emit telemetry","Add a test for the timeout-resolution path"],"status":"code-verified"},{"id":"V97","severity":"info","title":"envPrefix() collapses every SHA-less non-production deploy into one dev: quota namespace","component":"server/_shared/pro-mcp-token.ts:481-486 · api/mcp/free-account-allowance.ts:47-51","summary":"When VERCEL_GIT_COMMIT_SHA is unset, envPrefix falls back to the literal 'dev', so all such deploys share mcp:pro-usage:* / mcp:free-acct:* keys; an unset VERCEL_ENV collides with production outright.","cvss":"N/A — informational (deploy isolation)","cwe":"CWE-668 (Exposure of Resource to Wrong Sphere)","scope":"infra","description":"pro-mcp-token.ts:481-486 `const sha = process.env.VERCEL_GIT_COMMIT_SHA?.slice(0,8) || 'dev'`. Every non-production deploy without a commit SHA gets the literal dev: prefix and therefore shares mcp:pro-usage:*, mcp:free-acct:* keys with every other such deploy. free-account-allowance.ts:47-51 states the hazard verbatim ('an unprefixed key would let a preview deploy spend — or reset — a real user's production allowance'). VERCEL_ENV unset (self-hosted/sidecar) yields '' and collides with production outright.","reproduce":["Read pro-mcp-token.ts:481-486 (|| 'dev') and free-account-allowance.ts:47-51","Run two SHA-less non-prod deploys → they share the dev: namespace; unset VERCEL_ENV → collides with prod"],"poc":"Static: the fallback prefix is the literal 'dev', shared across all SHA-less deploys.","impact":"SHA-less non-production deploys share one quota namespace (and an unset VERCEL_ENV collides with production), so they can spend or reset each other's — and potentially production's — MCP allowances. Informational.","remediation":["Fall back to a per-deploy-unique value (VERCEL_URL or a random suffix), not the literal 'dev'","Fail closed when VERCEL_ENV is unset"],"status":"code-verified"},{"id":"V98","severity":"info","title":"MCP bearer tokens carry no audience and no enforced scope","component":"api/_oauth-token.js:128-163 · api/oauth/token.ts:506-521/629-631","summary":"Every bearer is an opaque Redis UUID in one flat namespace; the stored scope is written at mint and never read by the resolver, and no RFC 8707 resource parameter is accepted — so a token isn't bound to the client or resource server that received it.","cvss":"N/A — informational (token binding / blast radius)","cwe":"CWE-284","scope":"auth","description":"_oauth-token.js:128-163 every bearer is an opaque Redis UUID in one flat oauth:token:003cuuid> namespace. The stored scope ('mcp'/'mcp_pro') is written at mint time and never read by the resolver (grep scope returns only comments), and no RFC 8707 resource parameter is accepted, stored or checked. No escalation — both scopes grant identical MCP access, and redirect_uri/client_id/PKCE ARE re-verified on exchange (token.ts:506-521) with refresh-family reuse contained (:629-631). The consequence is blast radius, not privilege: a token is not bound to the client or resource server that received it, so a leak in any consumer of the namespace is immediately usable at both /mcp and api.worldmonitor.app, and revoking one consumer does not revoke the bearer elsewhere.","reproduce":["Read _oauth-token.js:128-163 (flat namespace, scope written not read; no resource param)","Note token.ts:506-521 re-verifies redirect_uri/PKCE but the resolver ignores scope/audience"],"poc":"Static: no audience/resource binding and scope is never read on resolve; both scopes grant identical access.","impact":"An MCP bearer is not bound to the client or resource server it was issued for, so a leak from any consumer is usable everywhere and per-consumer revocation is impossible — a blast-radius (not privilege) concern. Informational.","remediation":["Adopt RFC 8707 resource binding and enforce scope/audience on resolve","Namespace tokens by consumer to enable targeted revocation"],"status":"code-verified"},{"id":"V99","severity":"high","title":"/api/docs-mcp forwards the caller's Authorization to a third-party SaaS host","component":"api/docs-mcp.ts:23/42-51/266/304 (vs middleware.ts:383-392)","summary":"The unauthenticated public docs-MCP facade includes 'authorization' in its forwarded-header list and ships it verbatim to worldmonitor.mintlify.dev — a third-party host — while the sibling proxy of the same upstream deliberately excludes it.","cvss":"N/A — credential exposure to third party","cwe":"CWE-200 (Exposure of Sensitive Information)","scope":"comms","description":"docs-mcp.ts:23 sets UPSTREAM_URL='https://worldmonitor.mintlify.dev/docs/mcp' — a third-party host. FORWARDED_REQUEST_HEADERS (:42-51) includes 'authorization' (:45); upstreamRequestHeaders() (:233-240) copies the caller's header verbatim into the outbound fetch (:266 GET/DELETE, :304 POST). The route is an unauthenticated public facade: :78 ACAO:'*' and :80 Access-Control-Allow-Headers includes Authorization — the CORS preflight actively invites a browser to attach a credential to a route that ships it off-origin. The sibling settles intent: middleware.ts:383-392 proxies the SAME DOCS_UPSTREAM_ORIGIN forwarding only ['accept','accept-language','user-agent','if-none-match','if-modified-since'] — authorization deliberately excluded. mcp-proxy.ts:915-938 premium-gates the same capability precisely because relaying Authorization to an arbitrary upstream is dangerous; docs-mcp has no gate AND a fixed third-party target.","reproduce":["Read docs-mcp.ts:23 (mintlify upstream), :42-51 (authorization in forwarded headers), :78-80 (ACAO:* + Authorization in allow-headers)","Compare middleware.ts:383-392 (same upstream, authorization excluded)","Send a request to /api/docs-mcp with an Authorization header → it is forwarded to worldmonitor.mintlify.dev"],"poc":"Static: 'authorization' is in FORWARDED_REQUEST_HEADERS and the fixed upstream is a third-party host; the CORS policy invites credentials.","impact":"MCP clients typically apply one configured header set across every server they target, so an operator (or a misrouting agent) attaching its WorldMonitor API key / Clerk JWT / MCP OAuth bearer to https://www.worldmonitor.app/docs/mcp has that credential written into Mintlify's request logs. The server gains nothing (public docs), so the header is pure egress — a credential leak to a third party.","remediation":["Delete 'authorization' from FORWARDED_REQUEST_HEADERS (docs-mcp.ts:45), matching middleware.ts:386","Remove Authorization from the route's Access-Control-Allow-Headers","Add a test asserting no Authorization header leaves this route to the upstream"],"status":"code-verified"},{"id":"V100","severity":"medium","title":"Relay /rss returns raw Node transport errors on an unauthenticated route","component":"scripts/ais-relay.cjs:12066/12857/12713-12723","summary":"/rss is a public relay route whose error handler serializes err.message straight into the JSON body, leaking raw transport detail (ENOTFOUND, ECONNREFUSED 10.x, egress addresses) to any anonymous caller.","cvss":"N/A — information disclosure","cwe":"CWE-209 (Generation of Error Message Containing Sensitive Information)","scope":"comms","description":"ais-relay.cjs:12066 /rss is in isPublicRoute, so NO RELAY_SHARED_SECRET is required. :12857 request.on('error',(err)=>{…; sendError(502, err.message)}) and sendError (:12713-12723) serialises that message into an application/json body. err is a http.ClientRequest error, so the body is raw transport detail: getaddrinfo ENOTFOUND …, connect ECONNREFUSED 10.x.x.x:443, read ECONNRESET, socket hang up. api/_relay.js:44-49's non-disclosing wrap never fires because sendError always sets application/json, so api/rss-proxy.js:387-403 returns the body to the browser unchanged. The repo states the opposite policy twice (api/_relay.js:122-129, api/rss-proxy.js:416-419).","reproduce":["Read ais-relay.cjs:12066 (public), :12857 (sendError(502,err.message)), :12713-12723 (serializes message)","Call /api/rss-proxy?url=… pointing at a host that fails to resolve/connect","Observe raw ENOTFOUND/ECONNREFUSED text (incl. internal egress IPs) in the response"],"poc":"Static: a public route serializes the raw Node transport error, exposing resolver behavior and egress addresses.","impact":"Any anonymous caller learns the relay's resolver behavior and internal egress addresses, mapping the deployment's network topology and turning the relay into a remote host/port prober — the exact class the edge layer suppresses.","remediation":["Return a generic message (sendError(502,'Feed fetch failed')) at :12857 and :12834; keep err.message only in the throttled log","Add a test asserting no raw transport detail reaches the client body"],"status":"code-verified"},{"id":"V101","severity":"low","title":"X-Bases-Debug leaks the seed version and internal Redis keys on an ungated public route","component":"server/worldmonitor/military/v1/list-military-bases.ts:147-148/236-239 · server/gateway.ts:2537-2540","summary":"The route sets X-Bases-Debug on every success and, on the catch path, interpolates the internal Redis key from a timeout err.message — on an ungated CDN-cacheable route readable by any freely-minted wms_ session.","cvss":"N/A — information disclosure","cwe":"CWE-200","scope":"api","description":"list-military-bases.ts:147-148 sets X-Bases-Debug: v=003cversion>,raw=003cflag> on every successful call; :236-239 sets X-Bases-Debug: error:003cerr.message> on the catch. err.message for a cachedFetchJson timeout interpolates the internal Redis key (redis.ts:877 `… timeout after ${timeoutMs}ms for \"${key}\"`, :1044 likewise). The repo's convention is bypassed: gateway.ts:2537-2540 strips X-No-Cache and gates the sibling diagnostic header X-Cache-Tier behind ?_debug, but has no rule for X-Bases-Debug. The route is ungated (absent from ENDPOINT_ENTITLEMENTS and premium-paths.ts) on the CDN-cacheable daily tier, so any holder of a freely-mintable wms_ session can read it.","reproduce":["Read list-military-bases.ts:147-148/236-239 and gateway.ts:2537-2540 (no rule for X-Bases-Debug)","Call the route (or induce a timeout) with a wms_ session","Observe X-Bases-Debug exposing the seed version and, on error, the internal Redis key"],"poc":"Static: the debug header is emitted unconditionally and leaks the internal Redis key on the timeout path.","impact":"Any freely-minted anonymous session can read the seed version and internal Redis key names from an ungated public route, aiding reconnaissance — a low-severity information disclosure.","remediation":["Gate X-Bases-Debug behind ?_debug (extend the gateway.ts:2538 strip) and stop interpolating the Redis key into the client-visible string","Add a test asserting the header is absent without ?_debug"],"status":"code-verified"},{"id":"V102","severity":"low","title":"Desktop sidecar puts the FRED/EIA provider key in the validation URL","component":"src-tauri/sidecar/local-api-server.mjs:1151/1165 (header-capable providers use headers at :1129/:1140)","summary":"The FRED and EIA validation probes place api_key in the query string; EIA accepts a header on /v2/ and should use it (FRED v1 requires the param), so the key can reach logs on the one-shot probe.","cvss":"N/A — credential hygiene (desktop)","cwe":"CWE-598","scope":"comms","description":"local-api-server.mjs:1151 `…fred/series?series_id=GDP&api_key=${encodeURIComponent(value)}` and :1165 `https://api.eia.gov/v2/?api_key=${encodeURIComponent(value)}`. Same class as N6/V102 (seeders) but on the desktop sidecar path, which the prior pass did not cover. Header-capable providers in the same function already use headers (:1129,:1140 Authorization: Bearer). FRED v1 requires the query parameter, so it is not fixable at this layer; EIA accepts api_key as a header on /v2/ and should be moved. Low: the key only ever reaches the provider that issued it, over TLS, in a one-shot user-initiated probe.","reproduce":["Read local-api-server.mjs:1151/1165 (key in URL) vs :1129/:1140 (header auth)","Run the FRED/EIA key validation probe","Observe the key in the request URL"],"poc":"Static: FRED and EIA probes put api_key in the query string; EIA supports a header.","impact":"The provider key can be written into logs/Referer on the one-shot validation probe (TLS, provider-only), a minor desktop credential-hygiene gap; EIA is fixable, FRED v1 is not.","remediation":["Move EIA to the api_key header on /v2/; document FRED's query-param requirement","Add a test asserting header auth where the provider supports it"],"status":"code-verified"},{"id":"V103","severity":"medium","title":"CORS preflight Worker strips ACAO:* from 8 public endpoints, incl. both discovery docs","component":"workers/api-cors-preflight/src/index.js:110-118/120-123/330-333","summary":"PUBLIC_CORS_PATHS lists /api/oauth-protected-resource but not its sibling /api/oauth-authorization-server (and 6 others), and the Worker overwrites the origin function's ACAO:* with an echoed origin + credentials.","cvss":"N/A — CORS / interoperability + credential-flag","cwe":"CWE-942","scope":"comms","description":"index.js:110-118 PUBLIC_CORS_PATHS contains /api/oauth-protected-resource but NOT /api/oauth-authorization-server — the direct sibling, same _agent-metadata guard, same hardcoded ACAO:'*'. The prefixes (:120-123) are /api/mcp/ and /api/oauth/, and /api/oauth/ does not match /api/oauth-authorization-server. The clobber is at :330-333 (for(const [k,v] of Object.entries(corsHeaders)) newHeaders.set(k,v)) overwriting whatever the origin function set; hasPublicCorsPolicy (:125-129) is the only exemption (:403). The Worker's own comment (:108-109) says the list must stay in sync with oauth-protected-resource.ts — it wasn't. Also not exempt: /api/http-message-signatures-directory, /api/a2a, /api/ask, /api/agent-auth, /api/docs-mcp, /api/md-twin, /api/not-found. Two-sided damage: a disallowed origin loses a read that used to succeed, and the Worker stamps ACAC:true onto a response the origin declared credential-free.","reproduce":["Read index.js:110-118 (list omits /api/oauth-authorization-server + 7 others), :120-123 (prefixes), :330-333 (clobber)","Send a cross-origin request to /api/oauth-authorization-server","Observe ACAO:* replaced by an echoed origin + ACAC:true"],"poc":"Static: the RFC 8414 discovery doc and 7 other public endpoints are missing from PUBLIC_CORS_PATHS, so the Worker overwrites their ACAO:*.","impact":"Browser-context MCP/OAuth clients lose the ACAO:* they depend on for the discovery docs and the catch-all 404 contract (the file notes this exact shape previously broke every browser-context MCP client), and disallowed origins get a credential flag on credential-free responses.","remediation":["Add the 8 paths (or a /api/ catch-all) to PUBLIC_CORS_PATHS","Add a CI test asserting every api/** file with ACAO:'*'/getPublicCorsHeaders is exempted"],"status":"code-verified"},{"id":"V104","severity":"medium","title":"vercel.json /.well-known header rule caches the live MCP transport","component":"vercel.json:235/229 · api/mcp/handler.ts:576-586","summary":"The /.well-known/(.*) rule forces public, max-age=3600 and fires on the incoming path before /.well-known/mcp is rewritten to /api/mcp, removing the no-store defense for the credentialed SSE transport that a documented production incident required.","cvss":"N/A — cache-integrity (transport)","cwe":"CWE-524","scope":"api","description":"vercel.json:235 matches every /.well-known/* and forces ACAO:* + Cache-Control: public, max-age=3600. :229 rewrites /.well-known/mcp and /.well-known/mcp.json to /api/mcp — the credentialed, per-principal SSE transport. Vercel applies headers on the INCOMING pathname, so the rule fires before the rewrite. handler.ts:576-586 documents an empirical production incident of exactly this (x-vercel-cache:HIT replaying a cached body to an Accept:text/event-stream client) and deliberately sets MCP_CACHE_CONTROL='no-store, no-transform'. The config rule removes the only defense for the /.well-known/* spellings.","reproduce":["Read vercel.json:235 (public,max-age=3600 for /.well-known/*) and :229 (rewrite to /api/mcp)","Read handler.ts:576-586 (no-store required after a prior cache-replay incident)","Request /.well-known/mcp → the header rule applies a cacheable directive to the SSE transport"],"poc":"Static: the /.well-known/* header rule (public,max-age=3600) fires on the incoming path before the rewrite, overriding the handler's no-store.","impact":"The MCP SSE transport reached via /.well-known/mcp can be CDN-cached and replayed across principals (the exact incident the handler's no-store was added to prevent), a per-principal transport-integrity risk.","remediation":["Add explicit no-store rules for /.well-known/mcp and /.well-known/mcp.json ahead of rule 235","Add a deploy-config test asserting no /.well-known/mcp* path carries a public/s-maxage directive"],"status":"code-verified"},{"id":"V105","severity":"medium","title":"CMD+K layers:* presets toggle layers without ever fetching their data","component":"src/app/search-selection-dispatcher.ts:506-521/33-52","summary":"The layers:* preset writes mapLayers + setLayers but never calls applyMapLayerChange (which runs loadDataForLayer/initAisStream/stopLayerActivity) or syncUrlState, so layers render checked-but-empty and AIS/satellite loops leak.","cvss":"N/A — correctness / resource leak (client)","cwe":"CWE-670","scope":"client","description":"search-selection-dispatcher.ts:506-521 writes ctx.mapLayers, saveToStorage, ctx.map.setLayers() and stops. It never calls applyMapLayerChange (the single place that runs loadDataForLayer, initAisStream, stopLayerActivity, dataFreshness.setEnabled) and never calls syncUrlState(). SearchSelectionDispatcherBindings (:33-52) has no applyLayerChange member, so it cannot be recovered downstream. DeckGLMap.setLayers (:6536-6561) renders but never emits onLayerChange. Every sibling path does it right (the singular layer: case, the mission preset, the agent path). Impact: 'Show intelligence layers' enables protests/ucdpEvents/displacement with no fetch; ais is enabled with no initAisStream(); layers:none leaves the AIS socket and satellite-propagation loop running. Recovery needs an unrelated loadAllData() trigger.","reproduce":["Read search-selection-dispatcher.ts:506-521 (no applyMapLayerChange/syncUrlState) and :33-52 (no applyLayerChange binding)","Run the CMD+K 'Show intelligence layers' preset","Observe layers checked but empty; run layers:none and observe the AIS socket / satellite loop still running"],"poc":"Static: the preset mutates layer state and renders but never triggers data loading or teardown, unlike every sibling layer path.","impact":"CMD+K layer presets show enabled-but-empty layers (no data fetched) and leak the AIS websocket and satellite-propagation loop on 'none', degrading correctness and client resource usage.","remediation":["Route the preset through applyMapLayerChange (which handles fetch + teardown) and call syncUrlState()","Add an applyLayerChange binding; add a test asserting a preset fetches data and tears down on none"],"status":"code-verified"},{"id":"V106","severity":"medium","title":"fuelShortages map layer has no fetch path; its drain-once memo is permanently poisoned","component":"src/shared/fuel-shortage-registry-store.ts:32-41 · src/app/data-loader.ts · config/panels.ts:1084/1145","summary":"The registry sets drained=true on first read with no retry, but there is no loadDataForLayer/hydration task for the default-on fuel-shortages layer, so the memo is drained before the SLOW-tier bootstrap arrives and the pins layer is never created.","cvss":"N/A — correctness (client feature dead)","cwe":"CWE-665 (Improper Initialization)","scope":"client","description":"fuel-shortage-registry-store.ts:32-41 sets drained=true on the first call with NO retry. data-loader.ts has no loadDataForLayer case, no runLoadAllData hydration task, and App.ts:3907-3908 registers no {refresh:true} lane for it. Both siblings (ensurePipelineRegistriesHydrated, ensureStorageFacilityRegistryHydrated) have all four, each documenting 'Map layers and deferred panels must not depend on each other to populate this store.' The key is a SLOW-tier bootstrap key fetched after the next paint, so the memo is drained BEFORE hydration lands → DeckGLMap.ts:2759-2761 `if(rawEntries.length===0) return null` → the pins layer is never created, and no later call re-reads the slot. The layer is default-on for the energy monitor (config/panels.ts:1084,1145).","reproduce":["Read fuel-shortage-registry-store.ts:32-41 (drain-once, no retry) and confirm no loadDataForLayer/hydration task in data-loader.ts","Load the energy monitor (fuel-shortages default-on)","Observe the fuel-shortages pins layer never appears (drained before the SLOW bootstrap arrives)"],"poc":"Static: drain-once memo + no hydration task for a default-on layer = the layer reads empty and is never re-populated.","impact":"The default-on fuel-shortages map layer silently never renders on the energy monitor (unless its panel is separately mounted), a dead client feature.","remediation":["Add a loadDataForLayer case + a hydration task (mirror the pipeline/storage-facility registries) and allow the memo to retry","Add a test asserting the fuel-shortages layer populates after the SLOW bootstrap"],"status":"code-verified"},{"id":"V107","severity":"medium","title":"Five Promise.all sites in data-loader.ts discard a successful sibling on one rejection","component":"src/app/data-loader.ts:4039-4042/3534-3537/4755-4758/2793-2808/1301","summary":"Promise.all pairs mean a vessel-only failure discards the fulfilled military-flights data and misattributes the error to OpenSky, blanking the layer in the map, Insights panel and every open country brief.","cvss":"N/A — availability / correctness (client)","cwe":"CWE-703","scope":"client","description":"Worst: data-loader.ts:4039-4042 (and the duplicate at :3534-3537) `const [flightData,vesselData] = await Promise.all([fetchMilitaryFlights(),…fetchMilitaryVessels()])`. A vessel-only failure discards the fulfilled flightData, and the catch (:4081-4089) calls setLayerReady('military',false) and recordError('opensky',…) — blaming OpenSky for a vessel failure — never reaching setMilitaryFlights/ingestFlights/insightsPanel.setMilitaryFlights. Same shape at :4755-4758 (PizzInt+GDELT), :2793-2808 (drops three good token payloads when the fourth fails; paints 'retrying' on all four), :1301 (drops cable health on cable-activity failure). The file's dominant idiom is allSettled (loadNatural:3222, loadWeatherAlerts:3393, :4175, :4419, :4480). Five sites break it.","reproduce":["Read data-loader.ts:4039-4042 and the catch at :4081-4089 (blames opensky)","Fail only the vessel fetch","Observe military-flights blanked in the map, Insights panel and open country briefs, with the error attributed to OpenSky"],"poc":"Static: Promise.all discards a fulfilled sibling on any rejection and the catch misattributes the failure.","impact":"A degraded AIS/vessel feed blanks the military-flights layer everywhere it renders and points Data Freshness triage at the wrong pipeline — a correctness and operability regression under partial upstream failure.","remediation":["Use Promise.allSettled at the five sites (the file's dominant idiom) and handle each result independently","Attribute errors to the correct source","Add a test asserting a vessel failure does not blank military flights"],"status":"code-verified"},{"id":"V108","severity":"high","title":"alertRules.variant is an open per-user key feeding an unbounded cross-tenant .collect()","component":"convex/schema.ts:205-233 · convex/alertRules.ts:215-257/746-754 · convex/http.ts:1080-1103","summary":"variant is an open, length-unbounded string a user can write freely with no per-user row cap, and getByEnabled does a full cross-tenant .collect() that Convex aborts past its scan limit — so accumulated rows can make the relay read throw for every subscriber.","cvss":"N/A — availability / stored-growth DoS (auth-gated write)","cwe":"CWE-770 (Allocation of Resources Without Limits)","scope":"access-control","description":"convex/schema.ts:205-233: alertRules is keyed (userId, variant) with variant:v.string() (open, length-unbounded, not a closed enum) and eventTypes:v.array(v.string()) (uncapped). convex/alertRules.ts:215-220/256-257 (and :300/:324,:453/:493) — each of the three public mutations inserts a NEW row whenever (userId, variant) is unseen: no membership check, no length bound, no per-user row cap. alertRules.ts:746-754 getByEnabled does a full `.collect()` over by_enabled (spanning ALL tenants); :724-735 getDigestRules likewise. Reached from http.ts:1080,1100-1103. assertProEntitlement is evaluated per write only; nothing deletes rows when a subscription lapses. Convex THROWS (QueryScannedTooManyDocuments / TooManyBytesRead at 16 MiB) rather than truncating, so past the limit the relay read fails for every subscriber. The repo already wrote this diagnosis for another table (apiPlanLimitNotices.ts:508-512) and fixed it with an index-scoped read.","reproduce":["Read schema.ts:205-233 (variant:v.string(), no row cap) and alertRules.ts:215-257 (new row per unseen variant)","Read getByEnabled at :746-754 — full cross-tenant .collect()","Write many distinct variant values for a user (no cap enforced)","Observe by_enabled growth trending toward Convex's scan/byte limit, at which getByEnabled throws for all"],"poc":"Static: client-writable growth key + unbounded cross-tenant .collect() with no delete anywhere in convex/; the repo's own apiPlanLimitNotices comment describes this exact failure mode.","impact":"A client can grow the alertRules table via an open write key with no per-user cap; once by_enabled crosses Convex's per-query scan/byte limit, the notification relay's getByEnabled/getDigestRules throw — breaking alert delivery for EVERY subscriber, not just the abuser. In-repo callers already treat a getByEnabled failure as fatal.","remediation":["Constrain variant to the closed set (mirror preferenceVariant in userPreferences.ts:20), cap eventTypes.length, and enforce a per-user row cap","Delete rows when a subscription lapses","Convert both readers to .paginate(...) (as broadcast/metrics.ts:133-152 does)","Add a test asserting an unbounded variant write is rejected and getByEnabled is paginated"],"status":"code-verified"},{"id":"V59","severity":"critical","title":"Unauthenticated exposure of Pro-gated datasets via the public bootstrap tier","component":"GET /api/bootstrap?tier=slow&public=1 · api/_bootstrap-public-payload.js · api/bootstrap.js · api/_bootstrap-tier-keys.js","summary":"One unauthenticated request returns Pro-gated OFAC sanctions + national-debt data — confirmed LIVE on production.","cvss":"7.5 (High) — CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N · business-critical data class","cwe":"CWE-306 (Missing Authentication for Critical Function)","scope":"access-control","description":"The bootstrap endpoint serves a 'slow' data tier to anonymous callers via ?tier=slow&public=1, and this public classification is evaluated BEFORE the API-key check runs, so the request never reaches authentication. The public-path sanitizer (sanitizeBootstrapValue()) has explicit cases for several keys but NO case for two Pro-gated keys — sanctionsPressure (sanctions:pressure:v1) and nationalDebt (economic:national-debt:v1) — so execution falls through to `return value` and both datasets are emitted unchanged. The same datasets are correctly gated (HTTP 401) on their dedicated API routes; only the bootstrap public tier bypasses the control (invariant drift / unaudited path).","reproduce":["As an unauthenticated client with a normal browser User-Agent, request: GET https://www.worldmonitor.app/api/bootstrap?tier=slow&public=1","Observe HTTP 200 with a JSON body whose top-level keys include sanctionsPressure and nationalDebt","Control: request GET /api/economic/v1/get-national-debt and GET /api/sanctions/v1/list-sanctions-pressure → both return HTTP 401 'API key required'","The 200-vs-401 difference confirms the gate exists on the API routes and is bypassed on the bootstrap public tier"],"poc":"Unauthenticated GET returned sanctionsPressure (totalCount 25,695 · sdnCount 19,577 · consolidatedCount 1,058 · semaCount 5,703 · vesselCount 1,940 — the OFAC SDN/consolidated/SEMA dataset) and nationalDebt (per-country debt/GDP/growth series). Single read-only GET; no data written or modified. Exact captured response withheld here — responsibly disclosed to the maintainer per the project's coordinated-disclosure policy.","impact":"A paid intelligence product (OFAC sanctions + sovereign national-debt data) is freely harvestable by any anonymous caller. The response carries Access-Control-Allow-Origin: * and is CDN-cacheable (s-maxage=7200), so any third-party page can scrape it and the leak is amplified at the edge. Consequences: loss of a monetised dataset, exposure of regulated/sanctions-relevant intelligence, and reputational/compliance risk.","remediation":["Add sanctionsPressure and nationalDebt cases to sanitizeBootstrapValue() (blank them on the public path) and its twin scripts/_bootstrap-public-payload.mjs","Broaden the fix so every tier-gated key is sanitized-by-default on the public tier rather than enumerating exceptions","Add a structural/regression test asserting no tier-gated handler seed key ever appears in bootstrapTierKeyNames('fast'|'slow')","Run the public bootstrap payload through the same entitlement classification the RPC gateway uses so the two paths cannot drift again"],"status":"confirmed-live"},{"id":"DEV-1","severity":"medium","title":"SSRF allowlist bypass via redirect in the dev RSS proxy","component":"vite.config.ts:807 (rss-proxy dev middleware) — dev-only","summary":"Dev RSS proxy checks the allowlist once then follows redirects off-allowlist, unauthenticated (dev server only).","cvss":"6.5 (Medium) — dev-only","cwe":"CWE-918 (Server-Side Request Forgery)","scope":"api","description":"The Vite dev-server rss-proxy middleware validates the initial hostname against the RSS allowlist, then calls fetch() with redirect:'follow' — every subsequent 3xx hop is followed without re-checking the allowlist, unauthenticated and unthrottled. The production handler api/rss-proxy.js does this correctly (redirect:'manual' + assertAllowedRedirect() per hop).","reproduce":["Run the Vite dev server (localhost:3000)","GET /api/rss-proxy?url=https://feeds.marketwatch.com/ (an allowlisted host that 301s off-allowlist)","Observe content from the non-allowlisted redirect target returned through the proxy","Direct request to the disallowed host is refused (403), proving the redirect path is the bypass"],"poc":"Allowlisted feeds.marketwatch.com redirected to a non-allowlisted host and the proxy returned ~921 KB of that host's content; direct requests to the same host return 403. Local dev server only.","impact":"On a developer/CI machine, an attacker-chosen allowlisted host plus attacker-followable redirects can reach internal-only services, adjacent hosts, or cloud metadata — an unauthenticated SSRF/open-proxy surface. Dev-only; does not exist on the production edge.","remediation":["Mirror api/rss-proxy.js: redirect:'manual', re-validate protocol + allowlist on every Location hop, cap hops","Better: route dev traffic through the single shared production handler","Add a regression test asserting a redirect to a non-allowlisted host is refused"],"status":"dev-only"},{"id":"DEV-2","severity":"medium","title":"Dev sebuf plugin executes RPC handlers with no gateway auth/entitlement/rate-limit","component":"vite.config.ts:744 (sebufApiPlugin) — dev-only","summary":"Dev sebuf middleware calls handlers directly after only a CORS check, skipping the gateway's auth, entitlement and rate-limit (dev server only).","cvss":"6.5 (Medium) — dev-only","cwe":"CWE-306 (Missing Authentication for Critical Function)","scope":"api","description":"In production, authentication (validateApiKey), Pro-tier entitlement checks, rate limiting and telemetry all run in one place — the edge gateway (server/gateway.ts). The dev plugin rebuilds the route table and calls matchedHandler(webRequest) directly, performing only a CORS origin check, so tier-gated handlers execute fully unauthenticated on the dev server.","reproduce":["Run the Vite dev server","GET a tier-gated route unauthenticated, e.g. /api/economic/v1/list-global-tenders?limit=5","Observe 200 (handler executed) where production returns 401/403"],"poc":"On dev, tier-gated routes returned 200 unauthenticated (e.g. get-insider-transactions, list-stored-stock-backtests, list-global-tenders); the same routes are 401 in production. Local dev server only.","impact":"Anyone reachable of a dev server can invoke every RPC handler credential-free — including per-user premium stores queried with no user identity, and metered upstreams that spend the operator's budgets. Dev-only.","remediation":["Route dev sebuf traffic through server/gateway.ts","Or replicate the pipeline order: CORS → validateApiKey → checkEntitlementDetailed → rate limit → handler","CI test: a tier-gated route via the dev server unauthenticated must return 401/403, never 200"],"status":"dev-only"},{"id":"DEV-3","severity":"low","title":"Dev proxies omit the production auth + rate-limit gate","component":"vite.config.ts (rss-proxy et al.) — dev-only","summary":"Dev proxy middleware has no validateApiKey/checkRateLimit; unauthenticated, unthrottled surface on the dev server.","cvss":"N/A — dev-only defense-in-depth gap","cwe":"CWE-306","scope":"api","description":"The dev rss-proxy (and sibling dev proxies) contain zero occurrences of validateApiKey/checkRateLimit, which are present in the production handlers. There is no rate limiting anywhere on the dev server.","reproduce":["Run the Vite dev server","GET /api/rss-proxy?url=https://news.google.com/rss with no credential → 200 XML","Issue rapid repeated requests → no 429"],"poc":"60/60 rapid requests to dev proxy endpoints returned 200 (0×429); production requires an API key (401). Local dev server only.","impact":"Unauthenticated, unthrottled proxy surface on the dev server. Dev-only.","remediation":["Share the production gate, or bind the dev server to 127.0.0.1 by default and document it as local-only"],"status":"dev-only"},{"id":"CR-1","severity":"medium","title":"JMESPath projection computes full amplified output before the size gate (DoS)","component":"server/_shared/response-projection.ts:93,105,110 · api/mcp/jmespath.ts","summary":"A JMESPath expression is executed and stringified before the 256 KB output limit is checked — CPU/memory amplification.","cvss":"N/A — DoS / robustness (DoS out of scope per SECURITY.md)","cwe":"CWE-400 (Uncontrolled Resource Consumption)","scope":"dos","description":"projectJsonResponse gates the expression byte-length (≤1024), then runs jmespath.search(value, expr), then JSON.stringify(projected), and only then enforces the 256 KB output cap. A small expression producing a large fan-out (e.g. multiselect-hash over a large input array) does the full search + serialize work before rejection.","reproduce":["Read server/_shared/response-projection.ts:66-110 — expr gate at :68, search at :93, stringify at :105, output gate at :110","Locally, a 511-byte expression over a 4,000-leaf input produced ~1.93 MB before the gate"],"poc":"Local reproduction with the repo's own jmespath dependency: 511-byte expr → 1,929,681 bytes materialised in ~23 ms; the 256 KB cap only rejects after the projection is built and stringified.","impact":"CPU/memory amplification per request. Bounded by expression complexity × input size; classed as hardening because SECURITY.md lists DoS out of scope.","remediation":["Bound the projection during evaluation, or estimate output size before stringify","Add a codegen/unit test asserting large fan-out is rejected before full materialisation"],"status":"code-verified"},{"id":"CR-2","severity":"medium","title":"PRO widget loads an unpinned, no-SRI chart.js from a CDN (supply chain)","component":"src/utils/widget-sanitizer.ts:90 (meta CSP) · :205 (sandbox)","summary":"Widget iframe pulls floating chart.js@4 from jsdelivr with no integrity hash — supply-chain risk (form-exfil claim mitigated by sandbox).","cvss":"N/A — supply-chain / hardening","cwe":"CWE-829 (Inclusion of Functionality from Untrusted Control Sphere)","scope":"client","description":"The Pro-widget document loads 003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js\"> — a floating major range with no integrity attribute. The meta CSP also lacks form-action/base-uri/object-src. The iframe is sandbox=\"allow-scripts\" only (no allow-forms, no allow-same-origin), so the form-exfiltration scenario is NOT exploitable and a compromised script runs in an opaque origin with connect-src locked to jsdelivr.","reproduce":["Read src/utils/widget-sanitizer.ts:85-91 (meta CSP) and :205 (iframe sandbox attribute)"],"poc":"CSP at :89 omits form-action/base-uri/object-src; floating no-SRI script at :90; sandbox='allow-scripts' at :205 (no allow-forms). The only genuine residual is the unpinned/no-SRI CDN script.","impact":"If the pinned-by-range chart.js file is ever compromised or replaced, arbitrary JS runs inside the (sandboxed, opaque-origin) widget. Contained by the sandbox and connect-src, but pin+SRI is the correct hardening.","remediation":["Pin an exact chart.js version and add an integrity (SRI) attribute, or self-host the file","Add form-action/base-uri/object-src to the widget meta CSP for defense in depth"],"status":"code-verified"},{"id":"CR-3","severity":"low","title":"Webhook validator has no destination-port restriction; registration and delivery use different DNS resolvers","component":"api/_notification-webhook-ssrf.ts:170 · shipping/v2/webhook-shared.ts:53 · deliver-webhook.ts:71","summary":"Webhook URL validation checks scheme/host/private-IP but not the port; registration resolves via Cloudflare DoH while delivery uses node:dns (TOCTOU window).","cvss":"N/A — auth-gated hardening","cwe":"CWE-918 (SSRF)","scope":"api","description":"blockedNotificationWebhookUrlReason() validates protocol (https), metadata hostnames and private/reserved addresses, but performs no parsed.port check, and the registration-time resolver (Cloudflare DoH) differs from the delivery-time resolver (node:dns lookup), leaving a DNS-rebinding window. Authenticated (webhook registration requires a user/key).","reproduce":["Read api/_notification-webhook-ssrf.ts:170-199 — scheme/host/private-IP checks, no parsed.port","Compare registration DoH (webhook-shared.ts:37) vs delivery node:dns (deliver-webhook.ts:115-116)"],"poc":"Source-level: no port check present; the two resolvers differ. Auth-gated, so not remotely exploitable without a valid session.","impact":"An authorized user could register a webhook to a non-standard port on a public host, and the DNS-authority split creates a rebinding window. Low, auth-gated.","remediation":["Add a destination-port allowlist (443 only) to the validator","Use one pinned resolver for both registration and delivery, or socket-pin the resolved address"],"status":"code-verified"},{"id":"CR-4","severity":"info","title":"Internal-MCP body size cap is enforced after full buffering","component":"server/gateway.ts:1316-1336","summary":"A Content-Length pre-check is advisory; a chunked/lying body is fully buffered via arrayBuffer() before the byte cap rejects it.","cvss":"N/A — informational","cwe":"CWE-400","scope":"api","description":"The gateway pre-checks Content-Length (advisory), then does await request.clone().arrayBuffer(), then applies the post-buffer cap. A chunked request with no/incorrect Content-Length is fully buffered before rejection. Vercel's 4.5 MB request limit bounds practical impact.","reproduce":["Read server/gateway.ts:1316 (CL pre-check) → :1325 (arrayBuffer) → :1330 (byte cap)"],"poc":"Source-level: the comment says 'cap inbound body BEFORE buffering', but a chunked body reaches the buffering step first.","impact":"Bounded memory pressure on internal-MCP POSTs; capped by the platform's 4.5 MB request limit. Informational.","remediation":["Stream and count bytes with an early abort, rather than buffering then checking length"],"status":"code-verified"},{"id":"CR-5","severity":"info","title":"CORS denial responses echo an arbitrary Origin with Allow-Credentials: true","component":"api/_cors.js:166 (getOriginDeniedCorsHeaders)","summary":"Refusal responses reflect the request Origin + ACAC:true so clients can read the refusal; data responses use the fixed origin — intentional (#6411), not exploitable.","cvss":"N/A — informational (intentional trade-off)","cwe":"CWE-942 (Permissive Cross-domain Policy)","scope":"comms","description":"getOriginDeniedCorsHeaders sets Access-Control-Allow-Origin = request origin and Allow-Credentials: true — but ONLY on denial responses, whose bodies carry no data. The success path falls back to the fixed https://worldmonitor.app origin. Combined with SameSite=Lax cookies (not sent cross-site) and data-free denial bodies, there is no cross-origin read. Documented as intentional (#6411).","reproduce":["Send a hostile Origin to a credentialed endpoint → 403 body {\"error\":\"Origin not allowed\"} with ACAO:003cthat origin>","Send the allowed Origin → 200 aming them.","cvss":"N/A — auth-gated (requires RELAY_SHARED_SECRET)","cwe":"CWE-284 (Improper Access Control)","scope":"access-control","description":"For explicit keys, the handler checks isBlocklisted(k) but not isDurableData(k); the pattern/scan path checks both. So a caller with the purge secret can delete a durable-data key (military:bases:, conflict:iran-events:, conflict:ucdp-events:) by specifying it explicitly, bypassing the guard the scan path enforces.","reproduce":["Read api/cache-purge.js: explicit loop :127-133 (only isBlocklisted) vs scan loop :135-147 (adds isDurableData)","Authorized dry-run with {\"keys\":[\"military:bases:local-test\"],\"dryRun\":true} lists the protected key; the pattern dry-run excludes it"],"poc":"Source-level + dry-run comparison: explicit path includes a protected durable key that the pattern path omits. Auth-gated behind RELAY_SHARED_SECRET.","impact":"A caller holding the purge secret can delete a protected cached dataset until its producer recreates it. Auth-gated, Low.","remediation":["Add isDurableData(k) to the explicit-keys loop before allKeys.add(k)","Add a test covering protected keys through both explicit and pattern paths"],"status":"code-verified"},{"id":"CR-8","severity":"info","title":"Protocol-relative URLs (//evil.com) pass the URL sanitizers (link injection)","component":"src/utils/sanitize.ts:93 · src/utils/dom-utils.ts:131","summary":"//evil.com matches the relative-prefix rule and resolves to https://evil.com/ — link-injection/phishing only, no script execution.","cvss":"N/A — informational","cwe":"CWE-601 (Open Redirect / URL Redirection)","scope":"client","description":"sanitize.ts:93 uses /^(\\/|\\.\\/|\\.\\.\\/|\\?|#)/ which matches //evil.com (starts with /); new URL('//evil.com', base) resolves to https://evil.com/ and passes the protocol allowlist. dom-utils.ts:131 keeps an href that startsWith('/'), which //evil.com does. javascript: variants are correctly rejected.","reproduce":["Read src/utils/sanitize.ts:85-100 and src/utils/dom-utils.ts:125-140"],"poc":"Source-level: //evil.com passes both sanitizers and resolves to an external origin; no script execution possible.","impact":"A crafted protocol-relative link could redirect a user off-site (phishing). No script execution. Informational.","remediation":["Reject leading // in the relative-URL branch, or resolve then re-check the host against an allowlist"],"status":"code-verified"},{"id":"CR-9","severity":"info","title":"Enterprise-key parsing inconsistent: three parsers, two behaviours","component":"server/_shared/embed-entitlement.ts:51 vs CR-6 sites","summary":"parseEnterpriseApiKeys trims entries while the api-key/oauth parsers do not — same root as CR-6, fail-closed.","cvss":"N/A — informational","cwe":"CWE-1078","scope":"auth","description":"parseEnterpriseApiKeys (embed-entitlement.ts:51) does split(',').map(k => k.trim()).filter(Boolean), while api/_api-key.js:23 and api/_oauth-token.js:85,95 do not trim. Three parsers, two behaviours; fail-closed on the main path (no privilege escalation).","reproduce":["Read server/_shared/embed-entitlement.ts:51 (trims) vs api/_api-key.js:23 (no trim)"],"poc":"Source-level divergence between the three key parsers.","impact":"Operational inconsistency, no escalation. Informational.","remediation":["Consolidate to one shared, trimming key parser"],"status":"code-verified"},{"id":"N1","severity":"low","title":"GlobeMap tooltip interpolates severity raw on two sinks (missing esc)","component":"src/components/GlobeMap.ts:1545, :1556 (sink :1717)","summary":"Outage and cyber tooltips use ${d.severity.toUpperCase()} raw into trustedHtml while every sibling wraps it in esc() — defense-in-depth XSS gap.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79 (Cross-site Scripting)","scope":"client","description":"Lines 1545 (outage) and 1556 (cyber) interpolate ${d.severity.toUpperCase()} without esc(), while sibling branches (:1532,:1541,:1653,:1664) escape it. The value flows into setTrustedHtml(trustedHtml(...)) at :1717 (raw innerHTML). d.severity is a network/seeder-sourced string.","reproduce":["Read src/components/GlobeMap.ts:1545 and :1556 vs the esc()-wrapped siblings; sink at :1717"],"poc":"Source-level: two raw interpolations of a network-sourced string into a trusted-HTML sink.","impact":"If a compromised/malformed upstream feed supplies markup in severity, it renders in the dashboard origin (defense-in-depth XSS). Low; requires upstream compromise.","remediation":["Wrap both in esc(): esc(d.severity.toUpperCase())"],"status":"code-verified"},{"id":"N2","severity":"low","title":"Flight heading flows into a style attribute with no numeric coercion","component":"src/components/GlobeMap.ts:1099","summary":"const heading = d.heading ?? 0 (nullish only) → style=\"transform:rotate(${heading}deg)\" inside trustedHtml — a string breaks the attribute.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79","scope":"client","description":"?? guards only null/undefined, not type; if the server delivers heading as a string, it is interpolated verbatim into a style attribute inside trustedHtml. A value containing a quote or semicolon breaks out of the attribute.","reproduce":["Read src/components/GlobeMap.ts:1095-1104"],"poc":"Source-level: no Number()/clamp on heading before it enters the style attribute.","impact":"Attribute-injection / defense-in-depth XSS if a compromised flight feed supplies a non-numeric heading. Low.","remediation":["Coerce and clamp: Number(d.heading) || 0, clamped to 0-359"],"status":"code-verified"},{"id":"N3","severity":"low","title":"Aviation-news caches an empty success for 15 minutes on total outage","component":"server/worldmonitor/aviation/v1/list-aviation-news.ts:110-118, :165","summary":"fetchFeed swallows all failures to []; the fixed-key cache stores {items:[]} for 15 min and reports source:'rss' (looks healthy).","cvss":"N/A — availability / robustness","cwe":"CWE-544 (Missing Standardized andler omits no-store, its per-principal body could take a shared tier + CDN cache. Low/conditional.","remediation":["OR internalMcpVerified into isPrivateResponse and the CDN gate, or fix the comment and audit every internal-MCP GET for handler no-store"],"status":"code-verified"},{"id":"N5","severity":"low","title":"Health endpoint blind spots (presence-only cascades, unregistered keys)","component":"api/health.js (multiple)","summary":"Cascade checks test presence not freshness, several served keys aren't registered in the sweep, and fallbacks carry no clock — health can under-report staleness.","cvss":"N/A — monitoring / robustness","cwe":"CWE-754 (Improper Check for Unusual Conditions)","scope":"infra","description":"The orphan sweep covers only BOOTSTRAP_KEYS + STANDALONE_KEYS (several served keys are absent); isCascadeCovered checks presence only and buckets fallbacks as ok with no clock; ~21 names are presence-only with an empty readSeedMeta. Net: a seeder that publishes an empty-but-successful run or fails with only state:ERROR can read as healthy.","reproduce":["Read api/health.js sweep (:5208-5212), isCascadeCovered (:3020-3031), and the presence-only meta reads (:2738-2739)"],"poc":"Source-level pattern: presence-only checks + unregistered served keys.","impact":"Operator dashboard can show a country/dataset as healthy during a real source outage. Monitoring gap.","remediation":["Register every served key, gate cascades on freshness, default unknown-age to WARN, never CDN-cache missing[] tiers"],"status":"code-verified"},{"id":"N6","severity":"low","title":"Seeder fleet gaps (lock atomicity, exit-0 on fatal, raw key interpolation)","component":"scripts/_seed-utils.mjs · seed-ucdp-events.mjs:411 · ais-relay.cjs:11951","summary":"Env-file fallback on typo, exit(0) on fatal (green on failure), api_key interpolated without encoding, and single SET NX PX locks without renewal.","cvss":"N/A — robustness / hardening","cwe":"CWE-667 (Improper Locking)","scope":"infra","description":"Cross-cutting seeder robustness issues: WM_SEED_ENV_FILE set-but-missing falls back to the checkout .env.local; some seeders process.exit(0) on fatal (reports green to the bundle runner); ais-relay interpolates api_key into a URL without encodeURIComponent; distributed locks use a single SET NX PX with no heartbeat/renewal.","reproduce":["Read scripts/_seed-utils.mjs:353-362, seed-ucdp-events.mjs:408-414, ais-relay.cjs:11951, and the SET NX PX lock sites"],"poc":"Source-level: multiple robustness gaps; some are intentional-by-comment (cron exit-0).","impact":"Silent seed failures reported as success, mis-encoded keys, and non-renewing locks — data-freshness and reliability risk. Robustness.","remediation":["Exit non-zero (or 75/GRACEFUL_FAIL) on fatal; encodeURIComponent for URL params; add lock heartbeat/fencing; fail hard on a missing env file"],"status":"code-verified"},{"id":"N7","severity":"info","title":"urlState.LAYER_KEYS drops 20 map layers from shareable URLs","component":"src/utils/urlState.ts:4","summary":"LAYER_KEYS is a hand-maintained array; TypeScript enforces validity but not completeness, so new layers silently drop out of shared URL state.","cvss":"N/A — informational / UX","cwe":"CWE-1188 (Insecure Default)","scope":"client","description":"LAYER_KEYS is a manually maintained (keyof MapLayers)[]. The compiler checks each entry is a valid key but not that the list is complete, so ~20 layers (dayNight, radiationWatch, stockExchanges, ...) are omitted and never serialized into shareable URLs.","reproduce":["Read src/utils/urlState.ts:4 vs the MapLayers interface"],"poc":"Source-level: 20 MapLayers keys are absent from LAYER_KEYS.","impact":"Share links silently drop those layer toggles. UX/completeness. Informational.","remediation":["Derive the key list from MapLayers at runtime (or add an exhaustiveness check)"],"status":"code-verified"},{"id":"N8","severity":"low","title":"HormuzPanel status badge interpolates status raw into unsafeRawHtml","component":"src/components/HormuzPanel.ts:256, :266 · src/services/hormuz-tracker.ts:31","summary":"${d.status.toUpperCase()} is interpolated raw into unsafeRawHtml while the sibling date field is escaped; status comes from a bare `as` cast with no runtime validation.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79","scope":"client","description":"The strait-status badge at :256 interpolates d.status raw; the assembled html is written via unsafeRawHtml at :266. The sibling d.updatedDate at :250 is escapeHtml()-wrapped. HormuzTrackerData.status is declared as a union but produced by (await resp.json()) as HormuzTrackerData (bare assertion, no runtime validation), so at runtime it is whatever the endpoint returns.","reproduce":["Read src/components/HormuzPanel.ts:256 (raw) and :250 (escaped sibling); src/services/hormuz-tracker.ts:31 (bare `as` cast)"],"poc":"Source-level: raw network-sourced string into a raw-HTML sink; same class as N1 in a different component.","impact":"If the /api/supply-chain/hormuz-tracker response is tampered/malformed, markup in status renders in the app origin (defense-in-depth XSS). Low.","remediation":["Wrap in escapeHtml(d.status.toUpperCase()); validate status against its union at the fetch boundary instead of a bare `as` cast"],"status":"code-verified"},{"id":"N9","severity":"medium","title":"AgentSkills import: no HTTPS enforcement + protocol-agnostic cache key (cross-scheme collision)","component":"api/skills/fetch-agentskills.ts:107, :126 · UI src/services/preferences-content.ts:633","summary":"Query-less http:// and https:// agentskills.io URLs collide on one cache key; HTTP is accepted end-to-end (poisoning needs an on-path MITM).","cvss":"5.x (Medium) — on-path MITM precondition","cwe":"CWE-319 (Cleartext Transmission) / CWE-524","scope":"api","description":"The AgentSkills fetch handler checks only skillUrl.hostname (no protocol === 'https:' check), and the cache key agentskills:v1:${hostname}${pathname} omits the scheme and port. So http://agentskills.io/skills/x and https://agentskills.io/skills/x (no query) share one 1-hour cache entry, and HTTP is accepted. The UI validation also checks hostname only. redirect:'manual' rejects a normal HTTP→HTTPS redirect, so poisoning requires an on-path MITM of the edge→agentskills.io HTTP leg.","reproduce":["Read api/skills/fetch-agentskills.ts:107 (hostname-only) and :126 (scheme/port-less key); UI preferences-content.ts:633","Submit http://agentskills.io/skills/x and https://agentskills.io/skills/x (no query) → same cache key"],"poc":"Source-level: no protocol gate anywhere in the handler; CACHE_TTL_SECONDS=3600; both schemes map to one key.","impact":"An on-path attacker who can forge the HTTP 200 response could cache attacker-controlled skill instructions, later served to HTTPS importers; the payload is stored as systemPromptAppend for the LLM. Medium, conditioned on network position.","remediation":["Reject every non-HTTPS URL in the handler before the cache lookup; mirror the check in the UI","Include the scheme (and port) in the cache key; consider invalidating the agentskills:v1: namespace on deploy"],"status":"code-verified"}];

  t.addEventListener('click',()=>{const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const n=cur==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('wm-theme',n)}catch(e){}});})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

FINDINGS.sort((a,b)=>{const d=SEV.indexOf(a.severity)-SEV.indexOf(b.severity);if(d)return d;return String(a.id).localeCompare(String(b.id),undefined,{numeric:true});});

function renderStats(){const c={};SEV.forEach(s=>c[s]=FINDINGS.filter(f=>f.severity===s).length);
  document.getElementById('stats').innerHTML=
    `<span class="stat"><b>${FINDINGS.length}</b> total</span>`+
    SEV.map(s=>`<span class="stat ${s.slice(0,4)}"><b>${c[s]}</b> ${SEVLABEL[s]}</span>`).join('');}

function renderChips(){const box=document.getElementById('chips');
  box.innerHTML=SEV.map(s=>`<button class="chip c-${s.slice(0,4)}" data-sev="${s}" aria-pressed="false">${SEVLABEL[s]}</button>`).join('');
  box.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{const s=ch.dataset.sev;
    if(active.has(s)){active.delete(s);ch.setAttribute('aria-pressed','false');}else{active.add(s);ch.setAttribute('aria-pressed','true');}renderList();}));}

function matches(f){if(active.size&&!active.has(f.severity))return false;if(!query)return true;
  return (f.id+' '+f.title+' '+(f.component||'')+' '+(f.summary||'')+' '+(f.scope||'')).toLowerCase().includes(query);}

function renderList(){const items=FINDINGS.filter(matches);const list=document.getElementById('list');
  document.getElementById('count').textContent=items.length+' of '+FINDINGS.length+' shown';
  if(!items.length){list.innerHTML='<div class="empty">No findings match your filters.</div>';return;}
  list.innerHTML=items.map(f=>{const live=f.status==='confirmed-live'?' · LIVE':'';
    return `<button class="row sev-${f.severity}" role="option" data-id="${esc(f.id)}" aria-current="${f.id===currentId}">
      <span class="stripe"></span>
      <span class="main"><span class="rid">${esc(f.id)}${live}</span><span class="rtitle">${esc(f.title)}</span></span>
      <span class="badge"><span class="sevmini sev-${f.severity}">${SEVLABEL[f.severity]}</span></span>
    </button>`;}).join('');
  list.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>select(r.dataset.id)));}

function select(id){const f=FINDINGS.find(x=>x.id===id);if(!f)return;currentId=id;
  document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-current',String(r.dataset.id===id)));
  const meta=[['Affected component',f.component],['Severity',f.cvss],['CWE',f.cwe],['Scope',f.scope],['Status',f.status]]
    .filter(m=>m[1]).map(m=>`<div class="m"><div class="k">${m[0]}</div><div class="v">${esc(m[1])}</div></div>`).join('');
  const steps=Array.isArray(f.reproduce)&&f.reproduce.length?`<ol class="steps">${f.reproduce.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';
  const fixes=Array.isArray(f.remediation)&&f.remediation.length?`<ul class="fixes">${f.remediation.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
  const gated=f.status==='confirmed-live';
  const live=gated?'<span class="livetag">CONFIRMED LIVE</span>':'';
  document.getElementById('detail').innerHTML=`<div class="detail-inner">
    <button class="back" id="back">← All findings</button>
    <div class="dhead"><span class="did">${esc(f.id)}</span><span class="sevpill sev-${f.severity}">${SEVLABEL[f.severity]}</span>${live}</div>
    <h1 class="dtitle">${esc(f.title)}</h1>
    <div class="metagrid">${meta}</div>
    ${f.description?`<div class="sec"><h3>Description</h3><p>${esc(f.description)}</p></div>`:''}
    ${steps?`<div class="sec"><h3>Steps to reproduce</h3>${steps}</div>`:''}
    ${f.poc?`<div class="sec"><h3>Proof of concept</h3><div class="poc">${esc(f.poc)}</div>${gated?'<div class="disclose">Exact live payload withheld — responsibly disclosed to the maintainer under coordinated disclosure.</div>':''}</div>`:''}
    ${f.impact?`<div class="sec"><h3>Business impact</h3><div class="impactbox"><p>${esc(f.impact)}</p></div></div>`:''}
    ${fixes?`<div class="sec"><h3>Remediation</h3>${fixes}</div>`:''}
    <div class="psbar"><details><summary>Problem statement &amp; scope <span class="cv">NTRO · PS 26163</span></summary>
      <div class="pc"><p><b>Background.</b> World Monitor is a web/mobile platform for real-time monitoring, analytics and reporting, handling authentication, data visualization, API communication and role-based access control.</p>
      <h4>Scope</h4><ul><li>Authentication &amp; session management</li><li>Authorization &amp; access control</li><li>Input validation &amp; data handling</li><li>API security</li><li>Client-side security controls</li><li>Secure communication</li><li>Data storage &amp; privacy</li></ul>
      <h4>Constraints observed</h4><ul><li>Authorized systems only · read-only / GET verification</li><li>No production data modified</li><li>PoC-only exploitation · coordinated disclosure</li></ul></div></details></div>
  </div>`;
  document.body.classList.add('detail-open');
  const back=document.getElementById('back');if(back)back.addEventListener('click',()=>{document.body.classList.remove('detail-open');});
  document.getElementById('detail').scrollTop=0;
  if(history.replaceState)history.replaceState(null,'',location.pathname+location.search+'#'+id);
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderList();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('detail-open');});

renderStats();renderChips();renderList();
/* open at rest: deep-link, else the CRITICAL, else first */
const hashId=decodeURIComponent((location.hash||'').replace('#',''));
const initial=FINDINGS.find(f=>f.id===hashId)||FINDINGS.find(f=>f.severity==='critical')||FINDINGS[0];
if(initial)select(initial.id);
</script>
</body>
</html>
