ntains that literal is corrupted into a different HMAC key and every delivery 401s.","reproduce":["Read schema.ts:1184-1198 (unused index, no delete, plaintext userId) and registry.ts:160-164 (skip)","Confirm no query/delete for paymentReconciliationAttempts","Read resendWebhookHandler.ts:89 (unanchored replace) and :107-114 (uncapped loop)"],"poc":"Static: the table grows without bound, retains plaintext userId, is exempt from erasure; plus an unanchored whsec_ strip and uncapped signature loop.","impact":"Payment reconciliation rows accumulate forever with plaintext user identifiers and are excluded from account deletion (privacy/retention risk), and the webhook handler has a DoS-ish uncapped loop and a secret-corruption edge case.","remediation":["Prune on insert (mirror checkoutRateLimitAlarm.ts:219-229) and add a userId index so erasure can target it","Cap the svix-signature loop (MAX_SIGNATURE_CANDIDATES) and anchor the whsec_ strip (replace(/^whsec_/,''))","Add tests for retention, the loop cap, and the secret strip"],"status":"code-verified"},{"id":"V111","severity":"medium","title":"escapeHtml() used as a URL validator at 16 href sinks","component":"src/utils/sanitize.ts:32-35 · 16 components incl. SecurityAdvisoriesPanel.ts:169, MapPopup.ts:1874, HormuzPanel.ts:262","summary":"escapeHtml only escapes [&003c>\"'] and leaves javascript:/data: schemes intact, yet 16 href sinks use it as a URL validator; two siblings already do escapeHtml(sanitizeUrl(x)), and the repo ships sanitizeUrl for exactly this.","cvss":"N/A — client-side (XSS on unsafe-inline surfaces)","cwe":"CWE-79","scope":"client","description":"sanitize.ts:32-35 escapeHtml escapes only [&003c>\"']; a URL needs a protocol allowlist, not character escaping. escapeHtml('javascript:alert(1)') returns the string unchanged (contains none of those five chars). The repo ships sanitizeUrl() (:72-107) and uses it at 15+ sibling sites for the identical field. ripgrep found 16 href=\"${escapeHtml(...)}\" sinks; two already do it right (DiseaseOutbreaksPanel.ts:184, SocialVelocityPanel.ts:71 use escapeHtml(sanitizeUrl(x))) — the internal proof the bare form is an oversight. Same-file contradiction: MapPopup.ts:1874 emits href=\"${escapeHtml(apt.mitreUrl)}\" while :1707 uses sanitizeUrl for the same class. Unvalidated-API instances: SecurityAdvisoriesPanel.ts:169 (a.link from the advisories RPC), MapPopup.ts:1874 (apt.mitreUrl from a threat feed), HormuzPanel.ts:262 (d.attribution.url ← bare json cast), notifications-settings.ts:309 (channel.slackConfigurationUrl ← bare cast). Severity note: the shipped main-dashboard CSP has no unsafe-inline so javascript: does not execute there, but /api/brief/* ships script-src 'self' 'unsafe-inline' (vercel.json:597), so surfaces inheriting that policy execute it; stock-research-overlay.ts:210-212 says exactly this.","reproduce":["Read sanitize.ts:32-35 (escapeHtml) and the 16 href=\"${escapeHtml(...)}\" sinks","Note the two correct siblings (escapeHtml(sanitizeUrl(x))) and the MapPopup same-file contradiction","Supply a javascript:/data: URL via an unvalidated API-sourced link on an unsafe-inline surface"],"poc":"Runtime: escapeHtml('javascript:alert(1)') returns it unchanged; 16 href sinks rely on it as a URL validator.","impact":"On any surface inheriting the unsafe-inline CSP (e.g. /api/brief/*), an attacker-influenced link (advisory feed, threat feed, bare-cast attribution/Slack URL) can carry a javascript:/data: scheme and execute — client-side XSS; on the strict-CSP dashboard it degrades to link injection.","remediation":["Use sanitizeUrl() in all 16 href sinks, gated on a truthy result (the repo's own helper)","Add a lint rule rejecting escapeHtml( inside href=\"…\"","Validate the bare-cast API URLs at the fetch boundary"],"status":"code-verified"},{"id":"V112","severity":"medium","title":"CountryBriefPage.updateStock escapes its neighbour and emits the next token raw","component":"src/components/CountryBriefPage.ts:589-594 · src/app/country-intel.ts:525/836","summary":"parseFloat(weekChangePercent) is used only to pick the sign; the raw string is what's written into trustedHtml, and weekChangePercent is a runtime string from a bare-cast client — one field is both an HTML sink and a prompt-injection vector.","cvss":"N/A — client-side XSS + prompt injection","cwe":"CWE-79","scope":"client","description":"CountryBriefPage.ts:589-594 parseFloat(data.weekChangePercent) at :589 is used ONLY to pick the sign; the raw string is what gets written: setTrustedHtml(el, trustedHtml(`${arrow} ${escapeHtml(data.indexName)}: ${sign}${data.weekChangePercent}% (1W)`)). weekChangePercent is a string at runtime: country-intel.ts:525 `weekChangePercent: String(resp.weekChangePercent)`, and the generated client is a bare cast (service_client.ts:1085 `return await resp.json() as GetCountryStockIndexResponse`) with the proto declaring number. The sibling implementation of the identical method coerces: CountryDeepDivePanel.ts:2656 `const delta = Number.parseFloat(data.weekChangePercent)`, rendered via textContent. The same field is concatenated into the LLM prompt at country-intel.ts:836, so one field is both an HTML sink and a prompt-injection vector.","reproduce":["Read CountryBriefPage.ts:589-594 (raw weekChangePercent into trustedHtml) vs CountryDeepDivePanel.ts:2656 (coerced + textContent)","Supply a non-numeric weekChangePercent via a tampered/ malformed stock-index response","Observe it rendered raw in the brief and concatenated into the LLM prompt"],"poc":"Static: indexName is escaped but the adjacent weekChangePercent is emitted raw into trustedHtml, and it is a bare-cast runtime string.","impact":"A tampered/malformed stock-index response can inject markup into the country brief (client XSS on unsafe-inline surfaces) and inject instructions into the LLM prompt — a combined XSS + prompt-injection vector.","remediation":["Coerce with Number.parseFloat and render via textContent (mirror CountryDeepDivePanel.ts:2656); escape before any HTML sink","Validate weekChangePercent at the fetch boundary","Add a test with a non-numeric weekChangePercent"],"status":"code-verified"},{"id":"V113","severity":"low","title":"Three more missing-escaping sites, each with an escaped sibling in the same statement","component":"src/components/GlobeMap.ts:1704 · HormuzPanel.ts:41 · UcdpEventsPanel.ts:129/132","summary":"Numeric/text fields (resolutionM, data-val, lat/lon/date_start) are emitted raw next to esc()-wrapped siblings in the same template, the same class as N1/N2 in three more components.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79","scope":"client","description":"GlobeMap.ts:1704 `rp.push(`${d.resolutionM}m`)` while d.mode on line 1705 is esc()-wrapped, inside the same if block (the marker-label builder at :992 does coerce). HormuzPanel.ts:41 one template line, three data-* attributes: data-date and data-unit escaped, data-val=\"${p.value}\" raw (HormuzSeries.value typed number, never coerced). UcdpEventsPanel.ts:129/132 data-lat/data-lon/date_start raw while :127 escapes side_a/side_b two lines above; conflict/index.ts:85-101 passes latitude: proto.location?.latitude ?? 0 with no coercion.","reproduce":["Read GlobeMap.ts:1704/1705, HormuzPanel.ts:41, UcdpEventsPanel.ts:127/129/132","Supply non-numeric values for resolutionM/value/lat/lon via a tampered feed","Observe them emitted raw next to escaped siblings"],"poc":"Static: three components emit a network-sourced field raw adjacent to an esc()-wrapped sibling in the same statement.","impact":"On a compromised/malformed feed these raw interpolations are defense-in-depth XSS/attribute-injection gaps (same class as N1/N2), in three more components.","remediation":["esc()/Number()-coerce these fields (resolutionM, value, lat/lon/date_start) as their siblings do","Add a lint asserting no raw interpolation in trusted-HTML/attribute contexts"],"status":"code-verified"},{"id":"V114","severity":"low","title":"public-rpc-cache.ts and list-feed-digest.ts hold two hand-copied variant lists that disagree","component":"src/shared/public-rpc-cache.ts:18 · server/worldmonitor/news/v1/list-feed-digest.ts:125","summary":"NEWS_VARIANTS includes 'energy' while VALID_VARIANTS does not, so ?variant=energy&public=1 is marked anonymously CDN-storable but the handler falls back to 'full' and serves the full digest under the energy URL.","cvss":"N/A — cache-shape drift","cwe":"CWE-1041","scope":"api","description":"public-rpc-cache.ts:18 NEWS_VARIANTS = new Set(['full','tech','finance','happy','commodity','energy']); list-feed-digest.ts:125 VALID_VARIANTS = new Set(['full','tech','finance','happy','commodity']). ?variant=energy&lang=en&public=1 → the classifier marks it anonymously CDN-storable → the handler falls back to 'full' at :1991 and serves news:digest:v1:full:en under the energy URL. The file's own comment (public-rpc-cache.ts:19-21) states the hazard ('a hand-copied second list would let the handler and this public-shape classifier drift apart') — the variant list is exactly such a hand-copied second list.","reproduce":["Read public-rpc-cache.ts:18 (has energy) vs list-feed-digest.ts:125 (no energy)","Request ?variant=energy&public=1","Observe the full digest served under the energy URL, CDN-storable"],"poc":"Static: the two hand-copied variant lists disagree on 'energy', so the classifier and handler drift.","impact":"?variant=energy returns the full digest cached under the energy URL, a cache-shape/content-drift inconsistency (the exact hazard the file warns about).","remediation":["Derive both lists from one source of truth","Add a test asserting the classifier and handler variant sets are equal"],"status":"code-verified"},{"id":"V115","severity":"low","title":"hs4 and language/period build unvalidated raw (unprefixed) Redis keys","component":"server/worldmonitor/supply-chain/v1/_bilateral-hs4-lazy.ts:331/387 · research/v1/list-trending-repos.ts:26 · seed-research.mjs:316","summary":"hs4 (no proto pattern) and language/period (no validation) are concatenated into raw, unprefixed 24h Redis keys, and ?period=weekly reads a key no seeder writes, returning a success-shaped empty.","cvss":"N/A — input validation / key hygiene","cwe":"CWE-20","scope":"input","description":"get_country_products.proto:85 optional string hs4=2 has NO pattern/len/max_bytes, while the sibling iso2 on :78-83 carries pattern='^[A-Z]{2}$'. Only the global 64KiB ceiling applies (request-validator.ts:55). It flows into comtrade:bilateral-hs4-lazy-heading:{iso2}:{hs4}:v1 read/written with raw=true (_bilateral-hs4-lazy.ts:331/387, redis.ts:263) — a 24h-persisted unprefixed key. list_trending_repos.proto:16/18 language and period have zero validation, concatenated into a raw key at list-trending-repos.ts:26. And seed-research.mjs:316 hardcodes :daily: while the proto comment names weekly as valid — so ?period=weekly reads a key no seeder has ever written and returns 200 {repos:[]} (the success-shaped-empty class). Every sibling key builder validates its free component first.","reproduce":["Read get_country_products.proto:85 (no hs4 pattern) and _bilateral-hs4-lazy.ts:331/387 (raw unprefixed key)","Read list_trending_repos.proto:16/18 (no validation) and seed-research.mjs:316 (:daily: only)","Call with ?period=weekly → 200 {repos:[]} (key never written)"],"poc":"Static: hs4/language/period are unvalidated and build raw unprefixed keys; period=weekly reads an unseeded key.","impact":"Unvalidated free components build raw, unprefixed 24h Redis keys (collision/hygiene risk across deploys) and period=weekly silently returns empty — input-validation and key-hygiene gaps.","remediation":["Add proto validation (pattern/max_bytes) for hs4/language/period and prefix the keys with getKeyPrefix()","Align the seeder's period with the proto; add a test for weekly and for oversized hs4"],"status":"code-verified"},{"id":"V116","severity":"low","title":"Tauri sidecar silently clamps every TTL to 24h","component":"server/_shared/sidecar-cache.ts:11/84 · redis.ts:279","summary":"MAX_TTL_S=86400 clamps every ttlSeconds with no comment, so 40-day/90-day/7-day TTLs collapse to 24h on desktop while web passes them through — one function, one argument, two ceilings.","cvss":"N/A — desktop cache correctness","cwe":"CWE-682","scope":"storage","description":"sidecar-cache.ts:11/84 MAX_TTL_S=86400, applied as Math.max(MIN_TTL_S, Math.min(MAX_TTL_S, ttlSeconds)) with no comment explaining the clamp. redis.ts:279 passes the same ttlSeconds through verbatim as EX. One function, one argument name, two different ceilings. Victims: _bilateral-hs4-lazy.ts:53 SUCCESS_TTL=3456000 (40d→24h), infrastructure/v1/_shared.ts:10 BASELINE_TTL=7776000 (90d→24h), cache-keys.ts:65 STORY_TTL=604800 (7d→24h). Desktop-only, web unaffected — so it can never surface in staging.","reproduce":["Read sidecar-cache.ts:11/84 (clamp to 86400) vs redis.ts:279 (pass-through)","On a sidecar deployment, write a key with a 40-day TTL","Observe it expires in 24h"],"poc":"Static: the sidecar clamps every TTL to 24h, silently overriding 40d/90d/7d TTLs.","impact":"On desktop, long-lived cached data (bilateral HS4, temporal baselines, story tracking) expires far earlier than intended, causing needless re-fetches and lost continuity — a desktop-only correctness gap invisible in staging.","remediation":["Remove/raise the 24h clamp or make it per-key; document the intent","Add a test asserting the sidecar honors a long TTL"],"status":"code-verified"},{"id":"V117","severity":"info","title":"intel-history-client.ts documents that proto validation never runs; the gateway does run it","component":"server/_shared/intel-history-client.ts:61-63 · server/gateway.ts:124/132","summary":"A comment justifies the module's normalizers by claiming buf.validate 'does not run' because the gateway supplies no validateRequest — but the gateway does wire validateGeneratedRequest, so the premise is false and could mislead a future maintainer.","cvss":"N/A — informational (misleading comment)","cwe":"CWE-1116 (Inaccurate Comments)","scope":"api","description":"intel-history-client.ts:61-63 justifies its normalizers with 'buf.validate documents these shapes in the proto but does not run: the gateway supplies no validateRequest … so this is the only place the contract is actually applied.' The premise is false: gateway.ts:124 imports validateGeneratedRequest and :132 assigns it to serverOptions.validateRequest, and request-validator.ts compiles the proto rules. No behavioural defect (the normalisation is idempotent), but a future maintainer could remove a guard on the false premise that the normalizer is the only enforcement point. get-aircraft-details.ts:39-43 documents the correct framing for its own twin normalizer.","reproduce":["Read intel-history-client.ts:61-63 (claims validation doesn't run) vs gateway.ts:124/132 (wires validateGeneratedRequest)"],"poc":"Static: the comment's premise contradicts the gateway wiring; behaviour is unaffected (idempotent normalisation).","impact":"A misleading comment could lead a future maintainer to remove a validation guard believing the normalizer is the sole enforcement point — a maintainability/informational risk, no live defect.","remediation":["Correct the comment to reflect that the gateway runs validateGeneratedRequest","Reference the correct framing at get-aircraft-details.ts:39-43"],"status":"code-verified"},{"id":"V118","severity":"high","title":"Quadratic ReDoS in sanitizeForPrompt's role-marker pattern, reachable from one request body","component":"server/_shared/llm-sanitize.js:39 · reachable via news/v1/summarize-article.ts:79/:108-110","summary":"The role-marker regex uses \\s* under the /m flag so ^ matches after every newline, giving Θ(n²) backtracking on newline-dense input; a single request field (unsliced, part of the cache key) makes the cost per-request and unbounded in count.","cvss":"N/A — algorithmic complexity DoS","cwe":"CWE-1333 (Inefficient Regular Expression Complexity)","scope":"dos","description":"llm-sanitize.js:39 is `/(?:^|\\n)\\s*(?:#{1,4}\\s*)?(?:\\[|\\()?\\s*(?:system|human|gpt|claude|llm|model|prompt)\\s*(?:\\]|\\))?\\s*:/gim`. Measured against the literal repo regex: n newlines → n=1000:333ms, n=2000:2047ms, n=3000:6904ms (clearly super-linear); replacing every \\s* with horizontal-only [^\\S\\n]* gives ~0-1ms (~7000×). Mechanism: with the m flag ^ matches after every line terminator, so (?:^|\\n) succeeds at each of the n positions in a newline run; at each, \\s* greedily eats the remaining run, the keyword fails, and the engine backtracks one code unit at a time → Θ(n²). Trigger is line-terminator density, not length. Reachable from one request: summarize-article.ts:79 `systemAppend = isPremium && typeof req.systemAppend==='string' ? req.systemAppend : ''` — NO .slice() — sanitized at :272; and systemAppend is part of the cache key (:195) so every request is a guaranteed cache MISS. Entitlement doesn't gate it: the 2000-char geoContext sink at :108-110 is spent BEFORE the premium denial at :122, so any wm_ key (incl. free) reaches it. Stored/amplified variants at chat-analyst-context.ts:104/112/757/940 and _country-brief-evidence.ts:197 sanitize feed strings whose truncation happens AFTER the sanitize call.","reproduce":["Read llm-sanitize.js:39 (the /gim role-marker regex with \\s*)","POST /api/news/v1/summarize-article with a systemAppend (or geoContext) of many newlines","Measure server CPU rising super-linearly with newline count; each request misses the cache (systemAppend in key)"],"poc":"Measured on the repo's own regex: 1000/2000/3000 newlines → 333/2047/6904 ms; horizontal-only whitespace fix → ~0 ms (~7000× faster).","impact":"A single crafted request field ties up an edge CPU for seconds, and because the field is part of the cache key every request is a miss — so an unauthenticated-tier caller can impose an unbounded per-request CPU tax, and poisoned feed records make it a persistent tax on /api/chat-analyst and every country brief.","remediation":["Change \\s* to horizontal-only [^\\S\\n]* in the pattern (llm-sanitize.js:39)","Cap input length inside sanitizeForPrompt itself, and .slice() BEFORE each call site","Add a ReDoS regression test asserting bounded time on newline-dense input"],"status":"code-verified"},{"id":"V119","severity":"medium","title":"isModelRejection cannot classify OpenRouter's 'No endpoints found' body, so the model quarantine never fires","component":"server/_shared/llm-health.ts:171-176/184-189","summary":"All three rejection patterns require the model id adjacent to a narrow English phrase, but OpenRouter's real 'No endpoints found for this model.' body contains no model id, so the quarantine never triggers and every call re-pays a full prompt + 404.","cvss":"N/A — cost / latency / robustness","cwe":"CWE-20","scope":"api","description":"llm-health.ts:171-176 all three patterns require the model ID adjacent to a narrow set of English phrases. OpenRouter's actual response for a model with no routable endpoint — precisely the condition the quarantine exists to suppress — matches none. Reproduced against the repo's function with the pinned model (DEEPSEEK_V4_FLASH_MODEL_PREFIX='deepseek/deepseek-v4-flash'): {\"error\":{\"message\":\"No endpoints found for this model.\",\"code\":404}} → false; {\"error\":{\"message\":\"No endpoints found for deepseek/deepseek-v4.1-flash.\"}} → false; the valid-model-id case → true. Row 1 fails because the body has no model ID so modelRef can't match; row 2 fails because 'endpoints found for' is not \\bmodel\\b…not found. The provider body is externally sourced (Aider #2444, openclaw PR #61635 fix the same). Impact: when the pinned model loses endpoints, every LLM call pays a full prompt re-send + 404 before falling through; isModelUsable() (:184-189) never reports it unusable.","reproduce":["Read llm-health.ts:171-176 (patterns require model id + phrase)","Feed the OpenRouter body {\"error\":{\"message\":\"No endpoints found for this model.\",\"code\":404}}","Observe isModelRejection → false, so the model is not quarantined"],"poc":"Reproduced: the two real OpenRouter 'No endpoints found' bodies return false; only the model-id-bearing 'not a valid model ID' body matches.","impact":"When the pinned model loses its endpoints, every LLM call across the app (and seeders pinning the same id) pays a full prompt re-send and 404 round-trip before falling through the chain — multiplying user-visible latency and cost, with the health module wrongly reporting the model usable.","remediation":["Add /\\bno endpoints found\\b/i as a fourth pattern not requiring the model id","Add a regression fixture for both real bodies"],"status":"code-verified"},{"id":"V120","severity":"high","title":"SLOW-tier CDN shield (270 min) is 9× the freshness budget of six SLOW-tier keys","component":"api/bootstrap.js:82-85 vs api/health.js key budgets (:777/:779/:852/:863/:864 …)","summary":"TIER_CDN_CACHE.slow sums to 270 minutes of edge serving while six SLOW-tier keys have a 30-minute freshness budget in /api/health, so a stopped seeder shows 4.5h-old data with a green UI badge; the CI budget test never checks the fast/slow tiers.","cvss":"N/A — freshness/cache-integrity","cwe":"CWE-672 (Operation on stale resource)","scope":"infra","description":"api/bootstrap.js:82-85 sets TIER_CDN_CACHE.slow='public, s-maxage=7200, stale-while-revalidate=1800, stale-if-error=7200'. Summing the three directives (the repo's own conservative completeCacheServingWindowSeconds method, per tests/bootstrap-on-demand-cache-budget.test.mts:99-104) = 16,200s = 270 min. Against /api/health budgets of 30 min for keys in that same tier — cryptoQuotes:777, gulfQuotes:779, marketQuotes:852, countryStockIndexes:863, commodityQuotes:864, plus crossSourceSignals:1338, radiationWatch:1342, hyperliquidFlow:1421 — every one is 9× over. So a stopped seeder yields a dashboard rendering up to 4.5-hour-old data while /api/health reports STALE_SEED, and data-loader.ts:5140 dataFreshness.recordUpdate stamps the CDN copy as a fresh read (green badge). The repo ships ON_DEMAND_CACHE_PROFILES + a budget test, but the test iterates only bootstrapTierKeyNames('on-demand'), so fast/slow are never checked (green in CI).","reproduce":["Read api/bootstrap.js:82-85 (slow tier CDN directives → 270 min) and the health budgets for the six keys (30 min)","Stop a SLOW-tier seeder","Observe the dashboard serving up to 4.5h-old data with a green freshness badge while /api/health says STALE_SEED"],"poc":"Static/arithmetic: 7200+1800+7200 = 16,200s = 270 min vs a 30-min health budget = 9× over, for six SLOW-tier keys; the CI budget test skips fast/slow.","impact":"During a seeder outage, users see stale market/crypto/radiation data for up to 4.5 hours with the UI asserting freshness (green badge), while operators see STALE_SEED — a silent freshness violation on data whose value is timeliness, invisible to the existing tests.","remediation":["Add a per-key TIERED_CACHE_PROFILES map in api/bootstrap.js for any SLOW/FAST key under a 120-min budget","Extend tests/bootstrap-on-demand-cache-budget.test.mts to iterate fast ∪ slow","Reconcile the CDN serving window with each key's health freshness budget"],"status":"code-verified"},{"id":"V121","severity":"high","title":"MCP freshness budgets up to 18.6× looser than /api/health for the same seed-meta key","component":"api/mcp/registry/cache-tools.ts:424/1873 (and others) vs api/health.js:1135-1136/1341","summary":"Several MCP _freshnessChecks set maxStaleMin far looser than /api/health for the identical seed-meta key (e.g. sanctions entities 1440 vs 720; tps-mci 20160 vs a deliberately-tightened bound), and three carry a false 'matches api/health.js' comment.","cvss":"N/A — freshness/governance drift","cwe":"CWE-1041 (divergent duplicate implementation)","scope":"infra","description":"Reading both files: cache-tools.ts:1873 sets _freshnessChecks:[{key:'seed-meta:sanctions:entities',maxStaleMin:1440}] vs health.js:1341 sanctionsEntities maxStaleMin:720 — exactly 2× loose. cache-tools.ts:424 sets seed-meta:safety:tps-mci maxStaleMin:20160 (14 days) beside health.js:1135-1136 where the bound was deliberately tightened. mcp/freshness.ts:54 and health.js readSeedMeta are two implementations of one contract, and three MCP sites carry an inline comment asserting the value 'matches api/health.js' — which is false. Full loose set: intelligence:cross-source-signals 30→60, intelligence:risk-scores 30→120, sanctions:entities 720→1440, trade:customs-revenue 1440→2880, safety:tps-mci and safety:tps-calls-attended 1080→20160. mcp/filters.ts:298 makes `stale` a REQUIRED response field described to the agent as the freshness verdict.","reproduce":["Read cache-tools.ts:1873 (1440) and :424 (20160) vs health.js:1341 (720) and :1135-1136","Note the three inline 'matches api/health.js' comments that don't match","Query the MCP freshness for those keys → stale reported far later than the operator dashboard"],"poc":"Static: per-key maxStaleMin values diverge by up to 18.6× between MCP and /api/health for the identical seed-meta key, with false 'matches' comments.","impact":"An MCP agent reads sanctions entities, risk scores or Toronto safety data as 'current' for up to 18.6× longer than the operator dashboard considers fresh — so automated agents act on materially stale intelligence while operators are already paging on it.","remediation":["Add a test that parses SEED_META in api/health.js and every _freshnessChecks in api/mcp/registry/*.ts and asserts per-key equality","Or extract one shared constant table (the pattern api/_content-age.js already uses)","Correct the false 'matches api/health.js' comments"],"status":"code-verified"},{"id":"V122","severity":"medium","title":"displacement:summary:v1:003cyear> uses local year in the producer/RPC, UTC year in health/MCP","component":"scripts/seed-displacement-summary.mjs:226 · get-displacement-summary.ts:14 · api/health.js:519-520 · cache-tools.ts:1940","summary":"Producer and RPC compute the key with local getFullYear() while health and MCP use getUTCFullYear(), so on UTC hosts in the last hours of Dec 31 they resolve to different keys — health reports EMPTY on populated data and the consumer badge disagrees.","cvss":"N/A — freshness/monitoring drift","cwe":"CWE-697 (Incorrect Comparison)","scope":"infra","description":"Producer + RPC use LOCAL getFullYear(): seed-displacement-summary.mjs:226, get-displacement-summary.ts:14. Health + MCP use UTC getUTCFullYear(): api/health.js:519-520, cache-tools.ts:1940. On any host behind UTC (all US hosts, Railway default before a TZ override) these resolve to different keys for the last hours of 31 December: health probes a key nobody writes, reports EMPTY on a fully-populated dataset, and health-freshness.ts:170-172 synthesises unhcr as OK from the absent check — so the operator dashboard and the consumer badge disagree. get-risk-scores.ts:716 has the same local-year usage.","reproduce":["Read the four sites: producer/RPC local getFullYear vs health/MCP getUTCFullYear","On a UTC-behind host, evaluate around 23:00-23:59 local on Dec 31","Observe health probing displacement:summary:v1:003cUTC year> while the producer wrote 003clocal year>"],"poc":"Static: local vs UTC year yields different key suffixes in the Dec-31 window, so health reads a key no producer wrote.","impact":"During the year-boundary window on UTC hosts, health reports the displacement dataset EMPTY though it is populated (and synthesises a false OK), so operators and the consumer badge disagree — a monitoring correctness gap on a humanitarian dataset.","remediation":["Use getUTCFullYear() at all four sites (and get-risk-scores.ts:716)","Add a test asserting the key year is computed identically across producer, RPC, health and MCP"],"status":"code-verified"},{"id":"V123","severity":"medium","title":"insights is 'insights' in bootstrap but 'newsInsights' in health; its browser read is unauthenticated on a FAST key","component":"shared/bootstrap-tier-keys.js:58 · api/health.js:316 · src/services/insights-loader.ts:208","summary":"The same Redis key is named differently across surfaces (blocking name-based budget cross-checks), and the browser fetches /api/bootstrap?keys=insights with no public=1/credentials:omit, engaging wm-session recovery on a request meant to be anonymous.","cvss":"N/A — naming drift + needless auth overhead","cwe":"CWE-1041","scope":"api","description":"bootstrap-tier-keys.js:58 names the logical key 'insights'; health.js:316 names the same Redis key 'newsInsights'. Because the names differ, the two surfaces' budgets cannot be cross-checked by name — the mechanism that lets V121 drift. insights-loader.ts:208 issues a bare /api/bootstrap?keys=insights with NO public=1 and NO credentials:'omit', unlike every sibling credential-less bootstrap read (bootstrap.ts:192, weather.ts:83, china-policy-events.ts:333 all use ?keys=X&public=1). So isCredentiallessPublicDataRequest (wm-session.ts:910-933) returns false and the wm-session recovery machinery engages on a request that is anonymous by design — a recurring wm_session_route_401 cost. The comment at insights-loader.ts:174-183 documents this exact failure mode for the sibling crossStraitActivity call; this one was left on the old shape.","reproduce":["Read bootstrap-tier-keys.js:58 ('insights') vs health.js:316 ('newsInsights')","Read insights-loader.ts:208 (no public=1/credentials:omit) vs the public siblings","Load the app and observe the insights bootstrap read triggering wm-session recovery / 401 churn"],"poc":"Static: divergent key names block cross-surface budget checks; the browser read omits public=1 so it is treated as credentialed.","impact":"The naming divergence enables freshness-budget drift (V121 class), and the mis-shaped browser read triggers needless wm-session recovery and 401 churn on an anonymous request — an efficiency and maintainability defect.","remediation":["Unify the key name across bootstrap and health","Add public=1 (and credentials:'omit') to the insights-loader read (mirror the sibling public reads)","Add a test asserting the insights read is classified credential-less"],"status":"code-verified"},{"id":"V124","severity":"medium","title":"Wildfire bootstrap publishes a totalCount larger than the array with an empty nextCursor","component":"api/_wildfire-dashboard.js:147-163 · list-fire-detections.ts:47-52 · src/services/wildfires/payload.ts:11-12","summary":"The bootstrap path rewrites pagination.totalCount to max(reported, array.length) with nextCursor:'' after a byte-budget prefix, so the panel headline reports more fires than were shipped with no way to page back.","cvss":"N/A — correctness (client headline)","cwe":"CWE-682","scope":"api","description":"_wildfire-dashboard.js:147-163 binary-searches a byte-budget prefix and rewrites pagination:{nextCursor:'',totalCount} with totalCount=Math.max(…, value.fireDetections.length) — a count larger than what it ships, and a cursor pointing nowhere. The RPC path compensates (list-fire-detections.ts:47-52 re-derives the count and only substitutes when it actually capped); the bootstrap path calls the same helper with the default limit and no maxBytes (_bootstrap-public-payload.js:28), so the two disagree about whether totalCount is pre-cap or post-cap. wildfires/payload.ts:11-12 accepts the reported total whenever reportedTotal>=fireDetections.length, so the over-count becomes the panel's headline 'N fires burning' from a 500-row array with no way to page back. The RPC path's own comment says re-deriving would 'silently report the seeder's cap as the number of fires burning' — the bootstrap path has exactly that bug.","reproduce":["Read _wildfire-dashboard.js:147-163 (totalCount=max(reported,length), nextCursor:'') vs list-fire-detections.ts:47-52 (re-derives)","Trigger a byte-budget prefix (many fire detections)","Observe the panel headline reports more fires than the shipped array, with no cursor to page back"],"poc":"Static: the bootstrap path publishes totalCount > array length with an empty cursor.","impact":"The wildfire panel's 'N fires burning' headline overstates the count relative to the data shipped, with no way to page to the rest — a misleading headline metric.","remediation":["Re-derive totalCount from the shipped array (mirror list-fire-detections.ts:47-52) or emit a real cursor","Add a test asserting bootstrap totalCount matches the shipped detections or provides a usable cursor"],"status":"code-verified"},{"id":"V125","severity":"low","title":"Internal-MCP bodyHash is taken over a lossily decoded string, not the raw bytes","component":"server/_shared/mcp-internal-hmac.ts:534-538 (vs idempotency.ts:135, _session.js:81)","summary":"bodyHash = sha256Hex(new TextDecoder().decode(bytes)) maps every invalid-UTF-8 sequence to U+FFFD, so two byte-distinct bodies hash identically — the module's stated 'SHA-256(bodyBytes)' guarantee is false (bounded by nonce + JSON-parse equivalence).","cvss":"N/A — signature body-exactness (bounded)","cwe":"CWE-328","scope":"api","description":"mcp-internal-hmac.ts:534-538 `const bodyAsString = bodyBytes.length===0 ? '' : new TextDecoder().decode(bodyBytes); const bodyHash = await sha256Hex(bodyAsString);`. TextDecoder in non-fatal mode maps every distinct invalid-UTF-8 byte sequence onto U+FFFD. PoC: two byte-distinct bodies (9 and 11 bytes) — raw equal:false, decoded equal:true, sha256(decode(A))==sha256(decode(B)) but sha256(rawA)!=sha256(rawB). The module's docstring at :22 claims bodyHash=SHA-256(bodyBytes) — now false. The fix exists in the same repo: idempotency.ts:135 sha256Hex(input: string|ArrayBuffer) hashes bytes; embed-grant.ts:91 and _session.js:81 sign raw bytes. Impact bounded: exploitation needs an already-valid signature; the replay nonce is GETDEL-claimed (gateway.ts:1357); both bodies JSON.parse to the same value. The real finding is the false body-exactness guarantee.","reproduce":["Read mcp-internal-hmac.ts:534-538 (decode then hash) and the docstring at :22 (claims SHA-256(bodyBytes))","Construct two byte-distinct bodies that decode identically under non-fatal UTF-8","Observe equal bodyHash for unequal bytes"],"poc":"Executed: two byte-distinct bodies decode to the same string, so sha256(decode(A))==sha256(decode(B)) though the raw bytes differ.","impact":"The internal-MCP signature is not body-exact (its stated guarantee is false); exploitation is bounded (needs a valid signature, single-use nonce, JSON-equivalent bodies), but a future consumer treating a matching bodyHash as proof of byte identity would be wrong.","remediation":["Hash the raw bytes via the byte-accepting sha256Hex (idempotency.ts:135) and drop the TextDecoder coercion on both sides","Add a test asserting byte-distinct bodies produce distinct bodyHashes"],"status":"code-verified"},{"id":"V126","severity":"medium","title":"Embed entitlement client collapses 'could not verify' into a terminal denial, misattributed to the partner","component":"src/embed/embed-fetch.ts:96/14-20 · src/embed-main.ts:76-83","summary":"fetchEmbedEntitlement returns ok:resp.ok&&allowed===true for every non-2xx, so a 429/5xx verification outage is treated as a terminal denial and the iframe prints 'could not verify the embedding API key', blanking a paying partner's wall display with no retry.","cvss":"N/A — availability (partner-facing)","cwe":"CWE-703","scope":"api","description":"embed-fetch.ts:96 fetchEmbedEntitlement returns a single ok:resp.ok&&body.allowed===true for EVERY non-2xx, so the frame cannot distinguish a retryable verification outage from a real denial. The file states the contract it breaks 70 lines above (:14-20): 'denied and unavailable are deliberately different: a denial is terminal … while an unavailable answer means we could not find out and the frame keeps its last render rather than blanking a customer's wall display over a transient billing lookup.' Both siblings honour it: mintEmbedGrant (:124) and fetchEmbedMapFrame (:183) guard resp.status===429||>=500 and return/throw an unavailable outcome; :96 omits it. The three reachable 503s are named in the server contract (embed-entitlement.ts:99/100-102/148-150). Sink: embed-main.ts:76-83 mountError(root,denied) for a 503 prints 'could not verify the embedding API key', attributing our outage to the partner's credential; the iframe is never retried.","reproduce":["Read embed-fetch.ts:96 (single ok for all non-2xx) and :14-20 (the denied vs unavailable contract)","Return a 429/503 from the entitlement endpoint (Clerk BAPI blip / Convex 5xx / 3s timeout)","Observe the paid partner's embed blanks with 'could not verify the embedding API key', no retry"],"poc":"Static: a verification 503 is collapsed into a terminal denial, contradicting the file's own denied-vs-unavailable contract.","impact":"Any Clerk BAPI blip, Convex 5xx, or 3s timeout permanently blanks a PAYING partner's chokepoint-strip / fear-greed wall display (both paid-only, no free tier to degrade into), and blames the partner's credential for our outage — a partner-facing availability and reputation issue.","remediation":["Return {ok:false,status,retryable:resp.status===429||resp.status>=500,body} and schedule a backoff re-probe on retryable (mirror EmbedMapFrameUnavailableError)","Keep the last render on an unavailable outcome instead of blanking","Add a test asserting a 503 is treated as unavailable, not denied"],"status":"code-verified"},{"id":"V127","severity":"low","title":"embed-entitlement.ts discards the billing classification its sibling preserves","component":"server/_shared/embed-entitlement.ts:151-155 (vs embed-session.ts:113-124)","summary":"On denial it checks only verificationUnavailable and otherwise returns a terminal 403, so a cached row with billingStatus 'renewal_verification_pending' (transient) is treated as terminal — the sibling returns 503 + retryAfter.","cvss":"N/A — availability (partner-facing)","cwe":"CWE-703","scope":"api","description":"embed-entitlement.ts:151-155 on denial checks only entitlements?.verificationUnavailable (the lookup-failed marker) and otherwise returns a terminal 403 embed_not_entitled. Its sibling embed-session.ts:113-124 runs classifyBillingVerification(entitlements) and returns 503 with retryAfterSeconds when denial.retryable. The two modules are documented as 'split the same way' (embed-session.ts:5-7) and take the same inputs. A cached row carrying billingStatus 'renewal_verification_pending'|'renewal_verification_failed' with a lapsed validUntil misses :152 (that flag is verificationUnavailable, a different field) and lands on :155 — terminal. renewal_verification_pending is transient by definition. entitlement-check.ts:555-558 states the requirement this breaks ('retain the marker for denial details').","reproduce":["Read embed-entitlement.ts:151-155 vs embed-session.ts:113-124","Provide a cached entitlement with billingStatus 'renewal_verification_pending' and a lapsed validUntil","Observe a terminal 403 instead of a 503 + retry"],"poc":"Static: the denial path ignores the retryable billing classification the sibling honours.","impact":"A partner in a transient renewal-verification state is terminally denied (403) rather than retried, blanking a paying embed until manual intervention — partner-facing availability.","remediation":["Use the session module's four-clause block (or extract it) so retryable billing states return 503 + retryAfter","Add a test for renewal_verification_pending"],"status":"code-verified"},{"id":"V128","severity":"low","title":"Turnstile fail-open is decided by VERCEL_ENV, and no caller ever asks for deny","component":"server/_shared/turnstile.ts:25/28-32/35 · submit-contact.ts:114-118 · register-interest.ts:333-337","summary":"With no TURNSTILE_SECRET_KEY the captcha returns true when VERCEL_ENV is 'development' (or unset), and neither public no-auth caller passes the available 'deny' policy — so on any host without VERCEL_ENV the captcha silently disappears.","cvss":"N/A — anti-abuse (non-Vercel hosts)","cwe":"CWE-636 (Not Failing Securely)","scope":"api","description":"turnstile.ts:25 missingSecretPolicy='allow-in-development' is the default; :28-32 with no TURNSTILE_SECRET_KEY it returns true when (process.env.VERCEL_ENV ?? 'development')==='development' — a variable that says nothing about the captcha. The module exposes a 'deny' policy for exactly this case and neither caller passes it — submit-contact.ts:114-118 and register-interest.ts:333-337 both take the default. Both handlers are in PUBLIC_NO_AUTH_RPC_PATHS (gateway.ts:544-545) with a Convex write + Resend email sink. On Vercel, production/preview set VERCEL_ENV and fall through to return false at :35, so it is NOT live on the Vercel edge; the exposure is any deployment where VERCEL_ENV is unset (Tauri sidecar, Railway, Docker, bare Node).","reproduce":["Read turnstile.ts:25/28-32/35 and the two callers (default policy)","Deploy without VERCEL_ENV and without TURNSTILE_SECRET_KEY","Submit the contact/register form → the captcha is skipped (returns true)"],"poc":"Static: missing secret + unset VERCEL_ENV → captcha returns true; callers never pass 'deny'.","impact":"On non-Vercel hosts (sidecar/Railway/Docker/bare Node) the Turnstile captcha silently disappears from two public no-auth endpoints that write to Convex and send email, enabling automated abuse — not live on Vercel edge.","remediation":["Default missingSecretPolicy to 'deny' and/or test the captcha's own env, not VERCEL_ENV; pass 'deny' explicitly at both call sites","Add a test asserting a missing secret on a non-Vercel host denies"],"status":"code-verified"},{"id":"V129","severity":"info","title":"hasMxRecords fails open, silently disabling the disposable/typo-domain gates on a DoH outage","component":"server/_shared/email-validation.ts:35/40/69-72 · register-interest.ts:348","summary":"Both exits of the MX check (non-OK HTTP and the catch) return true, so a Cloudflare DoH outage or 3s timeout evaporates the disposable-domain, typo-TLD and MX gates together with no log.","cvss":"N/A — informational (anti-abuse fail-open)","cwe":"CWE-636","scope":"api","description":"email-validation.ts:35 `if(!res.ok) return true;` and :40 `catch { return true; }` — both exits of the only two are permissive. Non-OK HTTP, thrown fetch, and the 3s timeout all yield 'this domain accepts mail'. Consequence at :69-72: the disposable-domain list, the typo-TLD list and the MX check all evaporate together the moment Cloudflare DNS is unreachable, with no log line. Sole consumer register-interest.ts:348, also a PUBLIC_NO_AUTH_RPC_PATHS endpoint. Remaining controls after the collapse: the 5h per-IP scoped limit and a Convex per-email throttle.","reproduce":["Read email-validation.ts:35/40 (both return true) and :69-72 (gates depend on it)","Make the DoH endpoint unreachable/slow","Submit a disposable/typo-domain email → accepted"],"poc":"Static: both MX-check exits return true, so a DoH outage disables the disposable/typo/MX gates.","impact":"During a Cloudflare DoH outage the email-quality gates on a public no-auth endpoint silently disappear (only the IP/email throttles remain), a fail-open anti-abuse gap. Informational.","remediation":["Return a tri-state so the caller can answer 503 on an unresolved DoH rather than accept","Add a test asserting a DoH failure does not accept a disposable domain"],"status":"code-verified"},{"id":"V130","severity":"high","title":"clampInt collapses an absent page_size to min(=1) on four routes","component":"server/_shared/constants.ts:3-6 · callers research/list-arxiv-papers.ts:29, list-hackernews-items.ts:26, list-trending-repos.ts:25, prediction/list-prediction-markets.ts:98","summary":"clampInt(0,50,1,100) returns 1 (0 is finite, so fallback never applies), and four routes pass the decoder's absent-param 0 straight in — so external callers using the documented API silently get 1 item instead of 30-50, HTTP 200, sometimes CDN-cached 4h.","cvss":"N/A — correctness (API contract)","cwe":"CWE-670 (Always-Incorrect Control Flow Implementation)","scope":"input","description":"constants.ts:3-6: clampInt returns fallback only when !Number.isFinite(value); clampInt(0,50,1,100) → Math.max(1,Math.min(100,0)) = 1 (0 is finite). The generated GET decoder emits 0 for an absent optional page_size (see V61), and four callers pass req.pageSize raw: list-arxiv-papers.ts:29, list-hackernews-items.ts:26, list-trending-repos.ts:25 (clampInt(req.pageSize,50|30,1,100)) and list-prediction-markets.ts:98. Correct siblings in the same ripgrep output guard it: cyber/list-cyber-threats.ts:54 (`req.pageSize003c=0 ? DEFAULT : clampInt(...)`) and climate/list-climate-disasters.ts:66 (`clampInt(req.pageSize||DEFAULT,…)`). No test pins it (the research tests define their own defaults and call handlers directly, bypassing the decoder).","reproduce":["Read constants.ts:3-6 (fallback only on non-finite); clampInt(0,50,1,100)=1","Read the four raw callers vs the guarded siblings (list-cyber-threats.ts:54, list-climate-disasters.ts:66)","GET /api/research/v1/list-arxiv-papers with page_size omitted (decoder → 0)","Observe 1 item returned (HTTP 200), not the documented 30-50; static-tier routes cache the truncated page up to 4h"],"poc":"Runtime: clampInt(undefined,50,1,100)=50 but clampInt(0,…)=1; the decoder emits 0 for an absent param, so the four routes return 1 item.","impact":"External API/MCP consumers using the documented call (page_size 'optional, 1-100') for the primary arXiv / Hacker News / GitHub-trending / prediction-market content routes silently receive a single item with HTTP 200 and no degraded marker; on static-tier routes the truncated payload is CDN-pinned for up to 4 hours.","remediation":["Resolve the sentinel before clamping on the four sites (e.g. `req.pageSize>0 ? clampInt(...) : DEFAULT`), or make clampInt treat non-positive input as fallback (verified no caller passes min 0)","Fix the underlying decoder (V61) to emit undefined","Add a test exercising the generated decoder with page_size omitted asserting the documented default"],"status":"code-verified"},{"id":"V131","severity":"medium","title":"list-webcams treats an all-absent bbox as a real viewport → degenerate GEOSEARCH BYBOX 0 0","component":"server/worldmonitor/webcam/v1/list-webcams.ts:78-83/87/108/135","summary":"All five bbox params ??-default against a decoder that emits 0, so Number.isFinite(0) passes the ValidationError guard and the handler issues GEOSEARCH FROMLONLAT 0 0 BYBOX 0 0 — an empty 200 pinned 3600s or a 503, under one shared cache key.","cvss":"N/A — correctness / cache pollution","cwe":"CWE-20","scope":"input","description":"list-webcams.ts:78-83 all five params ??-default against a decoder that emits 0 (see V61), so Number.isFinite(0) is true for all five and the ValidationError guard at :87 never fires. Result: qW=qS=qE=qN=0, zoom=0 → one shared cache key webcam:resp:003cversion>:0:0:0:0:0 (:108) → a real GEOSEARCH key FROMLONLAT 0 0 BYBOX 0 0 km ASC COUNT 2000 (:135 → redis.ts:1215). Both downstream outcomes are stated conservatively (backend behaviour not determinable offline): accept-and-return-nothing → empty 200 pinned in Redis 3600s; or reject → SeedUnavailableError → 503. Siblings get it right — get-vessel-snapshot.ts:305-309 returns null for an all-zero box; list-military-bases.ts:120 short-circuits and :121 uses req.zoom||3 (|| treats 0 as missing) rather than ??.","reproduce":["Read list-webcams.ts:78-83 (?? against a 0-emitting decoder) and :87 (guard never fires)","GET list-webcams with the bbox params omitted","Observe GEOSEARCH BYBOX 0 0 → empty 200 cached 3600s (or a 503) under one shared key"],"poc":"Static: absent bbox → all-zero box passes Number.isFinite, issuing a degenerate GEOSEARCH and caching an empty result.","impact":"An all-absent bbox produces a degenerate implemented marker) vs list_arxiv_papers.proto:13-15 (has it)","Call the route with a cursor and observe it is ignored (pagination:undefined)","Check the generated OpenAPI advertises the cursor as functional"],"poc":"Static: two research protos declare a cursor without the unimplemented marker the sibling uses, so the OpenAPI advertises non-functional pagination.","impact":"External API/MCP consumers following the documented cursor pagination on Hacker News / GitHub-trending loop re-fetching page 1 forever, with no signal that pagination is a no-op — a misleading published API contract.","remediation":["Add (sebuf.http.unimplemented)=true to the cursor field in both protos (mirror list_arxiv_papers.proto) and regenerate the OpenAPI","Or implement real cursor pagination","Add a test asserting every declared-but-unread param carries the unimplemented marker"],"status":"code-verified"},{"id":"V1","severity":"high","title":"Gateway drains the handler side-channel from the wrong Request object","component":"server/gateway.ts:2451/2458/2467 · server/_shared/response-headers.ts:9-10 · :788-790 · :2420-2436","summary":"The per-request header side-channel is keyed by Request object identity, but the gateway reads it from the original request while the handler wrote it on a cloned one — so it silently no-ops for every authenticated/paid caller.","cvss":"N/A — correctness / cache-integrity (authenticated paths)","cwe":"CWE-670 (Always-Incorrect Control Flow Implementation)","scope":"api","description":"The handler side-channel (used for X-No-Cache, retryable-response and success-status overrides) is stored in a `new WeakMap003cRequest,…>()` and `new WeakSet003cRequest>()` keyed by object identity (response-headers.ts:9-10). When a principal is resolved, the gateway hands the handler a DIFFERENT Request object: `withTrustedRateLimitPrincipal(request,…)` clones via `cloneRequestWithHeaders` → `new Request(request,{headers})` (gateway.ts:788-790), and `requestForHandler` is that clone (:2420-2426), passed to `handlerCall(requestForHandler)` at :2436. The handler therefore writes the side-channel keyed to the clone, but the gateway drains it from the ORIGINAL `request` at drainResponseHeaders(request) :2451, drainRetryableResponse(request) :2458 and drainSuccessStatusOverride(request) :2467 — a different WeakMap key. rateLimitPrincipalUserId is set at :1801/:1824/:1881/:1937/:1983 (Clerk session, wm_ user key, legacy bearer, tier-gated, summarize-article Pro), i.e. exactly the authenticated/paid callers. Verified by reading the clone site and the three drain sites against the identity-keyed WeakMap.","reproduce":["Read server/_shared/response-headers.ts:9-10 — WeakMap/WeakSet keyed by Request identity","Read gateway.ts:788-790 — cloneRequestWithHeaders returns new Request(request,{headers})","Read gateway.ts:2420-2436 — requestForHandler is the clone when rateLimitPrincipalUserId is set; handler is called with it","Read gateway.ts:2451/2458/2467 — drain*(request) reads from the original object, not requestForHandler","Trace an authenticated GET that sets X-No-Cache (e.g. a degraded handler): the no-store conversion at :2491 never fires"],"poc":"Static object-identity proof: handler writes channel.set(requestForHandler,…) while gateway reads channel.get(request); the two are distinct objects for any principal-bearing request. Observable effect: run-scenario.ts:100-101 sets a 202 + Location success override that is lost (client sees 200 without Location), and X-No-Cache→no-store at :2491 never applies for authenticated callers.","impact":"Inverted correctness bug affecting exactly the paid/authenticated request paths across ~67 handler files that use the side-channel: per-principal responses that should be marked no-store can be cached, and async-enqueue endpoints that upgrade 200→202 with a Location header silently return a bare 200. Anonymous/enterprise callers (no clone) work; authenticated ones do not — the opposite of what you'd want.","remediation":["Drain from requestForHandler, not request: pass the same object the handler received to drainResponseHeaders/drainRetryableResponse/drainSuccessStatusOverride (a 3-character change at :2451/:2458/:2467)","Or key the side-channel by a stable per-request id rather than object identity","Add a regression test: an authenticated GET whose handler sets X-No-Cache must emit Cache-Control: no-store, and a POST that sets a 202 override must return 202 + Location"],"status":"code-verified"},{"id":"V2","severity":"medium","title":"Per-account daily REST meter is never refunded on the ENFORCE path","component":"server/gateway.ts:2170 (declare) · :2255 (assign) · :2308 (only call site, inside !governedByApiKeyLayer)","summary":"rollbackDailyMeter is only reachable in the non-governed block, but ENFORCE mode sets governedByApiKeyLayer=true, so every terminal non-2xx after reservation permanently burns a unit of the sold apiDailyAllowance.","cvss":"N/A — billing/quota integrity","cwe":"CWE-840 (Business Logic Error)","scope":"api","description":"rollbackDailyMeter is declared at gateway.ts:2170, assigned at :2255, and its only call site is :2308, which sits inside the `!governedByApiKeyLayer` block. :2291 sets governedByApiKeyLayer=true whenever `enforce && burst.ok`. So in ENFORCE mode no rollback ever runs; every terminal non-2xx after the reservation (400 compat, 429 LLM quota, idempotency 409/422, handler throw 500) permanently consumes a unit of the sold apiDailyAllowance without delivering a successful response.","reproduce":["Read gateway.ts:2170/2255/2308 and the enclosing !governedByApiKeyLayer block; :2291 sets governed=true when enforce&&burst.ok","As a metered API-key caller in ENFORCE mode, trigger a terminal non-2xx after reservation (e.g. a 400 or a handler 500)","Observe the daily allowance decrements with no refund"],"poc":"Static: the only rollbackDailyMeter() call is unreachable when governedByApiKeyLayer is true, which ENFORCE mode guarantees.","impact":"Paying API customers are debited daily-allowance units for requests that returned errors, silently eroding the quota they purchased and producing incorrect usage accounting.","remediation":["Move the rollback so it runs on any terminal non-2xx regardless of governedByApiKeyLayer","Add a test asserting a 400/500 after reservation refunds the daily meter in ENFORCE mode"],"status":"code-verified"},{"id":"V3","severity":"medium","title":"Tauri sidecar reports Exa/Brave/SerpAPI keys 'verified' with no probe","component":"src-tauri/sidecar/local-api-server.mjs:1423-1424 · :326-334 · :1778-1783","summary":"The validation switch has no case for EXA/BRAVE/SERPAPI/ALPHA_VANTAGE/WORLDMONITOR keys, so they hit the default arm and return HTTP 200 {valid:true} without any upstream check.","cvss":"N/A — desktop UX/integrity","cwe":"CWE-704 (Incorrect Type Conversion or Cast) / missing validation","scope":"client","description":"local-api-server.mjs:1423-1424 the switch has `default: return ok('Key stored')` with no case for EXA_API_KEYS, BRAVE_API_KEYS, SERPAPI_API_KEYS, ALPHA_VANTAGE_API_KEY or WORLDMONITOR_API_KEY. :326-334 ALLOWED_ENV_KEYS contains the first three and :1778 only checks that allowlist, so they reach the default arm; :1783 returns HTTP 200 {valid:true}. runtime-config.ts:138/145/152 renders all three as requiredSecrets in the settings UI. The three keys the author did treat as unverifiable carry honest messages (:1394 AISSTREAM, :1397 WTO, :1414 ICAO).","reproduce":["Read local-api-server.mjs:1423-1424 (default arm), :326-334 (allowlist), :1778-1783 (200 valid:true)","In the desktop settings UI, enter an obviously invalid EXA/BRAVE/SERPAPI key","Observe it reported valid:true with no upstream probe"],"poc":"Static: no switch case for these keys → default 'Key stored' → 200 {valid:true} regardless of the key's real validity.","impact":"Desktop users are told an invalid third-party API key is verified, so features silently fail later with no diagnostic — a dows produce distinct cache entries"],"status":"code-verified"},{"id":"V5","severity":"low","title":"api/brief public share pointer is written with no auth and no PRO check","component":"api/brief/[userId]/[issueDate].ts:241-269 (vs api/brief/share-url.ts:90-113)","summary":"Every read of the HMAC-token'd brief route writes the 7-day public share pointer to Redis, with no Clerk/session/Pro check, while the sanctioned writer requires a Clerk bearer + checkProEntitlement.","cvss":"N/A — authorization / invariant break","cwe":"CWE-862 (Missing Authorization)","scope":"access-control","description":"The route's only credential is the HMAC ?t= token (verifyBriefToken ~:193); rg 'clerk|getAuth|session|checkProEntitlement' on the file returns nothing. :241-269 buildPublicBriefUrl({… baseUrl:new URL(req.url).origin …}) then redisPipeline([['SET','brief:public:{hash}',ptr,'EX','604800']]) on EVERY read. The sanctioned writer api/brief/share-url.ts:90-113 requires a Clerk bearer AND checkProEntitlement. Its own doc (:17-26) states the lazy-on-share invariant this read path breaks. Consumer api/brief/public/[hash].ts:145-196 resolves the pointer to render the redacted magazine.","reproduce":["Read [issueDate].ts:241-269 (SET brief:public on every read) vs share-url.ts:90-113 (auth + Pro required)","Access the brief read route with a valid HMAC token but no session/Pro","Observe the 7-day public share pointer written to Redis"],"poc":"Static: the read path unconditionally writes the public share pointer that the sanctioned writer gates behind Clerk + Pro.","impact":"The public-share invariant (share only on an authenticated Pro action) is bypassed — the read path silently creates public pointers, so briefs can become publicly shareable without the intended authorization.","remediation":["Do not write the public pointer on read; require the same Clerk bearer + checkProEntitlement as share-url.ts to create it","Add a test asserting a read does not create a public share pointer"], le it passes.","cvss":"N/A — desktop least-privilege","cwe":"CWE-272 (Least Privilege Violation)","scope":"client","description":"capabilities/settings.json:6 is `\"permissions\":[\"core:default\"]`, identical to default.json (windows:['main']). Siblings live-channels.json and youtube-login.json use the narrower core:window:default. The GHSA-5458 guard test reads only default.json, so the invariant it names is false while the test passes.","reproduce":["Read capabilities/settings.json:6 (core:default) vs live-channels.json/youtube-login.json (core:window:default)","Note the GHSA-5458 guard test checks only default.json"],"poc":"Static: the settings capability grants the broad core:default set rather than the narrower core:window:default used by sibling windows.","impact":"The settings window holds broader Tauri core permissions than needed (violating least privilege), and the existing guard test does not catch it — a desktop hardening gap.","remediation":["Narrow settings.json to core:window:default (mirror the sibling windows)","Extend the GHSA-5458 guard test to cover settings.json"],"status":"code-verified"},{"id":"V8","severity":"low","title":"runtime-config vault-sourced keys are permanently valid:true","component":"src/services/runtime-config.ts:427","summary":"valid = state.source==='vault' || validateSecret(...).valid, and vault entries carry no value, so re-validation is unreachable for every desktop key sourced from the vault.","cvss":"N/A — desktop UX/integrity","cwe":"CWE-697","scope":"client","description":"runtime-config.ts:427 `valid: state.source === 'vault' || validateSecret(key, state.value ?? '').valid`. Vault entries carry no value, so the || short-circuit makes re-validation unreachable for every desktop key sourced from the vault.","reproduce":["Read runtime-config.ts:427","Observe any vault-sourced key reports valid:true regardless of its actual state"],"poc":"Static: source==='vault' short-circuits validateSecret, so vault keys are always val ty marker, contradicting sibling handlers on the same key.","impact":"During a chokepoint-status outage the shipping route-intelligence API confidently reports 'no disruption / normal war risk' for maritime chokepoints — an alarming false negative for a security-relevant dataset consumed as authoritative.","remediation":["Add an upstreamUnavailable member and set it on a seed miss (mirror get-chokepoint-status.ts:609); mark the response no-store","Handle a missing ISO2 pair as unavailable rather than NORMAL","Add a test asserting a seed miss does not publish an all-clear"],"status":"code-verified"},{"id":"V15","severity":"high","title":"Dockerfile.digest-notifications builds with npm lifecycle scripts enabled","component":"Dockerfile.digest-notifications:47 vs Dockerfile.relay:28-35","summary":"The digest image runs `npm ci` on the same scripts/ tree without --ignore-scripts that its hardened sibling calls 'the critical part', so dependency install/postinstall scripts (incl. a network-fetching esbuild) execute at build time as root.","cvss":"N/A — supply-chain / build hardening","cwe":"CWE-829 (Inclusion of Functionality from Untrusted Control Sphere)","scope":"supply-chain","description":"Dockerfile.digest-notifications:47 runs `RUN npm ci --prefix scripts --omit=dev` as root on node:24-alpine, with NO --ignore-scripts and no --omit=optional. The sibling Dockerfile.relay installs the IDENTICAL scripts/package.json + lockfile and its own comment states '--ignore-scripts is the critical part … their node-gyp-build install scripts won't run', using `RUN npm ci --prefix scripts --omit=dev --omit=optional --ignore-scripts` (:35). Measuring the lockfile, scripts/package-lock.json has FIVE packages with hasInstallScript:true — bufferutil, utf-8-validate, esbuild, es5-ext, fsevents — not two. esbuild is the one --omit=optional would not have caught: it is a direct production dependency (via convex and tsx) and its postinstall performs a network fetch of a platform binary. ne@sha256:… AS runtime` with no USER in :58-74. docker-publish.yml:31,41-42 publishes it to ghcr.io/koala73/worldmonitor (push:true). docker-entrypoint.sh:4-5 writes /etc/nginx/nginx.conf then `exec nginx -g 'daemon off;'` as uid 0. Correct siblings in the same repo: Dockerfile:114 USER appuser, Dockerfile.publish-bootstrap-tiers:18 USER node, Dockerfile.umami:159 USER nextjs. There is also no HEALTHCHECK in that stage.","reproduce":["Read docker/Dockerfile:58-74 (no USER) and docker-entrypoint.sh:4-5 (runs as root)","Confirm docker-publish.yml pushes this image to GHCR","Run the published image → nginx master and entrypoint run as uid 0"],"poc":"Static: the runtime stage never drops privileges, unlike the three sibling Dockerfiles that set USER.","impact":"A published container runs nginx as root, so any nginx/container escape or file-write primitive operates with maximum in-container privilege — an avoidable hardening gap on a distributed image.","remediation":["Add a non-root USER (and chown the needed paths) to the runtime stage, matching the sibling Dockerfiles","Add a HEALTHCHECK","Add a CI lint asserting every published runtime stage sets a non-root USER"],"status":"code-verified"},{"id":"V17","severity":"low","title":"deploy-gate.yml grants statuses:write at workflow scope to all five jobs","component":".github/workflows/deploy-gate.yml:30-35 (vs contributor-trust.yml:50-53)","summary":"statuses:write is set at the workflow permissions block, so all five jobs get it though only the invalidate job posts a commit status — violating the repo's own default-deny policy.","cvss":"N/A — CI least-privilege","cwe":"CWE-272","scope":"infra","description":"deploy-gate.yml:30-35 sets statuses:write at the workflow permissions block. Only invalidate (:58, script deploy-gate.sh:95) actually posts a commit status. Diverges from the repo's stated default-deny policy in contributor-trust.yml:50-53 and railway-deploy-trigger-watchdog.yml:23 (permissions:{}).","reproduce":["Read deploy-gate.yml:30-35 (workflow-scope statuses:write) and the single consumer at :58","Compare the default-deny siblings"],"poc":"Static: statuses:write is granted workflow-wide rather than scoped to the one job that needs it.","impact":"Four jobs hold an unnecessary write token, widening the blast radius if any is compromised — a CI least-privilege gap.","remediation":["Move statuses:write to the invalidate job only; default the workflow to permissions:{}","Add a lint asserting job-scoped permissions"],"status":"code-verified"},{"id":"V18","severity":"low","title":"workflow_dispatch inputs interpolated straight into run: blocks","component":".github/workflows/publish-go.yml:59 · perf-style-layout-budget.yml:63/76","summary":"GitHub expands ${{ inputs.* }} before the shell parses, so a value containing a double-quote breaks out of the run: string; the correct env-var pattern is used elsewhere.","cvss":"N/A — CI injection (write-access required)","cwe":"CWE-94 (Improper Control of Code Generation)","scope":"infra","description":"publish-go.yml:59 `VERSION=\"${{ inputs.version }}\"` inside shell double quotes; perf-style-layout-budget.yml:63,76 `\"${{ github.event.inputs.url || '…' }}\"`, `\"${{ github.event.inputs.max_pct || '28' }}\"`. GitHub expands ${{ }} BEFORE the shell parses, so a value containing a \" breaks out. deploy-gate.yml:55 and proto-check.yml:145-153 already do it correctly via env:. Severity Low: workflow_dispatch requires write access, so it is a narrow privilege gain, not an unauthenticated RCE.","reproduce":["Read publish-go.yml:59 and perf-style-layout-budget.yml:63/76 (direct interpolation)","Dispatch the workflow with an input containing a double-quote","Observe shell breakout in the run: block"],"poc":"Static: workflow_dispatch inputs are interpolated into shell strings before parsing, enabling breakout for a write-access actor.","impact":"An actor with write access can inject shell via a workflow_dispatch input — a narrow privilege gain (not unauthenticated), but avoidable.","remediation":["Pass inputs via env: and reference \"$VERSION\" in the script (mirror deploy-gate.yml:55)","Add a lint rejecting ${{ }} inside run: strings"],"status":"code-verified"},{"id":"V19","severity":"high","title":"api/health.js crashes on a seed-meta shape its own producer permits","component":"api/health.js:3449-3451 (consumer) vs :2574/:2610-2615 (producer)","summary":"classifyKey dereferences workerControl.subsystems.scan.status without optional chaining, but the producer legitimately omits `subsystems`, so /api/health throws a TypeError and wedges the refresh lease into a permanent REFRESH_PENDING.","cvss":"N/A — availability (monitoring self-DoS)","cwe":"CWE-476 (NULL/undefined Pointer Dereference)","scope":"infra","description":"At api/health.js:3449-3451 the consumer reads `workerControl.subsystems.scan.status` and `.admission.status` with NO optional chaining, even though the line immediately above (:3446) correctly uses `workerControl?.subsystems?.scan?.claimFailure`. The producer at :2574 wraps subsystems in `if (meta.subsystems !== undefined)` and returns `{status,outcome,...(subsystems?{subsystems}:{}),counters}` (:2610-2615) — so `subsystems` is legitimately absent. The guard at :3448 requires only status==='error' && outcome==='claim_error', both independent of subsystems, so the deref at :3449 throws TypeError on a shape the producer explicitly permits. Because the throw escapes handleHealth with no try/catch in the registry loop, /api/health 500s at the platform level (no CORS/verdict) and releaseHealthVerdictRefreshLock is never reached, so the refresh lease stays held and every caller gets REFRESH_PENDING; the snapshot cache is never written so it re-throws permanently.","reproduce":["Read api/health.js:3446 (optional chaining) vs :3449-3451 (unguarded deref)","Read the producer at :2574 and the return at :2610-2615 — subsystems is conditionally included","Construct/observe a worker-control meta with status:'error', outcome:'claim_error' and no subsystems → deref throws","Observe /api/health returns a platform 500 and subsequent calls report REFRESH_PENDING indefinitely"],"poc":"Static: producer may omit `subsystems`; consumer derefs it unguarded under a condition that doesn't require it → TypeError escapes the un-try/caught registry loop → refresh lock never released.","impact":"A single worker-control record in the SEED_ERROR/claim_error state permanently breaks the health endpoint: it 500s with no verdict and the refresh lease is stuck, so operators lose the entire health signal (all keys read REFRESH_PENDING) until manual intervention. A monitoring self-DoS triggered by ordinary producer output.","remediation":["Add optional chaining at :3449-3451 (workerControl?.subsystems?.scan?.status, .admission?.status) matching :3446","Wrap the per-key classify in try/catch inside the registry loop so one bad record can't 500 the whole endpoint","Ensure releaseHealthVerdictRefreshLock runs in a finally","Add a test feeding a subsystems-less claim_error meta and asserting a normal 200 verdict"],"status":"code-verified"},{"id":"V20","severity":"high","title":"api/bootstrap.js answers Redis failure with 200 {data:{},missing} for every credentialed caller","component":"api/bootstrap.js:436-441 · :543-568","summary":"On an infrastructure failure the catch returns 503+Retry-After for public kinds but falls through to a 200 empty-registry body for session/Pro/OEM/embed callers — the two arms of the same catch contradict each other.","cvss":"N/A — availability / correctness","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"isPublicBootstrapKind (:436-441) covers only public-weather | anonymous-weather | public-tier | public-on-demand. In the catch (:543-568) the handler answers 503 + Retry-After for those public kinds with the comment 'Infrastructure failure is not an empty registry', then falls through to `jsonResponse({data:{},missing:names},200,{…no-store})` for everything else. authKind:'session' (the primary browser boot via wm-session) and every Pro/OEM/embed credentialed caller take the 200 arm, where names = every registered key, so the body is byte-identical to 'nothing was ever seeded'. The two arms of the same catch directly contradict each other; the 200 arm is the defect.","reproduce":["Read api/bootstrap.js:436-441 (isPublicBootstrapKind set) and :543-568 (the catch)","Induce a Redis failure during a credentialed bootstrap (authKind:'session')","Observe HTTP 200 with {data:{}, missing:[…all keys…]} and Cache-Control:no-store, instead of a 503"],"poc":"Static: the catch returns 503 for public kinds ('infra failure is not an empty registry') but 200 {data:{}} for credentialed kinds — same failure, opposite response.","impact":"During a Redis/infra outage the primary browser boot (wm-session) and all paid callers receive a success-shaped empty dashboard indistinguishable from a never-seeded install: the app renders as if all data is legitimately absent, health/alerting keyed on 200 sees success, and the user silently loses every panel rather than getting a retryable error.","remediation":["Return the same 503 + Retry-After for credentialed kinds as for public kinds (remove the 200 empty-registry fall-through in the catch)","Never emit a full-missing registry as a 200 on an infrastructure error","Add a test asserting a Redis failure on an authKind:'session' bootstrap yields 503, not 200"],"status":"code-verified"},{"id":"V21","severity":"high","title":"checkRateLimit drops @upstash/ratelimit's reason, so a timeout is an unconditional silent allow","component":"server/_shared/rate-limit.ts:573-586 (vs :1260-1268)","summary":"checkRateLimit destructures away `reason`, so @upstash/ratelimit's `{success:true,reason:'timeout'}` internal-timer resolution passes as verified headroom — three failClosed callers become unlimited exactly when Redis is slow.","cvss":"N/A — rate-limit bypass under Redis degradation","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"checkRateLimit does `const {success,limit,reset} = await limitWithFallback(…)` (:573-586); `reason` is destructured away, so the catch (and opts.failClosed) is never reached. @upstash/ratelimit v2 RESOLVES `{success:true,reason:'timeout'}` on its internal 5s timer rather than rejecting → !success is false → return null = allow, with no log and no Sentry. The sibling in the same file documents and handles this exact hazard: checkScopedRateLimit at :1260-1268 branches on `result.reason==='timeout'` and reports degraded. Three call sites pass failClosed:true because the limit IS the control — api/chat-analyst.ts:204 (frontier LLM), api/customer-portal.ts:84 (billing portal), api/symbol-search.ts:231 (shared paid Finnhub key, 30/min). Under slow Redis all three silently become unlimited — exactly the condition the limiter exists to absorb.","reproduce":["Read rate-limit.ts:573-586 — reason is not captured","Read the sibling handling at :1260-1268 — reason==='timeout' → degraded","Induce Upstash latency so limit() resolves {success:true,reason:'timeout'}","Observe checkRateLimit returns null (allow) with no log for chat-analyst/customer-portal/symbol-search"],"poc":"Static: {success:true,reason:'timeout'} → !success false → return null; the failClosed branch is unreachable because reason is dropped before the catch.","impact":"When Redis is slow (the exact abuse/outage condition the limiter defends), the frontier-model LLM endpoint, the billing portal, and the shared paid Finnhub symbol-search become rate-limit-free with no telemetry — enabling cost-amplification against a paid upstream key and abuse of billing flows, invisibly.","remediation":["Copy the reason==='timeout' branch from checkScopedRateLimit into checkRateLimit (and the two MCP limiters): treat a timeout as unavailable/degraded and honor opts.failClosed","Emit a Sentry event/log on the timeout path so cap","Add a test asserting a stalled body is aborted before the Edge ceiling"],"status":"code-verified"},{"id":"V23","severity":"low","title":"api/cache-purge.js reports a partially-failed DEL pipeline as HTTP 200","component":"api/cache-purge.js:168-176 (vs api/bootstrap.js:311-317, api/_user-api-key.js:274-275)","summary":"deleted sums r.result and never inspects r.error, so a failed DEL contributes 0 and the handler still returns 200 {matched,deleted}, masking a partial failure from the operator.","cvss":"N/A — operability / observability","cwe":"CWE-703","scope":"api","description":"cache-purge.js:168-176 `deleted = results.reduce((sum,r)=>sum+(r.result||0),0)`; r.error is never inspected, so a failed command contributes 0 and the handler still returns 200 {matched,deleted}. Contrast api/bootstrap.js:311-317 and api/_user-api-key.js:274-275, which both branch on entry.error.","reproduce":["Read cache-purge.js:168-176 (ignores r.error)","Trigger a partial DEL failure in the pipeline","Observe HTTP 200 with a deleted count that silently omits the failures"],"poc":"Static: r.error is never checked; a failed DEL is counted as 0 and the response is still 200.","impact":"An operator issuing a cache purge is told it succeeded when some deletes failed, so stale keys persist unnoticed — an operability/observability gap.","remediation":["Inspect r.error and surface partial failures (non-200 or an errors[] field), mirroring bootstrap.js:311-317","Add a test asserting a partial DEL failure is reported"],"status":"code-verified"},{"id":"V24","severity":"medium","title":"api/seed-health.js staleness from an unvalidated fetchedAt (NaN → always fresh)","component":"api/seed-health.js:671/785 (vs api/health.js:2815-2819)","summary":"ageMs is computed from meta.fetchedAt||0 with no numeric guard, so a non-numeric truthy value yields NaN and NaN>maxStaleness is false — publishing status:'ok', stale:false forever.","cvss":"N/A — monitoring correctness","cwe":"CWE-754","scope":"infr is 7.29.1. package.json:256 pins the EXACT string '7.29.0' — no caret, so npm update / npm audit fix will never move it. Not currently reachable: the vuln is in undici's bundled WebSocket permessage-deflate cleanup; the sole import in the repo is scripts/seed-natural-events.mjs:6 import {Agent} from 'undici', used as an HTTP dispatcher. No WebSocket import exists.","reproduce":["grep undici in package.json (exact 7.29.0) and package-lock.json:22446","Confirm the only undici use is Agent (HTTP), no WebSocket import"],"poc":"Static: lockfile pins undici 7.29.0 (003c 7.29.1 fix), exact-pinned so it won't auto-upgrade; the WebSocket sink is unused.","impact":"A known undici advisory is present but not reachable (no WebSocket use); the exact pin blocks routine remediation, so it will linger until manually bumped.","remediation":["Bump the pin to undici 7.29.1 (or a caret range)","Add a dependency-audit gate that flags pinned advisory-affected versions"],"status":"code-verified"},{"id":"V27","severity":"low","title":"ip-address@10.4.0 (the tree's only IP-classification library) matches two SSRF-class advisories","component":"package-lock.json:15948 (via telegram → socks)","summary":"ip-address 10.4.0 is affected by GHSA-2vr4-cq9g-pvrc (NAT64) and GHSA-rpw4-54j3-4h4q (link-local mask), reached via telegram→socks, but socks only does byte↔text conversion so the classifiers are never called.","cvss":"N/A — dependency advisory (not reachable)","cwe":"CWE-918","scope":"supply-chain","description":"package-lock.json:15948 → 10.4.0, reached in production via telegram@2.26.22 → socks@2.8.7. CVE-2026-101910/GHSA-2vr4-cq9g-pvrc (>=10.2.0 003c10.5.1): no classifier recognises NAT64 64:ff9b:1::/48. CVE-2026-101913/GHSA-rpw4-54j3-4h4q (003c=10.5.0): Address6.isLinkLocal() matches fe80::/64 instead of fe80::/10. Not currently reachable — socks only does byte↔text conversion, never calls isLinkLocal/isPrivate/isLoopback. Reportable because the existing webhook-egress work (CR-3) is exac
