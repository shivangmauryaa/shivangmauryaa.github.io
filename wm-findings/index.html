bserve the JSON body carries the raw Node transport error (resolver behaviour, egress IPs)"],"poc":"Source-verified: :12857 sendError(502, err.message) on the public /rss route.","impact":"Any anonymous caller learns the relay's resolver behaviour and internal egress addresses, mapping deployment topology and turning the relay into a remote host/port prober.","remediation":["Return a generic 'Feed fetch failed' message; keep err.message only in server-side logs"],"status":"code-verified"},{"id":"V101","severity":"low","title":"X-Bases-Debug leaks the seed version and internal Redis keys on an ungated public route","component":"server/worldmonitor/military/v1/list-military-bases.ts:147-148,236-239","summary":"Sets X-Bases-Debug on every call, and on the catch path interpolates err.message — which contains the internal Redis key for a cachedFetchJson timeout — on an ungated CDN-cacheable route.","cvss":"N/A — info disclosure","cwe":"CWE-200","scope":"api","description":"list-military-bases sets X-Bases-Debug: v=<version>,raw=<flag> on every successful call, and X-Bases-Debug: error:<err.message> on the catch path. err.message for a cachedFetchJson timeout interpolates the internal Redis key (redis.ts:877/1044). The gateway strips X-No-Cache and gates X-Cache-Tier behind ?_debug but has no rule for X-Bases-Debug. The route is ungated on the CDN-cacheable daily tier, readable by any freely-mintable wms_ session.","reproduce":["Call list-military-bases with a freely-minted wms_ session","Read the X-Bases-Debug response header (seed version)","Force a Redis timeout and read the internal Redis key from the error header"],"poc":"Source-verified: :147-148 and :236-239 set X-Bases-Debug; redis.ts interpolates the key into the timeout message.","impact":"Leaks internal seed version and Redis key names to any anonymous session, aiding reconnaissance of the caching layer.","remediation":["Gate/drop X-Bases-Debug unless ?_debug is present (extend gateway:2538)","Stop interpolating the Redis key into the client-visible error string"],"status":"code-verified"},{"id":"V102","severity":"low","title":"Desktop sidecar puts the FRED/EIA provider key in the validation URL","component":"src-tauri/sidecar/local-api-server.mjs:1151,1165","summary":"Key-validation probes place api_key=<value> in the query string for FRED and EIA; EIA accepts a header and should use it (FRED requires the query param).","cvss":"N/A — info disclosure","cwe":"CWE-598","scope":"comms","description":"The sidecar key-validation probes build .../fred/series?...&api_key=<value> and https://api.eia.gov/v2/?api_key=<value>. Same class as the seeder findings but on the desktop sidecar path. Header-capable providers in the same function already use Authorization: Bearer. FRED v1 requires the query parameter (not fixable here), but EIA accepts api_key as a header on /v2/ and should be moved. Low: the key only reaches its issuing provider over TLS in a one-shot user probe.","reproduce":["Trigger EIA key validation in the desktop sidecar","Observe api_key in the request query string rather than a header"],"poc":"Source-verified: :1151 (FRED) and :1165 (EIA) place api_key in the URL.","impact":"Provider API keys can land in TLS-terminating proxy/CDN logs and Referer for the EIA probe (avoidable via header).","remediation":["Send the EIA key as a header on /v2/; leave FRED (which mandates the query param) as-is or document it"],"status":"code-verified"},{"id":"V103","severity":"medium","title":"CORS preflight Worker strips ACAO:* from 8 public endpoints incl. the RFC 8414 discovery doc","component":"workers/api-cors-preflight/src/index.js:110-129,330","summary":"PUBLIC_CORS_PATHS omits /api/oauth-authorization-server and 7 others; the Worker overwrites the origin function's ACAO:* and stamps ACAC:true on credential-free responses.","cvss":"N/A — CORS/hardening","cwe":"CWE-942","scope":"api","description":"PUBLIC_CORS_PATHS contains /api/oauth-protected-resource but not the sibling /api/ "6.5 (Medium-High)","cwe":"CWE-770","scope":"access-control","description":"alertRules is keyed (userId, variant) with variant: v.string() (open, unbounded, not an enum) and eventTypes: v.array(v.string()) (uncapped). Each public mutation inserts a new row for an unseen (userId, variant) with no membership check, length bound, or per-user row cap; assertProEntitlement runs per write only and nothing deletes rows when a subscription lapses. getByEnabled (:746-754) and getDigestRules do a full .collect() over the by_enabled index, which spans all tenants; Convex throws (QueryScannedTooManyDocuments / TooManyBytesRead at 16MiB) past the limit, so the relay read fails for every subscriber. apiPlanLimitNotices.ts:508-512 already diagnoses this exact class for another table.","reproduce":["As a user, repeatedly create alertRules with distinct variant values (open string)","Grow the table until a full .collect() in getByEnabled exceeds Convex's scan limit","Observe the relay's getByEnabled read throw for every subscriber"],"poc":"Source-verified: schema variant is open v.string(); getByEnabled does .withIndex('by_enabled').collect() with no delete anywhere in convex/.","impact":"A client-writable growth key on an unbounded cross-tenant scan can eventually make the enabled-rules read throw, breaking alert/digest delivery for all subscribers (self-DoS).","remediation":["Constrain variant to a closed enum (mirror userPreferences), cap eventTypes.length, enforce a per-user row cap","Convert getByEnabled/getDigestRules to .paginate(...)"],"status":"code-verified"},{"id":"V59","severity":"critical","title":"Unauthenticated exposure of Pro-gated datasets via the public bootstrap tier","component":"GET /api/bootstrap?tier=slow&public=1 · api/_bootstrap-public-payload.js · api/bootstrap.js · api/_bootstrap-tier-keys.js","summary":"One unauthenticated request returns Pro-gated OFAC sanctions + national-debt data — confirmed LIVE on production.","cvss":"7.5 (High) — CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N · business-critical data class","cwe":"CWE-306 (Missing Authentication for Critical Function)","scope":"access-control","description":"The bootstrap endpoint serves a 'slow' data tier to anonymous callers via ?tier=slow&public=1, and this public classification is evaluated BEFORE the API-key check runs, so the request never reaches authentication. The public-path sanitizer (sanitizeBootstrapValue()) has explicit cases for several keys but NO case for two Pro-gated keys — sanctionsPressure (sanctions:pressure:v1) and nationalDebt (economic:national-debt:v1) — so execution falls through to `return value` and both datasets are emitted unchanged. The same datasets are correctly gated (HTTP 401) on their dedicated API routes; only the bootstrap public tier bypasses the control (invariant drift / unaudited path).","reproduce":["As an unauthenticated client with a normal browser User-Agent, request: GET https://www.worldmonitor.app/api/bootstrap?tier=slow&public=1","Observe HTTP 200 with a JSON body whose top-level keys include sanctionsPressure and nationalDebt","Control: request GET /api/economic/v1/get-national-debt and GET /api/sanctions/v1/list-sanctions-pressure → both return HTTP 401 'API key required'","The 200-vs-401 difference confirms the gate exists on the API routes and is bypassed on the bootstrap public tier"],"poc":"Unauthenticated GET returned sanctionsPressure (totalCount 25,695 · sdnCount 19,577 · consolidatedCount 1,058 · semaCount 5,703 · vesselCount 1,940 — the OFAC SDN/consolidated/SEMA dataset) and nationalDebt (per-country debt/GDP/growth series). Single read-only GET; no data written or modified. Exact captured response withheld here — responsibly disclosed to the maintainer per the project's coordinated-disclosure policy.","impact":"A paid intelligence product (OFAC sanctions + sovereign national-debt data) is freely harvestable by any anonymous caller. The response carries Access-Control-Allow-Origin: * and is CDN-cacheable (s-maxage=7200), so any third-party page can scrape it and the leak is amplified at the edge. Consequences: loss of a monetised dataset, exposure of regulated/sanctions-relevant intelligence, and reputational/compliance risk.","remediation":["Add sanctionsPressure and nationalDebt cases to sanitizeBootstrapValue() (blank them on the public path) and its twin scripts/_bootstrap-public-payload.mjs","Broaden the fix so every tier-gated key is sanitized-by-default on the public tier rather than enumerating exceptions","Add a structural/regression test asserting no tier-gated handler seed key ever appears in bootstrapTierKeyNames('fast'|'slow')","Run the public bootstrap payload through the same entitlement classification the RPC gateway uses so the two paths cannot drift again"],"status":"confirmed-live"},{"id":"DEV-1","severity":"medium","title":"SSRF allowlist bypass via redirect in the dev RSS proxy","component":"vite.config.ts:807 (rss-proxy dev middleware) — dev-only","summary":"Dev RSS proxy checks the allowlist once then follows redirects off-allowlist, unauthenticated (dev server only).","cvss":"6.5 (Medium) — dev-only","cwe":"CWE-918 (Server-Side Request Forgery)","scope":"api","description":"The Vite dev-server rss-proxy middleware validates the initial hostname against the RSS allowlist, then calls fetch() with redirect:'follow' — every subsequent 3xx hop is followed without re-checking the allowlist, unauthenticated and unthrottled. The production handler api/rss-proxy.js does this correctly (redirect:'manual' + assertAllowedRedirect() per hop).","reproduce":["Run the Vite dev server (localhost:3000)","GET /api/rss-proxy?url=https://feeds.marketwatch.com/ (an allowlisted host that 301s off-allowlist)","Observe content from the non-allowlisted redirect target returned through the proxy","Direct request to the disallowed host is refused (403), proving the redirect path is the bypass"],"poc":"Allowlisted feeds.marketwatch.com redirected to a non-allowlisted host and the proxy returned ~921 KB of that host's content; direct requests to the same host return 403. Local dev server only.","impact":"On a developer/CI machine, an attacker-chosen allowlisted host plus attacker-followable redirects can reach internal-only services, adjacent hosts, or cloud metadata — an unauthenticated SSRF/open-proxy surface. Dev-only; does not exist on the production edge.","remediation":["Mirror api/rss-proxy.js: redirect:'manual', re-validate protocol + allowlist on every Location hop, cap hops","Better: route dev traffic through the single shared production handler","Add a regression test asserting a redirect to a non-allowlisted host is refused"],"status":"dev-only"},{"id":"DEV-2","severity":"medium","title":"Dev sebuf plugin executes RPC handlers with no gateway auth/entitlement/rate-limit","component":"vite.config.ts:744 (sebufApiPlugin) — dev-only","summary":"Dev sebuf middleware calls handlers directly after only a CORS check, skipping the gateway's auth, entitlement and rate-limit (dev server only).","cvss":"6.5 (Medium) — dev-only","cwe":"CWE-306 (Missing Authentication for Critical Function)","scope":"api","description":"In production, authentication (validateApiKey), Pro-tier entitlement checks, rate limiting and telemetry all run in one place — the edge gateway (server/gateway.ts). The dev plugin rebuilds the route table and calls matchedHandler(webRequest) directly, performing only a CORS origin check, so tier-gated handlers execute fully unauthenticated on the dev server.","reproduce":["Run the Vite dev server","GET a tier-gated route unauthenticated, e.g. /api/economic/v1/list-global-tenders?limit=5","Observe 200 (handler executed) where production returns 401/403"],"poc":"On dev, tier-gated routes returned 200 unauthenticated (e.g. get-insider-transactions, list-stored-stock-backtests, list-global-tenders); the same routes are 401 in production. Local dev server only.","impact":"Anyone reachable of a dev server can invoke every RPC handler credential-free — including per-user premium stores queried with no user identity, and metered upstreams that spend the operator's budgets. Dev-only.","remediation":["Route dev sebuf traffic through server/gateway.ts","Or replicate the pipeline order: CORS → validateApiKey → checkEntitlementDetailed → rate limit → handler","CI test: a tier-gated route via the dev server unauthenticated must return 401/403, never 200"],"status":"dev-only"},{"id":"DEV-3","severity":"low","title":"Dev proxies omit the production auth + rate-limit gate","component":"vite.config.ts (rss-proxy et al.) — dev-only","summary":"Dev proxy middleware has no validateApiKey/checkRateLimit; unauthenticated, unthrottled surface on the dev server.","cvss":"N/A — dev-only defense-in-depth gap","cwe":"CWE-306","scope":"api","description":"The dev rss-proxy (and sibling dev proxies) contain zero occurrences of validateApiKey/checkRateLimit, which are present in the production handlers. There is no rate limiting anywhere on the dev server.","reproduce":["Run the Vite dev server","GET /api/rss-proxy?url=https://news.google.com/rss with no credential → 200 XML","Issue rapid repeated requests → no 429"],"poc":"60/60 rapid requests to dev proxy endpoints returned 200 (0×429); production requires an API key (401). Local dev server only.","impact":"Unauthenticated, unthrottled proxy surface on the dev server. Dev-only.","remediation":["Share the production gate, or bind the dev server to 127.0.0.1 by default and document it as local-only"],"status":"dev-only"},{"id":"CR-1","severity":"medium","title":"JMESPath projection computes full amplified output before the size gate (DoS)","component":"server/_shared/response-projection.ts:93,105,110 · api/mcp/jmespath.ts","summary":"A JMESPath expression is executed and stringified before the 256 KB output limit is checked — CPU/memory amplification.","cvss":"N/A — DoS / robustness (DoS out of scope per SECURITY.md)","cwe":"CWE-400 (Uncontrolled Resource Consumption)","scope":"dos","description":"projectJsonResponse gates the expression byte-length (≤1024), then runs jmespath.search(value, expr), then JSON.stringify(projected), and only then enforces the 256 KB output cap. A small expression producing a large fan-out (e.g. multiselect-hash over a large input array) does the full search + serialize work before rejection.","reproduce":["Read server/_shared/response-projection.ts:66-110 — expr gate at :68, search at :93, stringify at :105, output gate at :110","Locally, a 511-byte expression over a 4,000-leaf input produced ~1.93 MB before the gate"],"poc":"Local reproduction with the repo's own jmespath dependency: 511-byte expr → 1,929,681 bytes materialised in ~23 ms; the 256 KB cap only rejects after the projection is built and stringified.","impact":"CPU/memory amplification per request. Bounded by expression complexity × input size; classed as hardening because SECURITY.md lists DoS out of scope.","remediation":["Bound the projection during evaluation, or estimate output size before stringify","Add a codegen/unit test asserting large fan-out is rejected before full materialisation"],"status":"code-verified"},{"id":"CR-2","severity":"medium","title":"PRO widget loads an unpinned, no-SRI chart.js from a CDN (supply chain)","component":"src/utils/widget-sanitizer.ts:90 (meta CSP) · :205 (sandbox)","summary":"Widget iframe pulls floating chart.js@4 from jsdelivr with no integrity hash — supply-chain risk (form-exfil claim mitigated by sandbox).","cvss":"N/A — supply-chain / hardening","cwe":"CWE-829 (Inclusion of Functionality from Untrusted Control Sphere)","scope":"client","description":"The Pro-widget document loads <script src=\"https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js\"> — a floating major range with no integrity attribute. The meta CSP also lacks form-action/base-uri/object-src. The iframe is sandbox=\"allow-scripts\" only (no allow-forms, no allow-same-origin), so the form-exfiltration scenario is NOT exploitable and a compromised script runs in an opaque origin with connect-src locked to jsdelivr.","reproduce":["Read src/utils/widget-sanitizer.ts:85-91 (meta CSP) and :205 (iframe sandbox attribute)"],"poc":"CSP at :89 omits form-action/base-uri/object-src; floating no-SRI script at :90; sandbox='allow-scripts' at :205 (no allow-forms). The only genuine residual is the unpinned/no-SRI CDN script.","impact":"If the pinned-by-range chart.js file is ever compromised or replaced, arbitrary JS runs inside the (sandboxed, opaque-origin) widget. Contained by the sandbox and connect-src, but pin+SRI is the correct hardening.","remediation":["Pin an exact chart.js version and add an integrity (SRI) attribute, or self-host the file","Add form-action/base-uri/object-src to the widget meta CSP for defense in depth"],"status":"code-verified"},{"id":"CR-3","severity":"low","title":"Webhook validator has no destination-port restriction; registration and delivery use different DNS resolvers","component":"api/_notification-webhook-ssrf.ts:170 · shipping/v2/webhook-shared.ts:53 · deliver-webhook.ts:71","summary":"Webhook URL validation checks scheme/host/private-IP but not the port; registration resolves via Cloudflare DoH while delivery uses node:dns (TOCTOU window).","cvss":"N/A — auth-gated hardening","cwe":"CWE-918 (SSRF)","scope":"api","description":"blockedNotificationWebhookUrlReason() validates protocol (https), metadata hostnames and private/reserved addresses, but performs no parsed.port check, and the registration-time resolver (Cloudflare DoH) differs from the delivery-time resolver (node:dns lookup), leaving a DNS-rebinding window. Authenticated (webhook registration requires a user/key).","reproduce":["Read api/_notification-webhook-ssrf.ts:170-199 — scheme/host/private-IP checks, no parsed.port","Compare registration DoH (webhook-shared.ts:37) vs delivery node:dns (deliver-webhook.ts:115-116)"],"poc":"Source-level: no port check present; the two resolvers differ. Auth-gated, so not remotely exploitable without a valid session.","impact":"An authorized user could register a webhook to a non-standard port on a public host, and the DNS-authority split creates a rebinding window. Low, auth-gated.","remediation":["Add a destination-port allowlist (443 only) to the validator","Use one pinned resolver for both registration and delivery, or socket-pin the resolved address"],"status":"code-verified"},{"id":"CR-4","severity":"info","title":"Internal-MCP body size cap is enforced after full buffering","component":"server/gateway.ts:1316-1336","summary":"A Content-Length pre-check is advisory; a chunked/lying body is fully buffered via arrayBuffer() before the byte cap rejects it.","cvss":"N/A — informational","cwe":"CWE-400","scope":"api","description":"The gateway pre-checks Content-Length (advisory), then does await request.clone().arrayBuffer(), then applies the post-buffer cap. A chunked request with no/incorrect Content-Length is fully buffered before rejection. Vercel's 4.5 MB request limit bounds practical impact.","reproduce":["Read server/gateway.ts:1316 (CL pre-check) → :1325 (arrayBuffer) → :1330 (byte cap)"],"poc":"Source-level: the comment says 'cap inbound body BEFORE buffering', but a chunked body reaches the buffering step first.","impact":"Bounded memory pressure on internal-MCP POSTs; capped by the platform's 4.5 MB request limit. Informational.","remediation":["Stream and count bytes with an early abort, rather than buffering then checking length"],"status":"code-verified"},{"id":"CR-5","severity":"info","title":"CORS denial responses echo an arbitrary Origin with Allow-Credentials: true","component":"api/_cors.js:166 (getOriginDeniedCorsHeaders)","summary":"Refusal responses reflect the request Origin + ACAC:true so clients can read the refusal; data responses use the fixed origin — intentional (#6411), not exploitable.","cvss":"N/A — informational (intentional trade-off)","cwe":"CWE-942 (Permissive Cross-domain Policy)","scope":"comms","description":"getOriginDeniedCorsHeaders sets Access-Control-Allow-Origin = request origin and Allow-Credentials: true — but ONLY on denial responses, whose bodies carry no data. The success path falls back to the fixed https://worldmonitor.app origin. Combined with SameSite=Lax cookies (not sent cross-site) and data-free denial bodies, there is no cross-origin read. Documented as intentional (#6411).","reproduce":["Send a hostile Origin to a credentialed endpoint → 403 body {\"error\":\"Origin not allowed\"} with ACAO:<that origin>","Send the allowed Origin → 200 data with ACAO:https://www.worldmonitor.app (fixed)"],"poc":"Verified live: evil origin received a 403 refusal (no data); the fixed origin received the data. The reflection accompanies only refusals.","impact":"None in practice — refusal bodies carry no data and the session cookie is SameSite=Lax. Reviewers flag the header shape; the mitigations make it safe. Informational.","remediation":["Optional: keep a maintenance guard/comment documenting the intentional refusal-echo so it isn't 'fixed' into breaking browser clients"],"status":"code-verified"},{"id":"CR-6","severity":"info","title":"WORLDMONITOR_VALID_KEYS parsed without trim() on some surfaces","component":"api/_api-key.js:23 · api/_oauth-token.js:85,95","summary":"Enterprise key list split on ',' with no per-entry trim on the API-key path, while a sibling parser trims — inconsistent, fail-closed.","cvss":"N/A — informational","cwe":"CWE-1078 (Inconsistent Behaviour)","scope":"auth","description":"isValidEnterpriseKey and the OAuth fingerprint/hash resolvers do (process.env.WORLDMONITOR_VALID_KEYS || '').split(',').filter(Boolean) with no .trim(), so a key configured with surrounding whitespace only matches when sent verbatim. Fail-closed (an errant space just fails to match).","reproduce":["Read api/_api-key.js:23 and api/_oauth-token.js:85,95 (no trim) vs server/_shared/embed-entitlement.ts:51 (trims)"],"poc":"Source-level: three parsers, two behaviours (trim vs no-trim).","impact":"No privilege escalation (fail-closed); operational confusion only. Informational.","remediation":["Use one shared parser that trims consistently across all key-reading surfaces"],"status":"code-verified"},{"id":"CR-7","severity":"low","title":"cache-purge explicit-keys path skips the durable-data guard","component":"api/cache-purge.js:127-133 (explicit) vs :135-147 (scan)","summary":"The explicit-keys loop checks only isBlocklisted; the scan loop also checks isDurableData — an authed caller can purge protected durable keys by naming them.","cvss":"N/A — auth-gated (requires RELAY_SHARED_SECRET)","cwe":"CWE-284 (Improper Access Control)","scope":"access-control","description":"For explicit keys, the handler checks isBlocklisted(k) but not isDurableData(k); the pattern/scan path checks both. So a caller with the purge secret can delete a durable-data key (military:bases:, conflict:iran-events:, conflict:ucdp-events:) by specifying it explicitly, bypassing the guard the scan path enforces.","reproduce":["Read api/cache-purge.js: explicit loop :127-133 (only isBlocklisted) vs scan loop :135-147 (adds isDurableData)","Authorized dry-run with {\"keys\":[\"military:bases:local-test\"],\"dryRun\":true} lists the protected key; the pattern dry-run excludes it"],"poc":"Source-level + dry-run comparison: explicit path includes a protected durable key that the pattern path omits. Auth-gated behind RELAY_SHARED_SECRET.","impact":"A caller holding the purge secret can delete a protected cached dataset until its producer recreates it. Auth-gated, Low.","remediation":["Add isDurableData(k) to the explicit-keys loop before allKeys.add(k)","Add a test covering protected keys through both explicit and pattern paths"],"status":"code-verified"},{"id":"CR-8","severity":"info","title":"Protocol-relative URLs (//evil.com) pass the URL sanitizers (link injection)","component":"src/utils/sanitize.ts:93 · src/utils/dom-utils.ts:131","summary":"//evil.com matches the relative-prefix rule and resolves to https://evil.com/ — link-injection/phishing only, no script execution.","cvss":"N/A — informational","cwe":"CWE-601 (Open Redirect / URL Redirection)","scope":"client","description":"sanitize.ts:93 uses /^(\\/|\\.\\/|\\.\\.\\/|\\?|#)/ which matches //evil.com (starts with /); new URL('//evil.com', base) resolves to https://evil.com/ and passes the protocol allowlist. dom-utils.ts:131 keeps an href that startsWith('/'), which //evil.com does. javascript: variants are correctly rejected.","reproduce":["Read src/utils/sanitize.ts:85-100 and src/utils/dom-utils.ts:125-140"],"poc":"Source-level: //evil.com passes both sanitizers and resolves to an external origin; no script execution possible.","impact":"A crafted protocol-relative link could redirect a user off-site (phishing). No script execution. Informational.","remediation":["Reject leading // in the relative-URL branch, or resolve then re-check the host against an allowlist"],"status":"code-verified"},{"id":"CR-9","severity":"info","title":"Enterprise-key parsing inconsistent: three parsers, two behaviours","component":"server/_shared/embed-entitlement.ts:51 vs CR-6 sites","summary":"parseEnterpriseApiKeys trims entries while the api-key/oauth parsers do not — same root as CR-6, fail-closed.","cvss":"N/A — informational","cwe":"CWE-1078","scope":"auth","description":"parseEnterpriseApiKeys (embed-entitlement.ts:51) does split(',').map(k => k.trim()).filter(Boolean), while api/_api-key.js:23 and api/_oauth-token.js:85,95 do not trim. Three parsers, two behaviours; fail-closed on the main path (no privilege escalation).","reproduce":["Read server/_shared/embed-entitlement.ts:51 (trims) vs api/_api-key.js:23 (no trim)"],"poc":"Source-level divergence between the three key parsers.","impact":"Operational inconsistency, no escalation. Informational.","remediation":["Consolidate to one shared, trimming key parser"],"status":"code-verified"},{"id":"N1","severity":"low","title":"GlobeMap tooltip interpolates severity raw on two sinks (missing esc)","component":"src/components/GlobeMap.ts:1545, :1556 (sink :1717)","summary":"Outage and cyber tooltips use ${d.severity.toUpperCase()} raw into trustedHtml while every sibling wraps it in esc() — defense-in-depth XSS gap.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79 (Cross-site Scripting)","scope":"client","description":"Lines 1545 (outage) and 1556 (cyber) interpolate ${d.severity.toUpperCase()} without esc(), while sibling branches (:1532,:1541,:1653,:1664) escape it. The value flows into setTrustedHtml(trustedHtml(...)) at :1717 (raw innerHTML). d.severity is a network/seeder-sourced string.","reproduce":["Read src/components/GlobeMap.ts:1545 and :1556 vs the esc()-wrapped siblings; sink at :1717"],"poc":"Source-level: two raw interpolations of a network-sourced string into a trusted-HTML sink.","impact":"If a compromised/malformed upstream feed supplies markup in severity, it renders in the dashboard origin (defense-in-depth XSS). Low; requires upstream compromise.","remediation":["Wrap both in esc(): esc(d.severity.toUpperCase())"],"status":"code-verified"},{"id":"N2","severity":"low","title":"Flight heading flows into a style attribute with no numeric coercion","component":"src/components/GlobeMap.ts:1099","summary":"const heading = d.heading ?? 0 (nullish only) → style=\"transform:rotate(${heading}deg)\" inside trustedHtml — a string breaks the attribute.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79","scope":"client","description":"?? guards only null/undefined, not type; if the server delivers heading as a string, it is interpolated verbatim into a style attribute inside trustedHtml. A value containing a quote or semicolon breaks out of the attribute.","reproduce":["Read src/components/GlobeMap.ts:1095-1104"],"poc":"Source-level: no Number()/clamp on heading before it enters the style attribute.","impact":"Attribute-injection / defense-in-depth XSS if a compromised flight feed supplies a non-numeric heading. Low.","remediation":["Coerce and clamp: Number(d.heading) || 0, clamped to 0-359"],"status":"code-verified"},{"id":"N3","severity":"low","title":"Aviation-news caches an empty success for 15 minutes on total outage","component":"server/worldmonitor/aviation/v1/list-aviation-news.ts:110-118, :165","summary":"fetchFeed swallows all failures to []; the fixed-key cache stores {items:[]} for 15 min and reports source:'rss' (looks healthy).","cvss":"N/A — availability / robustness","cwe":"CWE-544 (Missing Standardized Error Handling)","scope":"api","description":"fetchFeed maps 401/403/!ok/throw to []; the cache callback always returns {items:allItems} under the fixed key aviation:news:feeds:v2 (TTL 900s). When all feeds fail, {items:[]} is cached for 15 minutes and the success path returns source:'rss' — indistinguishable from 'no news exists'. Only a thrown exception yields source:'error', which fetchFeed prevents.","reproduce":["Read list-aviation-news.ts: fetchFeed :63-89, cache callback :110-118, success return :165-169"],"poc":"Source-level: all-feeds-down produces a cached empty 'healthy' snapshot for 15 minutes.","impact":"During an upstream outage, users see 'no aviation news' for up to 15 minutes even after recovery, and health monitoring cannot see it. Availability/robustness.","remediation":["Throw on all-feeds-failed or return source:'error' + dataAvailable:false and skip caching an empty snapshot"],"status":"code-verified"},{"id":"N4","severity":"low","title":"Cache-tier comment claims internal-MCP coverage the code omits","component":"server/gateway.ts:2513, :2524","summary":"The private-response classifier and CDN gate omit an internalMcpVerified term the comment says they cover — latent cache risk.","cvss":"N/A — conditional / latent","cwe":"CWE-524 (Use of Cache Containing Sensitive Information)","scope":"api","description":"The comment at :2508-2512 says the classification covers premium/internal-MCP callers, but isPrivateResponse (:2513) and the CDN gate (:2524) have no internalMcpVerified term, while internalMcpVerified (set :1442) skips tier/rate/quota. Impact is conditional: internal-MCP HMAC headers aren't credential-bearing by design and no-origin server calls miss isAllowedOrigin.","reproduce":["Read server/gateway.ts:2508-2529 and compare to the internalMcpVerified assignment at :1442"],"poc":"Source-level: the comment/code mismatch; no internalMcpVerified in the private/CDN classification.","impact":"Latent — if a future non-premium internal-MCP GET handler omits no-store, its per-principal body could take a shared tier + CDN cache. Low/conditional.","remediation":["OR internalMcpVerified into isPrivateResponse and the CDN gate, or fix the comment and audit every internal-MCP GET for handler no-store"],"status":"code-verified"},{"id":"N5","severity":"low","title":"Health endpoint blind spots (presence-only cascades, unregistered keys)","component":"api/health.js (multiple)","summary":"Cascade checks test presence not freshness, several served keys aren't registered in the sweep, and fallbacks carry no clock — health can under-report staleness.","cvss":"N/A — monitoring / robustness","cwe":"CWE-754 (Improper Check for Unusual Conditions)","scope":"infra","description":"The orphan sweep covers only BOOTSTRAP_KEYS + STANDALONE_KEYS (several served keys are absent); isCascadeCovered checks presence only and buckets fallbacks as ok with no clock; ~21 names are presence-only with an empty readSeedMeta. Net: a seeder that publishes an empty-but-successful run or fails with only state:ERROR can read as healthy.","reproduce":["Read api/health.js sweep (:5208-5212), isCascadeCovered (:3020-3031), and the presence-only meta reads (:2738-2739)"],"poc":"Source-level pattern: presence-only checks + unregistered served keys.","impact":"Operator dashboard can show a country/dataset as healthy during a real source outage. Monitoring gap.","remediation":["Register every served key, gate cascades on freshness, default unknown-age to WARN, never CDN-cache missing[] tiers"],"status":"code-verified"},{"id":"N6","severity":"low","title":"Seeder fleet gaps (lock atomicity, exit-0 on fatal, raw key interpolation)","component":"scripts/_seed-utils.mjs · seed-ucdp-events.mjs:411 · ais-relay.cjs:11951","summary":"Env-file fallback on typo, exit(0) on fatal (green on failure), api_key interpolated without encoding, and single SET NX PX locks without renewal.","cvss":"N/A — robustness / hardening","cwe":"CWE-667 (Improper Locking)","scope":"infra","description":"Cross-cutting seeder robustness issues: WM_SEED_ENV_FILE set-but-missing falls back to the checkout .env.local; some seeders process.exit(0) on fatal (reports green to the bundle runner); ais-relay interpolates api_key into a URL without encodeURIComponent; distributed locks use a single SET NX PX with no heartbeat/renewal.","reproduce":["Read scripts/_seed-utils.mjs:353-362, seed-ucdp-events.mjs:408-414, ais-relay.cjs:11951, and the SET NX PX lock sites"],"poc":"Source-level: multiple robustness gaps; some are intentional-by-comment (cron exit-0).","impact":"Silent seed failures reported as success, mis-encoded keys, and non-renewing locks — data-freshness and reliability risk. Robustness.","remediation":["Exit non-zero (or 75/GRACEFUL_FAIL) on fatal; encodeURIComponent for URL params; add lock heartbeat/fencing; fail hard on a missing env file"],"status":"code-verified"},{"id":"N7","severity":"info","title":"urlState.LAYER_KEYS drops 20 map layers from shareable URLs","component":"src/utils/urlState.ts:4","summary":"LAYER_KEYS is a hand-maintained array; TypeScript enforces validity but not completeness, so new layers silently drop out of shared URL state.","cvss":"N/A — informational / UX","cwe":"CWE-1188 (Insecure Default)","scope":"client","description":"LAYER_KEYS is a manually maintained (keyof MapLayers)[]. The compiler checks each entry is a valid key but not that the list is complete, so ~20 layers (dayNight, radiationWatch, stockExchanges, ...) are omitted and never serialized into shareable URLs.","reproduce":["Read src/utils/urlState.ts:4 vs the MapLayers interface"],"poc":"Source-level: 20 MapLayers keys are absent from LAYER_KEYS.","impact":"Share links silently drop those layer toggles. UX/completeness. Informational.","remediation":["Derive the key list from MapLayers at runtime (or add an exhaustiveness check)"],"status":"code-verified"},{"id":"N8","severity":"low","title":"HormuzPanel status badge interpolates status raw into unsafeRawHtml","component":"src/components/HormuzPanel.ts:256, :266 · src/services/hormuz-tracker.ts:31","summary":"${d.status.toUpperCase()} is interpolated raw into unsafeRawHtml while the sibling date field is escaped; status comes from a bare `as` cast with no runtime validation.","cvss":"N/A — client-side defense-in-depth","cwe":"CWE-79","scope":"client","description":"The strait-status badge at :256 interpolates d.status raw; the assembled html is written via unsafeRawHtml at :266. The sibling d.updatedDate at :250 is escapeHtml()-wrapped. HormuzTrackerData.status is declared as a union but produced by (await resp.json()) as HormuzTrackerData (bare assertion, no runtime validation), so at runtime it is whatever the endpoint returns.","reproduce":["Read src/components/HormuzPanel.ts:256 (raw) and :250 (escaped sibling); src/services/hormuz-tracker.ts:31 (bare `as` cast)"],"poc":"Source-level: raw network-sourced string into a raw-HTML sink; same class as N1 in a different component.","impact":"If the /api/supply-chain/hormuz-tracker response is tampered/malformed, markup in status renders in the app origin (defense-in-depth XSS). Low.","remediation":["Wrap in escapeHtml(d.status.toUpperCase()); validate status against its union at the fetch boundary instead of a bare `as` cast"],"status":"code-verified"},{"id":"N9","severity":"medium","title":"AgentSkills import: (function(){const root=document.documentElement,t=document.getElementById('tgl');
  let saved=null;try{saved=localStorage.getItem('wm-theme')}catch(e){}
  if(saved==='dark'||saved==='light')root.setAttribute('data-theme',saved);
  t.addEventListener('click',()=>{const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const n=cur==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('wm-theme',n)}catch(e){}});})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

FINDINGS.sort((a,b)=>{const d=SEV.indexOf(a.severity)-SEV.indexOf(b.severity);if(d)return d;return String(a.id).localeCompare(String(b.id),undefined,{numeric:true});});

function renderStats(){const c={};SEV.forEach(s=>c[s]=FINDINGS.filter(f=>f.severity===s).length);
  document.getElementById('stats').innerHTML=
    `<span class="stat"><b>${FINDINGS.length}</b> total</span>`+
    SEV.map(s=>`<span class="stat ${s.slice(0,4)}"><b>${c[s]}</b> ${SEVLABEL[s]}</span>`).join('');}

function renderChips(){const box=document.getElementById('chips');
  box.innerHTML=SEV.map(s=>`<button class="chip c-${s.slice(0,4)}" data-sev="${s}" aria-pressed="false">${SEVLABEL[s]}</button>`).join('');
  box.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{const s=ch.dataset.sev;
    if(active.has(s)){active.delete(s);ch.setAttribute('aria-pressed','false');}else{active.add(s);ch.setAttribute('aria-pressed','true');}renderList();}));}

function matches(f){if(active.size&&!active.has(f.severity))return false;if(!query)return true;
  return (f.id+' '+f.title+' '+(f.component||'')+' '+(f.summary||'')+' '+(f.scope||'')).toLowerCase().includes(query);}

function renderList(){const items=FINDINGS.filter(matches);const list=document.getElementById('list');
  document.getElementById('count').textContent=items.length+' of '+FINDINGS.length+' shown';
  if(!items.length){list.innerHTML='<div class="empty">No findings match your filters.</div>';return;}
  list.innerHTML=items.map(f=>{const live=f.status==='confirmed-live'?' · LIVE':'';
    return `<button class="row sev-${f.severity}" role="option" data-id="${esc(f.id)}" aria-current="${f.id===currentId}">
      <span class="stripe"></span>
      <span class="main"><span class="rid">${esc(f.id)}${live}</span><span class="rtitle">${esc(f.title)}</span></span>
      <span class="badge"><span class="sevmini sev-${f.severity}">${SEVLABEL[f.severity]}</span></span>
    </button>`;}).join('');
  list.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>select(r.dataset.id)));}

function select(id){const f=FINDINGS.find(x=>x.id===id);if(!f)return;currentId=id;
  document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-current',String(r.dataset.id===id)));
  const meta=[['Affected component',f.component],['Severity',f.cvss],['CWE',f.cwe],['Scope',f.scope],['Status',f.status]]
    .filter(m=>m[1]).map(m=>`<div class="m"><div class="k">${m[0]}</div><div class="v">${esc(m[1])}</div></div>`).join('');
  const steps=Array.isArray(f.reproduce)&&f.reproduce.length?`<ol class="steps">${f.reproduce.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';
  const fixes=Array.isArray(f.remediation)&&f.remediation.length?`<ul class="fixes">${f.remediation.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
  const gated=f.status==='confirmed-live';
  const live=gated?'<span class="livetag">CONFIRMED LIVE</span>':'';
  document.getElementById('detail').innerHTML=`<div class="detail-inner">
    <button class="back" id="back">← All findings</button>
    <div class="dhead"><span class="did">${esc(f.id)}</span><span class="sevpill sev-${f.severity}">${SEVLABEL[f.severity]}</span>${live}</div>
    <h1 class="dtitle">${esc(f.title)}</h1>
    <div class="metagrid">${meta}</div>
    ${f.description?`<div class="sec"><h3>Description</h3><p>${esc(f.description)}</p></div>`:''}
    ${steps?`<div class="sec"><h3>Steps to reproduce</h3>${steps}</div>`:''}
    ${f.poc?`<div class="sec"><h3>Proof of concept</h3><div class="poc">${esc(f.poc)}</div>${gated?'<div class="disclose">Exact live payload withheld — responsibly disclosed to the maintainer under coordinated disclosure.</div>':''}</div>`:''}
    ${f.impact?`<div class="sec"><h3>Business impact</h3><div class="impactbox"><p>${esc(f.impact)}</p></div></div>`:''}
    ${fixes?`<div class="sec"><h3>Remediation</h3>${fixes}</div>`:''}
    <div class="psbar"><details><summary>Problem statement &amp; scope <span class="cv">NTRO · PS 26163</span></summary>
      <div class="pc"><p><b>Background.</b> World Monitor is a web/mobile platform for real-time monitoring, analytics and reporting, handling authentication, data visualization, API communication and role-based access control.</p>
      <h4>Scope</h4><ul><li>Authentication &amp; session management</li><li>Authorization &amp; access control</li><li>Input validation &amp; data handling</li><li>API security</li><li>Client-side security controls</li><li>Secure communication</li><li>Data storage &amp; privacy</li></ul>
      <h4>Constraints observed</h4><ul><li>Authorized systems only · read-only / GET verification</li><li>No production data modified</li><li>PoC-only exploitation · coordinated disclosure</li></ul></div></details></div>
  </div>`;
  document.body.classList.add('detail-open');
  const back=document.getElementById('back');if(back)back.addEventListener('click',()=>{document.body.classList.remove('detail-open');});
  document.getElementById('detail').scrollTop=0;
  if(history.replaceState)history.replaceState(null,'',location.pathname+location.search+'#'+id);
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderList();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('detail-open');});

renderStats();renderChips();renderList();
/* open at rest: deep-link, else the CRITICAL, else first */
const hashId=decodeURIComponent((location.hash||'').replace('#',''));
const initial=FINDINGS.find(f=>f.id===hashId)||FINDINGS.find(f=>f.severity==='critical')||FINDINGS[0];
if(initial)select(initial.id);
</script>
</body>
</html>
