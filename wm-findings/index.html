a for up to 30 minutes (and across reloads)"],"poc":"Static: getWbBreaker executes with DEFAULT_CACHE_KEY, so countries/years never enter the key.","impact":"The tech-indicators panel shows a different country's or year-range's figures than requested, with no stale marker and persistence across reloads — a correctness/data-integrity defect.","remediation":["Pass a cacheKey built from countries+years (mirror the aviation/consumer-prices breakers)","Add a test asserting two distinct requests produce distinct breaker cache entries"],"status":"code-verified"},{"id":"V56","severity":"low","title":"x-intel cache serves a larger limit's payload to a smaller request","component":"src/services/x-intel.ts:70 (and the :71 inFlight map)","summary":"The cache check `cachedLimit >= limit` serves a limit=50 response to a limit=5 request, while the adjacent inFlight map keys by exact limit — two contradictory notions of query identity.","cvss":"N/A — correctness / cache-collision","cwe":"CWE-524","scope":"client","description":"x-intel.ts:70 `if (cachedResponse && cachedLimit >= limit && …) return cachedResponse;` — the comparison direction is the bug: a limit=50 response satisfies a limit=5 request. The inFlight map two lines down (:71) keys by limit exactly — so the module holds two contradictory notions of query identity in adjacent lines. Low in practice: the only production caller passes a constant 50 (data-loader.ts:5075).","reproduce":["Read x-intel.ts:70 (cachedLimit>=limit) vs :71 (inFlight keyed by exact limit)","Request limit=50 then limit=5","Observe the limit=5 request served the 50-item payload"],"poc":"Static: cachedLimit>=limit serves an oversized payload; the sibling inFlight map disagrees on identity.","impact":"A smaller-limit x-intel request can be served a larger cached payload (over-fetch), a minor correctness inconsistency (bounded because the only caller uses a constant limit).","remediation":["Key the cache on the exact limit (align with the inFlight map)","Add a test asserting a smaller limit is not served a larger cached payload"],"status":"code-verified"},{"id":"V57","severity":"low","title":"insights-loader shared abort can be armed past the point the shared promise matters","component":"src/services/insights-loader.ts:148-159/118/219-221","summary":"armInFlightTimeout uses Math.max on an already-expired deadline and its guard requires inFlightAbortTimer!==null, but abortInFlightRequest nulls that timer while inFlight is cleared only in finally — so a joining caller re-aborts a dead controller and discards its own budget.","cvss":"N/A — robustness (self-healing)","cwe":"CWE-362 (Race Condition)","scope":"client","description":"insights-loader.ts:148-159 armInFlightTimeout uses Math.max on inFlightDeadlineMs, and its early-return guard requires inFlightAbortTimer!==null. abortInFlightRequest nulls that timer (:118) while inFlight is only cleared in the promise's finally (:219-221). In that window a joining caller's guard fails, Math.max keeps the already-expired deadline, remaining003c=0 fires, and it re-aborts a dead controller — discarding the new caller's budget. Narrow and self-healing (one wasted retry), not a stuck loading state.","reproduce":["Read insights-loader.ts:148-159/118/219-221","Join an in-flight request in the window between abort (timer nulled) and finally (inFlight cleared)","Observe the joining caller re-abort a dead controller and lose its budget"],"poc":"Static: the arm/abort timing lets a joining caller re-abort with an expired deadline.","impact":"A narrow race wastes one insights-loader retry for a caller that joins at the wrong moment — self-healing, not a stuck state.","remediation":["Clear inFlight and the timer atomically (or guard on inFlight rather than the timer)","Add a test exercising the join-during-abort window"],"status":"code-verified"},{"id":"V58","severity":"low","title":"A server-rejected wm_ tester key is never cleared from localStorage / document.cookie","component":"src/services/browser-key-session.ts:50-67 · api/wm-session.ts:777-778","summary":"migrateLegacyKeysToHttpOnlySession returns false on a refused mint and clearLegacyKeyStorage runs only on success, and callers only handle throws — so a permanently-invalid key persists in JS-readable storage and is retried forever.","cvss":"N/A — storage hygiene","cwe":"CWE-312 (Cleartext Storage of Sensitive Information)","scope":"storage","description":"browser-key-session.ts:50-67 migrateLegacyKeysToHttpOnlySession does `if(!ok) return false`, and clearLegacyKeyStorage is only reached on success. establishWmKeySession returns false (does not throw) on a refused mint (wm-session.ts:777-778). Every production call site is either void …catch() (widget-store.ts:177) or if(!ok) return false — and .catch() only handles throws, so a permanent 401 Invalid session key is indistinguishable from a network blip and is retried forever, silently, with the raw key persisting in JS-readable storage. Contradicts the storage-hygiene invariant the module exists to enforce (everything else moved to HttpOnly).","reproduce":["Read browser-key-session.ts:50-67 (clear only on success) and wm-session.ts:777-778 (refused → false, not throw)","Present a permanently-invalid wm_ key","Observe it remains in localStorage/cookie and is retried on every load"],"poc":"Static: a refused mint returns false (not throw), so the clear-on-failure path never runs and the raw key persists.","impact":"A rejected legacy tester key stays in JS-readable storage indefinitely and is retried forever, contradicting the module's HttpOnly-migration hygiene goal — a minor storage-hygiene and churn issue.","remediation":["Distinguish a refused mint from a network error and clear the legacy key on refusal","Add a test asserting a refused key is removed from storage"],"status":"code-verified"},{"id":"V60","severity":"high","title":"MCP get_tariff_trends serves two Pro datasets to authenticated free accounts","component":"api/mcp/registry/cache-tools.ts:2422/2497-2502 · api/mcp/dispatch.ts:321-347 · registry/index.ts:52-59","summary":"The get_tariff_trends MCP tool reads Pro seed keys (national-debt, etc.) but omits _subscriptionOnly, so toolAccess() classifies it 'free-account' and dispatch meters-but-serves it to free accounts.","cvss":"N/A — entitlement bypass (Pro data to free tier)","cwe":"CWE-285 (Improper Authorization)","scope":"access-control","description":"cache-tools.ts:2497-2502 lists `_cacheKeys:['trade:tariffs:v2:840','economic:bigmac:v1','economic:fao-ffpi:v1','economic:national-debt:v1']` — the seed keys of the tier-1 get-tariff-trends and the PREMIUM get-national-debt. The tool definition at :2422 omits _subscriptionOnly, so toolAccess() (registry/index.ts:52-59, which returns 'subscription' only for _subscriptionOnly or _execute) classifies it 'free-account'. dispatch.ts:332 denies only toolAccess==='subscription' → 'free-account' passes, and :347 reserves an allowance slot. The sibling proves the omission: cache-tools.ts:1814-1815 sets name:'get_sanctions_data', _subscriptionOnly:true for the same class of Pro read, and dispatch.ts:321-332's comment says 'Explicit subscription tools (including sanctions cache reads) … are denied before metering.' docs/mcp-overview.mdx:393 publishes get-national-debt as this tool's REST twin, and tools/list advertises worldmonitor/access:'free-account'.","reproduce":["Read cache-tools.ts:2422 (no _subscriptionOnly) and :2497-2502 (_cacheKeys include economic:national-debt:v1)","Read registry/index.ts:52-59 (toolAccess) and dispatch.ts:321-347 (only 'subscription' is denied)","As an authenticated free MCP account, call get_tariff_trends","Observe the national-debt/bigmac/FAO Pro datasets returned (metered, not denied)"],"poc":"Static: _cacheKeys intersect a TIER_GATED_PATHS seed key while _subscriptionOnly is absent, so toolAccess='free-account' and dispatch serves it.","impact":"Authenticated free MCP accounts obtain two Pro datasets (per-country national debt + tariff/pricing indicators) that the REST routes gate behind entitlement — a direct monetisation/entitlement bypass on the MCP surface.","remediation":["Add _subscriptionOnly:true to the get_tariff_trends definition (:2423), matching get_sanctions_data","Add a test asserting every cache tool whose _cacheKeys intersect a TIER_GATED_PATHS seed key is flagged _subscriptionOnly","Reconcile tools/list access metadata for the tool"],"status":"code-verified"},{"id":"V61","severity":"high","title":"Generated GET decoder emits 0 for absent params, so every ?? default is dead code (28 files)","component":"src/generated/server/worldmonitor/**/service_server.ts (decoder) · consumers e.g. webcam/list-webcams.ts:78-82, aviation/get-carrier-ops.ts:51-55","summary":"The codegen emits Number(params.get(x) ?? '0') = 0 for an absent optional numeric query param, and ?? doesn't fall through on 0, so every handler's `req.x ?? default` is unreachable — collapsing bboxes, windows and thresholds to 0 across 28 generated files.","cvss":"N/A — systemic correctness (multiple handlers)","cwe":"CWE-670 (Always-Incorrect Control Flow Implementation)","scope":"input","description":"Root cause: the generated GET decoder produces `zoom: Number(params.get('zoom') ?? '0')` and the same for every bound field — it never yields undefined, it yields 0, and `??` does not treat 0 as missing. Consumer example list-webcams.ts:78-82 does `req.boundW ?? -180`, `req.zoom ?? 3` etc. — all five defaults are unreachable, so the box collapses to qW=qS=qE=qN=0 → widthKm=heightKm=0 → geoSearchByBoxStrict(0,0,0,0) → empty list, HTTP 200, and it is written to the response cache. The repo has already diagnosed this class at get-carrier-ops.ts:51-55 ('the generated GET decoder emits 0 when min_flights is absent … 0 means use the default here') and fixed exactly one handler via `req.minFlights > 0 ? … : 3`. The Number(params.get(...)) decoder pattern appears in 28 generated service files; confirmed same-defect instances include get-bypass-options (closurePct→0 drops full-closure corridors), list-aviation-news (windowHours→0, maxItems→0 → empty), get-multi-sector-cost-shock (closureDays 30× too small), search-flight-prices (limit 1 instead of 10). POST/JSON bodies are unaffected (an omitted JSON key really is undefined).","reproduce":["Read a generated decoder, e.g. webcam/v1/service_server.ts:110-114 — Number(params.get('zoom') ?? '0')","Read the consumer list-webcams.ts:78-82 — req.zoom ?? 3 etc. (unreachable)","Read the documented workaround at get-carrier-ops.ts:51-55","GET a query-param RPC omitting the optional numeric param → observe the default is not applied (0 used)"],"poc":"Static: decoder emits 0, not undefined; ?? does not fall through on 0; get-carrier-ops.ts documents and works around the exact behavior for one route.","impact":"Across ~28 generated GET RPCs, omitting a documented-optional numeric param silently substitutes 0 instead of the intended default, producing empty or wrong results with HTTP 200 (and often cached): webcams/vessels return nothing, aviation news windows collapse, cost-shock is 30× understated, page sizes shrink — a broad correctness/data-integrity failure invisible to callers using the documented API.","remediation":["Fix the codegen to emit undefined (not 0) for an absent optional numeric query param, so ?? defaults work","Interim: apply the get-carrier-ops.ts `> 0 ? x : default` guard at each affected consumer","Add a codegen test asserting no numeric optional query field is defaulted with ?? against a decoder that emits 0"],"status":"code-verified"},{"id":"V62","severity":"high","title":"Both earthquake exporters multiply an already-millisecond epoch by 1000","component":"src/utils/export.ts:119 · src/utils/export-report.ts:164 (proto: earthquake.proto:25)","summary":"occurredAt is Unix epoch milliseconds, but both the CSV and PDF exporters do new Date(occurredAt * 1000), dating every earthquake ~57,000 years in the future in an expanded-year ISO form most parsers can't read.","cvss":"N/A — data correctness (exported artefact)","cwe":"CWE-682 (Incorrect Calculation)","scope":"client","description":"proto/worldmonitor/seismology/v1/earthquake.proto:25 documents occurredAt as 'Unix epoch milliseconds'. export.ts:119 does `new Date(e.occurredAt * 1000).toISOString()` and export-report.ts:164 does `isoOrEmpty(e.occurredAt * 1000)` — multiplying milliseconds by 1000. The sibling consumers agree the value is already ms: MapPopup.ts:1386 uses `new Date(earthquake.occurredAt)` (no multiplier) and DeckGLMap.ts:1929 likewise. Verified: new Date(1759000000000*1000).toISOString() → '+057710-06-29T…', the ISO-8601 expanded-year form that most spreadsheet/date parsers cannot read.","reproduce":["Read export.ts:119 and export-report.ts:164 (both * 1000) vs the proto comment (milliseconds) and MapPopup.ts:1386 (no multiplier)","Export earthquakes to CSV or the PDF data report","Observe every occurredAt rendered as a year ~57,000 (expanded-year ISO), e.g. +057710-…"],"poc":"Runtime: new Date(1759000000000 * 1000).toISOString() → '+057710-06-29T07:06:40.000Z' vs correct '2025-09-27T19:06:40.000Z'.","impact":"Every earthquake timestamp in both the CSV export and the PDF data report — the artefacts a user takes away from the product — is corrupted to a year ~57,000 in the future in a format spreadsheets and parsers reject, silently breaking any downstream analysis of exported seismic data.","remediation":["Drop the * 1000 in both export.ts:119 and export-report.ts:164 (occurredAt is already ms)","Add a unit test asserting a known epoch-ms value exports to the correct ISO date","Consider a shared toIsoFromEpochMs helper to prevent divergence"],"status":"code-verified"},{"id":"V63","severity":"medium","title":"Aviation-news window filter is bypassed for undated items, which are then stamped now","component":"server/worldmonitor/aviation/v1/list-aviation-news.ts:129-133/155/163","summary":"new Date(str).getTime() returns NaN (never throws), so the try/catch 'skip' comment is wrong; NaN003ccutoff is falsy, the window filter never fires, and the item is stamped `now` and sorted freshest.","cvss":"N/A — correctness / freshness","cwe":"CWE-754","scope":"input","description":"list-aviation-news.ts:129-133 `try { publishedAt = new Date(item.pubDate).getTime(); } catch { /* skip */ }` — new Date(string).getTime() NEVER throws, it returns NaN, so the 'skip' comment is wrong. NaN && NaN003ccutoff is falsy → the window filter never fires → :155 `publishedAt: publishedAt || now` stamps the item with the current time → :163 sorts it newest-first. Reachable: :48 `pubDate: String(item?.pubDate ?? item?.published ?? item?.updated ?? '')` yields '' for a feed using only dc:date or none. Undated items bypass even window_hours=1 and always render as the freshest story in AirlineIntelPanel.ts:522.","reproduce":["Read list-aviation-news.ts:129-133 (NaN, not throw) and :155/:163 (stamp now, sort newest)","Provide a feed item with no parseable pubDate (e.g. dc:date only)","Observe it bypasses window_hours and renders as the newest story"],"poc":"Static: getTime() → NaN → filter never fires → item stamped now and sorted first.","impact":"Undated aviation-news items ignore the freshness window and always surface as the most recent story, misrepresenting recency for a feed whose value is timeliness.","remediation":["Guard with Number.isFinite(publishedAt); drop or de-prioritize undated items instead of stamping them now","Add a test with an undated feed item asserting it is not treated as freshest"],"status":"code-verified"},{"id":"V64","severity":"medium","title":"The relay's ETF parser pairs price and volume from different bars; the shared provider already fixed it","component":"scripts/ais-relay.cjs:3777-3787 (vs scripts/shared/etf-flow-provider.mjs:40-50)","summary":"ais-relay filters close and volume arrays independently, so it pairs price from one bar with volume from another, and derives flow sign from priceChange>0 so a flat ETF contributes a negative flow — both writers share one Redis key.","cvss":"N/A — data correctness (financial)","cwe":"CWE-682","scope":"infra","description":"etf-flow-provider.mjs:40-50 filters close and volume TOGETHER, with the comment 'Yahoo routinely nulls one but not the other, and pairing today's volume with yesterday's close fabricated false flows.' ais-relay.cjs:3777-3787 still filters the two arrays INDEPENDENTLY — so with close=[c0,c1,null], volume=[v0,v1,v2] the relay uses price from bar 2 with volume from bar 3. Worse: :3787 derives the flow sign from priceChange>0?1:-1, so a flat ETF (priceChange===0, direction 'neutral' at :3786) contributes a NEGATIVE dollar flow and can flip the panel's NET INFLOW/OUTFLOW headline (ETFFlowsPanel.ts:126). Both implementations write market:etf-flows:v1 (seed-etf-flows.mjs:12 and ais-relay.cjs:3818), and the relay runs its own loop (:4211), so which numbers appear depends on which writer ran last.","reproduce":["Read ais-relay.cjs:3777-3787 (independent filters, sign from priceChange) vs etf-flow-provider.mjs:40-50 (paired filter)","Feed a series where close nulls but volume doesn't","Observe mismatched price/volume pairing and a negative flow for a flat ETF; the panel headline can flip"],"poc":"Static: independent close/volume filtering pairs across bars, and priceChange>0?1:-1 makes a flat ETF negative; both writers share market:etf-flows:v1.","impact":"ETF flow figures are fabricated (mismatched bars) and a flat ETF is counted as an outflow, which can flip the NET INFLOW/OUTFLOW headline — incorrect financial data presented to users, non-deterministic by which writer ran last.","remediation":["Port the paired-filter logic from etf-flow-provider.mjs to ais-relay.cjs:3777-3787 and handle neutral (0) flows as zero","Have one writer own market:etf-flows:v1","Add a test with null-close bars and a flat ETF"],"status":"code-verified"},{"id":"V65","severity":"medium","title":"clusterByProximity grid cells collapse to ~1% of the search radius above 89.43° latitude","component":"src/services/correlation-engine/engine.ts:243-246/257-259","summary":"cellSizeLon uses cellSizeLat/cosLat but the cosLat>0.01 guard discards the divisor instead of clamping it, so above ~89.43° the longitude cell is ~160× too narrow and near-pole point pairs are never compared.","cvss":"N/A — correctness (geospatial clustering)","cwe":"CWE-682","scope":"client","description":"engine.ts:243-246 `const cellSizeLon = cosLat > 0.01 ? cellSizeLat/cosLat : cellSizeLat;` — the guard avoids dividing by ~0 but DISCARDS the divisor instead of clamping it, falling back to a latitude-width cell used as a longitude-width cell. At 89.5° one degree of longitude is 111.32×cos(89.5°) ≈ 0.696 km, so the cell spans ≈0.006×radiusKm — ~160× too narrow — while two points within radiusKm can be thousands of columns apart. The 3×3 neighbour scan (:257-259) is only a prefilter, so such pairs are never passed to haversineKm. Also a hard discontinuity: correct at 89.42°, 160× too small at 89.43°. Practical impact is small (few clustered signals above 89.4°) but the branch is provably wrong.","reproduce":["Read engine.ts:243-246 (guard discards the divisor) and :257-259 (3×3 prefilter)","Place two signals within radiusKm near 89.5° latitude","Observe they fall in non-adjacent grid columns and are never compared by haversineKm"],"poc":"Static/numeric: above 89.43° the longitude cell is ~160× too small, and the discontinuity flips at exactly 89.43°.","impact":"Correlated signals near the poles are not clustered, so polar co-located events are missed — a bounded but provable geospatial-clustering correctness bug.","remediation":["Use cellSizeLat / Math.max(0.01, cosLat) (clamp, don't discard)","Add a test for near-pole point pairs asserting they cluster"],"status":"code-verified"},{"id":"V66","severity":"low","title":"setMonth() overflow makes the 'last N months' window one period short on 7-11 days/year","component":"src/config/ai-regulations.ts:481 · scripts/seed-bis-data.mjs:130-131/158-159","summary":"cutoffDate.setMonth(getMonth()-months) preserves day-of-month, so e.g. July 31 minus 6 months overflows February 31 to March 3, moving the cutoff a month later than intended.","cvss":"N/A — correctness (date math)","cwe":"CWE-682","scope":"input","description":"ai-regulations.ts:481 and seed-bis-data.mjs:130-131,158-159 `cutoffDate.setMonth(cutoffDate.getMonth()-months)` preserve day-of-month, so July 31 minus 6 months yields February 31 → March 3, moving the cutoff a month later than intended. The correct sibling pattern is already in the repo: operational-balance.ts:45 and us-cpi-monthly.ts:45 both anchor on day 01.","reproduce":["Read ai-regulations.ts:481 / seed-bis-data.mjs:130-131/158-159 (setMonth day-of-month) vs the day-01 siblings","Compute a 6-month window from a 31st","Observe the cutoff overflow (e.g. Feb 31 → Mar 3)"],"poc":"Runtime: new Date('2026-07-31').setMonth(m-6) overflows to early March, shortening the window.","impact":"On the 7-11 days/year that trigger the overflow, the 'last N months' window is one period short, subtly excluding data — a date-math correctness defect.","remediation":["setDate(1) before setMonth, or use Date.UTC(y, m-months, 1) (mirror operational-balance.ts:45)","Add a test for month-end inputs"],"status":"code-verified"},{"id":"V67","severity":"high","title":"Three copies of the seed-meta health rule; the weakest owns the source-failure detector","component":"server/worldmonitor/resilience/v1/_dimension-freshness.ts:129-143 (strict) · _source-failure.ts:153-160 (weak) · _dimension-scorers.ts:1106-1114 (weak)","summary":"Three predicates classify seed-meta health with different strictness; the weakest (status+fetchedAt only, no state/recordCount) governs the source-failure detector and two fail-closed activation gates, so an ERROR/empty seed is treated as healthy.","cvss":"N/A — monitoring correctness / masked outage","cwe":"CWE-1041 (Redundant Code / divergent duplicates)","scope":"infra","description":"There are three copies of the seed-meta health rule. STRICT — _dimension-freshness.ts:129-143 seedMetaIsFreshnessEligible checks status AND state (must be OK/OK_ZERO) AND recordCount. WEAK(1) — _source-failure.ts:153-160: nonOk = Boolean(status) && status!=='ok' (absent status → false), stale requires hasFetchedAt (absent → false); `if(!nonOk && !stale) return` → treated healthy. WEAK(2) — _dimension-scorers.ts:1106-1114 isSeedMetaPreflightUnhealthy checks status+fetchedAt only (no state, no recordCount) and gates two fail-closed activation paths (:2151 education, :2384 financialSystemExposure). A meta of {state:'ERROR',fetchedAt:fresh} is reported stale by the freshness path (UI shows stale) but healthy by both source-failure paths. _source-failure.ts:5-8 states it is 'the ONLY place … that distinguishes country-not-in-source from seed-upstream-down' — so the weakest predicate owns the most important decision.","reproduce":["Read the three predicates: _dimension-freshness.ts:129-143, _source-failure.ts:153-160, _dimension-scorers.ts:1106-1114","Construct a seed-meta {state:'ERROR', fetchedAt:003cfresh>} (no bad status)","Observe the freshness path flags stale while both source-failure paths classify healthy → no source-failure tag, preflight passes"],"poc":"Static: absent status and present-but-fresh fetchedAt make the source-failure predicate return 'healthy' for an ERROR-state, empty-but-successful seed run.","impact":"A seeder that publishes an empty-but-successful run, or fails with only state:ERROR, yields a dimension that keeps imputationClass 'stable-absence' (score 85) or 'unmonitored' (50) — the widget renders 'this country has no crisis' from an actual outage — and 180+ countries can be imputed at curated_list_absent with no operator signal.","remediation":["Introduce one classifySeedMetaHealth(meta,key,nowMs):'ok'|'stale'|'failed' in _dimension-freshness.ts and call it from all three sites","Include state and recordCount in the source-failure and preflight checks","Add a test that {state:'ERROR'} and {empty successful run} are classified failed by every consumer"],"status":"code-verified"},{"id":"V68","severity":"high","title":"buildPillarList counts retired and not-applicable dimensions that computeOverallCoverage excludes","component":"server/worldmonitor/resilience/v1/_pillar-membership.ts:37 vs _shared.ts:825/:1424 (isExcludedFromConfidenceMean)","summary":"Pillar coverage filters only flag-dark dimensions while the headline coverage also excludes retired and zero-coverage-N/A dimensions, so two published fields disagree and pillar weights shift materially.","cvss":"N/A — analytics correctness (published metric divergence)","cwe":"CWE-682 (Incorrect Calculation)","scope":"api","description":"_pillar-membership.ts:37 does `domain.dimensions.filter(d => !isFlagDarkDimension(d))` — excluding only flag-dark dims. The sibling predicate used for the headline, isExcludedFromConfidenceMean (_shared.ts:825,:1424), additionally excludes RESILIENCE_RETIRED_DIMENSIONS ({fuelStockDays, reserveAdequacy}) and RESILIENCE_NOT_APPLICABLE_WHEN_ZERO_COVERAGE ({sovereignFiscalBuffer} at zero coverage). Re-running both filters over the real RESILIENCE_DIMENSION_DOMAINS: for a fully-observed sovereign-wealth country, pillars['recovery-capacity'].coverage=0.75 while overallScore.overallCoverage=1.0; for ~190 SWF-less countries, 0.625 vs 1.0. Numeric consequence: pillarScore weights member domains by domain.weight × coverage (:56-62), so with RESILIENCE_FIN_SYS_EXPOSURE_ENABLED at its code default, social-governance takes 59.9% of the structural-readiness pillar instead of the declared 47.2%.","reproduce":["Read _pillar-membership.ts:37 (filters flag-dark only) vs isExcludedFromConfidenceMean (_shared.ts:825/:1424)","Run both filters over RESILIENCE_DIMENSION_DOMAINS for a fully-observed country","Compare pillars['recovery-capacity'].coverage (0.75) with overallScore.overallCoverage (1.0)"],"poc":"Static/computed: two published coverage fields disagree for the same country (0.75 vs 1.0; 0.625 vs 1.0), and pillar weights shift (47.2% → 59.9%).","impact":"Published resilience pillar coverage and the headline overall coverage contradict each other for every country, and the mis-weighting distorts pillar scores and country rankings — undermining the integrity of the resilience index that consumers rely on.","remediation":["Change _pillar-membership.ts:37 to `!isExcludedFromConfidenceMean(dimension)` so pillar membership matches the headline","Add a test asserting pillar coverage and overall coverage use the same exclusion set","Recompute published rankings after the fix"],"status":"code-verified"},{"id":"V69","severity":"medium","title":"A missing sub-indicator is dropped and the survivors renormalised, so a source outage raises the score","component":"server/worldmonitor/resilience/v1/_dimension-scorers.ts:994-1019/232-299/4215-4220","summary":"weightedScore divides by availableWeight+fallbackWeight, not totalWeight, so a null sub-indicator drops out and its weight redistributes onto survivors — meaning a partial source outage can increase a country's published resilience score.","cvss":"N/A — analytics correctness","cwe":"CWE-682","scope":"api","description":"_dimension-scorers.ts:994-1019 weightedScore divides by scoringWeight = availableWeight+fallbackWeight, NOT totalWeight. A metric with score===null and no fallbackScore leaves the denominator entirely and its weight redistributes onto the survivors. Ran the real MACRO_FISCAL_INDICATOR_WEIGHTS (0.4/0.2/0.2/0.15/0.05) with legs 60/20/40/80/50: all-observed → 51; worst leg missing → 58; best leg missing → 45. The IMPUTE/IMPUTATION taxonomy (:232-299) exists to DEFLATE absent signals, but the outage branch emits score:null (drop), not an IMPUTE entry, and the re-tag at :4215-4220 requires observedWeight===0 && imputedWeight>0, which a partial outage never satisfies. Net: when a seeder dies, the affected country's published overallScore and rank go UP, with nothing on the response indicating a source is down (coverage does drop, mitigating headlineEligible).","reproduce":["Read _dimension-scorers.ts:994-1019 (divide by availableWeight+fallbackWeight)","Compute a dimension with one leg null (no fallback) vs all legs present","Observe the score rises when the worst leg is the one that goes missing"],"poc":"Computed: legs 60/20/40/80/50 → 51 all-observed, 58 with the worst leg missing — an outage raises the score.","impact":"When a data source fails, affected countries' resilience scores and rankings increase rather than reflecting reduced confidence, systematically biasing the published index during outages.","remediation":["Divide by totalWeight (or emit an IMPUTE entry that deflates, not a null drop) so missing signals lower, not raise, the score","Ensure the re-tag path handles partial outages","Add a test asserting a dropped leg never increases the dimension score"],"status":"code-verified"},{"id":"V70","severity":"medium","title":"Unguarded toISOString() on a seed-meta timestamp poisons the score cache for all 196 countries","component":"server/worldmonitor/resilience/v1/_shared.ts:890-893 (vs :53-59 and siblings)","summary":"A non-parsing staticMeta.fetchedAt throws RangeError in toISOString(), and the throw cascades through cachedFetchJson's NEG_SENTINEL to a success-shaped zero payload, failing the ranking for all 196 countries.","cvss":"N/A — availability / cache poisoning","cwe":"CWE-248 (Uncaught Exception)","scope":"api","description":"_shared.ts:890-893 guards only truthiness: `staticMeta?.fetchedAt ? new Date(staticMeta.fetchedAt).toISOString().slice(0,10) : todayIsoDate()`. A non-parsing value throws RangeError. Three sibling helpers in the same file guard correctly — _shared.ts:53-59 toResilienceDataVersion (if(!timestamp || !Number.isFinite(timestamp.getTime())) return ''), get-resilience-runtime-manifest.ts:53-59, get-resilience-indicators.ts:90-95. Chain: throw → ensureResilienceScoreCached's cachedFetchJson fetcher → redis.ts:1136-1146 writes NEG_SENTINEL and rethrows → _shared.ts:1266-1286 returns a success-shaped zero payload → warmMissingResilienceScores allSettled (:1608) records stage:'compute' failure for all 196 countries → get-resilience-ranking.ts:402-403 coverageRatio=0003c0.9 → ranking never published. Latent rather than live (seed-resilience-static.mjs:911 currently writes Date.now()).","reproduce":["Read _shared.ts:890-893 (unguarded toISOString) vs :53-59 (guarded)","Produce a staticMeta.fetchedAt that is truthy but non-parsing","Observe RangeError → NEG_SENTINEL → success-shaped zero payload → ranking not published for all countries"],"poc":"Static: an unparseable-but-truthy fetchedAt throws in toISOString, and the throw poisons the shared score cache via NEG_SENTINEL.","impact":"A single malformed seed-meta timestamp can blank the entire published resilience-score surface (all 196 countries), since the throw cascades into the shared cache and fails the ranking coverage gate — a whole-surface availability risk.","remediation":["Guard fetchedAt with Number.isFinite(new Date(x).getTime()) before toISOString (mirror _shared.ts:53-59)","Add a test feeding a malformed fetchedAt asserting graceful degradation, not a whole-surface failure"],"status":"code-verified"},{"id":"V71","severity":"medium","title":"change30d is not 30 days: the 31-member ZSET cap is shared across formula and education tags","component":"server/worldmonitor/resilience/v1/_shared.ts:855-863/949-954","summary":"One ZSET per country holds 003cdate>:003cformula>:003ceducationState> members trimmed to 31 total across all tags, but the reader filters to the current tag — so on a rollback-flag flip change30d collapses to a 1-day delta under a field named change30d.","cvss":"N/A — analytics correctness","cwe":"CWE-682","scope":"api","description":"_shared.ts:855-863 one ZSET per country holds 003cdate>:003cformula>:003ceducationState> members, trimmed with ZREMRANGEBYRANK key 0 -31 → the cap is 31 members TOTAL, across all tags. :949-954 the reader filters to the current tag and takes history[0] as the 30-day anchor. Both RESILIENCE_PILLAR_COMBINE_ENABLED and RESILIENCE_EDUCATION_ENABLED are documented emergency rollback switches (:82-84, _dimension-scorers.ts:2100-2106) and NEITHER rotates the history key prefix — unlike every other construct change in the file, which does a lockstep rotation (:250-319). On flip day the filtered history is empty → change30d=0; day 2 it's a 1-day delta under change30d; it reaches only ~15 days of depth. detectTrend reads 'stable' for the first two days.","reproduce":["Read _shared.ts:855-863 (31-member cap across tags) and :949-954 (reader filters to current tag)","Flip RESILIENCE_EDUCATION_ENABLED (or PILLAR_COMBINE) without rotating the history key","Observe change30d = 0 on flip day, a 1-day delta on day 2, ~15-day max depth"],"poc":"Static: the shared 31-member cap plus per-tag filtering (with no key rotation on flag flip) yields a change30d that isn't 30 days.","impact":"After an emergency rollback flag flip, the published change30d and trend for every country are wrong for days (0, then 1-day deltas, then shallow), misrepresenting resilience movement precisely when operators flip a rollback switch.","remediation":["Rotate the history key prefix on any construct/flag change (lockstep, mirror :250-319), or size the ZSET cap per tag","Add a test asserting change30d reflects a true 30-day window across a flag flip"],"status":"code-verified"},{"id":"V72","severity":"medium","title":"Energy scorers keep the 0.5 exposure default that scoreLogisticsSupply removed for this exact defect","component":"server/worldmonitor/resilience/v1/_dimension-scorers.ts:3133-3135/3024 (vs :2939-2956)","summary":"scoreEnergyV2/scoreEnergyLegacy still default missing fossilElectricityShare to 0.5, pinning energyPriceStress at a hard floor of 50 with full weight — the same 0.5 default the logistics scorer removed to stop inflating microstates.","cvss":"N/A — analytics correctness","cwe":"CWE-682","scope":"api","description":"Removed, with a plan reference, at _dimension-scorers.ts:2939-2956: 'removed the prior 0.5 default fallback for missing tradeToGdp … the 0.5 default extended that suppression to countries with NO observed trade-to-GDP at all (tiny island states), inflating their shipping/transit components to ~75.' Still present at :3133-3135 (scoreEnergyV2) and :3024 (scoreEnergyLegacy), with no comment: `const exposure = fossilElectricityShare != null ? … : 0.5;`. With no exposure observation, energyPriceStress is pinned at 50 + 0.5×energyStressScore — a hard floor of 50/100 on a live-shock signal — and weightedBlend (:1036) assigns it weight 1.0 because no certaintyCoverage is set.","reproduce":["Read _dimension-scorers.ts:3133-3135/3024 (0.5 default) vs :2939-2956 (removed for the same reason)","Score a country with no fossilElectricityShare observation","Observe energyPriceStress floored at 50 with full weight"],"poc":"Static: the exact 0.5 default the logistics scorer removed (with a comment) persists in the energy scorers, flooring a live-shock signal at 50.","impact":"Countries with no observed fossil-electricity exposure get an artificially floored energy-price-stress score at full weight, inflating their resilience on a live-shock dimension — the same distortion the sibling scorer was fixed to remove.","remediation":["Remove the 0.5 default in scoreEnergyV2/scoreEnergyLegacy (treat missing exposure as unobserved / lower certainty), mirroring the logistics scorer fix","Add a test asserting a missing exposure does not floor energyPriceStress at 50 with full weight"],"status":"code-verified"},{"id":"V73","severity":"high","title":"list-stablecoin-markets degraded 200s get s-maxage=1200 from the shared CDN","component":"server/worldmonitor/market/v1/list-stablecoin-markets.ts:358/387 · server/_shared/cache-contract.ts:26-45","summary":"Every degraded exit returns dataStatus:'UNAVAILABLE'|'PARTIAL' — a field the cache contract doesn't recognize — and never calls markNoStoreFallbackResponse, so a Redis blip is CDN-cached as 'no stablecoin data' for ~20-50 minutes.","cvss":"N/A — availability / cache-integrity","cwe":"CWE-524 (Use of Cache Containing Sensitive Information / stale)","scope":"api","description":"list-stablecoin-markets.ts:358,387 return `{timestamp,summary,stablecoins:[],unresolved,dataStatus:'UNAVAILABLE'|'PARTIAL'}` on every degraded exit. cache-contract.ts:26-45 only recognizes upstreamUnavailable, unavailable, dataAvailable===false, degraded===true, available===false, or a non-empty error — ListStablecoinMarketsResponse has NONE of these, only dataStatus. The handler never calls markNoStoreFallbackResponse (grep returns nothing), so getRpcNoStoreReasonFromJson returns null and gateway.ts:2524-2529 applies CDN-Cache-Control: public, s-maxage=1200, stale-if-error=1800 for anonymous callers. This is the sole unmarked seed-read handler in the directory — list-defi-tokens, list-ai-tokens, list-crypto-quotes and eight siblings all mark it.","reproduce":["Read list-stablecoin-markets.ts:358/387 (dataStatus only) and confirm no markNoStoreFallbackResponse call","Read cache-contract.ts:26-45 (recognized markers) — dataStatus is not among them","Induce a Redis failure; observe a degraded 200 with s-maxage=1200 served to anonymous callers"],"poc":"Static: the response carries only dataStatus (unrecognized), the handler never marks no-store, and the gateway applies a 20-minute CDN TTL to the degraded body.","impact":"One Upstash blip makes every anonymous visitor see 'no stablecoin data' for ~20 minutes (~50 under stale-if-error), with timestamp:new Date().toISOString() dating the empty answer as fresh — an outage that outlives the underlying failure and misleads users about market coverage.","remediation":["Wrap both degraded returns in markNoStoreFallbackResponse(ctx.request, …)","Or add a cache-contract-recognized marker (dataAvailable:false / upstreamUnavailable:true) to the degraded shape","Add a test asserting a degraded stablecoin response is served no-store, not CDN-cached"],"status":"code-verified"},{"id":"V74","severity":"medium","title":"get-insider-transactions sends the Finnhub key in the URL; the same-directory sibling uses the header","component":"server/worldmonitor/market/v1/get-insider-transactions.ts:69 (vs _quote-provider.ts:120-121)","summary":"The insider-transactions fetch puts &token=003cFINNHUB_API_KEY> in the query string, while the sibling authenticates the same key via the X-Finnhub-Token header, so the key lands in egress/CDN/APM logs and any Referer.","cvss":"N/A — credential hygiene","cwe":"CWE-598 (Information Exposure Through Query Strings)","scope":"comms","description":"get-insider-transactions.ts:69 builds `https://finnhub.io/api/v1/stock/insider-transactions?symbol=${…}&token=${apiKey}`. The sibling _quote-provider.ts:120-121 authenticates the SAME FINNHUB_API_KEY with the X-Finnhub-Token header — which Finnhub documents as a first-class alternative to token in the URL. The key lands in every egress proxy / CDN / APM access log and would be copied into Referer by any redirect.","reproduce":["Read get-insider-transactions.ts:69 (&token= in URL) vs _quote-provider.ts:120-121 (X-Finnhub-Token header)","Trace an insider-transactions request through any logging proxy","Observe the Finnhub key in the request URL/logs"],"poc":"Static: the key is interpolated into the query string, while the sibling uses the header for the same provider.","impact":"The shared paid Finnhub API key is written into egress/CDN/APM logs and can leak via Referer, risking credential compromise and quota abuse — a needless deviation from the sibling's header auth.","remediation":["Drop &token= and send X-Finnhub-Token, matching _quote-provider.ts:120-121","Add a test asserting no provider key appears in an outbound URL"],"status":"code-verified"},{"id":"V75","severity":"medium","title":"AnalyzeStock cache key is a lossy form of caller-supplied name","component":"server/worldmonitor/market/v1/analyze-stock.ts (name-derived cache key) · stock-news-search.ts:419","summary":"The cache key folds a stripped, 30-char, lowercased form of the caller's name, so two names sharing their first 30 alphanumerics collide (serving the first caller's name + LLM output), and a caller can mint unbounded distinct keys.","cvss":"N/A — cache-collision / cost","cwe":"CWE-524","scope":"api","description":"analyze-stock.ts folds `name.replace(/[^a-zA-Z0-9]/g,'').slice(0,30).toLowerCase()` into the cache key. Any two names sharing their first 30 alphanumeric characters collide, and the cached payload carries the FIRST caller's name plus the LLM summary/action/whyNow and headlines derived from it. Divergence: the news sub-cache (stock-news-search.ts:419) uses a different canonicalisation — stableHash(query).slice(0,12) over the FULL query — so the two layers were never reconciled. Secondary: the same lossy transform lets a caller manufacture unbounded distinct keys (and thus fresh paid LLM calls) for one symbol, bounded only by the daily direct-LLM quota.","reproduce":["Read the analyze-stock name-derived cache key vs stock-news-search.ts:419 (full-query hash)","Call analyze-stock with two names sharing the first 30 alphanumerics","Observe the second served the first's cached name + LLM output; or vary the name to mint fresh paid LLM calls"],"poc":"Static: a 30-char lossy name transform is the cache identity, so distinct names collide and a caller can generate unbounded keys.","impact":"Analyze-stock results (including LLM-generated summary/action and the caller's name) collide across different requests, and a caller can force fresh paid LLM calls for one symbol up to the daily quota — a correctness and cost issue.","remediation":["Key on a full-query cryptographic hash (mirror stock-news-search.ts:41 the ma60 response field (and injected into the LLM prompt), so recent IPOs/halts report a 20-day MA mislabeled ma60.","cvss":"N/A — data correctness (financial)","cwe":"CWE-684","scope":"api","description":"analyze-stock.ts:1116 `const ma60Series = candles.length>=60 ? smaSeries(closes,60) : ma20Series.slice();` — the fallback substitutes MA20, and :1135 emits it as the ma60 response field, also injected into the LLM prompt (:1672). The upstream gate at :988 only requires candles.length>=30, so any stock with 30-59 bars (recent IPO, long halt) reports a 20-day MA labelled ma60. No comment, no separate null marker.","reproduce":["Read analyze-stock.ts:1116/1135/988","Analyze a stock with 30-59 candles","Observe the ma60 field actually holds the MA20 value"],"poc":"Static: candles003c60 → ma60Series=ma20Series, emitted as ma60.","impact":"For recent-IPO / long-halt symbols the 60-day moving average is silently the 20-day average, feeding both the API response and the LLM prompt with a mislabeled indicator — incorrect financial data.","remediation":["Return null/omit ma60 (and mark it) when candles003c60 instead of substituting MA20","Add a test with 45 candles asserting ma60 is not the MA20"],"status":"code-verified"},{"id":"V78","severity":"low","title":"rateDateMs rolls invalid dates over; its Number.isFinite guard can never fire","component":"server/worldmonitor/economic/v1/us-interest-rates.ts:43-48 (vs us-cpi-monthly.ts:50, us-treasury-par-yield.ts:71)","summary":"Date.UTC(y,m-1,d) normalises rather than rejecting, so rateDateMs('2026-13-45') becomes 2027-02-14 and Number.isFinite(ms) is always true — unlike the two siblings that use Date.parse and reject.","cvss":"N/A — input validation / correctness","cwe":"CWE-20","scope":"input","description":"us-interest-rates.ts:43-48 Date.UTC(y,m-1,d) NORMALISES rather than rejecting: rateDateMs('2026-13-45') → 2027-02-14. So Number.isFinite(ms) is always true. The two siblings in the same domain use Date.parse(`${isoDate} e mode is covered.","reproduce":["Read analysis-population-exposure.ts:91 — raw-degree Euclidean, no cos(lat), no wrap","Evaluate a high-latitude or trans-antimeridian point (e.g. near 179°W)","Observe nearestCountry resolves to a wrong, far country; exposedPopulation uses that country's density"],"poc":"Static/numeric: longitude gap is taken in raw degrees (e.g. -4.0 vs -175.2 = 171.2° instead of the true ~9°), so antimeridian/polar points map to the wrong country; density of the wrong country then scales the exposure.","impact":"Population-exposure estimates for events near the poles or the antimeridian are attributed to the wrong country and scaled by the wrong population density, corrupting the public get-population-exposure RPC output and the browser Population Exposure top-10 ranking — a correctness failure in a humanitarian-impact metric.","remediation":["Use `const dx=((lon-cLon+540)%360)-180; const dist=Math.hypot(lat-cLat, dx*Math.cos(lat*Math.PI/180));` (wrap + cos scaling), or switch to haversine","Add tests for antimeridian and high-latitude points","Recompute cached exposure outputs after the fix"],"status":"code-verified"},{"id":"V81","severity":"high","title":"get-temporal-baseline reads a Redis keyspace no producer writes","component":"server/worldmonitor/infrastructure/v1/get-temporal-baseline.ts:13/44 · producer list-temporal-anomalies.ts:376 (v2)","summary":"The handler reads baseline:v1:* via makeBaselineKey, but the only producer writes baseline:v2:* (makeBaselineKeyV2) and the v1 writer now throws 403 — so the RPC can never return a baseline and permanently caches a useless 'learning' response.","cvss":"N/A — dead-path correctness / cache pollution","cwe":"CWE-561 (Dead Code) / CWE-670","scope":"api","description":"get-temporal-baseline.ts:13,44 uses makeBaselineKey → baseline:v1:003ctype>:global:003cweekday>:003cmonth> (_shared.ts:40). The only server-side producer, list-temporal-anomalies.ts:376, writes baseline:v2:* via makeBaselineKeyV2; the only v1 writer, record-baseline-snapshot.ts:20, now throws an unconditional 403. _shared.ts:37-38 even warns 'Not to be confused with makeBaselineKeyV2 … a different pipeline, not a later version'. So getCachedJson always returns null → :48-54 returns {learning:true,sampleCount:0,samplesNeeded:10,error:''}. error:'' means getRpcNoStoreReasonFromPayload does not fire, so the permanently-useless response is cached under the slow tier.","reproduce":["Read get-temporal-baseline.ts:13/44 (makeBaselineKey → v1) vs list-temporal-anomalies.ts:376 (makeBaselineKeyV2 → v2)","Confirm record-baseline-snapshot.ts:20 throws 403 (no v1 writer)","Call get-temporal-baseline for any type → {learning:true,sampleCount:0}, cached on the slow tier"],"poc":"Static: reader on baseline:v1:*, sole producer on baseline:v2:*, v1 writer disabled → getCachedJson always null → permanent 'still warming up' response, cached.","impact":"The temporal-baseline RPC can never return a baseline, anomaly or z-score for any of its five types; every client reading `learning` gets a permanent 'warming up' signal, and the useless payload is edge-cached — the feature is silently non-functional.","remediation":["Point the reader at makeBaselineKeyV2 (baseline:v2:*) to match the live producer","Or repoint the pipeline coherently and remove the dead v1 path","Mark the learning/empty response no-store so it isn't cached, and add a test asserting reader and writer key versions match"],"status":"code-verified"},{"id":"V82","severity":"high","title":"STAC imagery failure cached as a positive empty result (1h Redis, 4h CDN)","component":"server/worldmonitor/imagery/v1/search-imagery.ts:168-171 (fix: return null)","summary":"On a non-2xx STAC response the fetcher returns {scenes:[],totalResults:0} instead of null, so cachedFetchJson stores the failure as a positive empty result for 1h (Redis) / 4h (CDN), poisoning each request window independently.","cvss":"N/A — availability / cache-integrity","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"search-imagery.ts:168-171 returns `{scenes:[],totalResults:0}` on non-2xx instead of null. cachedFetchJsonWithMeta treats any non-null return as a positive result and writes it for CACHE_TTL=3600. The payload carries none of the markers cache-contract.ts:32-37 looks for, so the static tier applies s-maxage=3600 and the CDN s-maxage=14400. The shared helper's own contract states the rule: 'opts.cacheFailures:false makes nulls, no-store payloads, and thrown fetches non-cacheable' (redis.ts:985-987). The throw on timeout at :165 is correct; the return {…} at :170 bypasses it. The key includes the datetime, so each distinct request window is poisoned independently and recovery requires the 1h Redis entry to expire.","reproduce":["Read search-imagery.ts:165 (throw on timeout, correct) vs :168-171 (returns empty object on non-2xx)","Induce a STAC non-2xx for a given datetime window","Observe {scenes:[]} cached 1h in Redis and up to 4h at the CDN for that window"],"poc":"Static: non-null empty return is treated as a positive cacheable result; the failure is stored for an hour and re-served as 'no imagery'.","impact":"A transient STAC upstream error makes imagery search return 'no results' for the affected time window for up to an hour (Redis) / four hours (CDN edge), per window, misrepresenting satellite coverage as absent when it exists.","remediation":["Return null at :170 on non-2xx (so cacheFailures:false skips caching) and add upstreamUnavailable:true to the catch at :191","Add a test asserting a STAC failure is not cached as an empty positive result"],"status":"code-verified"},{"id":"V83","severity":"high","title":"list-service-statuses total outage caches 31 UNSPECIFIED rows and destroys its own fallback","component":"server/worldmonitor/infrastructure/v1/list-service-statuses.ts:134-136/279-281/317-330","summary":"checkServiceStatus never returns null (all errors become UNSPECIFIED rows), so the res","Only assign fallbackStatusesCache when at least one row has a known status","Add a top-level availability marker so the gateway/relay won't cache a total-unknown result; add a test for the all-fail case"],"status":"code-verified"},{"id":"V84","severity":"medium","title":"Vessel-snapshot bbox quantization floors all four corners","component":"server/worldmonitor/maritime/v1/get-vessel-snapshot.ts:48-50/101-105/186-190","summary":"quantize is Math.floor applied to both SW and NE corners, so the box shrinks south and west; sub-degree boxes collapse to zero area and just east of the antimeridian become zero-width, matching no vessels.","cvss":"N/A — correctness (geospatial)","cwe":"CWE-682","scope":"api","description":"get-vessel-snapshot.ts:48-50,101-105,186-190 quantize is Math.floor and is applied to the SW AND NE corners, so the box shrinks south and west instead of snapping outward. Sub-degree boxes collapse to zero area (a valid 0.5°×0.5° box east of the antimeridian becomes 0.00×0.00, and floor(-179.5)=-180 means any half-degree box just east of the antimeridian is zero-width). The relay's parseBbox (ais-relay.cjs:9884-9893) accepts a zero-area box, so the request succeeds and matches no vessel. The correct pattern is in the repo — list-military-bases.ts:122-125 (quantize NE with a ceil flag) and list-webcams.ts:97-100 (floor SW, ceil NE). The comment at :183-185 claims the two quantizations 'stay consistent' — they do; consistently wrong in the same direction. Production client live-tankers.ts:35,75-78 uses a ±2° box, so a 24.57→28.57 box is queried as 24→28 and the northern 0.57° strip is lost.","reproduce":["Read get-vessel-snapshot.ts:48-50/101-105/186-190 (floor on both corners) vs list-webcams.ts:97-100 (floor SW, ceil NE)","Query a sub-degree or trans-antimeridian bbox","Observe a zero-area / shrunk box that matches no vessels"],"poc":"Static/numeric: flooring both corners shrinks the box; a 0.5° box just east of 180° becomes zero-width and returns nothing.","impact":"Vessel-snapshot queries silently drop vessels near the box edges (and return nothing for sub-degree or trans-antimeridian boxes), so the live-tankers map loses coverage strips — a geospatial correctness defect.","remediation":["Floor the SW corner and ceil the NE corner (mirror list-webcams.ts:97-100)","Handle the antimeridian wrap","Add a test for sub-degree and trans-antimeridian boxes"],"status":"code-verified"},{"id":"V85","severity":"medium","title":"list-military-bases maps an unparseable coordinate to (0,0) while keeping the real country","component":"server/worldmonitor/military/v1/list-military-bases.ts:203-204/200-216 (vs list-military-flights.ts:235)","summary":"Number(meta.lat)||0 collapses 'no coordinate', non-numeric and a genuine 0 into (0,0) while still publishing the real name/branch/countryIso2, so a named base is drawn in the Gulf of Guinea and returned by a country filter.","cvss":"N/A — correctness (geospatial)","cwe":"CWE-682","scope":"api","description":"list-military-bases.ts:203-204 Number(meta.lat)||0 collapses no-coordinate, non-numeric and a genuine 0 into the same (0,0), while :200-216 still publishes the real name/kind/branch/countryIso2. Result: a named military base drawn in the Gulf of Guinea labelled with a country it is not in, surviving an hour of daily-tier CDN cache, and returned by a country=XX filter. The sibling in the same domain rejects instead of relocating — list-military-flights.ts:235: `if(f.lat==null||f.lon==null) return null;`. The seeder's guard is weaker than the handler's assumption: seed-military-bases.mjs:757 filters on e.lat==null, which is false for lat:'abc', lat:200 or lat:''. Three further unguarded Number(x)||0 coordinate sites: get-vessel-snapshot.ts:212-213/226-227, list-webcams.ts:156-157.","reproduce":["Read list-military-bases.ts:203-204 (Number(lat)||0) vs list-military-flights.ts:235 (null → reject)","Provide a base with a non-numeric/empty lat","Observe it published at (0,0) with ,-5) returns length 15 (not the intended page).","impact":"A negative or malformed page_size yields an incorrect/empty earthquake page rather than a validation error, a correctness/robustness defect on a public data route.","remediation":["Add (buf.validate.field).int32.gte=0 to page_size and clamp in the handler (mirror clampInt siblings)","Add a test for negative and oversized page_size"],"status":"code-verified"},{"id":"V87","severity":"medium","title":"list-positive-geo-events reports stale:false on total source failure","component":"server/worldmonitor/positive-events/v1/list-positive-geo-events.ts:50","summary":"On a Redis error with no in-process fallback it returns {events:[],fetchedAt:0,stale:false} — asserting the data is current — with no gateway marker, and the fixed cache key poisons the endpoint for every anonymous caller.","cvss":"N/A — availability / false-fresh","cwe":"CWE-703","scope":"api","description":"list-positive-geo-events.ts:50 returns {events:[],fetchedAt:0,stale:false} when Redis errors and no in-process fallback applies. stale:false ASSERTS the data is current, and no gateway marker is present. Every sibling in the family fails closed — list-natural-events.ts:32/41, list-fire-detections.ts:46/62, list-navigational-warnings.ts:82/89, list-climate-news.ts:23 all return dataAvailable:false, which cache-contract.ts:34 converts to no-store. The cache key is fixed (positive-events:geo:v1, no request-varying component), so a single failure poisons the endpoint for every anonymous caller across the slow/CDN window.","reproduce":["Read list-positive-geo-events.ts:50 (stale:false on failure) vs the dataAvailable:false siblings","Induce a Redis error for the positive-events key","Observe stale:false/empty served and cached for all anonymous callers"],"poc":"Static: the failure path returns stale:false with no availability marker, so a transient error is cached as a fresh empty result.","impact":"A single Redis failure makes the positive-geo-events endpoint serve an empty 'fresh' result to every anonymous caller for the cache window, misrepresenting an outage as 'no events'.","remediation":["Return dataAvailable:false (→ no-store) on failure, matching the family siblings","Add a test asserting a Redis error yields a no-store, not-fresh response"],"status":"code-verified"},{"id":"V88","severity":"medium","title":"get-population-exposure never enforces its required coordinates; radius is unbounded","component":"server/worldmonitor/displacement/v1/get-population-exposure.ts:26 · proto get_population_exposure.proto:15-27","summary":"lat/lon are documented required-for-exposure but only range-validated, so ?mode=exposure with no coords yields a confident estimate for (0,0), and radius has no upper bound, producing a lossy int64 population overflow.","cvss":"N/A — input validation / correctness","cwe":"CWE-20","scope":"input","description":"proto get_population_exposure.proto:15-27 documents lat/lon as 'required for exposure mode' but attaches only range rules, no required, and the handler never checks presence. ?mode=exposure with no coordinates → decoder yields 0 → satisfies gte=-90,lte=90 → a fully-formed estimate for (0,0). Ran it: exposedPopulation:1902773, nearestCountry:'NGA'. radius has gte=0 and no lte. The module's own doc (:68-82) says an unbounded radius 'produces a confidently-wrong number … which is worse than refusing', and documents computeBoundedExposure (:110-119) as the bounded variant, which this RPC does not use. Ran radius=10000000 → exposedPopulation 281803992182473150, exceeding Number.MAX_SAFE_INTEGER by 31×, so the int64 field (INT64_ENCODING_NUMBER) is emitted as a lossy double.","reproduce":["Read get-population-exposure.ts:26 (no presence check) and the proto (required-but-unenforced coords, unbounded radius)","GET ?mode=exposure with no lat/lon → estimate for (0,0)","GET with radius=10000000 → population exceeding MAX_SAFE_INTEGER (lossy int64)"],"poc":"Runtime: no-coords exposure → 1,902,773 for (0,0); radius=1e7 → 281803992182473150 (past MAX_SAFE_INTEGER).","impact":"The public population-exposure RPC returns confident, wrong estimates for missing coordinates and unbounded radii (with lossy int64 output), misrepresenting a humanitarian-impact metric consumers may act on.","remediation":["Enforce lat/lon presence for exposure mode and add an upper bound on radius (use computeBoundedExposure)","Add a test asserting no-coords and oversized-radius requests are rejected"],"status":"code-verified"},{"id":"V89","severity":"low","title":"get-humanitarian-summary-batch returns a 200 empty where its single-country sibling raises 503","component":"server/worldmonitor/conflict/v1/get-humanitarian-summary-batch.ts:39-51/52-54 (vs get-humanitarian-summary.ts:38-41)","summary":"The batch handler treats every cache miss as a legitimate zero (200 {results:{},fetched:0}) and is on the medium tier, publicly caching 'no summaries' for 20 minutes, while the single-country sibling throws a 503 no-store.","cvss":"N/A — availability / cache-integrity","cwe":"CWE-703","scope":"api","description":"get-humanitarian-summary-batch.ts:39-51 uses getCachedJsonBatch and treats every miss as a legitimate zero → {results:{},fetched:0,requested:N} with 200. The sibling get-humanitarian-summary.ts:38-41 uses readRequiredSeed, which throws SeedUnavailableError (503, no-store; required-seed.ts:18-20). The route is absent from RPC_CACHE_TIER, so it falls back to medium → s-maxage=600 / CDN s-maxage=1200, publicly caching '0 of 25 countries have summaries' for 20 minutes. The catch at :52-54 additionally reports requested:0, discarding the caller's own input.","reproduce":["Read get-humanitarian-summary-batch.ts:39-51/52-54 vs get-humanitarian-summary.ts:38-41","Induce a seed miss and call the batch route","Observe a 200 empty cached at s-maxage=600 (vs the sibling's 503 no-store)"],"poc":"Static: batch misses → 200 empty (medium-tier cached), single-country miss → 503 no-store.","impact":"A humanitarian-summary seed miss is publicly cached as 'no summaries' for 20 minutes and the caller's requested count is discarded — an availability/cache-integrity gap on a humanitarian dataset.","remediation":["Fail closed on a total miss (mirror readRequiredSeed) and mark no-store; add the route to RPC_CACHE_TIER","Preserve requested in the catch; add a test for the all-miss case"],"status":"code-verified"},{"id":"V90","severity":"low","title":"mapEcsFlight substitutes (0,0) for a position-less flight","component":"server/worldmonitor/military/v1/get-wingbits-live-flight.ts:81-82/138-139","summary":"lat = raw.lat ?? raw.la ?? 0 with only an if(!data.flight) guard maps a position-less flight to (0,0), cached 30s on an ungated public RPC; impact is confined to third-party consumers since no browser code reads live.lat/lon.","cvss":"N/A — correctness (geo, third-party surface)","cwe":"CWE-682","scope":"api","description":"get-wingbits-live-flight.ts:81-82 `lat: raw.lat ?? raw.la ?? 0`. The only absence check is if(!data.flight) return null at :138-139. The record is cached 30s and served on an ungated public RPC. The generated type declares plain double (proto:15-16), so (0,0) is indistinguishable from a real Gulf of Guinea fix. Rated Low because no in-repo browser code reads live.lat/live.lon (MapPopup.ts:1276-1350 renders only schedule/photo/registration/model/operator/vertical rate) — impact is confined to third-party API/MCP consumers.","reproduce":["Read get-wingbits-live-flight.ts:81-82/138-139","Provide a flight with no position","Observe it published at (0,0) via the public RPC"],"poc":"Static: raw.lat ?? raw.la ?? 0 maps missing position to (0,0).","impact":"Third-party API/MCP consumers of the wingbits live-flight RPC receive (0,0) for position-less flights, indistinguishable from a real fix — a geospatial correctness gap confined to external consumers.","remediation":["Return null (or omit) for a position-less flight rather than (0,0) (mirror list-military-flights.ts:235)","Add a test for a position-less flight"],"status":"code-verified"},{"id":"V91","severity":"high","title":"SSE connect timeout is attached to the long-lived stream, making the 12s RPC budget unreachable","component":"api/mcp-proxy.ts:204-212 · :646-657 · :666-672/:753-774","summary":"A signal passed to fetch() aborts the whole response body, so the 10s SSE_CONNECT_TIMEOUT on the stream kills every RPC before the code's own 12s budget — and a related deferred-rejection gap yields an unhandled rejection triggerable on demand.","cvss":"N/A — availability + unhandled-rejection (DoS-shape)","cwe":"CWE-703 (Improper Handling of Exceptional Conditions)","scope":"api","description":"mcp-proxy.ts:204-212 defines SSE_CONNECT_TIMEOUT_MS=10_000 and SSE_RPC_TIMEOUT_MS=12_000 (comment: 'Production waits up to 12s for an SSE RPC response'). connect() (:646-657) opens the HTTP+SSE stream with signal:AbortSignal.timeout(SSE_CONNECT_TIMEOUT_MS) — 10s. But a signal passed to fetch() aborts the RESPONSE BODY, not just connection establishment; verified against a live server (first chunk arrives, then the body throws TimeoutError at the deadline). So the stream carrying every initialize/tools/list/tools/call response is structurally dead at 10s while the code waits 12s for a response that can never arrive — the documented 12s RPC budget is unreachable by construction. Secondary: rejectSession (:666-672) rejects every this._pending deferred, but send() attaches its handler only at `return await deferred.promise` (:774) while the .set() is at :753 and the POST await at :762 — a stream abort in that window produces an unhandled promise rejection in the Edge isolate (reproduced in Node). The endpoint forwards the caller's Authorization/customHeaders (:415-441) and is rate-limited only 30/min/IP.","reproduce":["Read mcp-proxy.ts:204-212 (10s connect vs 12s RPC) and :651 (AbortSignal.timeout(SSE_CONNECT_TIMEOUT_MS) on the stream)","Point /api/mcp-proxy at a remote MCP server whose path ends /sse and whose tool takes >10s","Observe 504 'MCP server timed out' at ~10s; the 12s budget never applies","Time a stream abort within the :753-:762 window → unhandled promise rejection"],"poc":"Runtime semantics: a fetch() signal aborts the response body, so the 10s connect timeout terminates the long-lived SSE stream; the 12s budget is unreachable, and the deferred-handler gap yields an unhandled rejection.","impact":"Every remote MCP server whose tool takes >10s is permanently unusable through /api/mcp-proxy (always 504), and the unhandled-rejection path is triggerable on demand against an endpoint that forwards caller credentials and is only lightly rate-limited — an availability + isolate-stability issue.","remediation":["Race only the HEADER phase against the connect deadline, then keep the body under an AbortController that close() aborts","Make every deferred self-handling at creation (promise.catch(()=>{}) inside makeDeferred at :627-631)","Add a test with a >10s SSE tool asserting success within the 12s budget and no unhandled rejection on abort"],"status":"code-verified"},{"id":"V92","severity":"medium","title":"prompts/get coerces a JSON argument with unguarded String() → unhandled TypeError","component":"api/mcp/prompts/index.ts:324 · api/mcp/handler.ts:102-114/698-703","summary":"String(raw) with no typeof guard throws on an object with a non-string toString, and because prompts/get is an anonymous quota-exempt PUBLIC_MCP_METHOD that re-throws after telemetry, the error escapes as a raw platform 500 breaking the JSONRPCError contract.","cvss":"N/A — availability / contract violation","cwe":"CWE-248","scope":"api","description":"prompts/index.ts:324 `const value = String(raw);` with no typeof guard. String(JSON.parse('{\"toString\":\"x\"}')) throws TypeError: Cannot convert object to primitive value (verified). prompts/get is in PUBLIC_MCP_METHODS (handler.ts:102-114) — anonymous, quota-exempt — and mcpHandler RE-THROWS after telemetry (:698-703), so the error escapes every structured JSON-RPC path as a raw platform 500 with no Cache-Control/CORS contract and no id echo, breaking the 'every refusal is a JSONRPCError' invariant. Repro: POST /mcp {jsonrpc:2.0,id:1,method:'prompts/get',params:{name:'…',arguments:{iso2:{toString:1}}}}. The siblings guard this — argStr returns '' for non-strings (filters.ts:28-30); nlp-tools.ts:498-499 enforces maxLength in code.","reproduce":["Read prompts/index.ts:324 (unguarded String(raw)) and handler.ts:698-703 (re-throw)","POST prompts/get with an argument value {toString:1}","Observe a raw platform 500 (no JSONRPCError envelope, no id echo)"],"poc":"Runtime: String({toString:1}) throws; the anonymous quota-exempt method re-throws it as a platform 500.","impact":"An anonymous caller can force a raw platform 500 on the MCP endpoint (no structured error, no id), breaking the JSON-RPC contract clients depend on and enabling trivial error-forcing without auth.","remediation":["Guard with typeof raw==='string' (or use argStr) and return a JSONRPCError for non-strings","Add a test posting a non-string argument asserting a structured error, not a 500"],"status":"code-verified"},{"id":"V93","severity":"medium","title":"argStrList throws, and the dispatcher's post-filter catch then serves the UNFILTERED payload","component":"api/mcp/filters.ts:15-18 · api/mcp/dispatch.ts:173-188","summary":"argStrList maps String() over untrusted input and can throw a TypeError; the dispatcher's post-filter catch only re-throws two named error types, so a TypeError falls through and the full un-narrowed cache blob is returned.","cvss":"N/A — correctness / filter bypass","cwe":"CWE-755 (Improper Handling of Exceptional Conditions)","scope":"api","description":"filters.ts:15-18 argStrList does raw.map(x=>String(x).toLowerCase().trim()) on untrusted input, despite its own contract ('a missing/wrong-typed argument degrades to a no-op'). dispatch.ts:173-188 the post-filter catch re-throws only McpStoredContractError and RpcValidationError; a TypeError is neither, so it reaches `result = data` — the full, un-narrowed cache blob. Every sibling coercion helper (argStr, argNum, argBool, ciIncludes, matchesCode) is type-guarded. Not a data leak (the caller is already entitled to the full slice) — it defeats the limit/country narrowing the tool schema advertises, and lets a caller trigger Sentry post-filter events at will.","reproduce":["Read filters.ts:15-18 (unguarded map) and dispatch.ts:173-188 (catch re-throws only two types)","Call an MCP tool with an argument that makes argStrList throw (e.g. an object element)","Observe the post-filter catch serves the unfiltered payload and emits a Sentry event"],"poc":"Static: a TypeError from argStrList is neither McpStoredContractError nor RpcValidationError, so it bypasses the filter and returns the full blob.","impact":"A caller can defeat the advertised limit/country filtering (receiving the full slice) and force arbitrary Sentry post-filter events — a correctness/observability abuse, though not a data-entitlement leak.","remediation":["Type-guard argStrList (return [] for non-arrays / non-strings, like the sibling helpers)","Have the post-filter catch fail closed on unexpected errors","Add a test asserting a throwing filter argument does not return the unfiltered payload"],"status":"code-verified"},{"id":"V94","severity":"low","title":"describe_tool reflects caller tool_name untruncated; every sibling caps at 100","component":"api/mcp/registry/rpc-tools.ts:3421 · dispatch.ts:284-286 · registry/index.ts:23-25","summary":"The unknown-tool error echoes the caller's name with no slice, while the sibling caps it at 100 to avoid reflection amplification; the tool is quota-exempt, so one principal can turn ~256KB/request into ~15MB/min of egress.","cvss":"N/A — reflection amplification","cwe":"CWE-400","scope":"api","description":"rpc-tools.ts:3421 `return {error:'unknown_tool', requested:name, …}` with no slice. The sibling dispatch.ts:284-286, same surface, caps it: p.name.slice(0,100), with the comment 'same reflection-amplification class as the handler.ts method echo' (also capped at a2a.ts:313, handler.ts:1303, prompts/index.ts:325). arguments is cast rather than schema-validated (dispatch.ts:278), so the only bound is the 256KB body cap. The tool is quota-exempt by design (registry/index.ts:23-25) and reachable by an authenticated free account.","reproduce":["Read rpc-tools.ts:3421 (no slice) vs dispatch.ts:284-286 (slice(0,100))","Call describe_tool with a ~256KB tool_name as an authenticated free account","Observe the full name reflected in the error"],"poc":"Static: the unknown_tool error echoes the caller name untruncated on a quota-exempt tool.","impact":"An authenticated free account can convert ~256KB/request into ~15MB/min of reflected egress via a quota-exempt tool — a low-severity amplification.","remediation":["Slice requested to 100 (mirror dispatch.ts:284-286)","Add a test asserting the echoed name is capped"],"status":"code-verified"},{"id":"V95","severity":"low","title":"MCP Apps sources[] links allow http: while the sibling evidence[] links are https-only","component":"api/mcp/ui/shell.ts:196-202 · world-brief-app.ts:92-99 · country-brief-app.ts:142-150 (vs evHttps at :92)","summary":"httpUrl() accepts both http: and https: for sources[] headline links (target=_blank) while the same file defines evHttps() and applies it to evidence[] links — two link policies for two fields from the same payload.","cvss":"N/A — client link policy","cwe":"CWE-319","scope":"client","description":"shell.ts:196-202 httpUrl() accepts both http: and https:. world-brief-app.ts:92-99 and country-brief-app.ts:142-150 use it for sources[] headline links → a.href=url; a.target='_blank'. The same file already defines evHttps() (country-brief-app.ts:92) and applies it to evidence[] links 73 lines later — two different link policies for two URL fields from the same payload. The sh
