      darkMode: 'class',

    /* Premium Custom Scrollbar */

      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {

    }

    }

    .perspective-1000 {

    }

    .translate-z-0 {
      transform: translateZ(0px);
    }

    .translate-z-10 {
      transform: translateZ(20px);
    }

    .translate-z-20 {
      transform: translateZ(40px);
    }

    .translate-z-30 {
      transform: translateZ(60px);
    }

      transform: translateY(20px);

    @keyframes slideUp {

      Doc: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    };

    // --- Intersection Observer Hook ---
    function useIntersectionObserver(options = { threshold: 0.1 }) {
      const [isIntersecting, setIsIntersecting] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsIntersecting(true);
            observer.unobserve(entry.target);
          }
        }, options);

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      return [ref, isIntersecting];
    }

    // --- Reveal Wrapper ---
    function Reveal({ children, delay = 0, className = "" }) {
      const [ref, isVisible] = useIntersectionObserver();
      return (
        <div
          ref={ref}
          className={`transition-all duration-1000 ease-out ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'} ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    }

    // --- True 3D Tilt Wrapper with Glare ---
    function TiltWrapper({ children, className = "", depth = false }) {
      const ref = useRef(null);
      const [rotate, setRotate] = useState({ x: 0, y: 0 });
      const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });

      const handleMouseMove = (e) => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        const glareX = (x / rect.width) * 100;
        const glareY = (y / rect.height) * 100;

        setRotate({ x: rotateX, y: rotateY });
        setGlare({ x: glareX, y: glareY, opacity: 0.15 });
      };

      const handleMouseLeave = () => {
        setRotate({ x: 0, y: 0 });
        setGlare(prev => ({ ...prev, opacity: 0 }));
      };

      return (
        <div ref={ref} className={`perspective-1000 w-full ${className}`} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}>
          <div className={`relative w-full h-full transition-transform duration-200 ease-out ${depth ? 'preserve-3d' : ''}`} style={{ transform: `rotateX(${rotate.x}deg) rotateY(${rotate.y}deg)` }}>
            <div className="absolute inset-0 z-50 pointer-events-none rounded-xl transition-opacity duration-300" style={{ opacity: glare.opacity, background: `radial-gradient(circle at ${glare.x}% ${glare.y}%, rgba(255,255,255,1) 0%, transparent 50%)`, mixBlendMode: 'overlay' }} />
            {children}
          </div>
        </div>
      );
    }

    // --- Full-Screen Interactive Grid Background with Parallax ---
    function InteractiveGridBackground() {
      const [mousePos, setMousePos] = useState({ x: -1000, y: -1000 });
      const [scrollY, setScrollY] = useState(0);

      useEffect(() => {
        const handleMouseMove = (e) => setMousePos({ x: e.clientX, y: e.clientY });
        const handleScroll = () => setScrollY(window.scrollY);

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('scroll', handleScroll);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none" style={{ zIndex: 0, backgroundColor: '#09090b' }}>
          <div className="absolute inset-0 opacity-[0.02]" style={{ backgroundImage: GRID_SVG, backgroundPosition: `0px ${scrollY * 0.3}px` }}></div>
          <div className="absolute inset-0 transition-opacity duration-300" style={{ backgroundImage: GRID_SVG, backgroundPosition: `0px ${scrollY * 0.3}px`, opacity: 1, maskImage: `radial-gradient(500px circle at ${mousePos.x}px ${mousePos.y}px, black, transparent 80%)`, WebkitMaskImage: `radial-gradient(500px circle at ${mousePos.x}px ${mousePos.y}px, black, transparent 80%)` }}></div>
          <div className="absolute w-[600px] h-[600px] rounded-full blur-[100px] opacity-[0.15] pointer-events-none" style={{ background: 'radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0) 70%)', transform: `translate(${mousePos.x - 300}px, ${mousePos.y - 300}px)`, transition: 'transform 0.1s ease-out' }}></div>
        </div>
      );
    }

    // --- NEW: Live Groq API Chat Widget ---
    function GroqChatBox() {
      const [isOpen, setIsOpen] = useState(false);
      const [apiKey, setApiKey] = useState(localStorage.getItem('groq_api_key') || '');
      const [isKeySaved, setIsKeySaved] = useState(!!localStorage.getItem('groq_api_key'));
      const [messages, setMessages] = useState([{ role: 'assistant', content: 'Hello! I am your ExamSphere AI. Ask me to explain a concept, generate a quiz, or summarize notes.' }]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isOpen]);

      const saveKey = () => {
        if (apiKey.trim()) {
          localStorage.setItem('groq_api_key', apiKey.trim());
          setIsKeySaved(true);
        }
      }

      const clearKey = () => {
        localStorage.removeItem('groq_api_key');
        setApiKey('');
        setIsKeySaved(false);
      }

      const sendMessage = async () => {
        if (!input.trim() || isLoading) return;

        const userMsg = { role: 'user', content: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsLoading(true);

        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'llama3-8b-8192',
              messages: [
                { role: 'system', content: 'You are an AI Study Assistant embedded in a university exam dashboard. Keep answers concise, helpful, and academically focused.' },
                ...messages.map(m => ({ role: m.role, content: m.content })),
                userMsg
              ],
              temperature: 0.7,
              max_tokens: 1024
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error?.message || 'Failed to connect to Groq API.');
          }

          const aiResponse = data.choices[0].message.content;
          setMessages(prev => [...prev, { role: 'assistant', content: aiResponse }]);

        } catch (error) {
          setMessages(prev => [...prev, { role: 'assistant', content: `Error: ${error.message}. Please check your API Key.` }]);
        } finally {
          setIsLoading(false);
        }
      }

      return (
        <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end pointer-events-auto">
          {isOpen && (
            <div className="w-[340px] md:w-[400px] h-[500px] mb-4 bg-zinc-950/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-slide-up">

              {/* Chat Header */}
              <div className="p-4 border-b border-white/10 bg-zinc-900/50 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center">
                    {Icons.Sparkles}
                  </div>
                  <div>
                    <h3 className="text-sm font-semibold text-white leading-tight">ExamSphere AI</h3>
                    <div className="flex items-center gap-1.5 text-[10px] text-zinc-400">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      Powered by Groq
                    </div>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-zinc-500 hover:text-white transition-colors">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
              </div>

              {!isKeySaved ? (
                /* API Key Onboarding Screen */
                <div className="flex-1 p-6 flex flex-col justify-center items-center text-center">
                  <div className="w-12 h-12 rounded-xl border border-white/10 bg-zinc-900 mb-4 flex items-center justify-center text-zinc-400">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                  </div>
                  <h3 className="text-white font-medium mb-2">Connect Groq Inference</h3>
                  <p className="text-xs text-zinc-400 mb-6 leading-relaxed">Enter your Groq API key to enable live AI features. The key is never sent to our servers and remains securely in your browser's local storage.</p>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={e => setApiKey(e.target.value)}
                    placeholder="gsk_..."
                    className="w-full bg-black border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 mb-3 transition-colors"
                  />
                  <button onClick={saveKey} className="w-full bg-white text-black py-2.5 rounded-lg text-sm font-bold hover:bg-zinc-200 transition-colors">
                    Secure Key & Connect
                  </button>
                </div>
              ) : (
                /* Active Chat Screen */
                <>
                  <div className="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll">
                    {messages.map((m, i) => (
                      <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${m.role === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-zinc-900 border border-white/5 text-zinc-300 rounded-bl-sm'}`}>
                          {m.content}
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-zinc-900 border border-white/5 rounded-2xl rounded-bl-sm px-4 py-3 flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce"></span>
                          <span className="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce" style={{ animationDelay: '0.15s' }}></span>
                          <span className="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce" style={{ animationDelay: '0.3s' }}></span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                  <div className="p-3 border-t border-white/10 bg-zinc-900/30">
                    <div className="flex gap-2 relative">
                      <input
                        value={input}
                        onChange={e => setInput(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && sendMessage()}
                        placeholder="Ask about a concept..."
                        className="flex-1 bg-black border border-white/10 rounded-xl pl-4 pr-10 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                      />
                      <button onClick={sendMessage} disabled={isLoading || !input.trim()} className="absolute right-3 top-1/2 -translate-y-1/2 text-blue-500 hover:text-blue-400 disabled:opacity-50 transition-colors">
                        <svg className="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                      </button>
                    </div>
                    <div className="flex justify-between items-center mt-2 px-1">
                      <span className="text-[10px] text-zinc-600 font-mono">Model: llama3-8b-8192</span>
                      <button onClick={clearKey} className="text-[10px] text-zinc-500 hover:text-red-400 transition-colors">Revoke Key</button>
                    </div>
                  </div>
                </>
              )}
            </div>
          )}

          {/* Floating Toggle Button */}
          <button onClick={() => setIsOpen(!isOpen)} className="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:scale-110 transition-transform z-50 relative group">
            <div className="absolute inset-0 rounded-full bg-white animate-ping opacity-20 group-hover:opacity-0 transition-opacity"></div>
            {isOpen ? (
              <svg className="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            ) : (
              <svg className="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            )}
          </button>
        </div>
      );
    }

    // --- Module Data (The 20 points + Advanced mapped) ---
    const systemModules = [
      { title: "Core Portals & Auth", icon: Icons.User, features: ["JWT Student, Faculty & Admin Login", "Role-Based Access Control (RBAC)", "Welcome Dashboard & Quick Shortcuts", "Student Profile & Password Management", "Faculty Control Panel", "Global Admin Panel"] },
      { title: "Academic & Exams", svgIcon: Icons.Doc, features: ["Subject-wise Exam Timetables", "Venue & Seat Number Tracking", "Hall Ticket Generation", "Internal, External & Practical Schedules", "Syllabus Status & Subject Credits", "Previous Year Papers & Answer Keys"] },
      { title: "Productivity & Planning", svgIcon: Icons.Clock, features: ["Daily/Weekly/Monthly Study Planner", "Pomodoro Timer & Study Streaks", "Assignment Uploads & Tracking", "Faculty Feedback & Due Dates", "Academic & Personal Event Calendar", "To-do Lists & Priority Tasks"] },
      { title: "Tracking & Analytics", svgIcon: Icons.Chart, features: ["Overall & Subject-wise Attendance", "Leave Application & Low Alerts", "Internal/External Marks Entry", "GPA/CGPA & Total Score Calculator", "Predictive Performance Charts", "Dashboard Analytics & Exportable Reports"] },
      { title: "Smart AI & Resources", svgIcon: Icons.Sparkles, features: ["AI Study Assistant (Explain/Summarize)", "Flashcard & Quiz Generator", "Chat with Uploaded PDFs", "Timer-Based Mock Tests & Evaluation", "Lecture Notes, PPTs & Lab Manuals", "OCR Handwriting Scanner (Advanced)"] },
      { title: "System & Notifications", svgIcon: Icons.Settings, features: ["Exam & Assignment Reminders", "Result Announcements", "Push & Email Notifications", "Smart AI Reminders (Advanced)", "Multi-language Support (Advanced)", "Offline PWA Support (Advanced)"] }
    ];

    // --- Main App Component ---
    function ExamDashboardLanding() {
      const [activeRole, setActiveRole] = useState('student');
      const [mockupTab, setMockupTab] = useState('overview');
      const [activeModuleIndex, setActiveModuleIndex] = useState(0);

      const roleContent = activeRole === 'student' ? [
        { title: 'Welcome Dashboard', desc: 'Upcoming exams, daily study goals, and latest announcements' },
        { title: 'Performance Analytics', desc: 'GPA/CGPA calc, strong/weak subjects, and marks trends' },
        { title: 'Exam & Assignments', desc: 'Download hall tickets, view timetables, and submit assignments' }
